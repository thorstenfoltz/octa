mcp_intro = "Standardverdier for MCP-serveren (`octa --mcp`). Serveren leser disse én gang ved oppstart; å endre dem mens en server kjører krever en omstart av `octa --mcp`."
mcp_row_limit = "Maksimalt antall rader som `read_table` / `run_sql` returnerer når kalleren utelater `limit`. Verktøyskjemaet annonserer denne standarden til modellen så den kan be om flere (eller ubegrenset) ved behov.\n\nStandard: 1,000. Å sette den høyt - eller krysse av Ubegrenset - kan skyve svært store svar gjennom stdio og gjøre MCP-klienten treg."
cell_byte_cap = "Størrelsesgrense per celle på tråden. Celler hvis tekstform overskrider dette erstattes med en `[truncated: ...]`-markør, og svaret flagger `cell_truncated: true`. Sett 0 for å deaktivere grensen.\n\nStandard: 65,536 (64 KiB)."
map_intro = "Standardverdier for Kartvisningen (brukes av GeoJSON-filer). Den aktive fanen kan veksle mellom Fliser og bare Geometri via Kart-verktøylinjen."
chat_intro = "Innebygd AI-assistent som bruker Octas verktøy på de åpne fanene og filene dine. Velg en leverandør og angi API-nøkkelen (eller kjør Ollama lokalt), og åpne deretter panelet fra verktøylinjen (Analyser-menyen, Assistent)."
chat_max_iterations = "Maksimalt antall runder med verktøykall assistenten kan kjøre i en enkelt melding før den må stoppe. En beskyttelse mot løpske loops."
chat_max_tokens = "Grense for svarlengden (i tokener) som bes om per svar. Ubegrenset lar modellen bruke sitt eget maksimum (Anthropic trenger alltid en grense og bruker derfor en høy verdi)."
chat_provider = "Hvilken LLM-backend assistenten bruker. Hver leverandør trenger sin egen API-nøkkel, bortsett fra Ollama som kjører lokalt."
chat_model = "Modellen som brukes for denne leverandøren. Velg et forhåndsvalg eller skriv inn et hvilket som helst modellnavn."
chat_ollama_url = "Rot-URL til din lokale Ollama-server. Octa legger til API-stiene."
chat_position = "Hvor chatpanelet forankres i forhold til tabellen."
chat_export_dir = "Mappe der assistenten skriver eksporterte filer (nye CSV-er, diagrammer) når du ikke oppgir full sti."
chat_audit_log = "Legg til hvert verktøykall fra assistenten i en logg i konfigurasjonsmappen (chat_audit/). Av som standard."
chat_render_markdown = "På: overskrifter, lister, tabeller, kodeblokker og lenker i svarene vises formatert. Av: du ser den rå Markdown-kilden. Dine egne meldinger blir aldri omformatert."
chat_audit_warn = "Vis en advarsel ved oppstart når loggene overstiger denne størrelsen."
chat_api_key = "API-nøkkelen din for denne leverandøren. Lagres i systemets nøkkelring hvis tilgjengelig, ellers i klartekst i settings.toml."
map_default_mode = "Fliser: hent et slippy map fra den konfigurerte flis-URL-en.\nBare geometri: tegn bare objektene på et tomt lerret."
map_fallback = "Når flishenting mislykkes (frakoblet, blokkert), bytt automatisk til bare geometrigjengivelse for den fanen."
tile_url = "URL-mønster for rasterfliser. `{z}/{x}/{y}` erstattes med zoomnivå og fliskoordinater. Standarden peker på OSMs flisserver - for produksjon / tung bruk, pek på en selvhostet eller kommersiell leverandør."
sidebar_position = "På hvilken side katalogtreet dokker når en mappe åpnes\nvia Fil > Åpne katalog."
shortcuts_intro = "Klikk på 'Spill inn' og trykk så en tastekombinasjon (med Ctrl / Shift / Alt).\nTrykk Esc for å avbryte innspillingen. 'Tøm' lar handlingen være ubundet."
initial_load_cap = "Maksimalt antall rader som lastes inn i tabellen ved første åpning\nfor strømmeformater (Parquet, CSV, TSV). De resterende radene\nstrømmer i bakgrunnen mens du blar.\n\nStandard: 2,000,000. Å heve den forbedrer fullstendigheten ved\nførste tegning, men bruker mer minne. Å senke den gjør den første\nåpningen raskere, men flytter mer arbeid til bakgrunnslasteren.\nKryss av \"Ubegrenset\" for å deaktivere grensen helt og laste alle\nrader på forhånd.\n\nSkriv et tall - brukes ved Bruk."
db_page_rows = "Rader per forespørsel når du åpner en tabell fra en live databaseforbindelse.\n\nStandard: 100,000. Dette er en sidestørrelse, ikke et tak: neste side lastes i bakgrunnen mens du blar, akkurat som med en stor Parquet-fil.\n\nEgen innstilling fordi grensen over måler lesing av en lokal fil, mens her går det megabyte med JSON over nettet. Sett den ned hvis det føles tregt å åpne en tabell.\n\nSkriv et tall - brukes ved Bruk."
raw_view_cap = "Maksimal filstørrelse (i MB) som Octa leser helt inn i\nråvisningens redigering. Styrer også råtekst-reserven ved\ntolkefeil og råsiden i sammenligningsvisningen. Større filer\nhopper over råtekst for å spare minne.\n\nStandard: 50 MB. Kryss av \"Ubegrenset\" for å laste inn\nenhver fil uansett størrelse. Tas i bruk ved Bruk."
decompress_cap = "Maksimal dekomprimert størrelse (i MB) for .gz-/.zst-filer\nsom åpnes automatisk. En liten komprimert fil kan blåses\nenormt opp (en dekomprimeringsbombe); over denne grensen\nnektes åpningen.\n\nStandard: 4 295 MB (4 GB). Tas i bruk ved Bruk."
decompress_unlimited = "Fjern grensen for dekomprimert størrelse helt. Kryss bare\nav for arkiver du stoler på."
raw_view_unlimited = "Les hele teksten i enhver fil inn i råvisningen, uten\nstørrelsesgrense. Bruk bare med RAM til overs - en fil på\nflere GB leses helt inn i minnet."
initial_load_unlimited = "Last inn alle radene i filen på forhånd. Anbefales bare\nnår du har RAM til overs - en parquet med 100 M rader\nspiser flere GB."
syntax_size_cap = "Filer større enn dette faller tilbake til vanlig monospace i\nden rå redigereren. Sett 0 for å deaktivere syntaksutheving helt;\nsett et svært stort tall for å velge bort beskyttelsen.\nJSON/YAML/XML/Markdown/TOML uthevet aldri - de bruker sine egne\ntre-/forhåndsvisningsvisninger.\n\nStandard: 1 MB. Skriv et tall, velg en enhet - brukes ved Bruk."
open_as_text = "Ekstra filendelser som skal behandles som ren tekst ved åpning\n(overstyrer leseren som normalt ville gjort krav på dem). Skilt med\nkomma eller mellomrom, uten innledende punktum, små bokstaver.\nEksempel: log4j  myproj  rawdata\n\nBrukes ved Bruk; gjelder for senere filåpninger."
folder_union_cap = "Største antall filer en mappesammenslåing i skyen laster ned og\nslår sammen. Hver fil leses helt inn i minnet, så en mappe med\nti-tusenvis av deler kan tømme RAM. Filer over grensen hoppes over\nog telles i statuslinjen.\n\nStandard: 500. Tas i bruk ved Bruk."
folder_union_unlimited = "Slå sammen alle filer i mappen, uansett hvor mange det er. Kryss\nbare av hvis du har RAM til overs."
multi_search_cap = "Størrelsesgrense per fil for Multisøk-panelets katalogomfang.\nStørre filer hoppes over og listes i chippen for hoppede filer.\nKryss av \"Ubegrenset\" for å fjerne grensen helt.\n\nStandard: 50 MB."
multi_search_unlimited = "Søk gjennom hver fil i mappen uansett størrelse. En enorm logg\neller dump kan låse søket og spise minne."
chart_max_points = "Maksimalt antall rader som Diagram-fanen tegner før jevnt fordelt\nnedsampling slår inn (Histogram, Linje, Spredning). Stolpediagrammer\naggregerer alltid hele inndataene; boksdiagrammer beregner\n5-tallssammendraget over hele inndataene. Sett 0 for å deaktivere\nsamplingen - bare trygt for moderat store tabeller.\n\nStandard: 25,000. Numerisk inndata godtar kommaskilletegn."
chart_max_categories = "Maksimalt antall distinkte X-kategorier som et stolpediagram godtar\nfør det nekter å tegne. Over dette viser rendereren en feil i stedet\nfor en uleselig vegg av stolper - filtrer eller aggreger tabellen\nførst.\n\nStandard: 200. Numerisk inndata godtar kommaskilletegn."
tables_in_picker = "Hvor mange tabellrader dialogen for valg av flere tabeller (SQLite,\nDuckDB, ...) skal romme vertikalt ved sin standardstørrelse. Dialogen\ner fortsatt størrelsesjusterbar - dra i hjørnet for å gjøre den\nstørre når en database har mange tabeller.\n\nStandard: 10. Minimum 1."
excel_auto_open = "Hvor mange ark i en Excel-arbeidsbok med flere ark som åpnes\nautomatisk (hvert i sin egen fane). Arbeidsbøker med flere ark enn\ndette viser en velger så du velger hvilke som skal åpnes (du kan\nfortsatt velge flere enn dette antallet, eller alle).\n\nStandard: 5. Minimum 1."
max_recent = "Antall nylig åpnede filer som vises i Fil-menyen"
start_maximised = "Når på starter vinduet maksimert, og størrelsen nedenfor brukes\nsom gjenopprettingsstørrelse.\nNår av starter vinduet med den valgte størrelsen."
open_in_running_instance = "På: dobbeltklikk på en fil, eller octa med en fil i terminalen, legger til en fane i Octa som allerede er åpen. Starter du Octa uten fil, åpnes det likevel en til. Av: hver start er sin egen Octa. Gjelder fra neste gang Octa starter."
notify_on_finish = "På som standard: når en oppgave som har kjørt en stund blir ferdig, og Octa ikke er vinduet i forgrunnen, viser systemet ditt et varsel om hva som ble ferdig og hvor lang tid det tok."
notify_after_secs = "Kortere oppgaver blir ferdige mens du fortsatt ser på, så de får ikke varsel."
notify_after_secs_off = "Slå på varsler først."
notify_test = "Viser et varsel med en gang, så du ser hvordan det ser ut og kan sjekke at systemet ditt lar Octa sende dem."
notify_when_focused = "Av som standard. På: du får varselet også når Octa er vinduet i forgrunnen, så lenge oppgaven varte lenge nok."
initial_window_size = "Vindusstørrelse ved oppstart (når \"Start maksimert\" er av),\neller gjenopprettingsstørrelsen når den er på."
ctrl_close = "Lukk"
ctrl_restore = "Gjenopprett"
ctrl_full_size = "Full størrelse"
ctrl_minimise = "Minimer"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Beskytter filene dine mot lagring fra GUI-en og MCP-serverens standard.\nNår den er på, nektes det å legge til eller fjerne kolonner i en SQLite-,\nDuckDB- eller GeoPackage-fil ved lagring. Assistenten styres per chatprofil\n(profilens Tillat skriving-bryter), ikke av denne innstillingen."
confirm_db_write_back = "Før endringer går til en database i drift, viser Octa hva som ville endre seg, og spør.\nSlå det av så Lagre bruker endringene med en gang; det er én transaksjon uansett,\nog en mislykket skriving rulles tilbake."
db_pushdown = "Når en databasefane bare har en del av tabellen sin, kjører Sammendrag, Verdifrekvens, kvalitetsrapporten, Korrelasjon, Finn koblingsnøkler, Join-diagnostikk, Finn oppslagstabeller og Mål i Relasjonskartet som SQL på serveren over alle rader, uten å laste dem ned.\nSlå av for å kjøre dem på de innlastede radene i stedet."
confirm_url_redirects = "Når en nettadresse sender deg videre til en annen, spør før filen åpnes derfra. Bekreftelsen er det eneste stedet endringen er synlig."
backup_before_modify = "Før assistenten eller en skjemaendrende databaselagring overskriver\nen fil, kopieres den først til en tidsstemplet .bak-fil ved siden av.\nVanlige manuelle lagringer sikkerhetskopieres ikke."
chat_profiles = "Hver profil er ett lagret oppsett: en leverandør, en modell, en temperatur og et valgfritt tenkebudsjett, under et navn du velger. Lag så mange du vil, gjerne flere for samme leverandør, og bytt mellom dem fra assistentpanelet."
chat_profile_base_url = "Endepunkt for denne profilen. La stå tomt for å bruke Ollama-serveradressen som er satt nedenfor."
write_options = "Standardverdier når Octa skriver en fil. Lagre som og satsvis konvertering tar utgangspunkt i dem og kan endre dem for én kjøring."
status_message_secs = "Hvor lenge en statusmelding blir stående før den forsvinner.\nSamme varighet gjelder alle meldinger, både vellykkede og feil.\n\nHolder du musa over meldingen, pauses nedtellingen - en feil du\nleser eller kopierer blir altså stående. Hver melding har også\nen 'x' for å lukke den med en gang.\n\nKan ikke slås av; under 3 brukes 3. Standard: 10."
chat_tools = "Hvilke verktøy assistenten får bruke. Core-gruppen sendes med hver melding; de andre gruppene blir bare nevnt for den, og den henter en når oppgaven krever det. Et avslått verktøy er borte overalt: det sendes ikke, tilbys ikke og avvises hvis den kaller det likevel."
chat_tools_enable_all = "Slå på alle verktøyene igjen. Bare core-gruppen sendes med hver melding, så resten koster ingenting før assistenten ber om det."
chat_tools_budget = "Omtrent hvor mange tokens verktøybeskrivelsene legger til en melding. Regnet ut fra størrelsen deres, så les det som en pekepinn, ikke som en regning."
sql_page_rows = "Hvor mange resultatrader som hentes om gangen; flere kommer til når du ruller. Radtallet og Eksporter dekker alltid hele resultatet. 0 laster inn alt med én gang."
sql_auto_register = "Gjør hver annen åpen fane spørrbar i SQL-panelet under sitt eget navn, så en join av to åpne filer klarer seg uten attach."
sql_auto_register_max = "Større faner registreres ikke automatisk, fordi registrering kopierer radene deres. De får en Registrer-knapp i stedet."
sql_auto_register_max_off = "Brukes bare mens Spør andre åpne faner er på."
git_marks_uncommitted = "Farger filer og mapper i sidepanelet som har ikke-committede git-endringer: endret, lagt til, slettet, omdøpt eller ikke sporet."
git_marks_branch = "Farger filer og mapper som er endret på gjeldende branch siden den ble forgrenet fra basisbranchen."
git_marks_base_branch = "Branch det sammenlignes med. Når et repository ikke har en branch med dette navnet, prøves main; mangler den også, uteblir branchmarkeringen rett og slett, og mappens hover sier det."
git_marks_base_branch_off = "Brukes bare mens Marker endringer på denne branchen er på."
git_marks_refresh_secs = "Hvor ofte sidepanelet spør git på nytt mens det er synlig. 0 slår av timeren: da oppdateres markeringene bare når en mappe åpnes og når Octa lagrer en fil."
git_marks_refresh_secs_off = "Brukes bare mens minst én git-markering er på."
retype_layout_sample = "Hvor mange verdier Endre type leser når den avgjør hvilket datoformat en tekstkolonne er skrevet i. Avstemningen koster sju datotolkninger per verdi, alle på én gang i grensesnittstråden: ved 5 000 000 verdier blir det 35 000 000 tolkninger, og vinduet slutter å svare i flere sekunder. Å øke den hjelper bare når en kolonnes første verdier ikke representerer resten, for eksempel en fil sortert slik at alle ISO-radene kommer først. Den endrer aldri et vist antall. Standard 10 000."
retype_layout_sample_off = "Slå av Ubegrenset for å skrive et tall her."
retype_layout_sample_unlimited = "Leser hver verdi i kolonnen i stedet for et utvalg. Mest nøyaktig på en ujevnt sortert kolonne, men på flere millioner rader fryser vinduet i sekunder hver gang du velger en datotype."
folder_compare_max_files = "Sammenlign mapper slutter å liste en mappe etter så mange filer og sier fra om at resultatet er ufullstendig. Høyere tall tar lengre tid og bruker mer minne på store mapper i skyen."
folder_compare_max_files_off = "Ubegrenset er krysset av: alle filer blir listet."
folder_compare_max_files_unlimited = "List alle filer i alle mapper, uansett hvor mange det er."
cloud_download_concurrency = "Hvor mange skyobjekter en union laster ned samtidig. Standard 8, minst 1. Å hente fra et objektlager handler mest om å vente på rundturen, ikke om å flytte byte, så å laste ned ett om gangen lar forbindelsen ligge stille imellom. Åtte tilsvarer omtrent det en nettleser tillater per vert. Øk den på en rask forbindelse med høy forsinkelse; senk til 1 hvis en leverandør eller proxy begynner å avvise forespørsler. Svært høye verdier starter like mange tråder på én gang og er den raskeste veien til en feil om forespørselsgrense."
cloud_sidebar_position = "Hvilken kant av vinduet nettleseren for skytilkoblinger dokker ved. Venstre som standard. Nettlesere på samme kant deler ett panel."
db_sidebar_position = "Hvilken kant av vinduet nettleseren for databasetilkoblinger dokker ved. Venstre som standard. Nettlesere på samme kant deler ett panel."
sql_format_title = "Hvordan knappen Formater i SQL-panelet setter opp en spørring. Forhåndsvisningen under viser resultatet."
sql_format_keywords = "Om nøkkelord som SELECT og FROM kommer ut med store bokstaver, små bokstaver eller slik du skrev dem."
sql_format_indent = "Hva ett innrykksnivå er: 2 mellomrom, 4 mellomrom eller en tab."
sql_format_commas = "Hvor kommaet mellom to listepunkter står. I starten av neste linje ser du med en gang om et komma mangler."
sql_format_joins = "Hver JOIN starter på en ny linje på nivå med FROM i stedet for å være rykket inn under den."
sql_format_inline = "En liste kortere enn så mange tegn blir på én linje, for eksempel SELECT a, b, c. Med 0 får hvert punkt sin egen linje."
sql_format_blank_lines = "Hvor mange tomme linjer som skiller to setninger."
sql_format_one_line = "Rydder bare opp i mellomrom og store og små bokstaver i nøkkelord, og setter hver setning på én linje. Praktisk for å lime inn i en logg eller et program."
sql_format_off_one_line = "Av så lenge Hele spørringen på én linje er på: det finnes ingen linjeskift å plassere."
sql_format_clause_width = "Et ledd kortere enn så mange tegn blir på linjen til nøkkelordet sitt, som GROUP BY c.name, og en kort underspørring blir i parentesene sine. Starter på listebredden."
sql_format_clause_needs_list = "Sett listebredden over 0 først. Alene ville dette latt elementene i leddet stå uten innrykk."
sql_format_bracket_width = "Parenteser kortere enn så mange tegn blir på én linje, som coalesce(a, 0) eller IN (1, 2, 3). I lengre får hvert element sin egen linje."
sql_format_semicolon = "Legger til ; etter siste setning hvis den mangler."
sql_format_preview = "En eksempelspørring satt opp med innstillingene over. Den endrer seg mens du endrer dem."
restore_session = "Når Octa starter, åpnes filene igjen som var åpne da du lukket det. Av som standard. Filer som er borte, hoppes over."
restore_session_cloud = "Åpner også skyobjekter igjen. Pass på: hvert objekt lastes ned på nytt ved hver oppstart, noe som tar tid og kan koste penger for dataoverføring."
restore_session_connections = "Åpner også tabeller fra databasetilkoblinger og API-endepunkter igjen. Pass på: hver sender en spørring til sin server ved hver oppstart. På et warehouse kan det vekke det og koste penger, og en utløpt innlogging ber deg logge inn igjen."
restore_session_needs_main = "Slå først på Åpne forrige økt igjen."
save_as_rows = "Når et søk eller filter skjuler rader, kan Lagre som skrive alle rader eller bare de du ser. Spør hver gang, eller fjern haken for alltid å bruke svaret valgt her."
save_as_open = "Etter Lagre som fortsetter du i den nye filen: denne fanen bytter til den, eller en ny fane åpner den hvis bare radene du ser ble lagret. Spør hver gang, eller fjern haken for alltid å bruke svaret valgt her."
keep_versions = "Hver gang du lagrer over en fil, blir den erstattede versjonen tatt vare på. Fil > Tidligere versjoner åpner, sammenligner eller gjenoppretter dem. Av som standard, siden det bruker diskplass."
versions_needs_main = "Slå først på Behold tidligere versjoner."
versions_per_file = "Hvor mange tidligere versjoner som beholdes av hver fil. Den eldste går først. Huk av for Ubegrenset for å beholde alle."
versions_total = "Hvor mye diskplass alle tidligere versjoner kan bruke til sammen. De eldste går først, men den nyeste versjonen av hver fil beholdes alltid. Huk av for Ubegrenset for ingen grense."
versions_limit_off = "Fjern haken for Ubegrenset for å sette en grense."
versions_place = "Hvor de bevarte versjonene havner. Octas egen mappe holder dem unna. En mappe du velger, rommer versjonene av alle filer. En undermappe ved siden av filen er en .octa-versions-mappe ved hver fil. Rett ved siden av filen legger kopier som sales.20261020-140211-123.csv ved siden av sales.csv. Ved siden av filen teller plassgrensen hver mappe for seg. Endringen flytter ingenting: versjoner tatt vare på andre steder står fortsatt under Tidligere versjoner."
versions_dir_choose = "Velg mappen som rommer de tidligere versjonene av alle filer."
zoom_step = "Hvor mye ett zoomtrinn endrer størrelsen, med Ctrl+Plus og Ctrl+Minus, i Vis-menyen og med knappene + og - i statuslinjen. 5 prosent som standard."

