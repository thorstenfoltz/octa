mcp_intro = "Standardverdier for MCP-serveren (`octa --mcp`). Serveren leser disse én gang ved oppstart; å endre dem mens en server kjører krever en omstart av `octa --mcp`."
mcp_row_limit = "Maksimalt antall rader som `read_table` / `run_sql` returnerer når kalleren utelater `limit`. Verktøyskjemaet annonserer denne standarden til modellen så den kan be om flere (eller ubegrenset) ved behov.\n\nStandard: 1,000. Å sette den høyt - eller krysse av Ubegrenset - kan skyve svært store svar gjennom stdio og gjøre MCP-klienten treg."
cell_byte_cap = "Størrelsesgrense per celle på tråden. Celler hvis tekstform overskrider dette erstattes med en `[truncated: ...]`-markør, og svaret flagger `cell_truncated: true`. Sett 0 for å deaktivere grensen.\n\nStandard: 65,536 (64 KiB)."
map_intro = "Standardverdier for Kartvisningen (brukes av GeoJSON-filer). Den aktive fanen kan veksle mellom Fliser og bare Geometri via Kart-verktøylinjen."
chat_intro = "Innebygd AI-assistent som bruker Octas verktoy pa de apne fanene og filene dine. Velg en leverandor og angi API-nokkelen (eller kjor Ollama lokalt), og apne deretter panelet fra verktoylinjen (Analyser-menyen, Assistent)."
chat_max_iterations = "Maksimalt antall runder med verktoykall assistenten kan kjore i en enkelt melding for den ma stoppe. En beskyttelse mot loke loops."
chat_max_tokens = "Grense for svarlengden (i tokener) som bes om per svar. Ubegrenset lar modellen bruke sitt eget maksimum (Anthropic trenger alltid en grense og bruker derfor en hoy verdi)."
chat_provider = "Hvilken LLM-backend assistenten bruker. Hver leverandor trenger sin egen API-nokkel, bortsett fra Ollama som kjorer lokalt."
chat_model = "Modellen som brukes for denne leverandoren. Velg et forhandsvalg eller skriv inn et hvilket som helst modellnavn."
chat_ollama_url = "Rot-URL til din lokale Ollama-server. Octa legger til API-stiene."
chat_position = "Hvor chatpanelet forankres i forhold til tabellen."
chat_export_dir = "Mappe der assistenten skriver eksporterte filer (nye CSV-er, diagrammer) nar du ikke oppgir full sti."
chat_audit_log = "Legg til hvert verktoykall fra assistenten i en logg i konfigurasjonsmappen (chat_audit/). Av som standard."
chat_audit_warn = "Vis en advarsel ved oppstart nar loggene overstiger denne storrelsen."
chat_api_key = "API-nokkelen din for denne leverandoren. Lagres i systemets nokkelring hvis tilgjengelig, ellers i klartekst i settings.toml."
map_default_mode = "Fliser: hent et slippy map fra den konfigurerte flis-URL-en.\nBare geometri: tegn bare objektene på et tomt lerret."
map_fallback = "Når flishenting mislykkes (frakoblet, blokkert), bytt automatisk til bare geometrigjengivelse for den fanen."
tile_url = "URL-mønster for rasterfliser. `{z}/{x}/{y}` erstattes med zoomnivå og fliskoordinater. Standarden peker på OSMs flisserver - for produksjon / tung bruk, pek på en selvhostet eller kommersiell leverandør."
sidebar_position = "På hvilken side katalogtreet dokker når en mappe åpnes\nvia Fil > Åpne katalog."
shortcuts_intro = "Klikk på 'Spill inn' og trykk så en tastekombinasjon (med Ctrl / Shift / Alt).\nTrykk Esc for å avbryte innspillingen. 'Tøm' lar handlingen være ubundet."
initial_load_cap = "Maksimalt antall rader som lastes inn i tabellen ved første åpning\nfor strømmeformater (Parquet, CSV, TSV). De resterende radene\nstrømmer i bakgrunnen mens du blar.\n\nStandard: 5,000,000. Å heve den forbedrer fullstendigheten ved\nførste tegning, men bruker mer minne. Å senke den gjør den første\nåpningen raskere, men flytter mer arbeid til bakgrunnslasteren.\nKryss av \"Ubegrenset\" for å deaktivere grensen helt og laste alle\nrader på forhånd.\n\nSkriv et tall - brukes ved Bruk."
raw_view_cap = "Maksimal filstørrelse (i MB) som Octa leser helt inn i\nråvisningens redigering. Styrer også råtekst-reserven ved\ntolkefeil og råsiden i sammenligningsvisningen. Større filer\nhopper over råtekst for å spare minne.\n\nStandard: 500 MB. Kryss av \"Ubegrenset\" for å laste inn\nenhver fil uansett størrelse. Tas i bruk ved Bruk."
decompress_cap = "Maksimal dekomprimert størrelse (i MB) for .gz-/.zst-filer\nsom åpnes automatisk. En liten komprimert fil kan blåses\nenormt opp (en dekomprimeringsbombe); over denne grensen\nnektes åpningen.\n\nStandard: 4 295 MB (4 GB). Tas i bruk ved Bruk."
decompress_unlimited = "Fjern grensen for dekomprimert størrelse helt. Kryss bare\nav for arkiver du stoler på."
raw_view_unlimited = "Les hele teksten i enhver fil inn i råvisningen, uten\nstørrelsesgrense. Bruk bare med RAM til overs - en fil på\nflere GB leses helt inn i minnet."
initial_load_unlimited = "Last inn alle radene i filen på forhånd. Anbefales bare\nnår du har RAM til overs - en parquet med 100 M rader\nspiser flere GB."
syntax_size_cap = "Filer større enn dette faller tilbake til vanlig monospace i\nden rå redigereren. Sett 0 for å deaktivere syntaksutheving helt;\nsett et svært stort tall for å velge bort beskyttelsen.\nJSON/YAML/XML/Markdown/TOML uthevet aldri - de bruker sine egne\ntre-/forhåndsvisningsvisninger.\n\nStandard: 1 MB. Skriv et tall, velg en enhet - brukes ved Bruk."
open_as_text = "Ekstra filendelser som skal behandles som ren tekst ved åpning\n(overstyrer leseren som normalt ville gjort krav på dem). Skilt med\nkomma eller mellomrom, uten innledende punktum, små bokstaver.\nEksempel: log4j  myproj  rawdata\n\nBrukes ved Bruk; gjelder for senere filåpninger."
folder_union_cap = "Største antall filer en mappesammenslåing i skyen laster ned og\nslår sammen. Hver fil leses helt inn i minnet, så en mappe med\nti-tusenvis av deler kan tømme RAM. Filer over grensen hoppes over\nog telles i statuslinjen.\n\nStandard: 500. Tas i bruk ved Bruk."
folder_union_unlimited = "Slå sammen alle filer i mappen, uansett hvor mange det er. Kryss\nbare av hvis du har RAM til overs."
multi_search_cap = "Størrelsesgrense per fil for Multisøk-panelets katalogomfang.\nStørre filer hoppes over og listes i chippen for hoppede filer.\nKryss av \"Ubegrenset\" for å fjerne grensen helt.\n\nStandard: 50 MB."
multi_search_unlimited = "Søk gjennom hver fil i mappen uansett størrelse. En enorm logg\neller dump kan låse søket og spise minne."
chart_max_points = "Maksimalt antall rader som Diagram-fanen tegner før jevnt fordelt\nnedsampling slår inn (Histogram, Linje, Spredning). Stolpediagrammer\naggregerer alltid hele inndataene; boksdiagrammer beregner\n5-tallssammendraget over hele inndataene. Sett 0 for å deaktivere\nsamplingen - bare trygt for moderat store tabeller.\n\nStandard: 100,000. Numerisk inndata godtar kommaskilletegn."
chart_max_categories = "Maksimalt antall distinkte X-kategorier som et stolpediagram godtar\nfør det nekter å tegne. Over dette viser rendereren en feil i stedet\nfor en uleselig vegg av stolper - filtrer eller aggreger tabellen\nførst.\n\nStandard: 200. Numerisk inndata godtar kommaskilletegn."
tables_in_picker = "Hvor mange tabellrader dialogen for valg av flere tabeller (SQLite,\nDuckDB, ...) skal romme vertikalt ved sin standardstørrelse. Dialogen\ner fortsatt størrelsesjusterbar - dra i hjørnet for å gjøre den\nstørre når en database har mange tabeller.\n\nStandard: 10. Minimum 1."
excel_auto_open = "Hvor mange ark i en Excel-arbeidsbok med flere ark som åpnes\nautomatisk (hvert i sin egen fane). Arbeidsbøker med flere ark enn\ndette viser en velger så du velger hvilke som skal åpnes (du kan\nfortsatt velge flere enn dette antallet, eller alle).\n\nStandard: 5. Minimum 1."
max_recent = "Antall nylig åpnede filer som vises i Fil-menyen"
start_maximised = "Når på starter vinduet maksimert, og størrelsen nedenfor brukes\nsom gjenopprettingsstørrelse.\nNår av starter vinduet med den valgte størrelsen."
initial_window_size = "Vindusstørrelse ved oppstart (når \"Start maksimert\" er av),\neller gjenopprettingsstørrelsen når den er på."
ctrl_close = "Lukk"
ctrl_restore = "Gjenopprett"
ctrl_full_size = "Full størrelse"
ctrl_minimise = "Minimer"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Beskytter filene dine mot lagring fra GUI-en og MCP-serverens standard.\nNår den er på, nektes det å legge til eller fjerne kolonner i en SQLite-,\nDuckDB- eller GeoPackage-fil ved lagring. Assistenten styres per chatprofil\n(profilens Tillat skriving-bryter), ikke av denne innstillingen."
confirm_db_write_back = "Før endringer går til en database i drift, viser Octa hva som ville endre seg, og spør.\nSlå det av så Lagre bruker endringene med en gang; det er én transaksjon uansett,\nog en mislykket skriving rulles tilbake."
confirm_url_redirects = "Når en nettadresse sender deg videre til en annen, spør før filen åpnes derfra. Bekreftelsen er det eneste stedet endringen er synlig."
backup_before_modify = "Før assistenten eller en skjemaendrende databaselagring overskriver\nen fil, kopieres den først til en tidsstemplet .bak-fil ved siden av.\nVanlige manuelle lagringer sikkerhetskopieres ikke."
chat_profiles = "Hver profil er ett lagret oppsett: en leverandør, en modell, en temperatur og et valgfritt tenkebudsjett, under et navn du velger. Lag så mange du vil, gjerne flere for samme leverandør, og bytt mellom dem fra assistentpanelet."
chat_profile_base_url = "Endepunkt for denne profilen. La stå tomt for å bruke Ollama-serveradressen som er satt nedenfor."
write_options = "Standardverdier når Octa skriver en fil. Lagre som og satsvis konvertering tar utgangspunkt i dem og kan endre dem for én kjøring."

