hint_calendar_verdict = "Om en tidskolonne går uten hull: complete, weekdays only, complete (clock change) eller gaps. Helger og tidsomstillinger teller ikke som manglende. En kolonne som ikke er en serie sier hvorfor den ikke ble testet. Hold musa over et resultat for å se hva det betyr; hullene selv ligger i sin egen fane."
hint_shape_verdict = "Om verdiene i en tekstkolonne deler en form: consistent, mixed (én form og noen få avvikere) eller nå. Hold musa over et resultat for å se hva det betyr; avvikerne ligger i sin egen fane."
hint_score = "Karakteren til denne kolonnen av 100, regnet ut fra tre av kolonnene til venstre: 40 % for hvor utfylt den er, 40 % for hvor mange verdier som passer den oppgitte typen, og 20 % for hvor varierte verdiene er. Numeriske avvikere trekker inntil 10 poeng. Den sier ingenting om verdiene er riktige, bare om hvor velformede de er."
