hint_gap_after = "Den siste verdien før hullet."
hint_gap_before = "Den første verdien etter."
hint_gap_missing_steps = "Hvor mange skritt i serien som mangler imellom, talt i kolonnens egen takt (dager, timer, måneder)."
hint_gap_kind = "Hva slags hull det er: et vanlig sprang, eller en strekning lang nok til å ligne en stans heller enn et hopp."
hint_shape_column = "Kolonnen der den avvikende formen er."
hint_shape_shape = "Den avvikende formen: tall er 9, store bokstaver A, andre bokstaver a."
hint_shape_count = "Hvor mange verdier som har denne formen."
hint_shape_example = "Én verdi med denne formen."
overall_explained = "Gjennomsnittet av kolonnekarakterene i rapporten. Hold pekeren over overskriften til kolonnen score for å se hvordan én karakter blir regnet ut."
verdict_benford_conforms = "De første sifrene ligger nær det Benfords lov venter seg, slik målte eller oppsummerte tall pleier å gjøre. Beviser ingenting: en kolonne kan stemme og likevel være feil."
verdict_benford_acceptable = "Litt ved siden av de ventede andelene, innenfor det rommet ekte data beveger seg i. Ingenting å gjøre."
verdict_benford_marginal = "Langt nok ved siden av til et blikk til, men ikke et funn. Se på hvordan kolonnen blir til før du leser noe inn i den."
verdict_benford_nonconforming = "De første sifrene ser ikke ut som målte størrelser. En grunn til å se videre, aldri et funn i seg selv: avrundede, avkortede eller håndskrevne tall havner alle her helt uskyldig."
verdict_benford_not_numbers = "Ikke testet: kolonnen inneholder ikke tall, og loven handler om det første sifferet i et tall."
verdict_benford_too_few = "Ikke testet: under 300 brukbare verdier, der sifferandelene er støy og ikke en fordeling."
verdict_benford_narrow = "Ikke testet: verdiene spenner over mindre enn en faktor ti. En prosentsats, en alder eller en karakter har ingen grunn til å følge loven, så et resultat ville bare villede."
verdict_benford_ids = "Ikke testet: tette heltall som alle er forskjellige, altså en tildelt rekke (et radnummer, et fakturanummer, en id). Sånt deles ut, det måles ikke."
verdict_calendar_complete = "Hvert steg i serien er der, fra det første tidsstempelet til det siste. Ingen hull å forklare."
verdict_calendar_weekdays = "De eneste hullene er hoppede helger, og det gjør forretningsdata med vilje. Teller som komplett, og de helgene står ikke i hullfanen."
verdict_calendar_dst = "Det eneste hullet har formen av en tidsomstilling: ett steg, på en søndag, i de små timene. Octas tidsstempler bærer ingen tidssone, så dette leser formen uten å vite. Sjekk etter hvis timen betyr noe for serien."
verdict_calendar_gaps = "Tid som burde ha rader og ikke har det. Fanen Kalenderhull viser hvert hull med tidsstemplene på hver side."
verdict_calendar_not_dates = "Ikke testet: kolonnen inneholder ikke datoer eller tidsstempler."
verdict_calendar_too_few = "Ikke testet: under tre ulike tidsstempler, det er ingen serie ennå."
verdict_calendar_irregular = "Ikke testet: ingen enkelt steg dekker 60% av intervallene, så det finnes ingen rytme å finne hull i. Hendelseslogger leser seg sånn."
verdict_shape_consistent = "Alle verdier har samme form, for eksempel er hvert postnummer A-99999."
verdict_shape_mixed = "Nesten alle verdier har én form, noen få ikke. De få er ofte skrivefeil eller et annet format; fanen Blandede former viser dem."
verdict_shape_na = "Ikke testet: kolonnen er tom, ikke tekst, eller har for mange former til å avgjøre (fri tekst, eller flere formater med vilje)."

