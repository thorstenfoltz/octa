sections_added = "{n} ekstra fane(r) åpnet for funn som ikke gjelder én kolonne."
section_missingness_intro = "Kolonner som blir tomme i de samme radene. Fire kolonner med 8 % hull hver er ulike problemer alt etter om det er de samme 8 % av radene hver gang (en ødelagt kobling, ett sted å reparere) eller fire uavhengige 8 %. Hver rad her er en slik gruppe, den største først."
section_calendar_intro = "Hull i en dato- eller tidsstempelkolonne: strekningene der serien hopper i stedet for å ta et skritt. Manglende helger og overgangen til sommertid teller ikke med, så det som står på lista, er en dag, time eller måned som virkelig mangler."
section_shapes = "Blandede former"
section_shapes_intro = "Tekstkolonner der nesten alle verdier har én form. Hver rad er en form som avviker fra den, med hvor ofte den forekommer og et eksempel."
hint_miss_columns = "Kolonnene som er tomme sammen i disse radene."
