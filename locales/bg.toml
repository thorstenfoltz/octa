db_page_rows = "Редове на заявка, когато отваряш таблица през жива връзка към база данни.\n\nПо подразбиране: 100,000. Това е размер на страница, а не таван: следващата страница се зарежда във фонов режим, докато скролваш, точно както при голям Parquet файл.\n\nОтделна настройка е, защото лимитът отгоре мери четене на локален файл, а тук през мрежата минават мегабайти JSON. Намали го, ако отварянето на таблица ти се струва бавно.\n\nВъведете число - прилага се при Прилагане."
raw_view_cap = "Максимален размер на файл (в MB), който Octa чете изцяло в редактора\nна необработения изглед. Управлява и преминаването към необработен текст\nпри грешка в разчитането, както и необработената страна на изгледа за сравнение.\nПо-големите файлове пропускат необработения текст, за да пазят паметта.\n\nПо подразбиране: 500 MB. Отбележете \"Без ограничение\", за да заредите всеки\nфайл независимо от размера. Прилага се при потвърждаване."
decompress_cap = "Максимален разархивиран размер (в MB) за прозрачно отваряните\n.gz / .zst файлове. Мъничък компресиран файл може да се разрасне огромно\n(бомба при разархивиране); над това ограничение отварянето се отказва.\n\nПо подразбиране: 4295 MB (4 GB). Прилага се при потвърждаване."
decompress_unlimited = "Премахва изцяло ограничението за размера при разархивиране. Отбележете това\nсамо за архиви, на които имате доверие."
raw_view_unlimited = "Чете целия текст на всеки файл в необработения изглед, без\nограничение за размера. Използвайте само при излишък от RAM - файл от\nняколко GB се зарежда изцяло в паметта."
initial_load_unlimited = "Зареждане на всеки ред във файла наведнъж. Препоръчва се само\nкогато имате излишна RAM - parquet със 100 млн. реда изяжда\nняколко ГБ."
syntax_size_cap = "Файлове, по-големи от това, преминават към обикновен моноширинен в\nнеобработения редактор. Задайте 0, за да изключите подсветката на\nсинтаксиса изцяло; задайте много голямо число, за да се откажете от\nзащитата. JSON/YAML/XML/Markdown/TOML никога не се подсветяват\n- те използват своите специални изгледи дърво/преглед.\n\nПо подразбиране: 1 МБ. Въведете число, изберете единица - прилага се при Прилагане."
open_as_text = "Допълнителни файлови разширения, третирани като обикновен текст при\nотваряне (заменя четеца, който обикновено би ги поискал).\nРазделени със запетая или интервал, без начална точка, с малки букви.\nПример: log4j  myproj  rawdata\n\nПрилага се при Прилагане; влиза в сила за следващите отваряния на файлове."
folder_union_cap = "Максимален брой файлове, които обединяването на папка в облака\nизтегля и слива. Всеки файл се чете изцяло в паметта, затова папка\nс десетки хиляди части може да изчерпи RAM. Файловете над лимита се\nпропускат и се броят в лентата на състоянието.\n\nПо подразбиране: 500. Прилага се при Приложи."
folder_union_unlimited = "Обединява всички файлове в папката, колкото и да са. Отбележете\nсамо ако имате достатъчно памет."
multi_search_cap = "Лимит на размера на файл за обхвата папка на панела Множествено търсене.\nФайлове, по-големи от това, се пропускат и изброяват в чипа\nна пропуснатите файлове. Отбележете \"Без ограничение\", за да го премахнете напълно.\n\nПо подразбиране: 50 МБ."
multi_search_unlimited = "Сканира всеки файл в папката независимо от размера. Огромен дневник\nили дъмп може да блокира сканирането и да изяде паметта."
chart_max_points = "Максимален брой редове, които разделът Диаграма ще изобрази преди да се\nвключи равномерно прореждане (Хистограма, Линия, Точкова). Стълбовите диаграми\nвинаги агрегират целия вход; Кутийните изчисляват\n5-числовото резюме върху целия вход. Задайте 0, за да изключите\nпрореждането - безопасно само за умерено големи таблици.\n\nПо подразбиране: 100,000. Числовият вход приема разделители-запетаи."
chart_max_categories = "Максимален брой отделни категории X, които стълбова диаграма ще приеме преди\nда откаже да рисува. Над това рендерерът показва грешка\nвместо да произведе нечетима стена от стълбове - първо филтрирайте или\nагрегирайте таблицата.\n\nПо подразбиране: 200. Числовият вход приема разделители-запетаи."
tables_in_picker = "Колко реда с таблици диалогът за избор на многотаблични източници (SQLite,\nDuckDB, ...) трябва да побере вертикално при размера си по подразбиране. Диалогът\nвсе още може да се преоразмерява - плъзнете ъгъла, за да го направите\nпо-голям, когато база данни има много таблици.\n\nПо подразбиране: 10. Минимум 1."
excel_auto_open = "Колко листа на многолистова Excel книга да се отварят\nавтоматично (всеки в собствен раздел). Книги с повече\nлистове от това показват диалог за избор, за да изберете кои да отворите\n(все пак можете да изберете повече от това число или всички).\n\nПо подразбиране: 5. Минимум 1."
max_recent = "Брой скоро отваряни файлове, показвани в менюто Файл"
start_maximised = "Когато е включено, прозорецът се стартира максимизиран, а размерът по-долу\nсе използва като размер за възстановяване от максимизиране.\nКогато е изключено, прозорецът се стартира с избрания размер."
initial_window_size = "Размер на прозореца при стартиране (когато „Стартиране максимизирано“ е изключено),\nили размерът за възстановяване от максимизиране, когато е включено."
ctrl_close = "Затваряне"
ctrl_restore = "Възстановяване"
ctrl_full_size = "Пълен размер"
ctrl_minimise = "Минимизиране"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Защитава файловете ти от запазвания през интерфейса и от подразбиращата се настройка на MCP сървъра.\nКогато е включено, добавянето или премахването на колони в SQLite, DuckDB или GeoPackage\nфайл се отказва при запазване. Асистентът се управлява за всеки чат профил\n(превключвателя Разрешаване на запис в профила), а не от тази настройка."
confirm_db_write_back = "Преди промените да отидат в работеща база, Octa показва какво ще се промени и пита.\nИзключи това, за да прилага Запази разликите веднага; и в двата случая е една транзакция,\nа неуспешен запис се връща назад."
confirm_url_redirects = "Когато уеб адрес те отведе към друг, да пита преди файлът да се отвори оттам. Това потвърждение е единственото място, където промяната се вижда."
backup_before_modify = "Преди асистентът или запазване в база, което променя схемата, да презапише\nфайл, той първо се копира в .bak файл с времеви печат до него.\nОбичайните ръчни запазвания не се копират."
chat_profiles = "Всеки профил е една запазена настройка: доставчик, модел, температура и незадължителен бюджет за мислене, под име по твой избор. Направете колкото искате, включително няколко за един и същ доставчик, и превключвайте между тях от панела на асистента."
chat_profile_base_url = "Крайна точка за този профил. Остави празно, за да се използва адресът на Ollama сървъра, зададен по-долу."
write_options = "Стойности по подразбиране при запис на файл. „Запиши като“ и пакетното преобразуване тръгват от тях и могат да ги променят за едно изпълнение."
status_message_secs = "Колко дълго съобщение за състояние стои на екрана, преди да\nизчезне. Същото време важи за всяко съобщение - и успех, и грешка.\n\nАко посочиш с мишката, отброяването спира: грешка, която четеш\nили копираш, остава на място. Всяко съобщение има и 'x', за да\nго затвориш веднага.\n\nНе може да се изключи; под 3 се приема 3. По подразбиране: 10."
chat_tools = "Кои инструменти може да ползва асистентът. Групата core тръгва с всяко съобщение, а останалите групи само му се изброяват по име и той зарежда една, когато работата я поиска. Изключен инструмент изчезва навсякъде: не се изпраща, не се предлага и се отказва, ако асистентът все пак го извика."
chat_tools_enable_all = "Включи пак всички инструменти. С всяко съобщение тръгва само групата core, така че останалото не струва нищо, докато асистентът не го поиска."
chat_tools_budget = "Приблизително колко токена добавят описанията на инструментите към едно съобщение. Смята се от размера им, така че го чети като ориентир, не като сметка."

