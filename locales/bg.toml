verdict_benford_not_numbers = "Не е проверявано: колоната не съдържа числа, а законът е за първата цифра на число."
verdict_benford_too_few = "Не е проверявано: под 300 годни стойности, където дяловете на цифрите са шум, а не разпределение."
verdict_benford_narrow = "Не е проверявано: стойностите се побират в по-малко от десетократен обхват. Процент, възраст или оценка нямат причина да следват закона, така че резултат само би заблудил."
verdict_benford_ids = "Не е проверявано: гъсти цели числа, всички различни, тоест раздадена редица (номер на ред, номер на фактура, идентификатор). Такова нещо се раздава, не се мери."
verdict_calendar_complete = "Всяка стъпка от редицата е налице, от първия времеви печат до последния. Няма дупки за обясняване."
verdict_calendar_weekdays = "Единствените дупки са прескочени уикенди, а бизнес данните правят точно това нарочно. Брои се за пълно и тези уикенди не влизат в раздела с дупките."
verdict_calendar_dst = "Единствената дупка има формата на смяна на часа: една стъпка, в неделя, в малките часове. Времевите печати на Octa не носят часова зона, така че тук се чете формата, а не се знае. Провери, ако за редицата часът има значение."
verdict_calendar_gaps = "Време, което би трябвало да има редове и няма. Разделът Дупки в календара изброява всяка дупка с времевите печати от двете ѝ страни."
verdict_calendar_not_dates = "Не е проверявано: колоната не съдържа дати или времеви печати."
verdict_calendar_too_few = "Не е проверявано: под три различни времеви печата, това още не е редица."
verdict_calendar_irregular = "Не е проверявано: нито една стъпка не покрива 60% от интервалите, значи няма ритъм, в който да се търсят дупки. Дневниците на събития се четат така."

