backup_before_modify = "Прежде чем ассистент или сохранение с изменением схемы базы данных\nперезапишет файл, сначала скопировать его рядом в файл .bak\nс отметкой времени. Обычные ручные сохранения не резервируются."
chat_profiles = "Каждый профиль это один сохранённый набор: поставщик, модель, температура и необязательный бюджет мышления под выбранным тобой названием. Создавай сколько угодно профилей, в том числе несколько для одного поставщика, и переключайтесь между ними на панели ассистента."
chat_profile_base_url = "Точка доступа для этого профиля. Оставь пустым, чтобы использовать адрес сервера Ollama, заданный ниже."
write_options = "Значения по умолчанию при записи файла. «Сохранить как» и пакетное преобразование берут их за основу и могут изменить для одного запуска."
status_message_secs = "Сколько времени сообщение о состоянии остаётся на экране, прежде\nчем исчезнуть. Одна и та же длительность у всех сообщений - и об\nуспехе, и об ошибке.\n\nЕсли навести мышь, обратный отсчёт останавливается: ошибка,\nкоторую ты читаешь или копируешь, остаётся на месте. У каждого\nсообщения есть и 'x', чтобы закрыть его сразу.\n\nОтключить нельзя; меньше 3 считается за 3. По умолчанию: 10."
chat_tools = "Какими инструментами помощнику можно пользоваться. Группа core уходит с каждым сообщением, остальные группы ему только перечисляют по именам, и он подгружает одну, когда её требует задача. Выключенный инструмент исчезает отовсюду: его не отправляют, не предлагают и отклоняют, если помощник всё равно его вызовет."
chat_tools_enable_all = "Снова включить все инструменты. С каждым сообщением уходит только группа core, так что остальное ничего не стоит, пока помощник его не попросит."
