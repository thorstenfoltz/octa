verdict_benford_conforms = "Os primeiros dígitos ficam perto do que a lei de Benford espera, como costumam ficar valores medidos ou acumulados. Não prova nada: uma coluna pode cumprir e estar errada na mesma."
verdict_benford_acceptable = "Ligeiramente fora das proporções esperadas, dentro do que dados reais variam. Nada a fazer."
verdict_benford_marginal = "Suficientemente fora para merecer um segundo olhar, longe de ser um achado. Vê como a coluna é produzida antes de leres alguma coisa nela."
verdict_benford_nonconforming = "Os primeiros dígitos não parecem grandezas medidas. Um motivo para olhar melhor, nunca um achado por si só: números arredondados, limitados ou escritos à mão caem todos aqui sem culpa nenhuma."
verdict_benford_not_numbers = "Não testada: a coluna não contém números, e a lei fala do primeiro dígito de um número."
