sql_open_default = "Ao abrir um arquivo tabular, mostrar automaticamente o\neditor SQL ao lado da visualização de tabela."
sql_keep_open = "Quando uma aba fecha ou um arquivo abre nela, o editor SQL aberto continua aberto e guarda suas consultas.\nDesligado: o editor pertence à aba e fecha junto com ela."
sql_panel_position = "Onde o editor SQL ancora em relação à tabela"
sql_row_limit = "LIMIT usado na consulta de modelo ao abrir uma aba\n(ex. 100 -> SELECT * FROM data LIMIT 100).\nDigite um número - aplicado ao clicar em Aplicar."
autocomplete = "Oferecer sugestões de palavras-chave SQL e nomes de coluna\nabaixo do editor SQL."
editor_font = "Fonte usada pelo editor SQL e sua coluna de números de linha.\nJetBrains Mono vem incluída no Octa.\n\nNota: ligaduras de programação não são aplicadas - o\nrenderizador de texto do egui ainda não processa as\nsubstituições GSUB do OpenType."
sql_diff_highlight = "Após uma consulta INSERT/UPDATE/DELETE, realçar brevemente as células e linhas alteradas."
sql_diff_secs = "Por quanto tempo o realce de alterações SQL permanece antes de desaparecer."
mcp_intro = "Padrões para o servidor MCP (`octa --mcp`). O servidor os lê uma vez ao iniciar; alterá-los com um servidor em execução requer reiniciar `octa --mcp`."
mcp_row_limit = "Máximo de linhas retornadas por `read_table` / `run_sql` quando o chamador omite `limit`. O esquema da ferramenta anuncia este padrão ao modelo para que possa pedir mais (ou ilimitado) quando necessário.\n\nPadrão: 1,000. Defini-lo alto - ou marcar Ilimitado - pode empurrar respostas muito grandes pelo stdio e tornar o cliente MCP mais lento."
cell_byte_cap = "Limite de tamanho por célula na transmissão. Células cuja forma textual excede isto são substituídas por um marcador `[truncated: ...]` e a resposta sinaliza `cell_truncated: true`. Defina 0 para desativar o limite.\n\nPadrão: 65,536 (64 KiB)."
map_intro = "Padrões para a visualização de Mapa (usada por arquivos GeoJSON). A aba ativa pode alternar entre Blocos e apenas Geometria pela barra do Mapa."
chat_intro = "Assistente de IA integrado que usa as ferramentas do Octa sobre suas abas e arquivos abertos. Escolha um provedor e defina sua chave de API (ou execute o Ollama localmente), depois abra o painel pela barra de ferramentas (menu Analisar, Assistente)."
chat_max_iterations = "Número máximo de rodadas de chamadas de ferramentas que o assistente pode executar em uma única mensagem antes de parar. Uma proteção contra loops descontrolados."
chat_max_tokens = "Limite do comprimento da resposta (em tokens) solicitado por resposta. Ilimitado permite que o modelo use seu próprio máximo (a Anthropic sempre precisa de um limite, então usa um valor alto)."
chat_provider = "Qual backend de LLM o assistente usa. Cada provedor precisa da própria chave de API, exceto o Ollama, que é executado localmente."
chat_model = "O modelo usado para este provedor. Escolha uma predefinição ou digite qualquer nome de modelo."
chat_ollama_url = "URL raiz do seu servidor Ollama local. O Octa acrescenta os caminhos da API."
chat_position = "Onde o painel de chat se encaixa em relação à tabela."
chat_export_dir = "Pasta onde o assistente grava os arquivos exportados (novos CSV, gráficos) quando você não informa um caminho completo."
chat_audit_log = "Anexa cada chamada de ferramenta do assistente a um registro no diretório de configuração (chat_audit/). Desativado por padrão."
chat_render_markdown = "Ligado: títulos, listas, tabelas, blocos de código e links nas respostas aparecem formatados. Desligado: vês o Markdown em bruto. As tuas mensagens nunca são reformatadas."
chat_audit_warn = "Mostrar um aviso na inicialização quando os registros excederem este tamanho."
chat_api_key = "Sua chave de API para este provedor. Armazenada no chaveiro do sistema quando disponível; caso contrário, em texto simples em settings.toml."
map_default_mode = "Blocos: buscar um mapa deslizante da URL de blocos configurada.\nApenas geometria: desenhar somente as feições em uma tela em branco."
map_fallback = "Quando a busca de blocos falha (offline, bloqueada), alternar automaticamente para a renderização de apenas geometria nessa aba."
tile_url = "Padrão de URL para blocos raster. `{z}/{x}/{y}` são substituídos pelo nível de zoom e pelas coordenadas do bloco. O padrão aponta para o servidor de blocos do OSM - para produção / uso intenso, aponte para um provedor próprio ou comercial."
sidebar_position = "De que lado a árvore de diretórios ancora quando uma pasta é\naberta via Arquivo > Abrir diretório."
shortcuts_intro = "Clique em 'Gravar' e pressione uma combinação de teclas (com Ctrl / Shift / Alt).\nPressione Esc para cancelar a gravação. 'Limpar' deixa a ação sem atribuição."
initial_load_cap = "Máximo de linhas carregadas na tabela na primeira abertura para\nformatos de streaming (Parquet, CSV, TSV). As linhas restantes são\ncarregadas em segundo plano à medida que percorres o ficheiro.\n\nPadrão: 2,000,000. Aumentá-lo melhora a completude do primeiro\ndesenho mas usa mais memória. Reduzi-lo torna a abertura inicial\nmais rápida mas passa mais trabalho ao carregador em segundo plano.\nMarca \"Ilimitado\" para desativar totalmente o limite e carregar\ntodas as linhas de imediato.\n\nEscreve um número - aplicado ao clicar em Aplicar."
db_page_rows = "Linhas por pedido quando abres uma tabela a partir de uma ligação a base de dados ao vivo.\n\nPredefinição: 100,000. É um tamanho de página, não um tecto: a página seguinte carrega em segundo plano enquanto percorres, tal como num ficheiro Parquet grande.\n\nÉ uma definição à parte porque o limite acima mede a leitura de um ficheiro local, ao passo que aqui passam megabytes de JSON pela rede. Baixa-o se abrir uma tabela te parecer lento.\n\nEscreve um número - aplicado ao clicar em Aplicar."
raw_view_cap = "Tamanho máximo de ficheiro (em MB) que o Octa lê por completo\npara o editor da vista bruta. Também rege o recurso a texto bruto\napós um erro de análise e o lado bruto da vista de comparação.\nOs ficheiros maiores dispensam o texto bruto para poupar memória.\n\nPredefinição: 50 MB. Marque \"Sem limite\" para carregar qualquer\nficheiro, seja qual for o tamanho. Aplicado ao premir Aplicar."
decompress_cap = "Tamanho máximo descomprimido (em MB) para os ficheiros\n.gz / .zst abertos de forma transparente. Um ficheiro comprimido\nminúsculo pode expandir enormemente (uma bomba de descompressão);\nacima deste limite a abertura é recusada.\n\nPredefinição: 4.295 MB (4 GB). Aplicado ao premir Aplicar."
decompress_unlimited = "Remove por completo o limite de descompressão. Marque isto\napenas para arquivos em que confie."
raw_view_unlimited = "Lê o texto completo de qualquer ficheiro na vista bruta, sem\nlimite de tamanho. Use apenas com RAM de sobra: um ficheiro de\nvários GB é lido inteiro para a memória."
initial_load_unlimited = "Carregar todas as linhas do ficheiro de imediato. Só vale a pena\nquando tens RAM de sobra - um parquet de 100 M de linhas consome\nvários GB."
syntax_size_cap = "Arquivos maiores que isto voltam para monospace simples no\neditor bruto. Defina 0 para desativar totalmente o realce de\nsintaxe; defina um número muito grande para ignorar a proteção.\nJSON/YAML/XML/Markdown/TOML nunca são realçados - usam suas\npróprias visualizações de árvore/prévia.\n\nPadrão: 1 MB. Digite um número, escolha uma unidade - aplicado ao Aplicar."
open_as_text = "Extensões de arquivo extras a tratar como texto simples ao abrir\n(substitui o leitor que normalmente as reivindicaria). Separadas\npor vírgulas ou espaços, sem ponto inicial, em minúsculas.\nExemplo: log4j  myproj  rawdata\n\nAplicado ao Aplicar; tem efeito para aberturas subsequentes."
folder_union_cap = "Número máximo de arquivos que uma união de pasta na nuvem baixa e\ncombina. Cada arquivo é lido inteiro na memória, então uma pasta com\ndezenas de milhares de partes pode esgotar a RAM. Arquivos acima do\nlimite são ignorados e contados na barra de status.\n\nPadrão: 500. Aplicado ao clicar em Aplicar."
folder_union_unlimited = "Une todos os arquivos da pasta, quantos forem. Marque apenas se\ntiver RAM de sobra."
multi_search_cap = "Limite de tamanho por arquivo para o escopo de diretório do painel\nde Busca múltipla. Arquivos maiores são ignorados e listados no chip\nde arquivos ignorados. Marque \"Ilimitado\" para remover o limite por completo.\n\nPadrão: 50 MB."
multi_search_unlimited = "Varre todos os arquivos do diretório, seja qual for o tamanho.\nUm log ou dump enorme pode travar a varredura e consumir memória."
chart_max_points = "Máximo de linhas que a aba Gráfico traçará antes de a subamostragem\nequiespaçada entrar em ação (Histograma, Linha, Dispersão). Gráficos\nde barras sempre agregam toda a entrada; box plots calculam o resumo\nde 5 números sobre toda a entrada. Defina 0 para desativar a\namostragem - seguro apenas para tabelas de tamanho moderado.\n\nPadrão: 25,000. A entrada numérica aceita separadores de vírgula."
chart_max_categories = "Máximo de categorias X distintas que um gráfico de barras aceitará\nantes de se recusar a desenhar. Acima disso o renderizador mostra um\nerro em vez de um muro ilegível de barras - filtre ou agregue a\ntabela primeiro.\n\nPadrão: 200. A entrada numérica aceita separadores de vírgula."
tables_in_picker = "Quantas linhas de tabela o diálogo seletor de várias tabelas\n(SQLite, DuckDB, ...) deve caber verticalmente no seu tamanho\npadrão. O diálogo continua redimensionável - arraste o canto para\naumentá-lo quando um banco de dados tem muitas tabelas.\n\nPadrão: 10. Mínimo 1."
excel_auto_open = "Quantas folhas de um livro Excel com várias folhas abrir\nautomaticamente (cada uma no seu separador). Acima disso aparece\num seletor para escolheres quais abrir, e podes escolher mais do\nque este número, ou todas.\n\nPadrão: 5. Mínimo 1."
max_recent = "Número de arquivos abertos recentemente mostrados no menu Arquivo"
start_maximised = "Quando ativado, a janela inicia maximizada e o tamanho abaixo é\nusado como tamanho de restauração.\nQuando desativado, a janela inicia no tamanho escolhido."
initial_window_size = "Tamanho da janela ao iniciar (quando \"Iniciar maximizado\" está\ndesativado), ou o tamanho de restauração quando está ativado."
ctrl_close = "Fechar"
ctrl_restore = "Restaurar"
ctrl_full_size = "Tamanho cheio"
ctrl_minimise = "Minimizar"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Protege os seus ficheiros das gravações da interface e da predefinição do servidor MCP.\nQuando ativa, adicionar ou remover colunas num ficheiro SQLite, DuckDB ou GeoPackage\né recusado ao gravar. O assistente é regido por cada perfil de conversa\n(o interruptor Permitir escritas do perfil), não por esta definição."
confirm_db_write_back = "Antes de as alterações chegarem a uma base de dados em uso, o Octa mostra o que mudaria e pergunta.\nDesliga isto para que Guardar aplique logo as diferenças; em qualquer dos casos é uma só transação,\ne uma falha é revertida por completo."
db_pushdown = "Quando um separador de base de dados guarda só parte da sua tabela, o Resumo, a Frequência de valores, o relatório de qualidade, a Correlação, o Localizador de chaves de junção, o Diagnóstico de junção, Encontrar tabelas de consulta e Medir no Mapa de relações correm como SQL no servidor sobre todas as linhas, sem as descarregar.\nDesativa isto para os correr nas linhas carregadas."
confirm_url_redirects = "Quando um endereço web te envia para outro, perguntar antes de abrir o ficheiro daí. Essa confirmação é o único sítio onde essa mudança se vê."
backup_before_modify = "Antes de o assistente ou uma gravação que altera o esquema da base de dados\nsubstituir um ficheiro, este é primeiro copiado para um ficheiro .bak com data e hora ao lado.\nAs gravações manuais normais não têm cópia de segurança."
chat_profiles = "Cada perfil é uma configuração guardada: um fornecedor, um modelo, uma temperatura e um orçamento de raciocínio opcional, com o nome que escolher. Crie quantos quiser, incluindo vários do mesmo fornecedor, e alterne entre eles no painel do assistente."
chat_profile_base_url = "Ponto de acesso deste perfil. Deixe vazio para usar o endereço do servidor Ollama definido abaixo."
write_options = "Predefinições usadas quando o Octa escreve um ficheiro. Guardar como e a conversão em lote partem daqui e podem alterá-las numa execução."
status_message_secs = "Quanto tempo uma mensagem de estado fica visível antes de\ndesaparecer. A mesma duração vale para todas as mensagens,\nde sucesso ou de erro.\n\nPassar o rato por cima pausa a contagem: um erro que estás a\nler ou a copiar fica no sítio. Cada mensagem tem também um\n'x' para fechar já.\n\nNão pode ser desligado; abaixo de 3 usa-se 3. Padrão: 10."
chat_tools = "Que ferramentas o assistente pode usar. O grupo core vai em cada mensagem; os outros grupos só lhe são nomeados, e ele carrega um quando o trabalho pede. Uma ferramenta desligada desaparece de todo: não é enviada, não é oferecida e é recusada se mesmo assim a chamar."
chat_tools_enable_all = "Voltar a ligar todas as ferramentas. Só o grupo core vai em cada mensagem, por isso o resto não custa nada até o assistente o pedir."
chat_tools_budget = "Mais ou menos quantos tokens as descrições das ferramentas acrescentam a uma mensagem. Calculado pelo tamanho delas, por isso lê como orientação, não como uma fatura."
sql_page_rows = "Quantas linhas de resultado são trazidas de cada vez; ao deslocar chegam mais. A contagem de linhas e Exportar cobrem sempre o resultado inteiro. 0 carrega tudo de uma vez."
sql_auto_register = "Torna cada outro separador aberto consultável no painel SQL com o seu próprio nome, para que juntar dois ficheiros abertos não precise de attach."
sql_auto_register_max = "Separadores maiores do que isto não são registados automaticamente, porque registar copia as linhas deles. Em vez disso recebem um botão Registar."
sql_auto_register_max_off = "Só é usado enquanto Consultar outros separadores abertos estiver ligado."
git_marks_uncommitted = "Colore os ficheiros e pastas da barra lateral que têm alterações git por confirmar: modificados, adicionados, apagados, renomeados ou não seguidos."
git_marks_branch = "Colore os ficheiros e pastas alterados no ramo atual desde que se separou do ramo base."
git_marks_base_branch = "Ramo com que se compara. Quando um repositório não tem nenhum ramo com este nome, tenta-se main; se também faltar, a marca de ramo simplesmente não aparece e a dica da pasta di-lo."
git_marks_base_branch_off = "Só é usado enquanto Marcar alterações neste ramo estiver ligado."
git_marks_refresh_secs = "Com que frequência a barra lateral volta a perguntar ao git enquanto está visível. 0 desliga o temporizador: as marcas passam então a atualizar-se só ao abrir uma pasta e quando o Octa guarda um ficheiro."
git_marks_refresh_secs_off = "Só é usado enquanto pelo menos uma marca git estiver ligada."
retype_layout_sample = "Quantos valores o Alterar tipo lê para decidir em que formato de data uma coluna de texto está escrita. A votação custa sete análises de data por valor, de uma só vez no fio da interface: com 5.000.000 de valores são 35.000.000 de análises e a janela deixa de responder durante segundos. Aumentar só ajuda quando os primeiros valores de uma coluna não representam o resto, por exemplo um ficheiro ordenado com todas as linhas ISO à frente. Nunca altera uma contagem apresentada. Predefinição 10.000."
retype_layout_sample_off = "Desativa Ilimitado para escreveres um número aqui."
retype_layout_sample_unlimited = "Lê todos os valores da coluna em vez de uma amostra. É o mais exato numa coluna mal ordenada, mas com vários milhões de linhas a janela fica bloqueada durante segundos sempre que escolhes um tipo de data."
cloud_download_concurrency = "Quantos objetos da nuvem uma união transfere ao mesmo tempo. Predefinição 8, mínimo 1. Ir buscar dados a um armazenamento de objetos é sobretudo esperar pelo tempo de ida e volta e não mover bytes, por isso transferir um a seguir ao outro deixa a ligação parada pelo meio. Oito é mais ou menos o que um navegador permite por servidor. Aumenta numa ligação rápida com latência alta; baixa para 1 se um fornecedor ou proxy começar a recusar pedidos. Valores muito altos lançam esse número de threads de uma vez e são o caminho mais rápido para um erro de limite de pedidos."
cloud_sidebar_position = "Em qual borda da janela o navegador de conexões de nuvem se acopla. À esquerda por padrão. Navegadores na mesma borda dividem um painel."
db_sidebar_position = "Em qual borda da janela o navegador de conexões de banco de dados se acopla. À esquerda por padrão. Navegadores na mesma borda dividem um painel."
sql_format_title = "Como o botão Formatar do painel SQL dispõe uma consulta. A pré-visualização em baixo mostra o resultado."
sql_format_keywords = "Se as palavras-chave como SELECT e FROM saem em maiúsculas, minúsculas ou como as escreveste."
sql_format_indent = "Quanto vale um nível de recuo: 2 espaços, 4 espaços ou um tab."
sql_format_commas = "Onde fica a vírgula entre dois itens de uma lista. No início da linha seguinte, uma vírgula em falta vê-se logo."
sql_format_joins = "Cada JOIN começa numa linha nova ao nível do FROM, em vez de recuado por baixo."
sql_format_inline = "Uma lista mais curta do que este número de caracteres fica numa linha, como SELECT a, b, c. Com 0, cada item fica na sua linha."
sql_format_blank_lines = "Quantas linhas vazias separam duas instruções."
sql_format_one_line = "Só arruma os espaços e as maiúsculas das palavras-chave e coloca cada instrução em uma linha. Bom pra colar num log ou num programa."
sql_format_off_one_line = "Desligado enquanto Consulta inteira em uma linha estiver ligado: não tem quebra de linha pra arrumar."
sql_format_clause_width = "Uma cláusula menor que tantos caracteres fica na linha da palavra-chave dela, tipo GROUP BY c.name, e uma subconsulta curta fica dentro dos parênteses. Começa na largura de lista."
sql_format_clause_needs_list = "Coloca primeiro a largura de lista acima de 0. Sozinho isso deixaria os itens da cláusula sem recuo."
sql_format_bracket_width = "Parênteses menores que tantos caracteres ficam em uma linha, tipo coalesce(a, 0) ou IN (1, 2, 3). Nos maiores cada item vai pra sua própria linha."
sql_format_semicolon = "Coloca ; depois da última instrução se ela não tiver."
sql_format_preview = "Uma consulta de exemplo com as definições acima. Muda à medida que as mudas."
restore_session = "Ao arrancar, o Octa volta a abrir os ficheiros que estavam abertos quando o fechaste. Desligado por omissão. Ficheiros que já não existem são ignorados."
restore_session_cloud = "Reabre também os objetos na nuvem. Atenção: cada um é descarregado de novo em cada arranque, o que demora e pode custar dinheiro em transferência de dados."
restore_session_connections = "Reabre também tabelas de ligações a bases de dados e endpoints de API. Atenção: cada uma envia uma consulta ao seu servidor em cada arranque. Num data warehouse isso pode acordá-lo e custar dinheiro, e uma sessão expirada pede-te para entrares outra vez."
restore_session_needs_main = "Liga primeiro Reabrir a última sessão."

