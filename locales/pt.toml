hint_type_consistency = "Proporção de valores que correspondem ao tipo declarado."
hint_benford_verdict = "Se os primeiros dígitos da coluna seguem a lei de Benford: conforms, acceptable, marginal ou nonconforming. A maioria das colunas nem sequer é testada, e a célula diz porquê. Passa o rato por um veredicto para veres o que significa."
hint_calendar_verdict = "Se uma coluna de tempo corre sem buracos: complete, weekdays only, complete (clock change) ou gaps. Fins de semana e mudanças de hora não contam como ausentes. Uma coluna que não é uma série diz porque não foi testada. Passa o rato por um veredicto para veres o que significa; os buracos ficam num separador próprio."
hint_shape_verdict = "Se os valores de uma coluna de texto partilham uma forma: consistent, mixed (uma forma e algumas exceções) ou na. Passa o rato por um veredicto para veres o que significa; as exceções ficam num separador próprio."
hint_score = "A nota desta coluna em 100, tirada de três das colunas à esquerda: 40% pelo quanto está preenchida, 40% por quantos valores batem certo com o tipo declarado e 20% pela variedade dos valores. Os valores atípicos numéricos tiram até 10 pontos. Não diz nada sobre se os valores estão certos, só sobre o quão bem formados estão."
section_missingness = "Ausentes juntos"
section_calendar = "Falhas no calendário"
sections_added = "Abertas {n} aba(s) extra para achados que não são por coluna."
section_missingness_intro = "Colunas que ficam vazias nas mesmas linhas. Quatro colunas com 8% de falhas cada são um problema diferente conforme sejam sempre os mesmos 8% de linhas (uma junção partida, um único sítio a reparar) ou quatro 8% sem relação. Cada linha aqui é um desses grupos, o maior primeiro."
section_calendar_intro = "Buracos numa coluna de data ou de marca temporal: os trechos onde a série salta em vez de dar um passo. Os fins de semana em falta e a mudança da hora não contam, portanto o que está listado é um dia, uma hora ou um mês mesmo em falta."
section_shapes = "Formas mistas"
section_shapes_intro = "Colunas de texto onde quase todos os valores têm uma forma. Cada linha é uma forma que se desvia dela, com a frequência e um exemplo."
hint_miss_columns = "As colunas que estão vazias em conjunto nessas linhas."
hint_miss_column_count = "Quantas colunas são."
hint_miss_rows = "Quantas linhas têm vazio exatamente este conjunto de colunas."
hint_miss_share_percent = "Essas linhas em percentagem da tabela inteira."
hint_gap_column = "A coluna de data ou marca temporal onde está o buraco."
hint_gap_after = "O último valor antes do buraco."
hint_gap_before = "O primeiro valor a seguir."
hint_gap_missing_steps = "Quantos passos da série faltam pelo meio, contados no ritmo próprio da coluna (dias, horas, meses)."
hint_gap_kind = "Que espécie de buraco é: um buraco simples, ou um trecho comprido que parece mais uma paragem do que um deslize."
hint_shape_column = "A coluna onde está a forma que se desvia."
hint_shape_shape = "A forma que se desvia: os dígitos são 9, as maiúsculas A, as outras letras a."
hint_shape_count = "Quantos valores têm esta forma."
hint_shape_example = "Um valor com esta forma."
overall_explained = "A média das notas por coluna do relatório. Passa por cima do cabeçalho da coluna score para veres como uma nota é calculada."
verdict_benford_conforms = "Os primeiros dígitos ficam perto do que a lei de Benford espera, como costumam ficar valores medidos ou acumulados. Não prova nada: uma coluna pode cumprir e estar errada na mesma."
verdict_benford_acceptable = "Ligeiramente fora das proporções esperadas, dentro do que dados reais variam. Nada a fazer."
verdict_benford_marginal = "Suficientemente fora para merecer um segundo olhar, longe de ser um achado. Vê como a coluna é produzida antes de leres alguma coisa nela."
verdict_benford_nonconforming = "Os primeiros dígitos não parecem grandezas medidas. Um motivo para olhar melhor, nunca um achado por si só: números arredondados, limitados ou escritos à mão caem todos aqui sem culpa nenhuma."
verdict_benford_not_numbers = "Não testada: a coluna não contém números, e a lei fala do primeiro dígito de um número."
verdict_benford_too_few = "Não testada: menos de 300 valores utilizáveis, onde as proporções dos dígitos são ruído e não uma distribuição."
verdict_benford_narrow = "Não testada: os valores abrangem menos de um fator dez. Uma percentagem, uma idade ou uma classificação não têm razão para seguir a lei, por isso um veredicto só iria enganar."
verdict_benford_ids = "Não testada: inteiros densos e todos diferentes, ou seja uma sequência atribuída (um número de linha, um número de fatura, um id). Isso distribui-se, não se mede."
verdict_calendar_complete = "Cada passo da série está lá, da primeira marca temporal à última. Nenhum buraco para explicar."
verdict_calendar_weekdays = "Os únicos buracos são fins de semana saltados, que é o que os dados de negócio fazem de propósito. Conta como completo, e esses fins de semana não aparecem no separador dos buracos."
verdict_calendar_dst = "O único buraco tem a forma de uma mudança de hora: um passo, num domingo, de madrugada. As marcas temporais do Octa não levam fuso horário, portanto isto lê a forma sem saber. Confirma se a hora importa para esta série."
verdict_calendar_gaps = "Tempo que devia ter linhas e não tem. O separador Buracos de calendário lista cada buraco com as marcas temporais de cada lado."
verdict_calendar_not_dates = "Não testada: a coluna não contém datas nem marcas temporais."
verdict_calendar_too_few = "Não testada: menos de três marcas temporais distintas, ainda não é uma série."
verdict_calendar_irregular = "Não testada: nenhum passo cobre 60% dos intervalos, portanto não há ritmo nenhum onde procurar buracos. Registos de eventos leem-se assim."
verdict_shape_consistent = "Todos os valores têm a mesma forma, por exemplo todos os códigos postais são A-99999."
verdict_shape_mixed = "Quase todos os valores têm uma forma, exceto alguns. Costumam ser erros de escrita ou um segundo formato; o separador Formas mistas lista-os."
verdict_shape_na = "Não testado: a coluna está vazia, não é texto, ou tem demasiadas formas para decidir (texto livre, ou vários formatos de propósito)."

