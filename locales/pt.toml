hint_calendar_verdict = "Se uma coluna de tempo corre sem buracos: complete, weekdays only, complete (clock change) ou gaps. Fins de semana e mudanças de hora não contam como ausentes. Uma coluna que não é uma série diz porque não foi testada. Passa o rato por um veredicto para veres o que significa; os buracos ficam num separador próprio."
hint_score = "A nota desta coluna em 100, tirada de três das colunas à esquerda: 40% pelo quanto está preenchida, 40% por quantos valores batem certo com o tipo declarado e 20% pela variedade dos valores. Os valores atípicos numéricos tiram até 10 pontos. Não diz nada sobre se os valores estão certos, só sobre o quão bem formados estão."
