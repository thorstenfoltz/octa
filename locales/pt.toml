verdict_benford_narrow = "Não testada: os valores abrangem menos de um fator dez. Uma percentagem, uma idade ou uma classificação não têm razão para seguir a lei, por isso um veredicto só iria enganar."
verdict_benford_ids = "Não testada: inteiros densos e todos diferentes, ou seja uma sequência atribuída (um número de linha, um número de fatura, um id). Isso distribui-se, não se mede."
verdict_calendar_complete = "Cada passo da série está lá, da primeira marca temporal à última. Nenhum buraco para explicar."
verdict_calendar_weekdays = "Os únicos buracos são fins de semana saltados, que é o que os dados de negócio fazem de propósito. Conta como completo, e esses fins de semana não aparecem no separador dos buracos."
verdict_calendar_dst = "O único buraco tem a forma de uma mudança de hora: um passo, num domingo, de madrugada. As marcas temporais do Octa não levam fuso horário, portanto isto lê a forma sem saber. Confirma se a hora importa para esta série."
verdict_calendar_gaps = "Tempo que devia ter linhas e não tem. O separador Buracos de calendário lista cada buraco com as marcas temporais de cada lado."
verdict_calendar_not_dates = "Não testada: a coluna não contém datas nem marcas temporais."
verdict_calendar_too_few = "Não testada: menos de três marcas temporais distintas, ainda não é uma série."
verdict_calendar_irregular = "Não testada: nenhum passo cobre 60% dos intervalos, portanto não há ritmo nenhum onde procurar buracos. Registos de eventos leem-se assim."

