tile_url = "Rasterilaattojen URL-malli. `{z}/{x}/{y}` korvataan zoomaustasolla ja laatan koordinaateilla. Oletus osoittaa OSM:n laattapalvelimeen - tuotantoon / raskaaseen käyttöön osoita itse isännöityyn tai kaupalliseen palveluntarjoajaan."
sidebar_position = "Kummalle puolelle hakemistopuu kiinnittyy, kun kansio avataan\nkohdasta Tiedosto > Avaa hakemisto."
shortcuts_intro = "Napsauta 'Tallenna' ja paina sitten näppäinyhdistelmää (Ctrl / Vaihto / Alt).\nPaina Esc peruuttaaksesi tallennuksen. 'Tyhjennä' jättää toiminnon sitomatta."
initial_load_cap = "Suurin rivimäärä, joka ladataan taulukkoon ensimmäisellä avauksella\nsuoratoistomuodoille (Parquet, CSV, TSV). Loput rivit latautuvat\ntaustalla vierittäessäsi.\n\nOletus: 2,000,000. Korottaminen parantaa ensimmäisen piirron\ntäydellisyyttä mutta käyttää enemmän muistia. Pienentäminen tekee\nensimmäisestä avauksesta nopeamman mutta siirtää enemmän työtä\ntaustalataajalle. Valitse \"Rajoittamaton\" poistaaksesi rajoituksen\nkokonaan ja ladataksesi kaikki rivit etukäteen.\n\nKirjoita luku - otetaan käyttöön Käytä-painikkeella."
db_page_rows = "Rivejä pyyntöä kohti, kun avaat taulun live-tietokantayhteydestä.\n\nOletus: 100,000. Tämä on sivukoko, ei katto: seuraava sivu latautuu taustalla kun vierität, aivan kuten isolla Parquet-tiedostolla.\n\nOma asetuksensa siksi, että yllä oleva raja mittaa paikallisen tiedoston lukemista, kun taas tässä verkon yli kulkee megatavuja JSONia. Pienennä sitä, jos taulun avaaminen tuntuu hitaalta.\n\nKirjoita luku - otetaan käyttöön Käytä-painikkeella."
raw_view_cap = "Suurin tiedostokoko (MB), jonka Octa lukee kokonaan raakanäkymän\neditoriin. Rajoittaa myös jäsennysvirheen raakavaraumista ja\nvertailunäkymän raakapuolta. Suuremmilta tiedostoilta raakateksti\nohitetaan muistin säästämiseksi.\n\nOletus: 50 MB. Rastita \"Rajoittamaton\" ladataksesi minkä tahansa\ntiedoston koosta riippumatta. Otetaan käyttöön Käytä-painikkeella."
decompress_cap = "Suurin purettu koko (MB) läpinäkyvästi avatuille\n.gz-/.zst-tiedostoille. Pieni pakattu tiedosto voi laajeta valtavasti\n(purkupommi); tämän rajan yli menevää ei avata.\n\nOletus: 4 295 MB (4 GB). Otetaan käyttöön Käytä-painikkeella."
decompress_unlimited = "Poista purkukoon yläraja kokonaan. Rastita tämä vain\narkistoille, joihin luotat."
raw_view_unlimited = "Lue minkä tahansa tiedoston koko teksti raakanäkymään ilman\nkokorajaa. Käytä vain, jos muistia riittää - usean gigatavun\ntiedosto luetaan kokonaan muistiin."
initial_load_unlimited = "Lataa kaikki tiedoston rivit etukäteen. Suositellaan vain,\nkun muistia on runsaasti - 100 milj. rivin parquet syö\nuseita gigatavuja."
syntax_size_cap = "Tätä suuremmat tiedostot palautuvat tavalliseen monospaceen\nraakaeditorissa. Aseta 0 poistaaksesi syntaksikorostuksen\nkokonaan; aseta hyvin suuri luku ohittaaksesi suojan.\nJSON/YAML/XML/Markdown/TOML ei koskaan korosteta - ne käyttävät\nomia puu-/esikatselunäkymiään.\n\nOletus: 1 MB. Kirjoita luku, valitse yksikkö - otetaan käyttöön Käytä-painikkeella."
open_as_text = "Lisätiedostopäätteet, jotka käsitellään pelkkänä tekstinä avattaessa\n(ohittaa lukijan, joka normaalisti vaatisi ne). Pilkuin tai\nvälilyönnein eroteltuna, ilman alkupistettä, pienin kirjaimin.\nEsimerkki: log4j  myproj  rawdata\n\nOtetaan käyttöön Käytä-painikkeella; vaikuttaa seuraaviin avauksiin."
folder_union_cap = "Suurin määrä tiedostoja, jotka pilvikansion yhdistäminen lataa ja\nyhdistää. Jokainen tiedosto luetaan kokonaan muistiin, joten kansio,\njossa on kymmeniä tuhansia osia, voi kuluttaa RAMin loppuun. Rajan\nylittävät tiedostot ohitetaan ja lasketaan tilariville.\n\nOletus: 500. Otetaan käyttöön Käytä-painikkeella."
folder_union_unlimited = "Yhdistä kaikki kansion tiedostot, olipa niitä kuinka paljon\ntahansa. Rastita vain, jos muistia on runsaasti."
multi_search_cap = "Tiedostokohtainen kokorajoitus Monihaku-paneelin hakemistolaajuudelle.\nTätä suuremmat tiedostot ohitetaan ja luetellaan ohitettujen\ntiedostojen chipissä. Rastita \"Rajoittamaton\" poistaaksesi rajoituksen kokonaan.\n\nOletus: 50 MB."
multi_search_unlimited = "Etsi kansion jokaisesta tiedostosta koosta riippumatta. Valtava\nloki tai vedos voi jumittaa haun ja syödä muistia."
chart_max_points = "Suurin rivimäärä, jonka Kaavio-välilehti piirtää ennen kuin\ntasavälinen alinäytteistys käynnistyy (Histogrammi, Viiva, Hajonta).\nPylväskaaviot aggregoivat aina koko syötteen; laatikkokaaviot\nlaskevat 5-luvun yhteenvedon koko syötteestä. Aseta 0 poistaaksesi\nnäytteistyksen - turvallista vain kohtuullisen kokoisille taulukoille.\n\nOletus: 25,000. Numeerinen syöte hyväksyy pilkkuerottimet."
chart_max_categories = "Suurin määrä erillisiä X-luokkia, jotka pylväskaavio hyväksyy ennen\nkuin se kieltäytyy piirtämästä. Tämän yli piirtäjä näyttää virheen\nlukukelvottoman pylväsmuurin sijaan - suodata tai aggregoi taulukko\nensin.\n\nOletus: 200. Numeerinen syöte hyväksyy pilkkuerottimet."
tables_in_picker = "Kuinka monta taulukkoriviä monitaulukon valintaikkunan (SQLite,\nDuckDB, ...) tulisi mahduttaa pystysuunnassa oletuskoossaan.\nValintaikkuna on edelleen käyttäjän muutettavissa - vedä kulmasta\nsuurentaaksesi sitä, kun tietokannassa on paljon taulukoita.\n\nOletus: 10. Vähintään 1."
excel_auto_open = "Kuinka monta monisivuisen Excel-työkirjan taulukkoa avataan\nautomaattisesti (kukin omaan välilehteensä). Työkirjat, joissa on\nenemmän taulukoita kuin tämä, näyttävät valitsimen, josta valitset\navattavat (voit silti valita enemmän kuin tämän määrän tai kaikki).\n\nOletus: 5. Vähintään 1."
max_recent = "Tiedosto-valikossa näytettävien viimeksi avattujen tiedostojen määrä"
start_maximised = "Kun käytössä, ikkuna käynnistyy suurennettuna ja alla olevaa kokoa\nkäytetään palautuskokona.\nKun pois, ikkuna käynnistyy valitussa koossa."
initial_window_size = "Ikkunan koko käynnistyksessä (kun \"Käynnistä suurennettuna\" on pois)\ntai palautuskoko, kun se on käytössä."
ctrl_close = "Sulje"
ctrl_restore = "Palauta"
ctrl_full_size = "Täysi koko"
ctrl_minimise = "Pienennä"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Suojaa tiedostojasi käyttöliittymän tallennuksilta ja MCP-palvelimen oletukselta.\nKun tämä on käytössä, sarakkeiden lisääminen tai poistaminen SQLite-, DuckDB- tai\nGeoPackage-tiedostossa estetään tallennettaessa. Avustajaa ohjataan keskusteluprofiilikohtaisesti\n(profiilin Salli kirjoitukset -kytkin), ei tällä asetuksella."
confirm_db_write_back = "Ennen kuin muutokset menevät käytössä olevaan tietokantaan, Octa näyttää mikä muuttuisi ja kysyy.\nOta tämä pois, niin Tallenna vie muutokset heti; kummassakin tapauksessa se on yksi transaktio,\nja epäonnistunut kirjoitus perutaan."
confirm_url_redirects = "Kun verkko-osoite ohjaa sinut toiseen, kysy ennen kuin tiedosto avataan sieltä. Vahvistus on ainoa paikka jossa muutos näkyy."
backup_before_modify = "Ennen kuin avustaja tai skeemaa muuttava tietokantatallennus korvaa\ntiedoston, kopioi se ensin aikaleimatuksi .bak-tiedostoksi viereen.\nTavallisia käsin tehtyjä tallennuksia ei varmuuskopioida."
chat_profiles = "Jokainen profiili on yksi tallennettu kokoonpano: palveluntarjoaja, malli, lämpötila ja valinnainen ajattelubudjetti valitsemallasi nimellä. Tee niitä niin monta kuin haluat, myös useita samalle palveluntarjoajalle, ja vaihda niiden välillä avustajapaneelista."
chat_profile_base_url = "Tämän profiilin päätepiste. Jätä tyhjäksi käyttääksesi alla asetettua Ollama-palvelimen osoitetta."
write_options = "Oletukset, kun Octa kirjoittaa tiedoston. Tallenna nimellä ja erämuunnos lähtevät näistä ja voivat muuttaa niitä yhtä ajoa varten."
status_message_secs = "Kuinka kauan tilaviesti näkyy ennen katoamistaan. Sama kesto\nkoskee kaikkia viestejä, sekä onnistumisia että virheitä.\n\nKun viet hiiren viestin päälle, laskuri pysähtyy - lukemasi tai\nkopioimasi virhe pysyy siis paikallaan. Jokaisessa viestissä on\nmyös 'x', jolla sen sulkee heti.\n\nEi voi kytkeä pois; alle 3 tulkitaan 3:ksi. Oletus: 10."
chat_tools = "Mitä työkaluja avustaja saa käyttää. Core-ryhmä lähtee jokaisen viestin mukana; muut ryhmät vain nimetään sille, ja se lataa yhden kun tehtävä sitä vaatii. Pois kytketty työkalu katoaa kaikkialta: sitä ei lähetetä, ei tarjota, ja se torjutaan jos avustaja silti kutsuu sitä."
chat_tools_enable_all = "Kytke kaikki työkalut takaisin päälle. Vain core-ryhmä lähtee joka viestissä, joten loput eivät maksa mitään ennen kuin avustaja pyytää niitä."
chat_tools_budget = "Suunnilleen kuinka monta tokenia työkalujen kuvaukset lisäävät viestiin. Laskettu niiden koosta, joten lue se suuntaa antavana, ei laskuna."
sql_page_rows = "Montako tulosriviä haetaan kerralla; lisää tulee vierittäessä. Rivimäärä ja Vie kattavat aina koko tuloksen. 0 lataa kaiken kerralla."
sql_auto_register = "Tekee jokaisesta muusta avoimesta välilehdestä kysyttävän SQL-paneelissa omalla nimellään, jolloin kahden avoimen tiedoston liitos ei tarvitse attachia."
sql_auto_register_max = "Tätä suurempia välilehtiä ei rekisteröidä automaattisesti, koska rekisteröinti kopioi niiden rivit. Ne saavat sen sijaan Rekisteröi-painikkeen."
sql_auto_register_max_off = "Käytetään vain, kun Kysy muista avoimista välilehdistä on päällä."
git_marks_uncommitted = "Värittää sivupalkin tiedostot ja kansiot, joissa on sitomattomia git-muutoksia: muutettu, lisätty, poistettu, nimetty uudelleen tai seuraamaton."
git_marks_branch = "Värittää tiedostot ja kansiot, joita on muutettu nykyisessä haarassa sen jälkeen, kun se haarautui perushaarasta."
git_marks_base_branch = "Haara, johon verrataan. Kun repositoriossa ei ole tämännimistä haaraa, kokeillaan main-haaraa; jos sekin puuttuu, haaramerkintä jää yksinkertaisesti pois ja kansion vihje kertoo sen."
git_marks_base_branch_off = "Käytetään vain, kun Merkitse tämän haaran muutokset on päällä."
git_marks_refresh_secs = "Kuinka usein sivupalkki kysyy gitiltä uudelleen, kun se on näkyvissä. 0 sammuttaa ajastimen: silloin merkinnät päivittyvät vain kansiota avattaessa ja kun Octa tallentaa tiedoston."
git_marks_refresh_secs_off = "Käytetään vain, kun vähintään yksi git-merkintä on päällä."
retype_layout_sample = "Kuinka monta arvoa Vaihda tyyppi lukee päättäessään, missä päivämäärämuodossa tekstisarake on kirjoitettu. Äänestys maksaa seitsemän päivämääräjäsennystä arvoa kohti, kaikki kerralla käyttöliittymäsäikeessä: 5 000 000 arvolla se on 35 000 000 jäsennystä ja ikkuna lakkaa vastaamasta sekunneiksi. Nostamisesta on hyötyä vain jos sarakkeen ensimmäiset arvot eivät edusta loppuja, esimerkiksi tiedostossa jossa kaikki ISO-rivit ovat ensin. Näytettyjä lukuja se ei koskaan muuta. Oletus 10 000."
retype_layout_sample_off = "Ota Rajoittamaton pois päältä, niin voit kirjoittaa tähän luvun."
retype_layout_sample_unlimited = "Lukee sarakkeen jokaisen arvon otoksen sijaan. Tarkin vaihtoehto epätasaisesti järjestetylle sarakkeelle, mutta usean miljoonan rivin sarakkeessa ikkuna jumittuu sekunneiksi joka kerta kun valitset päivämäärätyypin."
cloud_download_concurrency = "Kuinka monta pilviobjektia yhdistäminen lataa yhtä aikaa. Oletus 8, vähintään 1. Objektivarastosta hakeminen on enimmäkseen edestakaisen viiveen odottamista eikä tavujen siirtämistä, joten yksi kerrallaan lataaminen jättää yhteyden väliin joutilaaksi. Kahdeksan on suunnilleen se, minkä selain sallii palvelinta kohden. Nosta lukua nopealla ja viiveisellä yhteydellä; laske se 1:een, jos palveluntarjoaja tai välityspalvelin alkaa hylätä pyyntöjä. Hyvin suuret arvot käynnistävät yhtä monta säiettä kerralla ja ovat nopein tie pyyntörajavirheeseen."
cloud_sidebar_position = "Mihin ikkunan reunaan pilviyhteyksien selain kiinnittyy. Oletuksena vasemmalle. Samalla reunalla olevat selaimet jakavat yhden paneelin."
db_sidebar_position = "Mihin ikkunan reunaan tietokantayhteyksien selain kiinnittyy. Oletuksena vasemmalle. Samalla reunalla olevat selaimet jakavat yhden paneelin."
sql_format_title = "Miten SQL-paneelin Muotoile-painike asettelee kyselyn. Alla oleva esikatselu näyttää tuloksen."
sql_format_keywords = "Tulevatko avainsanat kuten SELECT ja FROM isoilla, pienillä vai niin kuin kirjoitit ne."
sql_format_indent = "Mitä yksi sisennystaso on: 2 välilyöntiä, 4 välilyöntiä vai sarkain."
sql_format_commas = "Mihin kahden listan kohdan välinen pilkku menee. Seuraavan rivin alussa puuttuva pilkku huomataan heti."
sql_format_joins = "Jokainen JOIN alkaa uudelta riviltä samalla tasolla kuin FROM eikä sen alle sisennettynä."
sql_format_inline = "Tätä merkkimäärää lyhyempi lista pysyy yhdellä rivillä, esimerkiksi SELECT a, b, c. Arvolla 0 jokainen kohta saa oman rivinsä."
sql_format_blank_lines = "Montako tyhjää riviä erottaa kaksi lausetta."
sql_format_one_line = "Siistii vain välit ja avainsanojen kirjainkoon ja laittaa jokaisen lauseen yhdelle riville. Kätevä lokiin tai ohjelmaan liittämiseen."
sql_format_off_one_line = "Pois, kun Koko kysely yhdelle riville on päällä: rivinvaihtoja ei ole aseteltavana."
sql_format_clause_width = "Tätä merkkimäärää lyhyempi lauseke pysyy avainsanansa rivillä, kuten GROUP BY c.name, ja lyhyt alikysely pysyy sulkeissaan. Alkaa listan leveydestä."
sql_format_clause_needs_list = "Aseta ensin listan leveys yli 0:n. Yksinään tämä jättäisi lausekkeen kohdat ilman sisennystä."
sql_format_bracket_width = "Tätä merkkimäärää lyhyemmät sulkeet pysyvät yhdellä rivillä, kuten coalesce(a, 0) tai IN (1, 2, 3). Pidemmissä jokainen kohta on omalla rivillään."
sql_format_semicolon = "Lisää ; viimeisen lauseen perään, jos siinä ei ole."
sql_format_preview = "Esimerkkikysely yllä olevilla asetuksilla. Se muuttuu, kun muutat niitä."
restore_session = "Kun Octa käynnistyy, se avaa uudelleen tiedostot, jotka olivat auki, kun suljit sen. Oletuksena pois päältä. Kadonneet tiedostot ohitetaan."
restore_session_cloud = "Avaa myös pilviobjektit uudelleen. Varo: jokainen ladataan uudelleen joka käynnistyksellä, mikä vie aikaa ja voi maksaa tiedonsiirrosta."
restore_session_connections = "Avaa myös tietokantayhteyksien ja API-päätepisteiden taulut uudelleen. Varo: jokainen lähettää kyselyn palvelimelleen joka käynnistyksellä. Tietovarastossa se voi herättää sen ja maksaa, ja vanhentunut kirjautuminen pyytää sinua kirjautumaan uudelleen."
restore_session_needs_main = "Ota ensin käyttöön Avaa edellinen istunto uudelleen."

