hint_shape_shape = "Poikkeava muoto: numerot ovat 9, isot kirjaimet A, muut kirjaimet a."
hint_shape_count = "Kuinka monella arvolla on tämä muoto."
hint_shape_example = "Yksi arvo, jolla on tämä muoto."
overall_explained = "Raportin sarakekohtaisten arvosanojen keskiarvo. Vie osoitin score-sarakkeen otsikon päälle nähdäksesi, miten yksittäinen arvosana muodostuu."
verdict_benford_conforms = "Alkunumerot osuvat lähelle sitä mitä Benfordin laki odottaa, kuten mitatut tai kertyneet luvut yleensä. Ei todista mitään: sarake voi noudattaa lakia ja olla silti väärin."
verdict_benford_acceptable = "Hieman odotettujen osuuksien vierestä, sen rajoissa mihin oikea data heilahtaa. Ei toimenpiteitä."
verdict_benford_marginal = "Tarpeeksi vierestä toista vilkaisua varten, ei vielä havainto. Katso miten sarake syntyy ennen kuin luet siitä mitään."
verdict_benford_nonconforming = "Alkunumerot eivät näytä mitatuilta suureilta. Syy katsoa tarkemmin, ei koskaan yksinään havainto: pyöristetyt, katkaistut tai käsin näpätyt luvut päätyvät kaikki tänne täysin viattomasti."
verdict_benford_not_numbers = "Ei testattu: sarake ei sisällä lukuja, ja laki koskee luvun ensimmäistä numeroa."
verdict_benford_too_few = "Ei testattu: alle 300 käyttökelpoista arvoa, jolloin numero-osuudet ovat kohinaa eivätkä jakauma."
verdict_benford_narrow = "Ei testattu: arvot mahtuvat alle kymmenkertaiseen väliin. Prosentilla, iällä tai arvosanalla ei ole syytä noudattaa lakia, joten tulos vain harhauttaisi."
verdict_benford_ids = "Ei testattu: tiheitä kokonaislukuja jotka ovat kaikki erilaisia, eli jaettu sarja (rivinumero, laskunumero, tunniste). Sellaiset jaetaan, niitä ei mitata."
verdict_calendar_complete = "Sarjan jokainen askel on paikallaan, ensimmäisestä aikaleimasta viimeiseen. Ei aukkoja selitettäväksi."
verdict_calendar_weekdays = "Ainoat aukot ovat ohitettuja viikonloppuja, ja juuri niin liiketoimintadata tekee tarkoituksella. Lasketaan täydeksi, eivätkä ne viikonloput näy aukkovälilehdellä."
verdict_calendar_dst = "Ainoa aukko on kellonsiirron muotoinen: yksi askel, sunnuntaina, aamuyöllä. Octan aikaleimoissa ei ole aikavyöhykettä, joten tämä lukee muodon eikä tiedä. Tarkista, jos sarjassa tunti merkitsee."
verdict_calendar_gaps = "Aikaa jolla pitäisi olla rivejä eikä ole. Kalenteriaukot-välilehti listaa jokaisen aukon molemmin puolin olevine aikaleimoineen."
verdict_calendar_not_dates = "Ei testattu: sarake ei sisällä päivämääriä eikä aikaleimoja."
verdict_calendar_too_few = "Ei testattu: alle kolme eri aikaleimaa, se ei ole vielä sarja."
verdict_calendar_irregular = "Ei testattu: mikään yksittäinen askel ei kata 60% väleistä, joten ei ole rytmiä josta etsiä aukkoja. Tapahtumalokit lukeutuvat näin."
verdict_shape_consistent = "Kaikilla arvoilla on sama muoto, esimerkiksi jokainen postinumero on A-99999."
verdict_shape_mixed = "Lähes kaikilla arvoilla on yksi muoto, muutamalla ei. Ne ovat usein kirjoitusvirheitä tai toinen muoto; Sekamuodot-välilehti listaa ne."
verdict_shape_na = "Ei testattu: sarake on tyhjä, ei tekstiä, tai siinä on liikaa muotoja päätettäväksi (vapaata tekstiä, tai useita muotoja tarkoituksella)."

