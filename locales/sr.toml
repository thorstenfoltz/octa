# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Штити твоје датотеке од чувања из графичког сучеља и од подразумеване поставке MCP сервера.\nКада је укључено, додавање или уклањање колона у SQLite, DuckDB или GeoPackage\nдатотеци одбија се при чувању. Асистентом се управља по профилу ћаскања\n(прекидач Дозволи уписивање у профилу), а не овом поставком."
confirm_db_write_back = "Пре него што измене оду у базу која ради, Octa приказује шта би се променило и пита.\nИскључи ово да Сачувај одмах примени разлике; у оба случаја је то једна трансакција,\nа неуспео упис се поништава."
confirm_url_redirects = "Када те веб адреса пошаље на другу, питај пре него што се датотека отвори одатле. Та потврда је једино место где се та промена види."
backup_before_modify = "Пре него што асистент или чување базе које мења шему препише\nдатотеку, прво је копирај у .bak датотеку са временском ознаком поред ње.\nУобичајена ручна чувања се не копирају."
chat_profiles = "Сваки профил је једна сачувана поставка: добављач, модел, температура и необавезан буџет размишљања, под називом који изаберете. Направите их колико желите, укључујући више њих за истог добављача, и пребацујте се између њих из табле асистента."
chat_profile_base_url = "Крајња тачка за овај профил. Оставите празно за адресу Ollama сервера подешену испод."
write_options = "Подразумеване вредности када Octa уписује датотеку. Сачувај као и групна претворба полазе од њих и могу их променити за једно извршавање."
status_message_secs = "Колико дуго статусна порука остаје на екрану пре него што нестане.\nИсто трајање важи за сваку поруку, и успех и грешку.\n\nАко пређеш мишем преко ње, одбројавање се паузира - грешка коју\nчиташ или копираш остаје на месту. Свака порука има и 'x' за\nтренутно затварање.\n\nНе може да се искључи; испод 3 важи 3. Подразумевано: 10."
chat_tools = "Које алате помоћник сме да користи. Група core иде уз сваку поруку, док му се остале групе само набројe по имену, а једну учита кад је посао затражи. Искључен алат нестаје свуда: не шаље се, не нуди се и бива одбијен ако га помоћник ипак позове."
chat_tools_enable_all = "Поново укључи све алате. Уз сваку поруку иде само група core, па остало ништа не кошта док помоћник то не затражи."
chat_tools_budget = "Отприлике колико токена описи алата додају поруци. Израчунато из њихове величине, па читај као оријентир, а не као рачун."

