hint_shape_column = "Kolonna, kurā ir novirzošā forma."
hint_shape_shape = "Novirzošā forma: cipari ir 9, lielie burti A, pārējie burti a."
hint_shape_count = "Cik vērtībām ir šī forma."
hint_shape_example = "Viena vērtība ar šo formu."
overall_explained = "Atskaites kolonnu atzīmju vidējais. Pārvelc peli pār kolonnas score virsrakstu, tur ir rakstīts, kā rodas viena atzīme."
verdict_benford_conforms = "Pirmie cipari ir tuvu tam, ko Benforda likums gaida, tāpat kā parasti dara mērīti vai sakrāti lielumi. Neko nepierāda: kolonna var sakrist un tomēr būt nepareiza."
verdict_benford_acceptable = "Nedaudz garām gaidītajām daļām, tajās robežās, kurās īsti dati staigā. Nav ko darīt."
verdict_benford_marginal = "Pietiekami garām, lai paskatītos otrreiz, bet vēl nav atradums. Paskaties, kā kolonna rodas, pirms tu no tās kaut ko izlasi."
verdict_benford_nonconforming = "Pirmie cipari neizskatās pēc mērītiem lielumiem. Iemesls skatīties tālāk, bet pats par sevi nekad nav atradums: noapaļoti, nogriezti vai ar roku ierakstīti skaitļi nonāk šeit visi pilnīgi nevainīgi."
verdict_benford_not_numbers = "Nav pārbaudīts: kolonnā nav skaitļu, bet likums runā par skaitļa pirmo ciparu."
verdict_benford_too_few = "Nav pārbaudīts: zem 300 derīgām vērtībām, kur ciparu daļas ir troksnis, nevis sadalījums."
verdict_benford_narrow = "Nav pārbaudīts: vērtības ietilpst mazāk nekā desmitkārtīgā diapazonā. Procentam, vecumam vai vērtējumam nav iemesla sekot likumam, tāpēc rezultāts tikai maldinātu."
verdict_benford_ids = "Nav pārbaudīts: blīvi veseli skaitļi, visi dažādi, tātad piešķirta virkne (rindas numurs, rēķina numurs, id). Tādas lietas izdala, nevis mēra."
verdict_calendar_complete = "Katrs rindas solis ir klāt, no pirmā laika zīmoga līdz pēdējam. Nav caurumu, ko skaidrot."
verdict_calendar_weekdays = "Vienīgie caurumi ir izlaistas nedēļas nogales, un biznesa dati to dara ar nolūku. Skaitās pilnīgs, un šīs nedēļas nogales caurumu cilnē neparādās."
verdict_calendar_dst = "Vienīgajam caurumam ir pulksteņa pārstādīšanas forma: viens solis, svētdienā, agrā rītā. Octas laika zīmogi nenes laika joslu, tāpēc šeit tiek lasīta forma, nevis zināts. Pārbaudi, ja rindai ir svarīga stunda."
verdict_calendar_gaps = "Laiks, kuram vajadzētu būt rindām un nav. Cilne Kalendāra caurumi uzskaita katru caurumu ar laika zīmogiem abās pusēs."
verdict_calendar_not_dates = "Nav pārbaudīts: kolonnā nav datumu vai laika zīmogu."
verdict_calendar_too_few = "Nav pārbaudīts: mazāk nekā trīs dažādi laika zīmogi, tā vēl nav rinda."
verdict_calendar_irregular = "Nav pārbaudīts: neviens solis nesedz 60% no atstarpēm, tātad nav ritma, kurā meklēt caurumus. Notikumu žurnāli lasās tā."
verdict_shape_consistent = "Katrai vērtībai ir vienāda forma, piemēram, katrs pasta indekss ir A-99999."
verdict_shape_mixed = "Gandrīz katrai vērtībai ir viena forma, dažām nav. Tās bieži ir drukas kļūdas vai otrs formāts; cilne Jauktas formas tās uzskaita."
verdict_shape_na = "Nav pārbaudīts: kolonna ir tukša, nav teksts, vai tai ir pārāk daudz formu, lai izlemtu (brīvs teksts, vai vairāki formāti apzināti)."

