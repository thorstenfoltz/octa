hint_score = "Šīs kolonnas atzīme no 100, aprēķināta no trim kolonnām pa kreisi: 40% par to, cik tā ir aizpildīta, 40% par to, cik vērtību atbilst norādītajam tipam, un 20% par vērtību daudzveidību. Skaitliskās novirzes atņem līdz 10 punktiem. Tā neko nesaka par to, vai vērtības ir pareizas, tikai par to, cik labi tās ir noformētas."
