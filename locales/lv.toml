chat_intro = "Lietotnē iebūvēts MI asistents, kas vada Octa rīkus tavās atvērtajās cilnēs un failos. Izvēliees piegādātāju un iestatiet tā API atslēgu (vai palaidiet Ollama lokāli), pēc tam atveriet paneli no rīkjoslas (Analīzes izvēlne, Asistents)."
chat_max_iterations = "Maksimālais rīku izsaukumu kārtu skaits, ko asistents var izpildīt vienā ziņojumā, pirms tam jāapstājas. Aizsardzība pret nekontrolētām rīku cilpām."
chat_max_tokens = "Atbildes garuma ierobežojums (žetonos), ko prasa katrai atbildei. Neierobežots ļauj modelim izmantot savu maksimumu (Anthropic vienmēr nepieciešams ierobežojums, tāpēc tur izmanto augstu vērtību)."
chat_provider = "Ar kuru LLM aizmuguri asistents sazinās. Katram piegādātājam ir vajadzīga sava API atslēga, izņemot Ollama, kas darbojas lokāli."
chat_model = "Modelis, ko izmanto šim piegādātājam. Izvēlieties iepriekšiestatījumu vai ierakstiet jebkuru modeļa nosaukumu."
chat_ollama_url = "Tava lokālā Ollama servera saknes URL. API ceļus Octa pievieno pati."
chat_position = "Kur tērzēšanas panelis tiek piestiprināts attiecībā pret tabulu."
chat_export_dir = "Mape, kurā asistents raksta eksportētos failus (jaunus CSV, diagrammas), kad nenorādāt pilnu ceļu."
chat_audit_log = "Pievieno katru asistenta rīku izsaukumu žurnālam konfigurācijas direktorijā (chat_audit/). Pēc noklusējuma izslēgts."
chat_render_markdown = "Ieslēgts: atbilžu virsraksti, saraksti, tabulas, koda bloki un saites tiek attēlotas noformētas. Izslēgts: redzi neapstrādātu Markdown pirmkodu. Tavas ziņas nekad netiek pārformatētas."
chat_audit_warn = "Rādīt brīdinājumu startējot, kad žurnāli pārsniedz šo izmēru."
chat_api_key = "Tava API atslēga šim piegādātājam. Glabāta tavā OS atslēgu saišķī, kad tas pieejams, citādi vienkāršā tekstā failā settings.toml."
map_intro = "Kartes skata noklusējumi (izmanto GeoJSON faili). Aktīvā cilne var pārslēgties starp Flīzēm un Tikai ģeometriju ar Kartes rīkjoslu."
map_default_mode = "Flīzes: ielādēt slīdošu karti no konfigurētā flīžu URL.\nTikai ģeometrija: zīmēt tikai objektus uz tukša audekla."
map_fallback = "Kad flīžu ielāde neizdodas (bezsaistē, bloķēts), automātiski pārslēgties uz tikai ģeometrijas renderēšanu šai cilnei."
tile_url = "URL šablons rastra flīzēm. `{z}/{x}/{y}` tiek aizstāti ar tālummaiņas līmeni un flīžu koordinātām. Noklusējums norāda uz OSM flīžu serveri - ražošanai / intensīvai lietošanai norādiet uz pašmitinātu vai komerciālu piegādātāju."
sidebar_position = "Kurā pusē mapju koks tiek piestiprināts, kad\nmape tiek atvērta caur Fails > Atvērt mapi."
shortcuts_intro = "Noklikšķiniet “Ierakstīt”, pēc tam nospiediet taustiņu kombināciju (ar Ctrl / Shift / Alt).\nNospiediet Esc, lai atceltu ierakstīšanu. “Notīrīt” atstāj darbību nepiesaistītu."
initial_load_cap = "Maksimālais rindu skaits, kas ielādēts tabulā pirmajā atvēršanā\nstraumēšanas formātiem (Parquet, CSV, TSV). Atlikušās rindas\nstraumējas fonā, kad ritiniet.\n\nNoklusējums: 2,000,000. Tā palielināšana uzlabo pirmā zīmējuma\npilnīgumu, bet izmanto vairāk atmiņas. Tā samazināšana padara\nsākotnējo atvēršanu ātrāku, bet pārceļ vairāk darba uz\nfona ielādētāju. Atzīmējiet \"Neierobežots\", lai pilnībā atspējotu\nierobežojumu un ielādētu katru rindu uzreiz.\n\nIevadiet skaitli - lietots, nospiežot Lietot."
db_page_rows = "Rindas vienā pieprasījumā, kad atver tabulu no tiešsaistes datu bāzes savienojuma.\n\nNoklusējums: 100,000. Tas ir lapas izmērs, nevis griesti: nākamā lapa ielādējas fonā, kamēr ritini, tāpat kā lielam Parquet failam.\n\nAtsevišķs iestatījums, jo augšējais ierobežojums mēra lokāla faila lasīšanu, bet te pa tīklu iet megabaiti JSON. Samazini to, ja tabulas atvēršana šķiet lēna.\n\nIevadiet skaitli - lietots, nospiežot Lietot."
raw_view_cap = "Maksimālais faila izmērs (MB), ko Octa pilnībā ielasa neapstrādātā\nskata redaktorā. Tas nosaka arī neapstrādāto atkāpšanos pēc nolasīšanas\nkļūdas un Salīdzināšanas skata neapstrādāto pusi. Lielākiem failiem\nneapstrādātais teksts tiek izlaists, lai taupītu atmiņu.\n\nNoklusējums: 50 MB. Atzīmējiet \"Neierobežoti\", lai ielādētu jebkura\nizmēra failu. Piemēro, nospiežot Lietot."
decompress_cap = "Maksimālais atspiestais izmērs (MB) caurspīdīgi atvērtiem\n.gz / .zst failiem. Sīks saspiests fails var uzpūsties milzīgi\n(atspiešanas bumba); pēc šī ierobežojuma atvēršana tiek atteikta.\n\nNoklusējums: 4295 MB (4 GB). Piemēro, nospiežot Lietot."
decompress_unlimited = "Pilnībā noņemt atspiešanas izmēra ierobežojumu. Atzīmējiet to tikai\narhīviem, kuriem uzticaties."
raw_view_unlimited = "Ielasīt jebkura faila pilnu tekstu neapstrādātajā skatā bez\nizmēra ierobežojuma. Lietojiet tikai ar atmiņas rezervi - vairāku GB\nfails tiek pilnībā ielasīts atmiņā."
initial_load_unlimited = "Ielādēt katru faila rindu uzreiz. Ieteicams tikai,\nkad tev ir lieka RAM - 100 milj. rindu parquet apēd\nvairākus GB."
syntax_size_cap = "Lielāki faili par šo pāriet uz vienkāršu vienplatuma\nneapstrādāta teksta redaktorā. Iestatiet 0, lai pilnībā\natspējotu sintakses iezīmēšanu; iestatiet ļoti lielu skaitli, lai\natteiktos no aizsardzības. JSON/YAML/XML/Markdown/TOML nekad netiek iezīmēti\n- tie izmanto savus koka/priekšskatījuma skatus.\n\nNoklusējums: 1 MB. Ievadiet skaitli, izvēlieties vienību - lietots, nospiežot Lietot."
open_as_text = "Papildu failu paplašinājumi, ko atverot uzskatīt par vienkāršu tekstu\n(aizstāj jebkuru lasītāju, kas tos parasti pieprasītu).\nAtdalīti ar komatu vai atstarpi, bez sākuma punkta, mazajiem burtiem.\nPiemērs: log4j  myproj  rawdata\n\nLietots, nospiežot Lietot; stājas spēkā turpmākiem failu atvērumiem."
folder_union_cap = "Maksimālais failu skaits, ko mākoņa mapes apvienošana lejupielādē\nun apvieno. Katrs fails tiek pilnībā ielasīts atmiņā, tāpēc mape ar\ndesmitiem tūkstošu daļu var izsmelt RAM. Faili virs ierobežojuma tiek\nizlaisti un saskaitīti statusa joslā.\n\nNoklusējums: 500. Tiek piemērots, nospiežot Lietot."
folder_union_unlimited = "Apvienot visus mapes failus, lai cik to būtu. Atzīmējiet tikai\ntad, ja atmiņas ir pietiekami."
multi_search_cap = "Viena faila izmēra ierobežojums Vairākkārtējās meklēšanas paneļa mapju\ntvērumam. Lielāki faili par šo tiek izlaisti un uzskaitīti\nizlaisto failu žetonā. Atzīmējiet \"Neierobežots\", lai ierobežojumu pilnībā noņemtu.\n\nNoklusējums: 50 MB."
multi_search_unlimited = "Skenē katru mapes failu neatkarīgi no izmēra. Milzīgs žurnāls vai\nizgāztne var iestrēdzināt skenēšanu un apēst atmiņu."
chart_max_points = "Maksimālais rindu skaits, ko Diagrammas cilne zīmēs, pirms ieslēdzas\nvienmērīgi izvietota retināšana (Histogramma, Līnija, Izkliede). Stabiņu diagrammas\nvienmēr agregē visu ievadi; Kastīšu diagrammas aprēķina\n5 skaitļu kopsavilkumu pār visu ievadi. Iestatiet 0, lai atspējotu\nretināšanu - droši tikai vidēja izmēra tabulām.\n\nNoklusējums: 25,000. Skaitliska ievade pieņem komata atdalītājus."
chart_max_categories = "Maksimālais atšķirīgu X kategoriju skaits, ko Stabiņu diagramma pieņems, pirms\natsakās zīmēt. Virs tā renderētājs parāda kļūdu,\nnevis veido nesalasāmu stabiņu sienu - vispirms filtrējiet vai\nagregējiet tabulu.\n\nNoklusējums: 200. Skaitliska ievade pieņem komata atdalītājus."
tables_in_picker = "Cik tabulas rindu vairāktabulu atlasītāja dialogam (SQLite,\nDuckDB, ...) jāietilpina vertikāli pie tā noklusējuma izmēra. Dialoga\nizmēru lietotājs joprojām var mainīt - velciet stūri, lai padarītu\nto lielāku, kad datubāzē ir daudz tabulu.\n\nNoklusējums: 10. Minimums 1."
excel_auto_open = "Cik daudzlapu Excel darbgrāmatas lapu atvērt\nautomātiski (katru savā cilnē). Darbgrāmatas ar vairāk\nlapām par šo rāda atlasītāju, lai izvēlētos, kuras atvērt\n(vari izvēlēties vairāk par šo skaitu vai visas).\n\nNoklusējums: 5. Minimums 1."
max_recent = "Nesen atvērto failu skaits, kas parādīts Faila izvēlnē"
start_maximised = "Kad ieslēgts, logs tiek palaists maksimizēts, un zemāk esošais izmērs\ntiek izmantots kā atjaunošanas-no-maksimizēšanas izmērs.\nKad izslēgts, logs tiek palaists izvēlētajā izmērā."
initial_window_size = "Loga izmērs, kas izmantots palaišanā (kad \"Sākt maksimizētu\" ir izslēgts),\nvai atjaunošanas-no-maksimizēšanas izmērs, kad tas ir ieslēgts."
ctrl_close = "Aizvērt"
ctrl_restore = "Atjaunot"
ctrl_full_size = "Pilns izmērs"
ctrl_minimise = "Minimizēt"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Aizsargā tavus failus no grafiskās saskarnes saglabāšanām un MCP servera noklusējuma.\nKad ieslēgts, kolonnu pievienošana vai noņemšana SQLite, DuckDB vai GeoPackage\nfailā saglabājot tiek atteikta. Asistentu pārvalda katrs tērzēšanas profils\n(profila slēdzis Atļaut rakstīšanu), nevis šis iestatījums."
confirm_db_write_back = "Pirms izmaiņas nonāk strādājošā datubāzē, Octa parāda, kas mainītos, un pajautā.\nIzslēdz to, lai Saglabāt uzreiz piemērotu izmaiņas; abos gadījumos tā ir viena transakcija,\nun neizdevies ieraksts tiek atsaukts."
db_pushdown = "Ja datubāzes cilne satur tikai daļu no savas tabulas, Kopsavilkums, Vērtību biežums, kvalitātes pārskats, Korelācija, Savienojuma atslēgu meklētājs, Savienojuma diagnostika, Atrast uzziņu tabulas un Izmērīt Sakaru kartē darbojas kā SQL serverī pār visām rindām, neko nelejupielādējot.\nIzslēdz, lai tās darbinātu ielādētajās rindās."
confirm_url_redirects = "Kad tīmekļa adrese aizved uz citu, pajautāt, pirms fails tiek atvērts no turienes. Šis apstiprinājums ir vienīgā vieta, kur šī maiņa ir redzama."
backup_before_modify = "Pirms asistents vai shēmu mainoša datubāzes saglabāšana pārraksta\nfailu, vispirms nokopēt to blakus esošā .bak failā ar laika zīmogu.\nIkdienas manuālās saglabāšanas netiek dublētas."
chat_profiles = "Katrs profils ir viens saglabāts iestatījumu kopums: sniedzējs, modelis, temperatūra un neobligāts domāšanas budžets ar tevis izvēlētu nosaukumu. Veido tik daudz, cik vēlaties, tostarp vairākus vienam sniedzējam, un pārslēdzieties starp tiem asistenta panelī."
chat_profile_base_url = "Šī profila galapunkts. Atstājiet tukšu, lai lietotu zemāk norādīto Ollama servera adresi."
write_options = "Noklusējuma vērtības, kad Octa raksta failu. Saglabāt kā un pakešpārveide sākas no tām un var tās mainīt vienai izpildei."
status_message_secs = "Cik ilgi statusa ziņojums paliek redzams, pirms pazūd. Tas pats\nilgums attiecas uz katru ziņojumu - gan veiksmi, gan kļūdu.\n\nTurot peli virs ziņojuma, atskaite apstājas: kļūda, ko lasi vai\nkopē, paliek vietā. Katram ziņojumam ir arī 'x', lai to uzreiz\naizvērtu.\n\nNevar izslēgt; zem 3 tiek lietots 3. Noklusējums: 10."
chat_tools = "Kurus rīkus asistents drīkst izmantot. Core grupa aiziet līdzi katrai ziņai; pārējās grupas tam tikai nosauc, un tas ielādē vienu, kad darbam tā vajag. Izslēgts rīks pazūd visur: to nesūta, nepiedāvā un noraida, ja asistents to tomēr izsauc."
chat_tools_enable_all = "Ieslēgt visus rīkus atpakaļ. Katrai ziņai līdzi aiziet tikai core grupa, tāpēc pārējais neko nemaksā, kamēr asistents to nepieprasa."
chat_tools_budget = "Aptuveni cik tokenu rīku apraksti pievieno ziņai. Aprēķināts no to izmēra, tāpēc lasi kā orientieri, nevis kā rēķinu."
sql_page_rows = "Cik rezultāta rindu tiek paņemtas uzreiz; ritinot pienāk vēl. Rindu skaits un Eksportēt vienmēr aptver visu rezultātu. 0 ielādē visu uzreiz."
sql_auto_register = "Padara katru citu atvērtu cilni vaicājamu SQL panelī ar tās pašas vārdu, lai divu atvērtu failu savienošanai nevajadzētu attach."
sql_auto_register_max = "Lielākas cilnes netiek reģistrētas automātiski, jo reģistrēšana kopē to rindas. Tā vietā tās saņem pogu Reģistrēt."
sql_auto_register_max_off = "Tiek lietots tikai tad, kad ieslēgts Vaicāt pārējās atvērtās cilnes."
git_marks_uncommitted = "Iekrāso sānu joslā datnes un mapes, kurām ir neiesūtītas git izmaiņas: mainītas, pievienotas, dzēstas, pārdēvētas vai neizsekotas."
git_marks_branch = "Iekrāso datnes un mapes, kas mainītas pašreizējā zarā kopš tā atzarošanās no bāzes zara."
git_marks_base_branch = "Zars, ar kuru salīdzina. Ja repozitorijā nav zara ar šādu nosaukumu, tiek mēģināts main; ja trūkst arī tā, zara atzīmes vienkārši nav, un mapes padoms to pasaka."
git_marks_base_branch_off = "Tiek lietots tikai tad, kad ieslēgts Atzīmēt izmaiņas šajā zarā."
git_marks_refresh_secs = "Cik bieži sānu josla no jauna jautā git, kamēr tā ir redzama. 0 izslēdz taimeri: tad atzīmes atsvaidzinās tikai atverot mapi un kad Octa saglabā datni."
git_marks_refresh_secs_off = "Tiek lietots tikai tad, kad ieslēgta vismaz viena git atzīme."
retype_layout_sample = "Cik vērtību nolasa Mainīt tipu, kad izlemj, kādā datuma formātā teksta kolonna ir rakstīta. Balsojums maksā septiņas datuma analīzes uz vērtību, visas uzreiz saskarnes pavedienā: pie 5 000 000 vērtību tās ir 35 000 000 analīžu, un logs uz vairākām sekundēm pārstāj atbildēt. Palielināt ir vērts tikai tad, ja kolonnas pirmās vērtības nepārstāv pārējās, piemēram, failā, kas sakārtots tā, ka visas ISO rindas ir pirmās. Parādītos skaitļus tas nekad nemaina. Noklusējums 10 000."
retype_layout_sample_off = "Izslēdz Neierobežoti, lai šeit ierakstītu skaitli."
retype_layout_sample_unlimited = "Nolasa katru kolonnas vērtību izlases vietā. Visprecīzāk nevienmērīgi sakārtotai kolonnai, bet vairāku miljonu rindu kolonnā logs katru reizi uz sekundēm sastingst, kad izvēlies datuma tipu."
cloud_download_concurrency = "Cik mākoņa objektu apvienošana lejupielādē vienlaikus. Noklusējums 8, vismaz 1. Lasīšana no objektu krātuves galvenokārt ir gaidīšana uz atbildes laiku, nevis baitu pārvietošana, tāpēc lejupielāde pa vienam atstāj savienojumu starplaikā dīkstāvē. Astoņi ir aptuveni tik, cik pārlūks atļauj vienam resursdatoram. Palielini ātrā savienojumā ar lielu aizkavi; samazini līdz 1, ja pakalpojumu sniedzējs vai starpniekserveris sāk noraidīt pieprasījumus. Ļoti lielas vērtības palaiž tikpat daudz pavedienu uzreiz un ir ātrākais ceļš uz pieprasījumu ierobežojuma kļūdu."
cloud_sidebar_position = "Pie kuras loga malas piestiprinās mākoņa savienojumu pārlūks. Pēc noklusējuma pa kreisi. Pārlūki pie vienas malas dala vienu paneli."
db_sidebar_position = "Pie kuras loga malas piestiprinās datubāzu savienojumu pārlūks. Pēc noklusējuma pa kreisi. Pārlūki pie vienas malas dala vienu paneli."
sql_format_title = "Kā SQL paneļa poga Formatēt izkārto vaicājumu. Priekšskatījums zemāk rāda rezultātu."
sql_format_keywords = "Vai atslēgvārdi, piemēram, SELECT un FROM, būs lielajiem burtiem, mazajiem vai tā, kā tu tos uzrakstīji."
sql_format_indent = "Cik ir viens atkāpes līmenis: 2 atstarpes, 4 atstarpes vai tabulācija."
sql_format_commas = "Kur liek komatu starp diviem saraksta elementiem. Nākamās rindas sākumā trūkstošs komats uzreiz krīt acīs."
sql_format_joins = "Katrs JOIN sākas jaunā rindā FROM līmenī, nevis ar atkāpi zem tā."
sql_format_inline = "Saraksts, kas īsāks par tik rakstzīmēm, paliek vienā rindā, piemēram, SELECT a, b, c. Ar 0 katrs elements saņem savu rindu."
sql_format_blank_lines = "Cik tukšu rindu atdala divas komandas."
sql_format_one_line = "Tikai sakārto atstarpes un atslēgvārdu burtu reģistru un katru priekšrakstu ieliek vienā rindā. Ērti, lai ielīmētu žurnālā vai programmā."
sql_format_off_one_line = "Izslēgts, kamēr ieslēgts Viss vaicājums vienā rindā: nav rindiņu pārnesumu, ko izkārtot."
sql_format_clause_width = "Klauzula, kas īsāka par tik rakstzīmēm, paliek sava atslēgvārda rindā, piemēram, GROUP BY c.name, un īss apakšvaicājums paliek savās iekavās. Sākas no saraksta platuma."
sql_format_clause_needs_list = "Vispirms iestati saraksta platumu virs 0. Viens pats šis iestatījums atstātu klauzulas elementus bez atkāpes."
sql_format_bracket_width = "Iekavas, kas īsākas par tik rakstzīmēm, paliek vienā rindā, piemēram, coalesce(a, 0) vai IN (1, 2, 3). Garākās katrs elements ir savā rindā."
sql_format_semicolon = "Pievieno ; aiz pēdējā priekšraksta, ja tā nav."
sql_format_preview = "Parauga vaicājums, izkārtots pēc iestatījumiem augstāk. Tas mainās, kad tu tos maini."
restore_session = "Palaižot Octa atkal atver failus, kas bija atvērti, kad tu to aizvēri. Pēc noklusējuma izslēgts. Pazudušie faili tiek izlaisti."
restore_session_cloud = "Atkal atver arī mākoņa objektus. Uzmanies: katrs tiek lejupielādēts no jauna katrā palaišanā, tas aizņem laiku un var maksāt par datu pārsūtīšanu."
restore_session_connections = "Atkal atver arī tabulas no datubāzu savienojumiem un API galapunktiem. Uzmanies: katra katrā palaišanā sūta vaicājumu savam serverim. Datu noliktavu tas var pamodināt un maksāt naudu, un beidzies pieteikums lūgs tev pieteikties vēlreiz."
restore_session_needs_main = "Vispirms ieslēdz Atkal atvērt pēdējo sesiju."

