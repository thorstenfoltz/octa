section_calendar = "Robi kalendārā"
sections_added = "Atvērtas {n} papildu cilnes atradumiem, kas nav pa kolonnām."
section_missingness_intro = "Kolonnas, kas paliek tukšas tajās pašās rindās. Četras kolonnas ar 8% tukšumu katrā ir cita problēma atkarībā no tā, vai katru reizi runa ir par tām pašām 8% rindu (viens salauzts savienojums, viena vieta, ko salabot) vai par četriem nesaistītiem 8%. Katra rinda šeit ir viena tāda grupa, lielākā pirmā."
section_calendar_intro = "Caurumi datuma vai laika zīmoga kolonnā: posmi, kur virkne lēkā, nevis soļo. Trūkstošās nedēļas nogales un pāreja uz vasaras laiku netiek skaitītas, tāpēc uzskaitīts ir patiešām trūkstošs dienas, stundas vai mēneša solis."
