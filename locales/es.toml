hint_benford_verdict = "Si los primeros dígitos de la columna siguen la ley de Benford: conforms, acceptable, marginal o nonconforming. La mayoría de las columnas no se prueban, y la celda dice por qué. Pasa el ratón por un veredicto para ver qué significa."
hint_calendar_verdict = "Si una columna de tiempo avanza sin huecos: complete, weekdays only, complete (clock change) o gaps. Los fines de semana y los cambios de hora no cuentan como ausentes. Una columna que no es una serie dice por qué no se probó. Pasa el ratón por un veredicto para ver qué significa; los huecos van en su propia pestaña."
hint_score = "La nota de esta columna sobre 100, sacada de tres de las columnas de la izquierda: 40% por lo llena que está, 40% por cuántos valores encajan con el tipo declarado y 20% por lo variados que son los valores. Los valores atípicos numéricos restan hasta 10 puntos. No dice nada sobre si los valores son correctos, solo sobre lo bien formados que están."
section_missingness = "Ausentes a la vez"
section_calendar = "Huecos en el calendario"
sections_added = "Se abrieron {n} pestaña(s) más para hallazgos que no son por columna."
section_missingness_intro = "Columnas que se quedan vacías en las mismas filas. Cuatro columnas con un 8% de huecos cada una son un problema distinto según si es siempre el mismo 8% de filas (una unión rota, un único sitio que arreglar) o cuatro 8% sin relación. Cada fila de aquí es uno de esos grupos, el mayor primero."
section_calendar_intro = "Huecos en una columna de fecha o marca de tiempo: los tramos donde la serie salta en vez de avanzar paso a paso. Los fines de semana que faltan y el cambio de hora no cuentan, así que lo que se lista es un día, una hora o un mes que falta de verdad."
hint_miss_columns = "Las columnas que están vacías juntas en esas filas."
hint_miss_column_count = "Cuántas columnas son."
hint_miss_rows = "Cuántas filas tienen vacío exactamente ese conjunto de columnas."
hint_miss_share_percent = "Esas filas como porcentaje de toda la tabla."
hint_gap_column = "La columna de fecha o marca de tiempo donde está el hueco."
hint_gap_after = "El último valor antes del hueco."
hint_gap_before = "El primer valor después."
hint_gap_missing_steps = "Cuántos pasos de la serie faltan en medio, contados en el propio ritmo de la columna (días, horas, meses)."
hint_gap_kind = "Qué clase de hueco es: un hueco corriente, o un tramo lo bastante largo como para parecer una parada y no un desliz."
overall_explained = "La media de las notas por columna del informe. Pasa el ratón por la cabecera de la columna score para ver cómo se calcula una nota."
verdict_benford_conforms = "Los primeros dígitos quedan cerca de lo que espera la ley de Benford, como suelen hacer las cifras medidas o acumuladas. No prueba nada: una columna puede cumplir y estar mal igualmente."
verdict_benford_acceptable = "Un poco fuera de las proporciones esperadas, dentro de lo que los datos reales se mueven. Nada que hacer."
verdict_benford_marginal = "Lo bastante fuera como para mirarlo dos veces, no lo bastante para ser un hallazgo. Mira cómo se produce la columna antes de leer nada en ella."
verdict_benford_nonconforming = "Los primeros dígitos no parecen cantidades medidas. Un motivo para seguir mirando, nunca un hallazgo por sí solo: cifras redondeadas, topadas o tecleadas a mano acaban aquí sin ninguna culpa."
verdict_benford_not_numbers = "No probado: la columna no contiene números, y la ley trata del primer dígito de un número."
verdict_benford_too_few = "No probado: menos de 300 valores útiles, donde las proporciones de dígitos son ruido y no una distribución."
verdict_benford_narrow = "No probado: los valores abarcan menos de un factor diez. Un porcentaje, una edad o una valoración no tienen por qué seguir la ley, así que un veredicto solo despistaría."
verdict_benford_ids = "No probado: enteros densos y todos distintos, o sea una secuencia asignada (un número de fila, un número de factura, un id). Eso se reparte, no se mide."
verdict_calendar_complete = "Cada paso de la serie está, desde la primera marca de tiempo hasta la última. Ningún hueco que explicar."
verdict_calendar_weekdays = "Los únicos huecos son fines de semana saltados, que es lo que hacen los datos de negocio a propósito. Cuenta como completo, y esos fines de semana no salen en la pestaña de huecos."
verdict_calendar_dst = "El único hueco tiene la forma de un cambio de hora: un paso, un domingo, de madrugada. Las marcas de tiempo de Octa no llevan zona horaria, así que esto lee la forma sin saberlo. Compruébalo si a la serie le importa la hora."
verdict_calendar_gaps = "Tiempo que debería tener filas y no las tiene. La pestaña Huecos de calendario lista cada hueco con las marcas de tiempo a ambos lados."
verdict_calendar_not_dates = "No probado: la columna no contiene fechas ni marcas de tiempo."
verdict_calendar_too_few = "No probado: menos de tres marcas de tiempo distintas, eso aún no es una serie."
verdict_calendar_irregular = "No probado: ningún paso cubre el 60% de los intervalos, así que no hay ritmo en el que buscar huecos. Los registros de eventos se leen así."

