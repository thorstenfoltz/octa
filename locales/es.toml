write_protection = "Protege tus archivos de los guardados de la interfaz y del valor predeterminado del servidor MCP.\nCuando está activado, añadir o quitar columnas en un archivo SQLite, DuckDB o GeoPackage\nse rechaza al guardar. El asistente se rige por cada perfil de chat\n(el interruptor Permitir escrituras del perfil), no por este ajuste."
confirm_db_write_back = "Antes de que los cambios lleguen a una base de datos en uso, Octa muestra qué cambiaría y pregunta.\nDesactívalo para que Guardar aplique las diferencias de inmediato; en ambos casos es una sola\ntransacción, y si algo falla se deshace por completo."
confirm_url_redirects = "Cuando una dirección web te lleva a otra distinta, preguntar antes de abrir el archivo desde allí. Esa confirmación es el único sitio donde ese cambio se ve."
backup_before_modify = "Antes de que el asistente o un guardado que cambia el esquema de la base de datos\nsobrescriba un archivo, se copia primero a un archivo .bak con marca de tiempo al lado.\nLos guardados manuales normales no se respaldan."
chat_profiles = "Cada perfil es una configuración guardada: un proveedor, un modelo, una temperatura y un presupuesto de razonamiento opcional, con el nombre que elijas. Crea tantos como quieras, incluidos varios del mismo proveedor, y cambia entre ellos desde el panel del asistente."
chat_profile_base_url = "Punto de acceso para este perfil. Déjalo vacío para usar la dirección del servidor Ollama configurada más abajo."
write_options = "Valores predeterminados al escribir un archivo. Guardar como y la conversión por lotes parten de ellos y pueden cambiarlos para una ejecución."
status_message_secs = "Cuánto tiempo permanece un mensaje de estado antes de\ndesaparecer. La misma duración vale para todos los mensajes,\ntanto de éxito como de error.\n\nAl pasar el ratón por encima, la cuenta atrás se pausa: un\nerror que estás leyendo o copiando se queda ahí. Cada\nmensaje tiene además una 'x' para cerrarlo al momento.\n\nNo se puede desactivar; por debajo de 3 se usa 3.\nPor defecto: 10."
chat_tools = "Qué herramientas puede usar el asistente. El grupo core va en cada mensaje; los demás grupos solo se le nombran, y carga uno cuando el trabajo lo pide. Una herramienta apagada desaparece del todo: no se envía, no se ofrece y se rechaza si aun así la llama."
