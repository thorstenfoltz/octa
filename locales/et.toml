map_intro = "Kaardivaate vaikeväärtused (kasutavad GeoJSON-failid). Aktiivne kaart saab Kaardi tööriistariba kaudu vahetada Paanide ja Ainult geomeetria vahel."
map_default_mode = "Paanid: too libisev kaart konfigureeritud paani URL-ist.\nAinult geomeetria: joonista ainult objektid tühjale lõuendile."
map_fallback = "Kui paani toomine ebaõnnestub (võrguühenduseta, blokeeritud), lülitu selle kaardi jaoks automaatselt ainult geomeetria renderdamisele."
tile_url = "URL-muster rasterpaanide jaoks. `{z}/{x}/{y}` asendatakse suumitaseme ja paani koordinaatidega. Vaikimisi viitab OSM-i paaniserverile - tootmiseks / suure koormuse jaoks viidake ise majutatud või kommertspakkujale."
sidebar_position = "Millisel poolel kataloogipuu dokitakse, kui\nkaust avatakse menüüst Fail > Ava kataloog."
shortcuts_intro = "Klõpsake „Salvesta“, seejärel vajutage klahvikombinatsiooni (koos Ctrl / Shift / Alt).\nVajutage Esc salvestamise tühistamiseks. „Tühjenda“ jätab toimingu sidumata."
initial_load_cap = "Maksimaalne ridade arv, mis laaditakse tabelisse esimesel avamisel\nvoogesitusvormingute jaoks (Parquet, CSV, TSV). Ülejäänud read\nvoogesitatakse taustal kerides.\n\nVaikimisi: 2,000,000. Selle tõstmine parandab esimese kuva\ntäielikkust, kuid kasutab rohkem mälu. Selle langetamine muudab\nesialgse avamise kiiremaks, kuid lükkab rohkem tööd\ntaustalaaduri peale. Märkige \"Piiramatu\", et piirang täielikult\nkeelata ja laadida iga rida kohe.\n\nSisestage arv - rakendatakse Rakenda nupul."
db_page_rows = "Ridu päringu kohta, kui avad tabeli reaalajas andmebaasiühendusest.\n\nVaikimisi: 100,000. See on lehe suurus, mitte lagi: järgmine leht laaditakse taustal, kui kerid, täpselt nagu suure Parquet-faili puhul.\n\nEraldi seade, sest ülal olev piir mõõdab kohaliku faili lugemist, siin aga liigub üle võrgu megabaite JSON-i. Vähenda seda, kui tabeli avamine tundub aeglane.\n\nSisestage arv - rakendatakse Rakenda nupul."
raw_view_cap = "Suurim failimaht (MB), mille Octa loeb täielikult toorvaate\nredaktorisse. Piirab ka töötlemisvea tooreks varuvaateks minekut\nja võrdlusvaate toorpoolt. Suuremate failide puhul jäetakse\ntoortekst mälu säästmiseks vahele.\n\nVaikimisi: 50 MB. Märgi \"Piiramatu\", et laadida iga fail\nsõltumata suurusest. Rakendub Rakenda nupul."
decompress_cap = "Suurim lahtipakitud maht (MB) läbipaistvalt avatud\n.gz / .zst failide jaoks. Väike pakitud fail võib tohutult paisuda\n(lahtipakkimispomm); üle selle piiri avamisest keeldutakse.\n\nVaikimisi: 4295 MB (4 GB). Rakendub Rakenda nupul."
decompress_unlimited = "Eemalda lahtipakkimise suuruse piir täielikult. Märgi see ainult\narhiivide puhul, mida usaldad."
raw_view_unlimited = "Loe iga faili kogu tekst toorvaatesse ilma suuruse\npiiranguta. Kasuta ainult siis, kui mälu jagub - mitme GB\nsuurune fail loetakse täielikult mällu."
initial_load_unlimited = "Laadi iga faili rida kohe. Soovitatav ainult,\nkui sul on RAM-i üle - 100 mln rea parquet sööb\nmitu GB."
syntax_size_cap = "Sellest suuremad failid taanduvad toorredaktoris tavalisele\npüsisammule. Seadke 0, et süntaksiesiletõst täielikult\nkeelata; seadke väga suur arv, et kaitsest loobuda.\nJSON/YAML/XML/Markdown/TOML ei tõsteta kunagi esile\n- need kasutavad oma spetsiaalseid puu/eelvaate vaateid.\n\nVaikimisi: 1 MB. Sisestage arv, valige ühik - rakendatakse Rakenda nupul."
open_as_text = "Lisafaililaiendid, mida avamisel käsitleda lihttekstina\n(alistab mis tahes lugeja, mis need tavaliselt hõivaks).\nKoma- või tühikueraldatud, ilma alguspunktita, väiketähtedega.\nNäide: log4j  myproj  rawdata\n\nRakendatakse Rakenda nupul; jõustub järgnevatel failiavamistel."
folder_union_cap = "Suurim failide arv, mille pilvekausta ühendamine alla laadib ja\nkokku liidab. Iga fail loetakse tervikuna mällu, seega kümnete\ntuhandete osadega kaust võib RAM-i ammendada. Piirist ülejäävad failid\njäetakse vahele ja loendatakse olekuribal.\n\nVaikimisi: 500. Rakendub nupuga Rakenda."
folder_union_unlimited = "Ühenda kõik kausta failid, olgu neid kui palju tahes. Märgi ainult\nsiis, kui mälu on ülearu."
multi_search_cap = "Failipõhine suuruspiirang Mitmikotsingu paneeli kataloogi-\nulatuse jaoks. Sellest suuremad failid jäetakse vahele ja loetletakse\nvahelejäetud failide märgises. Märgi \"Piiramatu\", et piirang täielikult eemaldada.\n\nVaikimisi: 50 MB."
multi_search_unlimited = "Skannib kausta iga faili sõltumata suurusest. Hiiglaslik logi või\ntõmmis võib skannimise kinni jooksutada ja mälu ära süüa."
chart_max_points = "Maksimaalne ridade arv, mille Diagrammi kaart joonistab enne, kui rakendub\nühtlaselt jaotatud allproovimine (Histogramm, Joon, Hajuvus). Tulpdiagrammid\nagregeerivad alati kogu sisendi; Karpdiagrammid arvutavad\n5-numbrilise kokkuvõtte kogu sisendi üle. Seadke 0, et keelata\nproovimine - ohutu ainult mõõdukate tabelite jaoks.\n\nVaikimisi: 25,000. Numbriline sisend aktsepteerib komaeraldajaid."
chart_max_categories = "Maksimaalne erinevate X-kategooriate arv, mida Tulpdiagramm aktsepteerib enne\njoonistamisest keeldumist. Sellest enam toob renderdaja esile vea,\nselle asemel et toota loetamatut tulpade seina - filtreerige või\nagregeerige tabelit kõigepealt.\n\nVaikimisi: 200. Numbriline sisend aktsepteerib komaeraldajaid."
tables_in_picker = "Mitu tabeli rida peaks mitmetabeli valija dialoog (SQLite,\nDuckDB, ...) oma vaikesuuruses vertikaalselt mahutama. Dialoogi\nsuurust saab kasutaja siiski muuta - lohistage nurka, et seda\nsuurendada, kui andmebaasis on palju tabeleid.\n\nVaikimisi: 10. Miinimum 1."
excel_auto_open = "Mitu mitmelehelise Exceli töövihiku lehte avada\nautomaatselt (igaüks oma kaardil). Töövihikud, millel on rohkem\nlehti kui see, näitavad valijat, et saaksite valida, milliseid avada\n(saate ikkagi valida rohkem kui selle arvu või kõik).\n\nVaikimisi: 5. Miinimum 1."
max_recent = "Hiljuti avatud failide arv, mis kuvatakse Faili menüüs"
start_maximised = "Kui sees, käivitatakse aken maksimeerituna ja allolevat suurust\nkasutatakse maksimeeringust taastamise suurusena.\nKui väljas, käivitatakse aken valitud suuruses."
initial_window_size = "Akna suurus, mida kasutatakse käivitamisel (kui \"Käivita maksimeerituna\" on väljas),\nvõi maksimeeringust taastamise suurus, kui see on sees."
ctrl_close = "Sulge"
ctrl_restore = "Taasta"
ctrl_full_size = "Täissuurus"
ctrl_minimise = "Minimeeri"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Kaitseb sinu faile graafilise liidese salvestuste ja MCP serveri vaikeseade eest.\nKui see on sees, keeldutakse salvestamisel veergude lisamisest või eemaldamisest\nSQLite, DuckDB või GeoPackage failis. Assistenti juhitakse vestlusprofiili kaupa\n(profiili Luba kirjutamine lüliti), mitte selle sättega."
confirm_db_write_back = "Enne kui muudatused jõuavad töötavasse andmebaasi, näitab Octa, mis muutuks, ja küsib.\nLülita see välja, et Salvesta rakendaks muudatused kohe; mõlemal juhul on see üks tehing\nja ebaõnnestunud kirjutamine võetakse tagasi."
db_pushdown = "Kui andmebaasi vaheleht sisaldab tabelist vaid osa, töötavad Kokkuvõte, Väärtuste sagedus, kvaliteediaruanne, Korrelatsioon, Ühendusvõtmete otsija, Ühenduse diagnostika, Leia otsingutabelid ja Seoste kaardi Mõõda SQL-ina serveris kõigil ridadel, midagi alla laadimata.\nLülita välja, et käivitada need hoopis laaditud ridadel."
confirm_url_redirects = "Kui veebiaadress saadab sind teisele, küsi enne faili sealt avamist. See kinnitus on ainus koht, kus muutus on näha."
backup_before_modify = "Enne kui assistent või skeemi muutev andmebaasi salvestus faili üle\nkirjutab, kopeeri see kõrvale ajatempliga .bak faili.\nTavalisi käsitsi salvestusi ei varundata."
chat_profiles = "Iga profiil on üks salvestatud seadistus: pakkuja, mudel, temperatuur ja valikuline mõtlemise eelarve sinu valitud nime all. Tee neid nii palju kui soovid, sealhulgas mitu sama pakkuja kohta, ja vaheta nende vahel assistendi paneelilt."
chat_profile_base_url = "Selle profiili lõpp-punkt. Jäta tühjaks, et kasutada allpool määratud Ollama serveri aadressi."
write_options = "Vaikeväärtused, kui Octa faili kirjutab. Salvesta nimega ja hulgiteisendus lähtuvad neist ja saavad neid ühe käivituse jaoks muuta."
status_message_secs = "Kui kaua olekuteade ekraanil püsib, enne kui kaob. Sama kestus\nkehtib igale teatele, nii õnnestumisele kui veale.\n\nKui viid hiire teate peale, peatub loendur - viga, mida parajasti\nloed või kopeerid, jääb seega paigale. Igal teatel on ka 'x',\nmillega selle kohe sulged.\n\nEi saa välja lülitada; alla 3 loetakse 3-ks. Vaikimisi: 10."
chat_tools = "Milliseid tööriistu assistent kasutada tohib. Core-rühm läheb iga sõnumiga kaasa; teisi rühmi ainult nimetatakse talle ja ta laadib ühe, kui töö seda nõuab. Väljalülitatud tööriist on kõikjalt kadunud: seda ei saadeta, ei pakuta ja see lükatakse tagasi, kui ta seda ikkagi kutsub."
chat_tools_enable_all = "Lülita kõik tööriistad jälle sisse. Ainult core-rühm läheb iga sõnumiga kaasa, nii et ülejäänu ei maksa midagi enne, kui assistent seda küsib."
chat_tools_budget = "Umbkaudu mitu tokenit tööriistade kirjeldused sõnumile lisavad. Arvutatud nende suurusest, seega loe seda suunanäitajana, mitte arvena."
sql_page_rows = "Mitu tulemuse rida korraga tuuakse; kerides tuleb juurde. Ridade arv ja Ekspordi katavad alati kogu tulemuse. 0 laadib kõik korraga."
sql_auto_register = "Teeb iga teise avatud kaardi SQL-paneelis päritavaks tema enda nime all, nii et kahe avatud faili ühendamine ei vaja attachi."
sql_auto_register_max = "Sellest suuremaid kaarte automaatselt ei registreerita, sest registreerimine kopeerib nende read. Nemad saavad selle asemel nupu Registreeri."
sql_auto_register_max_off = "Kasutatakse ainult siis, kui Päri teistest avatud kaartidest on sees."
git_marks_uncommitted = "Värvib külgribal failid ja kaustad, millel on sisestamata git-muudatusi: muudetud, lisatud, kustutatud, ümber nimetatud või jälgimata."
git_marks_branch = "Värvib failid ja kaustad, mida on praeguses harus muudetud pärast selle hargnemist baasharust."
git_marks_base_branch = "Haru, millega võrreldakse. Kui hoidlas pole selle nimega haru, proovitakse main-i; kui ka see puudub, jääb harumärk lihtsalt ära ja kausta vihje ütleb seda."
git_marks_base_branch_off = "Kasutatakse ainult siis, kui Märgi selle haru muudatused on sees."
git_marks_refresh_secs = "Kui tihti külgriba gitilt uuesti küsib, kuni see on nähtav. 0 lülitab taimeri välja: siis värskenduvad märgid ainult kausta avamisel ja siis, kui Octa faili salvestab."
git_marks_refresh_secs_off = "Kasutatakse ainult siis, kui vähemalt üks git-märk on sees."
retype_layout_sample = "Mitu väärtust Muuda tüüpi loeb, kui otsustab, millises kuupäevavormingus tekstiveerg kirjutatud on. Hääletus maksab seitse kuupäeva sõelumist väärtuse kohta, kõik korraga liidese lõimes: 5 000 000 väärtuse juures on see 35 000 000 sõelumist ja aken lakkab sekunditeks vastamast. Tõstmine aitab ainult siis, kui veeru esimesed väärtused ei esinda ülejäänuid, näiteks failis, kus kõik ISO read on ees. Näidatud arve see kunagi ei muuda. Vaikimisi 10 000."
retype_layout_sample_off = "Lülita Piiramatu välja, et siia arv kirjutada."
retype_layout_sample_unlimited = "Loeb valimi asemel veeru iga väärtuse. Ebaühtlaselt sorteeritud veeru puhul kõige täpsem, kuid mitme miljoni reaga veerus hangub aken iga kord sekunditeks, kui valid kuupäevatüübi."
cloud_download_concurrency = "Mitu pilveobjekti ühendamine korraga alla laadib. Vaikimisi 8, vähemalt 1. Objektisalvestusest lugemine on peamiselt edasi-tagasi aja ootamine, mitte baitide liigutamine, nii et ükshaaval laadimine jätab ühenduse vahepeal seisma. Kaheksa on umbes see, mida brauser hosti kohta lubab. Tõsta kiirel ja suure viivitusega ühendusel; langeta 1-ni, kui teenusepakkuja või puhverserver hakkab päringuid tagasi lükkama. Väga suured väärtused käivitavad sama palju lõime korraga ja on kiireim tee päringupiirangu veani."
cloud_sidebar_position = "Millise akna serva külge pilveühenduste sirvija dokitakse. Vaikimisi vasakule. Sama serva sirvijad jagavad üht paneeli."
db_sidebar_position = "Millise akna serva külge andmebaasiühenduste sirvija dokitakse. Vaikimisi vasakule. Sama serva sirvijad jagavad üht paneeli."
sql_format_title = "Kuidas SQL-paneeli nupp Vorminda päringu paigutab. Allolev eelvaade näitab tulemust."
sql_format_keywords = "Kas märksõnad nagu SELECT ja FROM tulevad suurte, väikeste tähtedega või nii, nagu sa need kirjutasid."
sql_format_indent = "Mis on üks taandetase: 2 tühikut, 4 tühikut või tab."
sql_format_commas = "Kuhu läheb koma kahe loendi elemendi vahel. Järgmise rea alguses paistab puuduv koma kohe silma."
sql_format_joins = "Iga JOIN algab uuelt realt FROM-iga samal tasemel, mitte selle alla taandatult."
sql_format_inline = "Sellest märkide arvust lühem loend jääb ühele reale, näiteks SELECT a, b, c. Väärtusega 0 saab iga element oma rea."
sql_format_blank_lines = "Mitu tühja rida eraldab kahte lauset."
sql_format_one_line = "Korrastab ainult tühikud ja võtmesõnade suurtähed ning paneb iga lause ühele reale. Mugav logisse või programmi kleepimiseks."
sql_format_off_one_line = "Väljas, kuni Kogu päring ühel real on sees: pole reavahetusi, mida paigutada."
sql_format_clause_width = "Klausel, mis on lühem kui nii mitu märki, jääb oma võtmesõna reale, näiteks GROUP BY c.name, ja lühike alampäring jääb oma sulgudesse. Algab loendi laiusest."
sql_format_clause_needs_list = "Sea esmalt loendi laius üle 0. Üksi jätaks see klausli elemendid taandeta."
sql_format_bracket_width = "Sulud, mis on lühemad kui nii mitu märki, jäävad ühele reale, näiteks coalesce(a, 0) või IN (1, 2, 3). Pikemates on iga element omaette real."
sql_format_semicolon = "Lisab viimase lause järele ; kui seda pole."
sql_format_preview = "Näidispäring ülalolevate seadetega. See muutub, kui sa neid muudad."
restore_session = "Käivitamisel avab Octa uuesti failid, mis olid lahti, kui sa selle sulgesid. Vaikimisi väljas. Kadunud failid jäetakse vahele."
restore_session_cloud = "Avab uuesti ka pilveobjektid. Ettevaatust: igaüks laaditakse igal käivitamisel uuesti alla, mis võtab aega ja võib andmeedastuse eest raha maksta."
restore_session_connections = "Avab uuesti ka tabelid andmebaasiühendustest ja API lõpp-punktidest. Ettevaatust: igaüks saadab igal käivitamisel oma serverile päringu. Andmelaos võib see selle üles äratada ja raha maksta, ja aegunud sisselogimine palub sul uuesti sisse logida."
