chat_ollama_url = "Sinu kohaliku Ollama serveri juur-URL. API-teed lisab Octa ise."
chat_position = "Kuhu vestluspaneel tabeli suhtes dokitakse."
chat_export_dir = "Kaust, kuhu assistent kirjutab loodud failid (uued CSV-d, diagrammid), kuni sa täielikku teed ei anna."
chat_audit_log = "Lisab iga abilise tööriistakutse logisse seadistuskaustas (chat_audit/). Vaikimisi väljas."
chat_render_markdown = "Sees: vastuste pealkirjad, loendid, tabelid, koodiplokid ja lingid joonistatakse vormindatuna. Väljas: näed toorest Markdowni lähteteksti. Sinu enda sõnumeid ei vormindata kunagi ümber."
chat_audit_warn = "Näita käivitamisel hoiatust, kui logid ületavad selle suuruse."
