write_protection = "Védi a fájljaidat a grafikus felület mentéseitől és az MCP-szerver alapértelmezésétől.\nBekapcsolva egy SQLite, DuckDB vagy GeoPackage fájlban az oszlopok hozzáadása vagy\neltávolítása mentéskor elutasításra kerül. Az asszisztenst csevegőprofilonként\nszabályozza az adott profil Írás engedélyezése kapcsolója, nem ez a beállítás."
confirm_db_write_back = "Mielőtt a módosítások élő adatbázisba kerülnének, az Octa megmutatja, mi változna, és rákérdez.\nKapcsold ki, hogy a Mentés azonnal alkalmazza a különbséget; mindkét esetben egyetlen tranzakció,\nés a sikertelen írás visszagördül."
confirm_url_redirects = "Ha egy webcím továbbküld egy másikra, kérdezzen rá, mielőtt onnan nyitja meg a fájlt. Ez a kérdés az egyetlen hely, ahol a változás látszik."
backup_before_modify = "Mielőtt az asszisztens vagy egy sémát módosító adatbázismentés felülír\negy fájlt, először másolja azt egy időbélyeges .bak fájlba mellé.\nA szokásos kézi mentésekről nem készül másolat."
chat_profiles = "Minden profil egy mentett összeállítás: egy szolgáltató, egy modell, egy hőmérséklet és egy opcionális gondolkodási keret, az általad választott néven. Annyit készíthetsz, amennyit szeretnél, akár többet ugyanahhoz a szolgáltatóhoz is, és az asszisztens panelről válthatsz köztük."
chat_profile_base_url = "A profil végpontja. Hagyd üresen az alább beállított Ollama-szervercím használatához."
write_options = "Alapértékek fájl írásakor. A Mentés másként és a kötegelt átalakítás ezekből indul, és egy futásra felülírhatja őket."

