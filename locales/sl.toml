tile_url = "URL predloga za rastrske ploščice. `{z}/{x}/{y}` se zamenjajo z ravnjo povečave in koordinatami ploščice. Privzeto kaže na strežnik ploščic OSM - za produkcijo / intenzivno uporabo usmerite na samostojno gostovanega ali komercialnega ponudnika."
sidebar_position = "Na kateri strani je priključeno drevo imenikov, ko\nse mapa odpre prek Datoteka > Odpri mapo."
shortcuts_intro = "Kliknite „Posnemi“ in pritisnite kombinacijo tipk (s Ctrl / Shift / Alt).\nPritisnite Esc za preklic snemanja. „Počisti“ pusti dejanje nepovezano."
initial_load_cap = "Največje število vrstic, naloženih v tabelo ob prvem odpiranju za\nstreaming oblike (Parquet, CSV, TSV). Preostale vrstice\nse nalagajo v ozadju med pomikanjem.\n\nPrivzeto: 2,000,000. Povečanje izboljša popolnost\nprvega izrisa, a porabi več pomnilnika. Zmanjšanje naredi\nzačetno odpiranje hitrejše, a prenese več dela na\nnalagalnik v ozadju. Označite „Neomejeno“, da onemogočite\nomejitev v celoti in naložite vsako vrstico naenkrat.\n\nVnesite število - uporabi se ob Uporabi."
db_page_rows = "Vrstic na zahtevo, ko odpreš tabelo prek žive povezave z bazo podatkov.\n\nPrivzeto: 100,000. To je velikost strani, ne zgornja meja: naslednja stran se naloži v ozadju, medtem ko drsiš, enako kot pri veliki datoteki Parquet.\n\nLočena nastavitev, ker zgornja omejitev meri branje lokalne datoteke, tu pa gredo po omrežju megabajti JSON. Zmanjšaj jo, če se ti odpiranje tabele zdi počasno.\n\nVnesite število - uporabi se ob Uporabi."
raw_view_cap = "Največja velikost datoteke (v MB), ki jo Octa v celoti prebere v\nurejevalnik surovega pogleda. Omejuje tudi surovi nadomestni prikaz ob napaki\nrazčlenjevanja in surovo stran primerjave. Večje datoteke surovo besedilo\nizpustijo, da se prihrani pomnilnik.\n\nPrivzeto: 50 MB. Označi \"Brez omejitve\" za nalaganje datoteke\nne glede na velikost. Uveljavi se ob potrditvi."
decompress_cap = "Največja velikost po razširitvi (v MB) za prosojno odprte\ndatoteke .gz / .zst. Majhna stisnjena datoteka se lahko silno napihne\n(dekompresijska bomba); nad to omejitvijo je odpiranje zavrnjeno.\n\nPrivzeto: 4.295 MB (4 GB). Uveljavi se ob potrditvi."
decompress_unlimited = "Popolnoma odstrani omejitev velikosti po razširitvi. Označi le\nza arhive, ki jim zaupaš."
raw_view_unlimited = "Preberi celotno besedilo poljubne datoteke v surovi pogled brez\nomejitve velikosti. Uporabljaj le, če imaš dovolj pomnilnika - datoteka\nvelikosti več GB se v celoti prebere v pomnilnik."
initial_load_unlimited = "Naloži vsako vrstico v datoteki naenkrat. Priporočeno samo,\nko imate odvečen RAM - parquet s 100 M vrsticami poje\nnekaj GB."
syntax_size_cap = "Datoteke, večje od tega, preidejo na navaden monospace v\nsurovem urejevalniku. Nastavite 0, da onemogočite poudarjanje\nskladnje v celoti; nastavite zelo veliko število, da se odpoveste\nzaščiti. JSON/YAML/XML/Markdown/TOML se nikoli ne poudarjajo\n- uporabljajo svoje namenske poglede drevo/predogled.\n\nPrivzeto: 1 MB. Vnesite število, izberite enoto - uporabi se ob Uporabi."
open_as_text = "Dodatne pripone datotek, ki naj se ob odpiranju obravnavajo kot navadno\nbesedilo (prevlada nad bralnikom, ki bi jih običajno zahteval).\nLočeno z vejico ali presledkom, brez vodilne pike, z malimi črkami.\nPrimer: log4j  myproj  rawdata\n\nUporabi se ob Uporabi; začne veljati za naslednja odpiranja datotek."
folder_union_cap = "Največje število datotek, ki jih združevanje mape v oblaku prenese\nin združi. Vsaka datoteka se v celoti prebere v pomnilnik, zato lahko\nmapa z več deset tisoč deli izčrpa RAM. Datoteke nad omejitvijo se\npreskočijo in preštejejo v vrstici stanja.\n\nPrivzeto: 500. Uveljavi se z Uporabi."
folder_union_unlimited = "Združi vse datoteke v mapi, kolikor koli jih je. Označite le, če\nimate dovolj pomnilnika."
multi_search_cap = "Omejitev velikosti datoteke za obseg imenika plošče Večkratno iskanje.\nDatoteke, večje od tega, se preskočijo in navedejo v oznaki\npreskočenih datotek. Označite \"Neomejeno\", da omejitev popolnoma odstranite.\n\nPrivzeto: 50 MB."
multi_search_unlimited = "Preišče vsako datoteko v imeniku ne glede na velikost. Ogromen\ndnevnik ali izpis lahko zatakne iskanje in poje pomnilnik."
chart_max_points = "Največje število vrstic, ki jih zavihek Grafikon nariše, preden se\nvklopi enakomerno redčenje (Histogram, Črta, Razsevni). Stolpčni grafikoni\nvedno agregirajo celoten vhod; Škatlasti izračunajo\n5-številčni povzetek nad celotnim vhodom. Nastavite 0, da onemogočite\nredčenje - varno samo za zmerno velike tabele.\n\nPrivzeto: 25,000. Številski vnos sprejema ločila-vejice."
chart_max_categories = "Največje število različnih kategorij X, ki jih stolpčni grafikon sprejme, preden\nzavrne risanje. Nad tem upodabljalnik prikaže napako\nnamesto neberljive stene stolpcev - najprej filtrirajte ali\nagregirajte tabelo.\n\nPrivzeto: 200. Številski vnos sprejema ločila-vejice."
tables_in_picker = "Koliko vrstic tabel naj pogovorno okno za izbiro večtabelnih virov (SQLite,\nDuckDB, ...) navpično prilagodi pri privzeti velikosti. Pogovorno okno\nje še vedno mogoče spreminjati po velikosti - povlecite vogal, da ga naredite\nvečjega, ko ima podatkovna baza veliko tabel.\n\nPrivzeto: 10. Najmanj 1."
excel_auto_open = "Koliko listov večlistnega Excelovega delovnega zvezka odpreti\nsamodejno (vsakega v svojem zavihku). Delovni zvezki z več\nlisti od tega prikažejo izbirnik, da izberete, katere odpreti\n(še vedno lahko izberete več od tega števila, ali vse).\n\nPrivzeto: 5. Najmanj 1."
max_recent = "Število nedavno odprtih datotek, prikazanih v meniju Datoteka"
start_maximised = "Ko je vklopljeno, se okno zažene maksimirano, velikost spodaj\npa se uporabi kot velikost obnovitve iz maksimiranja.\nKo je izklopljeno, se okno zažene z izbrano velikostjo."
initial_window_size = "Velikost okna ob zagonu (ko je „Zaženi maksimirano“ izklopljeno),\nali velikost obnovitve iz maksimiranja, ko je vklopljeno."
ctrl_close = "Zapri"
ctrl_restore = "Obnovi"
ctrl_full_size = "Polna velikost"
ctrl_minimise = "Pomanjšaj"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Ščiti tvoje datoteke pred shranjevanjem iz vmesnika in privzeto nastavitvijo strežnika MCP.\nKo je vklopljeno, je dodajanje ali odstranjevanje stolpcev v datoteki SQLite, DuckDB ali GeoPackage\nob shranjevanju zavrnjeno. Pomočnika ureja vsak profil pogovora posebej\n(stikalo Dovoli pisanje v profilu), ne ta nastavitev."
confirm_db_write_back = "Preden spremembe odidejo v delujočo zbirko, Octa pokaže, kaj bi se spremenilo, in vpraša.\nIzklopi to, da Shrani razlike uporabi takoj; v obeh primerih gre za eno transakcijo,\nneuspel zapis pa se povrne."
db_pushdown = "Če zavihek zbirke podatkov vsebuje le del svoje tabele, se Povzetek, Pogostost vrednosti, poročilo o kakovosti, Korelacija, Iskalnik ključev za stik, Diagnostika združevanja, Poišči šifrante in Izmeri v Zemljevidu povezav izvedejo kot SQL na strežniku nad vsemi vrsticami, brez prenosa.\nIzklopi, da se izvedejo nad naloženimi vrsticami."
confirm_url_redirects = "Ko te spletni naslov pošlje na drugega, vprašaj, preden se datoteka odpre od tam. Ta potrditev je edino mesto, kjer je sprememba vidna."
backup_before_modify = "Preden pomočnik ali shranjevanje s spremembo sheme prepiše\ndatoteko, jo najprej kopiraj v datoteko .bak s časovnim žigom poleg nje.\nObičajna ročna shranjevanja se ne kopirajo."
chat_profiles = "Vsak profil je ena shranjena postavitev: ponudnik, model, temperatura in neobvezen proračun razmišljanja pod imenom, ki ga izbereš. Ustvari jih poljubno mnogo, tudi več za istega ponudnika, in med njimi preklapljaj iz pomočnikovega podokna."
chat_profile_base_url = "Končna točka za ta profil. Pusti prazno za uporabo naslova strežnika Ollama, nastavljenega spodaj."
write_options = "Privzete vrednosti pri zapisu datoteke. Shrani kot in paketna pretvorba izhajata iz njih in ju lahko za en zagon spremenita."
status_message_secs = "Kako dolgo statusno sporočilo ostane na zaslonu, preden izgine.\nIsto trajanje velja za vsako sporočilo, uspeh ali napako.\n\nČe greš z miško nadenj, se odštevanje ustavi - napaka, ki jo\nbereš ali kopiraš, torej ostane. Vsako sporočilo ima tudi 'x'\nza takojšnje zaprtje.\n\nNi mogoče izklopiti; pod 3 velja 3. Privzeto: 10."
chat_tools = "Katera orodja sme pomočnik uporabljati. Skupina core gre z vsakim sporočilom; druge skupine so mu samo naštete, eno pa naloži, ko jo naloga potrebuje. Izklopljeno orodje izgine povsod: ne pošlje se, ne ponudi se in je zavrnjeno, če ga pomočnik vseeno pokliče."
chat_tools_enable_all = "Znova vklopi vsa orodja. Z vsakim sporočilom gre le skupina core, zato preostalo nič ne stane, dokler pomočnik zanj ne vpraša."
chat_tools_budget = "Približno koliko žetonov opisi orodij dodajo sporočilu. Izračunano iz njihove velikosti, zato beri kot napotek in ne kot račun."
sql_page_rows = "Koliko vrstic rezultata se prenese naenkrat; ob drsenju jih pride več. Število vrstic in Izvozi vedno zajameta celoten rezultat. 0 naloži vse naenkrat."
sql_auto_register = "Naredi vsak drug odprt zavihek poizvedljiv v SQL plošči pod njegovim lastnim imenom, tako da stik dveh odprtih datotek ne potrebuje attach."
sql_auto_register_max = "Večji zavihki se ne registrirajo samodejno, ker registracija prekopira njihove vrstice. Namesto tega dobijo gumb Registriraj."
sql_auto_register_max_off = "Uporablja se le, dokler je vklopljeno Poizveduj druge odprte zavihke."
git_marks_uncommitted = "Obarva datoteke in mape v stranski vrstici, ki imajo git spremembe brez commita: spremenjene, dodane, izbrisane, preimenovane ali nesledene."
git_marks_branch = "Obarva datoteke in mape, spremenjene na trenutni veji, odkar se je odcepila od osnovne veje."
git_marks_base_branch = "Veja, s katero se primerja. Kadar repozitorij nima veje s tem imenom, se poskusi main; če manjka tudi ta, oznaka veje preprosto izostane in namig mape to pove."
git_marks_base_branch_off = "Uporablja se le, dokler je vklopljeno Označi spremembe na tej veji."
git_marks_refresh_secs = "Kako pogosto stranska vrstica znova vpraša git, dokler je vidna. 0 izklopi časovnik: oznake se takrat osvežijo le ob odprtju mape in ko Octa shrani datoteko."
git_marks_refresh_secs_off = "Uporablja se le, dokler je vklopljena vsaj ena git oznaka."
retype_layout_sample = "Koliko vrednosti prebere Spremeni vrsto, ko se odloča, v kateri obliki datuma je zapisan besedilni stolpec. Glasovanje stane sedem razčlenitev datuma na vrednost, vse naenkrat v niti vmesnika: pri 5.000.000 vrednostih je to 35.000.000 razčlenitev in okno se za nekaj sekund neha odzivati. Zvišanje pomaga le, kadar prve vrednosti stolpca ne predstavljajo ostalih, na primer pri datoteki, urejeni tako, da so vse vrstice ISO na začetku. Prikazanih števil to nikoli ne spremeni. Privzeto 10.000."
retype_layout_sample_off = "Izklopi Neomejeno, da tu vpišeš število."
retype_layout_sample_unlimited = "Prebere vsako vrednost v stolpcu namesto vzorca. Najnatančneje pri neenakomerno urejenem stolpcu, a pri nekaj milijonih vrstic se okno vsakič za nekaj sekund zamrzne, ko izbereš vrsto datuma."
cloud_download_concurrency = "Koliko predmetov iz oblaka združevanje prenese hkrati. Privzeto 8, najmanj 1. Prenos iz shrambe predmetov je večinoma čakanje na odziv in ne prenašanje bajtov, zato pri zaporednem prenašanju povezava vmes miruje. Osem je približno toliko, kolikor brskalnik dovoli na gostitelja. Povečaj na hitri povezavi z visoko zakasnitvijo; zmanjšaj na 1, če ponudnik ali posredniški strežnik začne zavračati zahteve. Zelo visoke vrednosti zaženejo toliko niti naenkrat in so najhitrejša pot do napake o omejitvi zahtev."
cloud_sidebar_position = "Na kateri rob okna se pripne brskalnik povezav v oblak. Privzeto levo. Brskalniki na istem robu si delijo eno podokno."
db_sidebar_position = "Na kateri rob okna se pripne brskalnik povezav z bazami. Privzeto levo. Brskalniki na istem robu si delijo eno podokno."
sql_format_title = "Kako gumb Oblikuj v podoknu SQL razporedi poizvedbo. Predogled spodaj pokaže rezultat."
sql_format_keywords = "Ali ključne besede, kot sta SELECT in FROM, pridejo z velikimi črkami, malimi ali tako, kot si jih natipkal."
sql_format_indent = "Kaj je ena raven zamika: 2 presledka, 4 presledki ali tabulator."
sql_format_commas = "Kam gre vejica med dvema elementoma seznama. Na začetku naslednje vrstice manjkajočo vejico takoj opaziš."
sql_format_joins = "Vsak JOIN se začne v novi vrstici na ravni FROM, namesto zamaknjen pod njim."
sql_format_inline = "Seznam, krajši od toliko znakov, ostane v eni vrstici, na primer SELECT a, b, c. Pri 0 dobi vsak element svojo vrstico."
sql_format_blank_lines = "Koliko praznih vrstic loči dva stavka."
sql_format_one_line = "Samo uredi presledke in velikost črk ključnih besed ter postavi vsak stavek v eno vrstico. Priročno za lepljenje v dnevnik ali program."
sql_format_off_one_line = "Izklopljeno, dokler je vklopljeno Cela poizvedba v eni vrstici: ni prelomov vrstic za razporeditev."
sql_format_clause_width = "Klavzula, krajša od toliko znakov, ostane v vrstici svoje ključne besede, na primer GROUP BY c.name, kratka podpoizvedba pa ostane v svojih oklepajih. Začne pri širini seznama."
sql_format_clause_needs_list = "Najprej nastavi širino seznama nad 0. Samo to bi pustilo elemente klavzule brez zamika."
sql_format_bracket_width = "Oklepaji, krajši od toliko znakov, ostanejo v eni vrstici, na primer coalesce(a, 0) ali IN (1, 2, 3). Pri daljših je vsak element v svoji vrstici."
sql_format_semicolon = "Doda ; za zadnji stavek, če ga nima."
sql_format_preview = "Vzorčna poizvedba, razporejena z zgornjimi nastavitvami. Spreminja se, ko jih spreminjaš."
restore_session = "Ob zagonu Octa znova odpre datoteke, ki so bile odprte, ko si ga zaprl. Privzeto izklopljeno. Datoteke, ki jih ni več, preskoči."
restore_session_cloud = "Znova odpre tudi objekte v oblaku. Pozor: vsak se ob vsakem zagonu znova prenese, kar traja in lahko stane denar za prenos podatkov."
restore_session_connections = "Znova odpre tudi tabele iz povezav z bazami podatkov in končnih točk API. Pozor: vsaka ob vsakem zagonu pošlje poizvedbo svojemu strežniku. Pri podatkovnem skladišču ga lahko to zbudi in stane denar, potekla prijava pa te prosi za ponovno prijavo."
restore_session_needs_main = "Najprej vklopi Znova odpri zadnjo sejo."

