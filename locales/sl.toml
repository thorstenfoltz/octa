chat_position = "Kje se plošča klepeta priključi glede na tabelo."
chat_export_dir = "Mapa, v katero pomočnik zapisuje izvožene datoteke (nove CSV, grafikone), ko ne navedete polne poti."
chat_audit_log = "Doda vsak klic orodja pomočnika v dnevnik v mapi nastavitev (chat_audit/). Privzeto izklopljeno."
chat_render_markdown = "Vklopljeno: naslovi, seznami, tabele, bloki kode in povezave v odgovorih se izrišejo oblikovani. Izklopljeno: vidiš surovo Markdown kodo. Tvoja lastna sporočila se nikoli ne preoblikujejo."
