section_calendar_intro = "Luknje v stolpcu z datumom ali časovnim žigom: odseki, kjer zaporedje preskoči, namesto da bi korakalo. Manjkajoči vikendi in prehod na poletni čas se ne štejejo, tako da je našteto res manjkajoč dan, ura ali mesec."
section_shapes = "Mešane oblike"
section_shapes_intro = "Besedilni stolpci, kjer ima skoraj vsaka vrednost eno obliko. Vsaka vrstica je oblika, ki odstopa od nje, s pogostostjo in primerom."
hint_miss_columns = "Stolpci, ki so v teh vrsticah prazni skupaj."
hint_miss_column_count = "Koliko stolpcev je to."
hint_miss_rows = "Koliko vrstic ima prazen natanko ta nabor stolpcev."
hint_miss_share_percent = "Te vrstice v odstotkih celotne tabele."
hint_gap_column = "Stolpec z datumom ali časovnim žigom, v katerem je luknja."
hint_gap_after = "Zadnja vrednost pred luknjo."
hint_gap_before = "Prva vrednost za njo."
hint_gap_missing_steps = "Koliko korakov zaporedja vmes manjka, šteto v lastnem ritmu stolpca (dnevi, ure, meseci)."
hint_gap_kind = "Kakšna luknja je to: navadna vrzel ali odsek, dovolj dolg, da je videti kot zastoj in ne kot spodrsljaj."
hint_shape_column = "Stolpec, v katerem je odstopajoča oblika."
hint_shape_shape = "Odstopajoča oblika: števke so 9, velike črke A, druge črke a."
hint_shape_count = "Koliko vrednosti ima to obliko."
hint_shape_example = "Ena vrednost s to obliko."
overall_explained = "Povprečje ocen po stolpcih v poročilu. Postavi miško na glavo stolpca score, tam piše, kako nastane posamezna ocena."
verdict_benford_conforms = "Prve števke ležijo blizu tega, kar Benfordov zakon pričakuje, tako kot običajno delajo merjene ali sešteta količine. Ne dokazuje ničesar: stolpec se lahko ujema in je vseeno napačen."
verdict_benford_acceptable = "Malo mimo pričakovanih deležev, znotraj razpona, v katerem se pravi podatki sprehajajo. Nič za ukrepati."
verdict_benford_marginal = "Dovolj mimo za drugi pogled, a še ni ugotovitev. Poglej, kako stolpec nastane, preden iz njega kaj prebereš."
verdict_benford_nonconforming = "Prve števke ne izgledajo kot merjene količine. Razlog, da pogledaš dlje, sam po sebi pa nikoli ugotovitev: zaokrožene, odrezane ali na roko vtipkane številke pristanejo tu vse povsem nedolžno."
verdict_benford_not_numbers = "Ni preverjeno: stolpec ne vsebuje števil, zakon pa govori o prvi števki števila."
verdict_benford_too_few = "Ni preverjeno: pod 300 uporabnih vrednosti, kjer so deleži števk šum in ne porazdelitev."
verdict_benford_narrow = "Ni preverjeno: vrednosti se stlačijo v manj kot desetkratni razpon. Odstotek, starost ali ocena nimajo razloga slediti zakonu, zato bi rezultat samo zavajal."
verdict_benford_ids = "Ni preverjeno: gosta cela števila, vsa različna, torej dodeljeno zaporedje (številka vrstice, številka računa, id). Take stvari se razdelijo, ne merijo."
verdict_calendar_complete = "Vsak korak niza je tu, od prvega časovnega žiga do zadnjega. Nobene luknje za razlago."
verdict_calendar_weekdays = "Edine luknje so preskočeni vikendi, in poslovni podatki to počnejo namenoma. Šteje se kot popolno, in ti vikendi niso navedeni v zavihku lukenj."
verdict_calendar_dst = "Edina luknja ima obliko premika ure: en korak, v nedeljo, v zgodnjih urah. Časovni žigi v Octi ne nosijo časovnega pasu, zato se tu bere oblika in ne ve. Preveri, če je za niz pomembna ura."
verdict_calendar_gaps = "Čas, ki bi moral imeti vrstice in jih nima. Zavihek Luknje v koledarju našteje vsako luknjo s časovnima žigoma na obeh straneh."
verdict_calendar_not_dates = "Ni preverjeno: stolpec ne vsebuje datumov ali časovnih žigov."
verdict_calendar_too_few = "Ni preverjeno: manj kot trije različni časovni žigi, to še ni niz."
verdict_calendar_irregular = "Ni preverjeno: noben korak ne pokrije 60% razmikov, torej ni ritma, v katerem bi iskali luknje. Dnevniki dogodkov se berejo tako."
verdict_shape_consistent = "Vsaka vrednost ima enako obliko, na primer vsaka poštna številka je A-99999."
verdict_shape_mixed = "Skoraj vsaka vrednost ima eno obliko, nekaj jih nima. Te so pogosto tipkarske napake ali druga oblika zapisa; zavihek Mešane oblike jih našteje."
verdict_shape_na = "Ni preverjeno: stolpec je prazen, ni besedilo, ali ima preveč oblik, da bi lahko odločili (prosto besedilo, ali več oblik namerno)."

