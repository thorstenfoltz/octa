chat_intro = "Vgrajeni AI pomočnik, ki upravlja orodja Octa nad tvojimi odprtimi zavihki in datotekami. Izberi ponudnika in nastavite njegov ključ API (ali zaženite Ollama lokalno), nato odprite ploščo iz orodne vrstice (meni Analiza, Pomočnik)."
