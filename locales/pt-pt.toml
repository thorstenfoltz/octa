mcp_intro = "Predefinições do servidor MCP (`octa --mcp`). O servidor lê-as uma vez ao arrancar; alterá-las com um servidor em execução obriga a reiniciar `octa --mcp`."
mcp_row_limit = "Máximo de linhas devolvidas por `read_table` / `run_sql` quando quem chama omite `limit`. O esquema da ferramenta anuncia esta predefinição ao modelo para que possa pedir mais (ou ilimitado) quando precisar.\n\nPredefinição: 1.000. Um valor alto - ou assinalar Ilimitado - pode empurrar respostas muito grandes pelo stdio e tornar o cliente MCP lento."
cell_byte_cap = "Limite de tamanho por célula na transmissão. As células cuja forma textual excede isto são substituídas por um marcador `[truncated: ...]` e a resposta indica `cell_truncated: true`. Põe 0 para desativar o limite.\n\nPredefinição: 65.536 (64 KiB)."
chat_intro = "Assistente de IA integrado que usa as ferramentas do Octa sobre os teus separadores e ficheiros abertos. Escolhe um fornecedor e define a chave de API (ou corre o Ollama localmente) e depois abre o painel pela barra de ferramentas (menu Analisar, Assistente)."
chat_max_iterations = "Número máximo de rondas de chamadas a ferramentas que o assistente pode fazer numa só mensagem antes de ter de parar. Uma proteção contra ciclos de ferramentas descontrolados."
chat_max_tokens = "Limite do comprimento da resposta (em tokens) pedido por resposta. Ilimitado deixa o modelo usar o seu próprio máximo (a Anthropic precisa sempre de um limite, por isso aí usa-se um valor alto)."
chat_provider = "Com que motor de LLM o assistente fala. Cada fornecedor precisa da sua própria chave de API, exceto o Ollama, que corre localmente."
chat_model = "O modelo usado para este fornecedor. Escolhe um predefinido ou escreve qualquer nome de modelo."
chat_ollama_url = "URL raiz do teu servidor Ollama local. O Octa acrescenta os caminhos da API."
chat_position = "Onde o painel de chat encaixa em relação à tabela."
chat_export_dir = "Pasta onde o assistente escreve os ficheiros exportados (CSV novos, gráficos) quando não dás um caminho completo."
chat_audit_log = "Acrescenta cada chamada a ferramentas do assistente a um registo no diretório de configuração (chat_audit/). Desligado por predefinição."
chat_export_trace = "As exportações passam a conter também cada passo da caixa de depuração, com o prompt do sistema, as chamadas de ferramentas e os resultados, por isso podem conter os teus dados. Só há passos nos chats desta execução do Octa, porque nunca são guardados."
chat_writing_apply_directly = "Desligado, a versão nova do assistente abre ao lado do teu texto atual e só entra quando a aceitas. Ligado, vai logo para o editor e o botão Anular alteração repõe o texto antigo. Em nenhum dos casos se guarda algo no disco."
chat_cli_program = "O Octa inicia este programa no teu computador e envia-lhe a tua pergunta. Deixa vazio para usar o que está no teu PATH. Instala-o e inicia sessão nele primeiro. O Octa nunca vê o teu início de sessão."
chat_render_markdown = "Ligado: títulos, listas, tabelas, blocos de código e ligações nas respostas do assistente aparecem formatados. Desligado: vês o Markdown em bruto. As tuas mensagens nunca são reformatadas."
chat_audit_warn = "Mostrar um aviso ao arrancar quando os registos de auditoria passarem este tamanho."
chat_api_key = "A tua chave de API para este fornecedor. Guardada no porta-chaves do sistema quando existe; caso contrário, em texto simples em settings.toml."
map_intro = "Predefinições da vista de mapa (usada pelos ficheiros GeoJSON). O separador ativo pode alternar entre Mosaicos e Só geometria pela barra do mapa."
map_default_mode = "Mosaicos: carregar um mapa navegável a partir do URL de mosaicos configurado.\nSó geometria: desenhar só os elementos numa tela em branco."
map_fallback = "Quando a obtenção de mosaicos falha (sem ligação, bloqueada), passar automaticamente a mostrar só a geometria nesse separador."
tile_url = "Padrão de URL dos mosaicos raster. `{z}/{x}/{y}` são substituídos pelo nível de zoom e pelas coordenadas do mosaico. A predefinição aponta para o servidor de mosaicos do OSM - para produção ou uso intenso, aponta para um fornecedor próprio ou comercial."
sidebar_position = "Em que margem encaixa o explorador de pastas. À esquerda e à direita\nredimensiona-se pela largura; em cima e em baixo, pela altura. Os exploradores da nuvem e\ndas bases de dados têm as suas próprias posições em Painéis."
shortcuts_intro = "Clica em 'Gravar' e carrega numa combinação de teclas (com Ctrl / Shift / Alt).\nCarrega em Esc para cancelar a gravação. 'Limpar' deixa a ação sem atalho."
initial_load_cap = "Máximo de linhas carregadas na tabela na primeira abertura dos\nformatos em fluxo (Parquet, CSV, TSV). As restantes linhas\nchegam em segundo plano à medida que te deslocas.\n\nPredefinição: 2.000.000. Aumentá-lo torna o primeiro desenho\nmais completo, mas usa mais memória. Baixá-lo torna a\nabertura inicial mais rápida, mas passa mais trabalho ao\ncarregador em segundo plano. Assinala \"Ilimitado\" para desligar\no limite por completo e carregar todas as linhas logo à partida.\n\nEscreve um número - aplicado ao carregar em Aplicar."
db_page_rows = "Linhas pedidas por pedido quando abres uma tabela a partir de uma ligação a uma base de dados em direto.\n\nPredefinição: 100.000. É um tamanho de página, não um teto: a página seguinte carrega em segundo plano enquanto te deslocas, tal como num ficheiro Parquet grande.\n\nÉ uma definição à parte porque o limite acima mede a leitura de um ficheiro local, ao passo que este se transforma em megabytes de JSON pela rede. Baixa-o se abrir uma tabela te parecer lento.\n\nEscreve um número - aplicado ao carregar em Aplicar."
raw_view_cap = "Tamanho máximo de ficheiro (em MB) que o Octa lê por inteiro para o editor\nda vista em bruto. Também limita o recurso ao texto em bruto depois de um erro\nde interpretação e o lado em bruto da vista de comparação. Os ficheiros maiores\ndispensam o texto em bruto para proteger a memória.\n\nPredefinição: 50 MB. Assinala \"Ilimitado\" para carregar qualquer ficheiro\nseja qual for o tamanho. Aplicado ao carregar em Aplicar."
decompress_cap = "Tamanho máximo descomprimido (em MB) dos ficheiros .gz / .zst\nabertos de forma transparente. Um ficheiro comprimido minúsculo pode crescer imenso\n(uma bomba de descompressão); acima deste limite a abertura é recusada.\n\nPredefinição: 4.295 MB (4 GB). Aplicado ao carregar em Aplicar."
decompress_unlimited = "Retirar por completo o limite de tamanho da descompressão. Assinala isto\nsó para arquivos em que confies."
raw_view_unlimited = "Ler o texto completo de qualquer ficheiro na vista em bruto, sem\nlimite de tamanho. Usa só com RAM de sobra - um ficheiro de vários GB\né lido inteiro para a memória."
initial_load_unlimited = "Carregar todas as linhas do ficheiro logo à partida. Só recomendado\nquando tens RAM de sobra - um parquet de 100 M de linhas consome\nvários GB."
syntax_size_cap = "Os ficheiros maiores do que isto passam a monoespaçado simples no\neditor em bruto. Põe 0 para desligar por completo o realce de sintaxe;\npõe um número muito grande para dispensar a\nproteção. JSON/YAML/XML/Markdown/TOML nunca são realçados\n- usam as suas próprias vistas de árvore/pré-visualização.\n\nPredefinição: 1 MB. Escreve um número e escolhe uma unidade - aplicado ao carregar em Aplicar."
open_as_text = "Extensões de ficheiro extra a tratar como texto simples ao abrir\n(passam à frente do leitor que normalmente as reclamaria).\nSeparadas por vírgulas ou espaços, sem ponto inicial, em minúsculas.\nExemplo: log4j  myproj  rawdata\n\nAplicado ao carregar em Aplicar; tem efeito nas aberturas seguintes."
folder_union_cap = "Número máximo de ficheiros que uma união de pasta na nuvem transfere e\njunta. Cada ficheiro é lido inteiro para a memória, por isso uma pasta\ncom dezenas de milhares de partes pode esgotar a RAM. Os ficheiros\nacima do limite são ignorados e contados na barra de estado.\n\nPredefinição: 500. Aplicado ao carregar em Aplicar."
folder_union_unlimited = "Unir todos os ficheiros da pasta, sejam quantos forem.\nUsa só com RAM de sobra."
multi_search_cap = "Limite de tamanho por ficheiro para o âmbito de diretório do painel\nde pesquisa múltipla. Os ficheiros maiores são ignorados e listados na\netiqueta de ficheiros ignorados. Assinala \"Ilimitado\" para tirar o limite por completo.\n\nPredefinição: 50 MB."
multi_search_unlimited = "Analisar todos os ficheiros do diretório, seja qual for o tamanho. Um registo enorme\nou um dump pode bloquear a análise e consumir memória."
chart_max_points = "Máximo de linhas que o separador Gráfico desenha antes de entrar uma\namostragem uniforme (Histograma, Linha, Dispersão). Os gráficos de barras\nagregam sempre todos os dados; os diagramas de caixa calculam o\nresumo de 5 números sobre todos os dados. Põe 0 para desligar\na amostragem - só é seguro em tabelas de tamanho moderado.\n\nPredefinição: 25.000. O campo numérico aceita separadores de vírgula."
chart_max_categories = "Máximo de categorias X distintas que um gráfico de barras aceita antes\nde recusar desenhar. Acima disso aparece um erro\nem vez de uma parede ilegível de barras - filtra ou\nagrega primeiro a tabela.\n\nPredefinição: 200. O campo numérico aceita separadores de vírgula."
tables_in_picker = "Quantas linhas de tabelas o seletor de várias tabelas (SQLite,\nDuckDB, ...) deve mostrar na vertical no tamanho predefinido. A\ncaixa de diálogo continua redimensionável - arrasta o canto para a\naumentar quando uma base de dados tem muitas tabelas.\n\nPredefinição: 10. Mínimo 1."
excel_auto_open = "Quantas folhas de um livro do Excel com várias folhas abrir\nautomaticamente (cada uma no seu separador). Os livros com mais\nfolhas mostram um seletor para escolheres quais abrir\n(podes escolher mais do que este número, ou todas).\n\nPredefinição: 5. Mínimo 1."
max_recent = "Número de ficheiros abertos recentemente mostrados no menu Ficheiro"
start_maximised = "Ligado: a janela abre maximizada (ocupa o ecrã inteiro)\ne o tamanho abaixo só tem efeito quando a\ntiras do estado maximizado. Desligado: a janela abre no tamanho escolhido."
open_in_running_instance = "Ligado: fazer duplo clique num ficheiro, ou correr octa com um ficheiro, acrescenta um separador ao Octa que já está aberto. Iniciar o Octa sem ficheiro continua a abrir um segundo. Desligado: cada arranque é um Octa à parte. Tem efeito no próximo arranque do Octa."
notify_on_finish = "Ligado por predefinição: quando uma tarefa que demorou algum tempo termina e o Octa não é a janela da frente, o teu sistema mostra uma notificação com o que terminou e quanto tempo demorou."
notify_after_secs = "As tarefas mais curtas terminam enquanto ainda estás a olhar, por isso não recebem notificação."
notify_after_secs_off = "Liga primeiro as notificações."
notify_test = "Mostra já uma notificação, para veres como é e confirmares que o teu sistema deixa o Octa enviá-las."
notify_when_focused = "Desligado por predefinição. Ligado: recebes a notificação também quando o Octa é a janela da frente, desde que a tarefa tenha demorado o suficiente."
initial_window_size = "Tamanho em píxeis da janela quando NÃO está maximizada. Uma janela\nmaximizada ocupa sempre o ecrã inteiro, por isso numa janela maximizada todos\nos tamanhos parecem iguais; isto só se aplica quando a tiras do estado maximizado\n(ou com \"Iniciar maximizado\" desligado)."
ctrl_close = "Fechar"
ctrl_restore = "Restaurar"
ctrl_full_size = "Tamanho completo"
ctrl_minimise = "Minimizar"
write_protection = "Quando ligado, a gravação de um ficheiro SQLite, DuckDB ou GeoPackage é recusada se tiverem sido acrescentadas ou removidas colunas. Vale para as gravações na aplicação e para o servidor MCP, que lê a definição uma vez ao arrancar. O assistente segue antes a opção Permitir escrita do seu perfil."
chat_profile_may_override = "Este é o valor predefinido. Um perfil de modelo pode definir o seu."
confirm_db_write_back = "Antes de as edições irem para uma base de dados em direto, mostrar o que mudaria e perguntar.\nDesliga isto para que Guardar aplique logo as diferenças; em ambos os casos é\numa só transação, e uma escrita falhada é revertida na mesma."
db_pushdown = "Quando um separador de base de dados tem só parte da sua tabela, o Resumo, a Frequência de valores, o relatório de qualidade, a Correlação, o Localizador de chaves de junção, o Diagnóstico de junção, Encontrar tabelas de consulta e Medir do mapa de relações correm como SQL no servidor sobre todas as linhas, sem as transferir.\nDesliga isto para os correr sobre as linhas carregadas."
auto_refresh_min = "A atualização automática recusa um intervalo mais curto num separador de base de dados ou de API."
auto_refresh_min_billed = "O mesmo para BigQuery, Athena e Snowflake, onde cada leitura custa dinheiro."
confirm_url_redirects = "Quando um endereço web te reencaminha para outro, perguntar antes de abrir o ficheiro a partir daí. A confirmação é o único sítio onde essa mudança se vê."
backup_before_modify = "Antes de o assistente ou uma gravação de base de dados que muda o esquema substituir\num ficheiro, este é primeiro copiado para um ficheiro .bak com data e hora ao lado.\nAs gravações manuais habituais não têm cópia de segurança."
chat_profiles = "Cada perfil é uma configuração guardada: um fornecedor, um modelo, uma temperatura e um orçamento de raciocínio opcional, com o nome que escolheres. Cria quantos quiseres, incluindo vários do mesmo fornecedor, e alterna entre eles no painel do assistente."
chat_profile_base_url = "Endpoint deste perfil. Deixa vazio para usar o endereço do servidor Ollama definido abaixo."
write_options = "Predefinições usadas quando o Octa escreve um ficheiro. Guardar como e a conversão em lote partem daqui e podem alterá-las numa execução."
status_message_secs = "Quanto tempo uma mensagem de estado fica no ecrã antes de desaparecer.\nA mesma duração vale para todas as mensagens, de sucesso ou de falha.\n\nPassar o rato por cima da mensagem pausa a contagem, por isso um erro que\nestás a ler ou a copiar fica no sítio. Cada mensagem tem também um\n'x' para a fechar logo.\n\nNão pode ser desligado; valores abaixo de 3 contam como 3.\nPredefinição: 10."
chat_tools = "Que ferramentas o assistente pode usar. O grupo base vai com cada mensagem; dos outros grupos só se diz o nome ao assistente, que carrega um quando um trabalho precisa. Desligar uma ferramenta tira-a de todo o lado: não é enviada, não é oferecida e é recusada se o assistente a pedir na mesma."
chat_tools_enable_all = "Voltar a ligar todas as ferramentas. Só o grupo base vai com cada mensagem, por isso o resto não custa nada até o assistente o pedir."
chat_tools_budget = "Mais ou menos quantos tokens as descrições das ferramentas acrescentam a uma mensagem. Calculado pelo tamanho delas, por isso lê como orientação, não como uma fatura."
sql_page_rows = "Quantas linhas de resultado são trazidas de cada vez; chegam mais à medida que te deslocas. A contagem de linhas e Exportar cobrem sempre o resultado inteiro. 0 carrega tudo de uma vez."
sql_auto_register = "Torna cada um dos outros separadores abertos consultável no painel SQL com o seu próprio nome, para que juntar dois ficheiros abertos não precise de nenhum passo de anexar."
sql_auto_register_max = "Os separadores maiores do que isto não são registados automaticamente, porque registar copia as suas linhas. Em vez disso recebem um botão Registar."
sql_auto_register_max_off = "Só é usado enquanto Consultar outros separadores abertos estiver ligado."
git_marks_uncommitted = "Colore os ficheiros e as pastas da barra lateral que têm alterações git por confirmar: modificados, adicionados, eliminados, com nome mudado ou não seguidos."
git_marks_branch = "Colore os ficheiros e as pastas alterados no ramo atual desde que se separou do ramo base."
git_marks_base_branch = "Ramo com que se compara. Quando um repositório não tem nenhum ramo com este nome, tenta-se main; se também faltar, a marca de ramo simplesmente não aparece e a dica da pasta di-lo."
git_marks_base_branch_off = "Só é usado enquanto Marcar alterações neste ramo estiver ligado."
git_marks_refresh_secs = "Com que frequência a barra lateral volta a perguntar ao git enquanto está visível. 0 desliga o temporizador: então as marcas só se atualizam ao abrir uma pasta e quando o Octa guarda um ficheiro."
git_marks_refresh_secs_off = "Só é usado enquanto pelo menos uma marca git estiver ligada."
retype_layout_sample = "Quantos valores o Alterar tipo lê para decidir que formato de data uma coluna de texto usa. A votação custa sete interpretações de data por valor, de uma só vez no fio da interface: com 5.000.000 de valores são 35.000.000 de interpretações e a janela deixa de responder durante segundos com um só clique. Aumentar só ajuda quando os primeiros valores de uma coluna não representam o resto, como num ficheiro ordenado com todas as linhas em formato ISO à frente. Nunca muda uma contagem apresentada. Predefinição 10.000."
retype_layout_sample_off = "Desliga Ilimitado para escreveres aqui um número."
retype_layout_sample_unlimited = "Lê todos os valores da coluna em vez de uma amostra. É a escolha mais exata numa coluna ordenada de forma irregular, mas numa coluna com vários milhões de linhas a janela deixa de responder durante segundos sempre que escolhes um tipo de data."
folder_compare_max_files = "Comparar pastas deixa de listar uma pasta depois deste número de ficheiros e avisa que o resultado está incompleto. Números maiores demoram mais e usam mais memória em buckets grandes."
folder_compare_max_files_off = "Ilimitado está assinalado: todos os ficheiros são listados."
folder_compare_max_files_unlimited = "Lista todos os ficheiros de todas as pastas, sejam quantos forem."
cloud_download_concurrency = "Quantos objetos da nuvem uma união transfere ao mesmo tempo. Predefinição 8, mínimo 1. Ir buscar dados a um armazenamento de objetos é sobretudo esperar pela ida e volta, não mover bytes, por isso transferir um a seguir ao outro deixa a ligação parada pelo meio. Oito é mais ou menos o que um navegador permite por servidor. Aumenta numa ligação rápida com latência alta; baixa para 1 se um fornecedor ou proxy começar a recusar pedidos. Valores muito altos lançam esse número de fios de uma vez e são o caminho mais rápido para um erro de limite de pedidos."
cloud_sidebar_position = "Em que margem da janela encaixa o explorador de ligações na nuvem. À esquerda por predefinição. Os exploradores na mesma margem partilham um painel."
db_sidebar_position = "Em que margem da janela encaixa o explorador de ligações de base de dados. À esquerda por predefinição. Os exploradores na mesma margem partilham um painel."
sql_format_title = "Como o botão Formatar do painel SQL organiza uma consulta. A pré-visualização abaixo mostra o resultado."
sql_format_keywords = "Se as palavras-chave como SELECT e FROM saem em maiúsculas, em minúsculas ou como as escreveste."
sql_format_indent = "O que é um nível de indentação: 2 espaços, 4 espaços ou uma tabulação."
sql_format_commas = "Onde fica a vírgula entre dois itens de uma lista. No início da linha seguinte, uma vírgula em falta vê-se logo."
sql_format_joins = "Começar cada JOIN numa linha nova ao nível do FROM, em vez de indentado por baixo dele."
sql_format_inline = "Uma lista mais curta do que este número de caracteres fica numa linha, como SELECT a, b, c. 0 põe cada item na sua própria linha."
sql_format_blank_lines = "Quantas linhas vazias separam duas instruções."
sql_format_one_line = "Só arruma os espaços e as maiúsculas das palavras-chave e põe cada instrução numa linha. Dá jeito para colar num registo ou num programa."
sql_format_off_one_line = "Desligado enquanto Consulta inteira numa linha estiver ligado: não há quebras de linha a organizar."
sql_format_clause_width = "Uma cláusula mais curta do que este número de caracteres fica na linha da sua palavra-chave, como GROUP BY c.name, e uma subconsulta curta fica dentro dos parênteses. Começa na largura de lista."
sql_format_clause_needs_list = "Põe primeiro a largura de lista acima de 0. Sozinha, esta opção deixaria os itens de uma cláusula sem indentação."
sql_format_bracket_width = "Os parênteses mais curtos do que este número de caracteres ficam numa linha, como coalesce(a, 0) ou IN (1, 2, 3). Os mais longos põem cada item na sua própria linha."
sql_format_semicolon = "Acrescenta ; depois da última instrução quando não tem."
sql_format_preview = "Uma consulta de exemplo organizada com as definições acima. Muda à medida que as alteras."
restore_session = "Quando o Octa arranca, volta a abrir os ficheiros que estavam abertos quando o fechaste. Desligado por predefinição. Os ficheiros que já não existem são ignorados. Os editores SQL também voltam, só com o texto e o ficheiro, por isso nada se liga."
restore_session_cloud = "Reabrir também os objetos na nuvem. Atenção: cada um é transferido de novo a cada arranque, o que leva tempo e pode custar dinheiro em transferência de dados."
restore_session_connections = "Reabrir também as tabelas das ligações de base de dados e dos endpoints de API. Atenção: cada uma envia uma consulta ao seu servidor a cada arranque. Num data warehouse isso pode acordá-lo e custar dinheiro, e uma sessão expirada pede-te para voltares a entrar."
restore_session_needs_main = "Liga primeiro Reabrir a última sessão."
save_as_rows = "Quando uma pesquisa ou um filtro esconde linhas, Guardar como pode escrever todas as linhas ou só as que vês. Pergunta sempre, ou desmarca para usar sempre a resposta escolhida aqui."
save_as_open = "Depois de Guardar como, continuar no ficheiro novo: este separador passa para ele, ou abre-se num separador novo quando só foram guardadas as linhas que vês. Pergunta sempre, ou desmarca para usar sempre a resposta escolhida aqui."
keep_versions = "Sempre que guardas por cima de um ficheiro, guardar a versão que ele substitui. Ficheiro > Versões anteriores abre-as, compara-as ou repõe-nas. Desligado por predefinição, porque ocupa espaço em disco."
versions_needs_main = "Liga primeiro Guardar versões anteriores."
versions_per_file = "Quantas versões anteriores guardar de cada ficheiro. A mais antiga sai primeiro. Assinala Ilimitado para as guardar todas."
versions_total = "Quanto espaço em disco todas as versões anteriores podem usar juntas. As mais antigas saem primeiro, mas a versão mais recente de cada ficheiro é sempre guardada. Assinala Ilimitado para não haver limite."
versions_limit_off = "Desassinala Ilimitado para definir um limite."
versions_place = "Para onde vão as versões guardadas. A pasta do próprio Octa mantém-nas fora do caminho. Uma pasta à tua escolha guarda as versões de todos os ficheiros. Uma subpasta ao lado do ficheiro é uma pasta .octa-versions junto de cada ficheiro. Mesmo ao lado do ficheiro põe cópias como sales.20261020-140211-123.csv junto de sales.csv. Ao lado do ficheiro, o limite de espaço conta cada pasta à parte. Mudar isto não move nada: as versões guardadas noutro sítio continuam listadas em Versões anteriores."
versions_dir_choose = "Escolhe a pasta que guarda as versões anteriores de todos os ficheiros."
zoom_step = "Quanto um passo de zoom muda o tamanho, com Ctrl+Mais e Ctrl+Menos, no menu Ver e com os botões + e - na barra de estado. 5 por cento por predefinição."
confirm_snippet_delete = "Pergunta antes de apagar um fragmento SQL. Desligado apaga logo."

