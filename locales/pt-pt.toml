detect_dates = "Transformar as colunas de texto que só contêm datas em colunas de datas\nao abrir um ficheiro.\n\nFicheiros grandes: abrir fica mais lento, cerca de três segundos\npor coluna de datas com cinco milhões de linhas. Colunas > Detetar datas\nfá-lo a pedido."
warn_date_change = "Mostrar uma faixa quando a deteção de datas reescreve uma coluna\nna forma de apresentação ISO (p. ex. guardada como 02.05.2026,\nmostrada como 2026-05-02). Desliga para silenciar o aviso."
warn_date_change_off = "Só se aplica enquanto Detetar datas ao carregar estiver ligado"
trim_whitespace = "Remover os espaços no início e no fim das células de texto\nao abrir um ficheiro. Os espaços interiores mantêm-se."
