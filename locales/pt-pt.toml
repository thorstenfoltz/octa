window_controls = "Desativar as decorações de janela do sistema e deixar o Octa\ndesenhar os botões fechar / minimizar / maximizar na margem\ndireita da barra de ferramentas principal. Útil em gestores\nde janelas em mosaico sem controlos. Tem efeito\ndepois de reiniciar."
