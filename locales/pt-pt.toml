section_calendar_intro = "Buracos numa coluna de data ou de carimbo de data/hora: os trechos em que a série salta em vez de avançar passo a passo. Os fins de semana em falta e o salto da hora de verão não contam, por isso o que aparece é um dia, uma hora ou um mês que falta mesmo."
