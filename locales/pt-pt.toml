usage_hint = "Tokens usados nesta sessão, contados pelo fornecedor: são exatos. O lado da entrada é grande porque cada pedido leva as definições de todas as ferramentas, tudo o que essas ferramentas devolveram e a conversa toda até agora, e cresce a cada mensagem. As caixas Perguntar da barra de pesquisa e do painel SQL também contam aqui. Começa uma nova sessão para repor. A velocidade é a rapidez com que a resposta está a ser gerada: contada em direto enquanto chega e depois o valor exato do próprio Ollama quando termina; os outros fornecedores não indicam tempos."
