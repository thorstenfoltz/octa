clean_headers = "Normalizar os cabeçalhos das colunas para identificadores snake_case em minúsculas\nao carregar um ficheiro (remoção de espaços, minúsculas, espaços e pontuação\npassam a sublinhados, os duplicados recebem um sufixo numérico)."
offer_repair = "Quando um CSV/TSV é lido mas parece mal formado (codificação\nerrada, caracteres de controlo, um\ndelimitador que não bate com a extensão ou\nlinhas muito irregulares), mostrar um aviso a propor\nrepará-lo e recarregá-lo. Desligado por predefinição; a reparação\nsó corre se a confirmares."
readonly_notice = "Mostrar uma janela de confirmação sempre que o modo só de leitura\né ligado ou desligado (com F8 ou o menu Ver). Desliga para\nmudar o estado em silêncio."
notebook_output = "Posição da saída do código na vista de notebook Jupyter\n(só se aplica a ficheiros .ipynb no modo de vista de notebook)"
sql_open_default = "Ao abrir um ficheiro tabular, mostrar automaticamente o\neditor SQL ao lado da vista de tabela."
sql_keep_open = "Quando um separador fecha ou um ficheiro abre nele, o editor SQL aberto continua aberto e guarda as tuas consultas.\nDesligado: o editor pertence ao seu separador e fecha com ele."
sql_panel_position = "Onde o editor SQL encaixa em relação à tabela"
sql_row_limit = "LIMIT usado na consulta de exemplo ao abrir um separador\n(p. ex. 100 -> SELECT * FROM data LIMIT 100).\nEscreve um número - aplicado ao carregar em Aplicar."
autocomplete = "Oferecer sugestões de palavras-chave SQL e nomes de colunas\npor baixo do editor SQL."
