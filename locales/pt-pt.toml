section_shapes_intro = "Colunas de texto em que quase todos os valores têm a mesma forma. Cada linha é uma forma que se desvia, com quantas vezes aparece e um exemplo."
hint_miss_columns = "As colunas que estão vazias em conjunto nestas linhas."
hint_miss_column_count = "Quantas colunas são."
hint_miss_rows = "Quantas linhas têm exatamente este conjunto de colunas vazias."
hint_miss_share_percent = "Essas linhas em percentagem da tabela inteira."
hint_gap_column = "A coluna de data ou de carimbo de data/hora onde está o buraco."
hint_gap_after = "O último valor antes do buraco."
hint_gap_before = "O primeiro valor depois dele."
hint_gap_missing_steps = "Quantos passos da série faltam pelo meio, contados no espaçamento da própria coluna (dias, horas, meses)."
hint_gap_kind = "O que é o buraco: um buraco simples, ou um trecho longo o bastante para parecer uma paragem e não um deslize."
hint_shape_column = "A coluna onde está a forma desviada."
hint_shape_shape = "A forma desviada: os dígitos são 9, as maiúsculas A, as outras letras a."
hint_shape_count = "Quantos valores têm esta forma."
hint_shape_example = "Um valor com esta forma."
overall_explained = "A média das notas por coluna do relatório. Passa o rato por cima do cabeçalho da coluna de pontuação para ver como se calcula a nota de uma coluna."
sections_added = "{n} separador(es) extra aberto(s) para resultados que não são por coluna."
verdict_benford_conforms = "Os primeiros dígitos estão perto do que a lei de Benford espera, como costumam estar os valores medidos ou acumulados. Não prova nada: uma coluna pode cumprir e ainda assim estar errada."
verdict_benford_acceptable = "Ligeiramente fora das proporções esperadas, dentro da margem em que os dados reais variam. Nada a fazer."
verdict_benford_marginal = "Desviado o suficiente para merecer um segundo olhar, sem chegar a ser um resultado. Verifica como a coluna é produzida antes de tirar conclusões."
verdict_benford_nonconforming = "Os primeiros dígitos não parecem quantidades medidas. É um motivo para olhar melhor, nunca um resultado por si só: valores arredondados, limitados ou introduzidos à mão vêm cá parar sem culpa."
verdict_benford_not_numbers = "Não testado: a coluna não tem números, e a lei trata do primeiro dígito de um número."
verdict_benford_too_few = "Não testado: menos de 300 valores utilizáveis, em que as proporções de dígitos são ruído e não uma distribuição."
verdict_benford_narrow = "Não testado: os valores abrangem menos de um fator de dez. Uma percentagem, uma idade ou uma classificação não têm razão para seguir a lei, por isso um veredicto só induziria em erro."
verdict_benford_ids = "Não testado: números inteiros densos e todos diferentes, por isso é uma sequência atribuída (um número de linha, um número de fatura, um id). Esses são atribuídos, não medidos."
verdict_calendar_complete = "Todos os passos da série estão lá, do primeiro carimbo de data/hora ao último. Não há buracos para explicar."
verdict_calendar_weekdays = "Os únicos buracos são fins de semana saltados, que é o que os dados de negócio fazem de propósito. Conta como completo, e esses fins de semana não aparecem no separador dos buracos."
verdict_calendar_dst = "O único buraco tem a forma de uma mudança de hora: um passo, num domingo, de madrugada. Os carimbos de data/hora do Octa não têm fuso horário, por isso isto lê a forma sem ter a certeza. Verifica se a série importa à hora."
verdict_calendar_gaps = "Tempo que devia ter linhas e não tem. O separador Buracos no calendário lista cada buraco com os carimbos de data/hora de cada lado."
verdict_calendar_not_dates = "Não testado: a coluna não tem datas nem carimbos de data/hora."
verdict_calendar_too_few = "Não testado: menos de três carimbos de data/hora distintos, o que ainda não é uma série."
verdict_calendar_irregular = "Não testado: nenhum passo cobre 60% dos intervalos, por isso não há ritmo em que procurar buracos. Os registos de eventos leem-se assim."
verdict_shape_consistent = "Todos os valores têm a mesma forma, por exemplo todos os códigos postais são A-99999."
verdict_shape_mixed = "Quase todos os valores têm uma forma e alguns não. Esses poucos são muitas vezes gralhas ou um segundo formato; o separador Formas misturadas lista-os."
verdict_shape_na = "Não testado: a coluna está vazia, não é texto ou tem formas a mais para decidir (texto livre, ou vários formatos de propósito)."
hint_number_verdict = "Se uma numeração, como números de fatura ou de encomenda, segue sem buracos. IDs de texto como INV-2024-0007 são verificados série a série. Passa o rato por cima de um veredicto para veres o que significa. Os números em falta aparecem num separador próprio."
section_numbers = "Números em falta"
section_numbers_intro = "Números que faltam numa numeração, como números de fatura ou de encomenda. Cada linha é um buraco, do primeiro ao último número em falta. São listados no máximo 200 buracos por coluna."
hint_num_column = "A coluna onde está a numeração."
hint_num_series = "O texto à volta dos algarismos que contam, com # no lugar do número. Vazio numa coluna só de números."
hint_num_first = "O primeiro número em falta deste buraco."
hint_num_last = "O último número em falta deste buraco."
hint_num_count = "Quantos números faltam neste buraco."
verdict_numbers_complete = "Estão lá todos os números, do primeiro ao último."
verdict_numbers_gaps = "Faltam números. O separador Números em falta lista cada buraco."
verdict_numbers_repeat = "Não testado. Menos de 95% dos valores são diferentes, por isso isto não é uma numeração. Idades e quantidades têm este aspeto."
verdict_numbers_not_sequence = "Não testado. Menos de 60% dos passos entre valores vizinhos são 1, por isso os valores não sobem um a um."
verdict_numbers_too_few = "Não testado. Menos de três valores diferentes."
verdict_numbers_not_numbers = "Não testado. A coluna não tem números inteiros nem texto."

