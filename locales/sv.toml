cell_byte_cap = "Storleksgräns per cell på tråden. Celler vars textform överskrider detta ersätts med en `[truncated: ...]`-markör och svaret flaggar `cell_truncated: true`. Sätt 0 för att inaktivera gränsen.\n\nStandard: 65,536 (64 KiB)."
map_intro = "Standardvärden för Kartvyn (används av GeoJSON-filer). Den aktiva fliken kan växla mellan Plattor och enbart Geometri via Kart-verktygsfältet."
chat_intro = "Inbyggd AI-assistent som anvander Octas verktyg pa dina oppna flikar och filer. Valj en leverantor och ange dess API-nyckel (eller kor Ollama lokalt), oppna sedan panelen fran verktygsfaltet (menyn Analysera, Assistent)."
chat_max_iterations = "Maximalt antal omgangar av verktygsanrop som assistenten far kora inom ett enda meddelande innan den maste stanna. Ett skydd mot skenande loopar."
chat_max_tokens = "Grans for svarslangden (i tokens) som begars per svar. Obegransat later modellen anvanda sitt eget maximum (Anthropic kraver alltid en grans och anvander dar ett hogt varde)."
chat_provider = "Vilken LLM-backend assistenten anvander. Varje leverantor behover sin egen API-nyckel, utom Ollama som kors lokalt."
chat_model = "Modellen som anvands for den har leverantoren. Valj en forinstallning eller skriv valfritt modellnamn."
chat_ollama_url = "Rot-URL till din lokala Ollama-server. Octa lagger till API-sokvagarna."
chat_position = "Var chattpanelen forankras i forhallande till tabellen."
chat_export_dir = "Mapp dit assistenten skriver exporterade filer (nya CSV, diagram) nar du inte anger en fullstandig sokvag."
chat_audit_log = "Lagg till varje verktygsanrop fran assistenten i en logg i konfigurationsmappen (chat_audit/). Av som standard."
chat_render_markdown = "På: rubriker, listor, tabeller, kodblock och länkar i svaren visas formaterade. Av: du ser den råa Markdown-källan. Dina egna meddelanden formateras aldrig om."
chat_audit_warn = "Visa en varning vid start nar loggarna overstiger denna storlek."
chat_api_key = "Din API-nyckel for den har leverantoren. Lagras i systemets nyckelring om tillganglig, annars i klartext i settings.toml."
map_default_mode = "Plattor: hämta en slippy map från den konfigurerade platt-URL:en.\nEnbart geometri: rita bara objekten på en tom yta."
map_fallback = "När platthämtning misslyckas (offline, blockerad), växla automatiskt till enbart geometrirendering för den fliken."
tile_url = "URL-mönster för rasterplattor. `{z}/{x}/{y}` ersätts med zoomnivå och plattkoordinater. Standarden pekar på OSM:s plattserver - för produktion / tung användning, peka på en egen eller kommersiell leverantör."
sidebar_position = "På vilken sida katalogträdet dockas när en mapp öppnas\nvia Arkiv > Öppna katalog."
shortcuts_intro = "Klicka på 'Spela in' och tryck sedan en tangentkombination (med Ctrl / Skift / Alt).\nTryck Esc för att avbryta inspelningen. 'Rensa' lämnar åtgärden obunden."
initial_load_cap = "Högsta antal rader som läses in i tabellen vid första öppningen\nför strömmande format (Parquet, CSV, TSV). Resterande rader\nströmmar in i bakgrunden medan du rullar.\n\nStandard: 5,000,000. Att höja det förbättrar fullständigheten vid\nförsta ritningen men använder mer minne. Att sänka det gör första\növningen snabbare men flyttar mer arbete till bakgrundsinläsaren.\nKryssa i \"Obegränsat\" för att inaktivera gränsen helt och läsa in\nalla rader på förhand.\n\nSkriv ett tal - tillämpas vid Tillämpa."
db_page_rows = "Rader per förfrågan när du öppnar en tabell från en live databasanslutning.\n\nStandard: 100,000. Det här är en sidstorlek, inte ett tak: nästa sida laddas i bakgrunden medan du scrollar, precis som med en stor Parquet-fil.\n\nEgen inställning eftersom gränsen ovanför mäter läsning av en lokal fil, medan det här blir megabyte JSON över nätet. Sänk den om det känns långsamt att öppna en tabell.\n\nSkriv ett tal - tillämpas vid Tillämpa."
raw_view_cap = "Största filstorlek (i MB) som Octa läser in helt i redigeraren\nför rå vy. Styr även den råa reservlösningen vid tolkningsfel\noch den råa sidan i jämförelsevyn. Större filer hoppar över\nrå text för att spara minne.\n\nStandard: 500 MB. Kryssa i Obegränsat för att läsa in filer\noavsett storlek. Tillämpas när du klickar Verkställ."
decompress_cap = "Största uppackade storlek (i MB) för .gz-/.zst-filer som öppnas\ntransparent. En liten komprimerad fil kan svälla enormt\n(en dekomprimeringsbomb); över den här gränsen nekas öppningen.\n\nStandard: 4 295 MB (4 GB). Tillämpas när du klickar Verkställ."
decompress_unlimited = "Ta bort storleksgränsen för uppackning helt. Kryssa bara i detta\nför arkiv du litar på."
raw_view_unlimited = "Läs in hela texten i vilken fil som helst i rå vy, utan\nstorleksgräns. Använd bara med RAM att avvara, en fil på\nflera GB läses helt in i minnet."
initial_load_unlimited = "Läs in alla rader i filen på förhand. Rekommenderas bara\nnär du har gott om RAM - en parquet med 100 M rader äter\nflera GB."
syntax_size_cap = "Filer större än detta faller tillbaka till vanlig monospace i\nden råa redigeraren. Sätt 0 för att inaktivera syntaxmarkering\nhelt; sätt ett mycket stort tal för att avstå från skyddet.\nJSON/YAML/XML/Markdown/TOML markeras aldrig - de använder sina\negna träd-/förhandsvisningsvyer.\n\nStandard: 1 MB. Skriv ett tal, välj en enhet - tillämpas vid Tillämpa."
open_as_text = "Extra filändelser att behandla som vanlig text vid öppning\n(åsidosätter den läsare som normalt skulle göra anspråk på dem).\nKomma- eller blankstegsavgränsade, ingen inledande punkt, gemener.\nExempel: log4j  myproj  rawdata\n\nTillämpas vid Tillämpa; gäller för efterföljande filöppningar."
folder_union_cap = "Största antal filer som en mappsammanslagning i molnet laddar ner\noch slår ihop. Varje fil läses helt in i minnet, så en mapp med\ntiotusentals delar kan ta slut på RAM. Filer över gränsen hoppas\növer och räknas i statusraden.\n\nStandard: 500. Tillämpas vid Tillämpa."
folder_union_unlimited = "Slå ihop alla filer i mappen, hur många de än är. Kryssa bara i\ndetta om du har RAM att avvara."
multi_search_cap = "Storleksgräns per fil för Multisök-panelens katalogomfattning.\nStörre filer hoppas över och listas i chippen för överhoppade\nfiler. Kryssa i \"Obegränsat\" för att ta bort gränsen helt.\n\nStandard: 50 MB."
multi_search_unlimited = "Sök igenom varje fil i katalogen oavsett storlek. En enorm logg\neller dump kan låsa sökningen och äta minne."
chart_max_points = "Högsta antal rader som Diagram-fliken ritar innan jämnt fördelad\nnedsampling slår till (Histogram, Linje, Spridning). Stapeldiagram\naggregerar alltid hela indata; lådagram beräknar 5-talssamman-\nfattningen över hela indata. Sätt 0 för att inaktivera samplingen -\nbara säkert för måttligt stora tabeller.\n\nStandard: 100,000. Numerisk inmatning godtar kommaavgränsare."
chart_max_categories = "Högsta antal distinkta X-kategorier som ett stapeldiagram godtar\ninnan det vägrar rita. Över detta visar renderaren ett fel i\nstället för en oläslig vägg av staplar - filtrera eller aggregera\ntabellen först.\n\nStandard: 200. Numerisk inmatning godtar kommaavgränsare."
tables_in_picker = "Hur många tabellrader dialogen för val av flera tabeller (SQLite,\nDuckDB, ...) ska rymma vertikalt vid sin standardstorlek. Dialogen\när fortfarande storleksändringsbar - dra i hörnet för att göra den\nstörre när en databas har många tabeller.\n\nStandard: 10. Minimum 1."
excel_auto_open = "Hur många blad i en Excel-arbetsbok med flera blad som öppnas\nautomatiskt (vart och ett i en egen flik). Arbetsböcker med fler\nblad än så visar en väljare så att du väljer vilka som ska öppnas\n(du kan fortfarande välja fler än detta antal, eller alla).\n\nStandard: 5. Minimum 1."
max_recent = "Antal nyligen öppnade filer som visas i Arkiv-menyn"
start_maximised = "När på startar fönstret maximerat och storleken nedan används\nsom återställningsstorlek.\nNär av startar fönstret med den valda storleken."
initial_window_size = "Fönsterstorlek vid start (när \"Starta maximerat\" är av),\neller återställningsstorleken när det är på."
ctrl_close = "Stäng"
ctrl_restore = "Återställ"
ctrl_full_size = "Full storlek"
ctrl_minimise = "Minimera"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Skyddar dina filer mot sparanden från gränssnittet och MCP-serverns\nstandardläge. När det är på nekas tillägg eller borttagning av kolumner\ni en SQLite-, DuckDB- eller GeoPackage-fil vid sparande. Assistenten styrs\nper chattprofil (profilens inställning Tillåt skrivning), inte av den här\ninställningen."
confirm_db_write_back = "Innan ändringar går till en databas i drift visar Octa vad som skulle ändras och frågar.\nStäng av det så att Spara tillämpar ändringarna direkt; det är en enda transaktion i båda fallen,\noch en misslyckad skrivning rullas tillbaka."
confirm_url_redirects = "När en webbadress skickar dig vidare till en annan, fråga innan filen öppnas därifrån. Bekräftelsen är enda stället där ändringen syns."
backup_before_modify = "Innan assistenten eller ett schemaändrande databassparande skriver\növer en fil kopieras den först till en tidsstämplad .bak-fil bredvid.\nVanliga manuella sparanden säkerhetskopieras inte."
chat_profiles = "Varje profil är en sparad uppsättning: en leverantör, en modell, en temperatur och en valfri tankebudget, under ett namn du väljer. Skapa hur många du vill, även flera för samma leverantör, och växla mellan dem från assistentpanelen."
chat_profile_base_url = "Slutpunkt för den här profilen. Lämna tomt för att använda Ollama-serveradressen som anges nedan."
write_options = "Standardvärden när Octa skriver en fil. Spara som och batchkonvertering utgår från dem och kan ändra dem för en körning."
status_message_secs = "Hur länge ett statusmeddelande står kvar innan det försvinner.\nSamma tid gäller alla meddelanden, både lyckade och fel.\n\nHåller du musen över meddelandet pausas nedräkningen - ett fel\ndu läser eller kopierar står alltså kvar. Varje meddelande har\nockså ett 'x' för att stänga det direkt.\n\nGår inte att stänga av; under 3 används 3. Standard: 10."
chat_tools = "Vilka verktyg assistenten får använda. Core-gruppen skickas med varje meddelande; de andra grupperna nämns bara för den, och den hämtar en när uppgiften kräver det. Ett avstängt verktyg är borta överallt: det skickas inte, erbjuds inte och avvisas om den anropar det ändå."
chat_tools_enable_all = "Slå på alla verktyg igen. Bara core-gruppen skickas med varje meddelande, så resten kostar ingenting förrän assistenten ber om det."
chat_tools_budget = "Ungefär hur många tokens verktygsbeskrivningarna lägger till i ett meddelande. Räknat på deras storlek, så läs det som en vägledning, inte som en räkning."
sql_page_rows = "Hur många resultatrader som hämtas åt gången; fler kommer när du rullar. Radantalet och Exportera täcker alltid hela resultatet. 0 läser in allt på en gång."
sql_auto_register = "Gör varje annan öppen flik frågbar i SQL-panelen under sitt eget namn, så att en join av två öppna filer klarar sig utan attach."
sql_auto_register_max = "Större flikar registreras inte automatiskt, eftersom registrering kopierar deras rader. De får en Registrera-knapp i stället."
sql_auto_register_max_off = "Används bara medan Fråga andra öppna flikar är på."
git_marks_uncommitted = "Färgar filer och mappar i sidopanelen som har ej incheckade git-ändringar: ändrade, tillagda, borttagna, omdöpta eller ospårade."
git_marks_branch = "Färgar filer och mappar som ändrats på den aktuella grenen sedan den grenades av från basgrenen."
git_marks_base_branch = "Gren att jämföra mot. När ett repo saknar en gren med det här namnet provas main; saknas den också uteblir grenmarkeringen helt enkelt, och mappens hovertext säger det."
git_marks_base_branch_off = "Används bara medan Markera ändringar på den här grenen är på."
git_marks_refresh_secs = "Hur ofta sidopanelen frågar git igen medan den syns. 0 stänger av timern: då uppdateras markeringarna bara när en mapp öppnas och när Octa sparar en fil."
git_marks_refresh_secs_off = "Används bara medan minst en git-markering är på."
retype_layout_sample = "Hur många värden Ändra typ läser när den avgör vilket datumformat en textkolumn är skriven i. Omröstningen kostar sju datumtolkningar per värde, alla på en gång i gränssnittstråden: vid 5 000 000 värden blir det 35 000 000 tolkningar och fönstret slutar svara i flera sekunder. Att höja hjälper bara när en kolumns första värden inte representerar resten, till exempel en fil sorterad så att alla ISO-rader kommer först. Det ändrar aldrig ett visat antal. Standard 10 000."
retype_layout_sample_off = "Stäng av Obegränsat för att skriva ett tal här."
retype_layout_sample_unlimited = "Läser varje värde i kolumnen i stället för ett urval. Mest exakt på en ojämnt sorterad kolumn, men på flera miljoner rader fryser fönstret i sekunder varje gång du väljer en datumtyp."
cloud_download_concurrency = "Hur många molnobjekt en union laddar ned samtidigt. Standard 8, minst 1. Att hämta från ett objektlager handlar mest om att vänta på tur och retur, inte om att flytta byte, så att ladda ned en i taget lämnar länken sysslolös däremellan. Åtta är ungefär vad en webbläsare tillåter per värd. Höj på en snabb länk med hög latens; sänk till 1 om en leverantör eller proxy börjar avvisa förfrågningar. Mycket höga värden startar lika många trådar på en gång och är den snabbaste vägen till ett fel om förfrågningsgräns."

