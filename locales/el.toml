sidebar_position = "Σε ποια πλευρά αγκυρώνεται το δέντρο φακέλων όταν ανοίγει\nένας φάκελος μέσω Αρχείο > Άνοιγμα φακέλου."
shortcuts_intro = "Κάντε κλικ στο 'Εγγραφή' και μετά πατήστε έναν συνδυασμό πλήκτρων (με Ctrl / Shift / Alt).\nΠατήστε Esc για ακύρωση της εγγραφής. Το 'Εκκαθάριση' αφήνει την ενέργεια χωρίς αντιστοίχιση."
initial_load_cap = "Μέγιστος αριθμός γραμμών που φορτώνονται στον πίνακα στο πρώτο άνοιγμα\nγια μορφές ροής (Parquet, CSV, TSV). Οι υπόλοιπες γραμμές\nφορτώνονται στο παρασκήνιο καθώς κάνετε κύλιση.\n\nΠροεπιλογή: 5.000.000. Η αύξηση βελτιώνει την πληρότητα της πρώτης\nαπεικόνισης αλλά χρησιμοποιεί περισσότερη μνήμη. Η μείωση κάνει\nτο αρχικό άνοιγμα ταχύτερο αλλά μεταφέρει περισσότερη δουλειά στον\nφορτωτή παρασκηνίου. Επιλέξτε \"Απεριόριστο\" για να απενεργοποιήσετε\nεντελώς το όριο και να φορτώσετε κάθε γραμμή εκ των προτέρων.\n\nΠληκτρολογήστε αριθμό - εφαρμόζεται με Εφαρμογή."
db_page_rows = "Γραμμές ανά αίτημα όταν ανοίγεις πίνακα μέσω ζωντανής σύνδεσης βάσης δεδομένων.\n\nΠροεπιλογή: 100,000. Είναι μέγεθος σελίδας, όχι όριο: η επόμενη σελίδα φορτώνεται στο παρασκήνιο καθώς κάνεις κύλιση, όπως ακριβώς σε ένα μεγάλο αρχείο Parquet.\n\nΕίναι ξεχωριστή ρύθμιση επειδή το όριο από πάνω αφορά ανάγνωση τοπικού αρχείου, ενώ εδώ περνούν megabyte JSON από το δίκτυο. Μείωσέ το αν το άνοιγμα ενός πίνακα σου φαίνεται αργό.\n\nΠληκτρολογήστε αριθμό - εφαρμόζεται με Εφαρμογή."
raw_view_cap = "Μέγιστο μέγεθος αρχείου (σε MB) που διαβάζει πλήρως το Octa στον\nεπεξεργαστή προβολής Raw. Ελέγχει επίσης την εφεδρική εμφάνιση raw σε σφάλμα ανάλυσης και\nτην raw πλευρά της προβολής Σύγκρισης. Τα μεγαλύτερα αρχεία παρακάμπτουν το raw κείμενο για\nπροστασία της μνήμης.\n\nΠροεπιλογή: 500 MB. Επιλέξτε \"Απεριόριστο\" για φόρτωση οποιουδήποτε αρχείου\nανεξαρτήτως μεγέθους. Εφαρμόζεται στην Εφαρμογή."
decompress_cap = "Μέγιστο αποσυμπιεσμένο μέγεθος (σε MB) για διαφανώς ανοιγμένα\nαρχεία .gz / .zst. Ένα μικροσκοπικό συμπιεσμένο αρχείο μπορεί να διογκωθεί τεράστια\n(βόμβα αποσυμπίεσης)· πέρα από αυτό το όριο το άνοιγμα απορρίπτεται.\n\nΠροεπιλογή: 4.295 MB (4 GB). Εφαρμόζεται στην Εφαρμογή."
decompress_unlimited = "Πλήρης κατάργηση του ορίου μεγέθους αποσυμπίεσης. Επιλέξτε το μόνο\nγια αρχεία που εμπιστεύεστε."
raw_view_unlimited = "Ανάγνωση του πλήρους κειμένου οποιουδήποτε αρχείου στην προβολή Raw, χωρίς\nόριο μεγέθους. Χρησιμοποιήστε το μόνο με άφθονη RAM - ένα αρχείο πολλών GB\nδιαβάζεται εξ ολοκλήρου στη μνήμη."
initial_load_unlimited = "Φόρτωση κάθε γραμμής του αρχείου εκ των προτέρων. Συνιστάται μόνο\nόταν έχετε άφθονη RAM - ένα parquet 100 εκατ. γραμμών τρώει\nαρκετά GB."
syntax_size_cap = "Αρχεία μεγαλύτερα από αυτό επιστρέφουν σε απλή μονοαποστασιακή\nστον ακατέργαστο επεξεργαστή. Ορίστε 0 για να απενεργοποιήσετε\nεντελώς την επισήμανση σύνταξης· ορίστε πολύ μεγάλο αριθμό για να\nεξαιρεθείτε από την προστασία. Τα JSON/YAML/XML/Markdown/TOML δεν\nεπισημαίνονται ποτέ - χρησιμοποιούν τις δικές τους προβολές δέντρου/προεπισκόπησης.\n\nΠροεπιλογή: 1 MB. Πληκτρολογήστε αριθμό, επιλέξτε μονάδα - εφαρμόζεται με Εφαρμογή."
open_as_text = "Επιπλέον επεκτάσεις αρχείων που αντιμετωπίζονται ως απλό κείμενο κατά το άνοιγμα\n(υπερισχύει του αναγνώστη που κανονικά θα τις διεκδικούσε).\nΧωρισμένες με κόμμα ή κενό, χωρίς αρχική τελεία, πεζά.\nΠαράδειγμα: log4j  myproj  rawdata\n\nΕφαρμόζεται με Εφαρμογή· ισχύει για τα επόμενα ανοίγματα αρχείων."
folder_union_cap = "Μέγιστος αριθμός αρχείων που κατεβάζει και ενώνει μια ένωση φακέλου\nστο cloud. Κάθε αρχείο διαβάζεται πλήρως στη μνήμη, οπότε ένας φάκελος\nμε δεκάδες χιλιάδες τμήματα μπορεί να εξαντλήσει τη RAM. Τα αρχεία πάνω\nαπό το όριο παραλείπονται και καταμετρώνται στη γραμμή κατάστασης.\n\nΠροεπιλογή: 500. Εφαρμόζεται με το Εφαρμογή."
folder_union_unlimited = "Ένωση όλων των αρχείων του φακέλου, όσα κι αν είναι. Επιλέξτε το\nμόνο αν έχετε άφθονη μνήμη."
multi_search_cap = "Όριο μεγέθους ανά αρχείο για την εμβέλεια φακέλου του πίνακα\nπολλαπλής αναζήτησης. Αρχεία μεγαλύτερα από αυτό παραλείπονται και\nαναφέρονται στο chip παραλειφθέντων αρχείων. Επιλέξτε \"Απεριόριστο\" για πλήρη κατάργηση του ορίου.\n\nΠροεπιλογή: 50 MB."
multi_search_unlimited = "Σάρωση κάθε αρχείου του φακέλου ανεξαρτήτως μεγέθους. Ένα τεράστιο\nαρχείο καταγραφής ή dump μπορεί να κολλήσει τη σάρωση και να φάει μνήμη."
chart_max_points = "Μέγιστος αριθμός γραμμών που θα απεικονίσει η καρτέλα Γράφημα πριν ενεργοποιηθεί\nη ομοιόμορφη υποδειγματοληψία (Ιστόγραμμα, Γραμμή, Διασπορά). Τα ραβδογράμματα\nπάντα συναθροίζουν όλη την είσοδο· τα θηκογράμματα υπολογίζουν την\nπεντάριθμη σύνοψη σε όλη την είσοδο. Ορίστε 0 για απενεργοποίηση της\nυποδειγματοληψίας - ασφαλές μόνο για πίνακες μέτριου μεγέθους.\n\nΠροεπιλογή: 100.000. Η αριθμητική είσοδος δέχεται διαχωριστές με κόμμα."
chart_max_categories = "Μέγιστος αριθμός διακριτών κατηγοριών X που θα δεχτεί ένα ραβδόγραμμα πριν\nαρνηθεί να σχεδιάσει. Πάνω από αυτό ο αποδότης εμφανίζει σφάλμα\nαντί να παράγει έναν δυσανάγνωστο τοίχο ράβδων - φιλτράρετε ή\nσυναθροίστε πρώτα τον πίνακα.\n\nΠροεπιλογή: 200. Η αριθμητική είσοδος δέχεται διαχωριστές με κόμμα."
tables_in_picker = "Πόσες γραμμές πινάκων πρέπει να χωρά κατακόρυφα ο διάλογος επιλογής\nπολλών πινάκων (SQLite, DuckDB, ...) στο προεπιλεγμένο μέγεθός του. Ο\nδιάλογος εξακολουθεί να αλλάζει μέγεθος - σύρετε τη γωνία για να τον\nμεγαλώσετε όταν μια βάση έχει πολλούς πίνακες.\n\nΠροεπιλογή: 10. Ελάχιστο 1."
excel_auto_open = "Πόσα φύλλα ενός πολυφυλλικού βιβλίου εργασίας Excel να ανοίγουν\nαυτόματα (το καθένα στη δική του καρτέλα). Βιβλία με περισσότερα\nφύλλα από αυτό εμφανίζουν επιλογέα ώστε να επιλέξετε ποια θα ανοίξουν\n(μπορείτε να επιλέξετε περισσότερα από αυτόν τον αριθμό ή όλα).\n\nΠροεπιλογή: 5. Ελάχιστο 1."
max_recent = "Αριθμός πρόσφατα ανοιγμένων αρχείων που εμφανίζονται στο μενού Αρχείο"
start_maximised = "Όταν είναι ενεργό, το παράθυρο εκκινεί μεγιστοποιημένο και το παρακάτω μέγεθος\nχρησιμοποιείται ως μέγεθος επαναφοράς από τη μεγιστοποίηση.\nΌταν είναι ανενεργό, το παράθυρο εκκινεί στο επιλεγμένο μέγεθος."
initial_window_size = "Μέγεθος παραθύρου που χρησιμοποιείται κατά την εκκίνηση (όταν το \"Έναρξη μεγιστοποιημένο\" είναι ανενεργό),\nή το μέγεθος επαναφοράς από τη μεγιστοποίηση όταν είναι ενεργό."
ctrl_close = "Κλείσιμο"
ctrl_restore = "Επαναφορά"
ctrl_full_size = "Πλήρες μέγεθος"
ctrl_minimise = "Ελαχιστοποίηση"

write_protection = "Προστατεύει τα αρχεία σου από αποθηκεύσεις μέσω GUI και την προεπιλογή του διακομιστή MCP.\nΌταν είναι ενεργή, η προσθήκη ή αφαίρεση στηλών σε αρχείο SQLite, DuckDB ή GeoPackage\nαπορρίπτεται κατά την αποθήκευση. Ο Βοηθός διέπεται ανά προφίλ συνομιλίας\n(τον διακόπτη Να επιτρέπονται οι εγγραφές του προφίλ), όχι από αυτήν τη ρύθμιση."
confirm_db_write_back = "Πριν οι αλλαγές φτάσουν σε βάση που δουλεύει, το Octa δείχνει τι θα άλλαζε και ρωτάει.\nΚλείσε το για να εφαρμόζει η Αποθήκευση τις αλλαγές αμέσως, και στις δύο περιπτώσεις είναι μία\nσυναλλαγή και μια αποτυχία αναιρείται."
confirm_url_redirects = "Όταν μια διεύθυνση σε στέλνει σε άλλη, να ρωτά πριν ανοίξει το αρχείο από εκεί. Αυτή η επιβεβαίωση είναι το μόνο σημείο όπου φαίνεται η αλλαγή."
backup_before_modify = "Πριν ο βοηθός ή μια αποθήκευση βάσης δεδομένων που αλλάζει το σχήμα αντικαταστήσει\nένα αρχείο, αντιγράψτε το πρώτα σε ένα αρχείο .bak με χρονική σήμανση δίπλα του.\nΟι συνήθεις χειροκίνητες αποθηκεύσεις δεν λαμβάνουν αντίγραφο ασφαλείας."
chat_profiles = "Κάθε προφίλ είναι μία αποθηκευμένη διαμόρφωση: ένας πάροχος, ένα μοντέλο, μια θερμοκρασία και ένας προαιρετικός προϋπολογισμός σκέψης, με όνομα που επιλέγετε. Δημιουργήστε όσα θέλετε, ακόμη και πολλά για τον ίδιο πάροχο, και εναλλάξτε τα από τον πίνακα του βοηθού."
chat_profile_base_url = "Σημείο πρόσβασης για αυτό το προφίλ. Αφήστε το κενό για χρήση της διεύθυνσης του διακομιστή Ollama που ορίζεται παρακάτω."
write_options = "Προεπιλογές όταν το Octa γράφει ένα αρχείο. Η Αποθήκευση ως και η μαζική μετατροπή ξεκινούν από αυτές και μπορούν να τις αλλάξουν για μία εκτέλεση."
status_message_secs = "Πόση ώρα μένει ένα μήνυμα κατάστασης στην οθόνη πριν σβήσει.\nΗ ίδια διάρκεια ισχύει για κάθε μήνυμα, επιτυχία ή σφάλμα.\n\nΑν περάσεις το ποντίκι από πάνω, η αντίστροφη μέτρηση παγώνει:\nένα σφάλμα που διαβάζεις ή αντιγράφεις μένει στη θέση του. Κάθε\nμήνυμα έχει επίσης ένα 'x' για άμεσο κλείσιμο.\n\nΔεν απενεργοποιείται - κάτω από 3 ισχύει 3. Προεπιλογή: 10."
chat_tools = "Ποια εργαλεία επιτρέπεται να χρησιμοποιεί ο βοηθός. Η ομάδα core φεύγει με κάθε μήνυμα, ενώ τις άλλες ομάδες τις βλέπει μόνο ονομαστικά και φορτώνει μία όταν τη χρειαστεί η δουλειά. Ένα κλειστό εργαλείο φεύγει από παντού: δεν στέλνεται, δεν προσφέρεται και απορρίπτεται αν το καλέσει έτσι κι αλλιώς."
chat_tools_enable_all = "Ξανάνοιξε όλα τα εργαλεία. Με κάθε μήνυμα φεύγει μόνο η ομάδα core, οπότε τα υπόλοιπα δεν κοστίζουν τίποτα μέχρι να τα ζητήσει ο βοηθός."
chat_tools_budget = "Χονδρικά πόσα τόκεν προσθέτουν οι περιγραφές των εργαλείων σε ένα μήνυμα. Υπολογίζεται από το μέγεθός τους, οπότε διάβασέ το ως οδηγό, όχι ως λογαριασμό."
sql_page_rows = "Πόσες γραμμές αποτελέσματος φέρνει κάθε φορά. Με την κύλιση έρχονται κι άλλες. Ο αριθμός γραμμών και η Εξαγωγή καλύπτουν πάντα όλο το αποτέλεσμα. Το 0 τα φορτώνει όλα μαζί."
sql_auto_register = "Κάνει κάθε άλλη ανοιχτή καρτέλα ερωτήσιμη στον πίνακα SQL με το δικό της όνομα, ώστε η σύνδεση δύο ανοιχτών αρχείων να μη χρειάζεται attach."
sql_auto_register_max = "Μεγαλύτερες καρτέλες δεν καταχωρούνται αυτόματα, επειδή η καταχώριση αντιγράφει τις γραμμές τους. Παίρνουν αντ' αυτού ένα κουμπί Καταχώριση."
sql_auto_register_max_off = "Χρησιμοποιείται μόνο όσο είναι ενεργό το Ερώτημα στις άλλες ανοιχτές καρτέλες."
git_marks_uncommitted = "Χρωματίζει αρχεία και φακέλους στην πλαϊνή μπάρα που έχουν μη δεσμευμένες αλλαγές git: τροποποιημένα, προστιθέμενα, διαγραμμένα, μετονομασμένα ή μη παρακολουθούμενα."
git_marks_branch = "Χρωματίζει αρχεία και φακέλους που άλλαξαν στον τρέχοντα κλάδο από τότε που διακλαδώθηκε από τον βασικό κλάδο."
git_marks_base_branch = "Κλάδος με τον οποίο γίνεται η σύγκριση. Όταν ένα αποθετήριο δεν έχει κλάδο με αυτό το όνομα, δοκιμάζεται το main. Αν λείπει κι αυτό, η σήμανση κλάδου απλώς απουσιάζει και το hover του φακέλου το λέει."
git_marks_base_branch_off = "Χρησιμοποιείται μόνο όσο είναι ενεργό το Σήμανση αλλαγών σε αυτόν τον κλάδο."
git_marks_refresh_secs = "Πόσο συχνά η πλαϊνή μπάρα ξαναρωτά το git όσο είναι ορατή. Το 0 απενεργοποιεί τον χρονοδιακόπτη: τότε οι σημάνσεις ανανεώνονται μόνο όταν ανοίγει ένας φάκελος και όταν το Octa αποθηκεύει ένα αρχείο."
git_marks_refresh_secs_off = "Χρησιμοποιείται μόνο όσο είναι ενεργή τουλάχιστον μία σήμανση git."
retype_layout_sample = "Πόσες τιμές διαβάζει η Αλλαγή τύπου όταν αποφασίζει σε ποια μορφή ημερομηνίας είναι γραμμένη μια στήλη κειμένου. Η ψηφοφορία κοστίζει επτά αναλύσεις ημερομηνίας ανά τιμή, όλες μαζί στο νήμα της διεπαφής: στις 5.000.000 τιμές αυτό είναι 35.000.000 αναλύσεις και το παράθυρο σταματά να αποκρίνεται για δευτερόλεπτα. Η αύξηση βοηθά μόνο όταν οι πρώτες τιμές μιας στήλης δεν αντιπροσωπεύουν τις υπόλοιπες, π.χ. σε αρχείο ταξινομημένο ώστε όλες οι γραμμές ISO να είναι πρώτες. Δεν αλλάζει ποτέ έναν εμφανιζόμενο αριθμό. Προεπιλογή 10.000."
retype_layout_sample_off = "Απενεργοποίησε το Απεριόριστο για να γράψεις εδώ έναν αριθμό."
retype_layout_sample_unlimited = "Διαβάζει κάθε τιμή της στήλης αντί για δείγμα. Είναι το πιο ακριβές σε άνισα ταξινομημένη στήλη, αλλά σε μερικά εκατομμύρια γραμμές το παράθυρο παγώνει για δευτερόλεπτα κάθε φορά που διαλέγεις τύπο ημερομηνίας."
cloud_download_concurrency = "Πόσα αντικείμενα από το cloud κατεβάζει ταυτόχρονα μια ένωση. Προεπιλογή 8, ελάχιστο 1. Η ανάκτηση από αποθήκη αντικειμένων είναι κυρίως αναμονή για τον χρόνο μετ' επιστροφής και όχι μεταφορά byte, οπότε το κατέβασμα ένα-ένα αφήνει τη σύνδεση αδρανή ενδιάμεσα. Το οκτώ είναι περίπου όσα επιτρέπει ένα πρόγραμμα περιήγησης ανά διακομιστή. Ανέβασέ το σε γρήγορη σύνδεση με μεγάλη καθυστέρηση, κατέβασέ το στο 1 αν κάποιος πάροχος ή διαμεσολαβητής αρχίσει να απορρίπτει αιτήματα. Πολύ μεγάλες τιμές ξεκινούν άλλα τόσα νήματα μαζί και είναι ο γρηγορότερος δρόμος για σφάλμα ορίου αιτημάτων."

[chat]
result_row_limit = "Όριο γραμμών αποτελέσματος"
export = "Εξαγωγή"
export_hint = "Εξαγωγή αυτής της συνομιλίας σε Markdown ή JSON"
export_empty = "Δεν υπάρχει τίποτα για εξαγωγή ακόμη"
export_done = "Η συνομιλία εξήχθη στο"
prompt_insert = "Εισαγωγη"
prompts_hint = "Αποθηκευση και επαναχρηση προτροπων"
explain = "Εξήγησε αυτό το αρχείο"
explain_hint = "Ρώτα τον βοηθό τι έχει αυτό το αρχείο, τι σημαίνουν οι στήλες και τι φαίνεται περίεργο. Χρειάζεται προφίλ μοντέλου στις ρυθμίσεις."
explain_prompt = "Εξήγησε το {file}, τον πίνακα στην ενεργή καρτέλα: τι φαίνεται να είναι τα δεδομένα, τι σημαίνουν οι στήλες και ό,τι φαίνεται περίεργο ή αξίζει έλεγχο. Δες τον πρώτα με τα εργαλεία και μετά απάντησε σε μια σύντομη παράγραφο."
usage = "{in} είσοδος / {out} έξοδος"
usage_hint = "Τα tokens αυτής της συνεδρίας όπως τα μετράει ο πάροχος: αυτά είναι ακριβή. Η πλευρά της εισόδου είναι μεγάλη επειδή κάθε αίτημα κουβαλάει τις περιγραφές όλων των εργαλείων, ό,τι επέστρεψαν αυτά τα εργαλεία και όλη τη συζήτηση μέχρι τώρα, και μεγαλώνει με κάθε μήνυμα. Τα πλαίσια Ρώτησε στη μπάρα αναζήτησης και στο πάνελ SQL μετράνε κι αυτά εδώ. Ξεκίνα νέα συνεδρία για να μηδενιστεί. Η ταχύτητα δείχνει πόσο γρήγορα παράγεται η απάντηση: μετριέται ζωντανά όσο έρχεται, και στο τέλος εμφανίζεται η ακριβής τιμή του ίδιου του Ollama. Οι άλλοι πάροχοι δεν στέλνουν χρόνους."
usage_speed = "{n} tokens/s"
usage_read = "Τελευταίο prompt: {n} tokens, διαβάστηκαν με {rate} tokens/s πριν από το πρώτο token της απάντησης."
mode_data = "Δεδομένα"
mode_data_hint = "Ο βοηθός μπορεί να χρησιμοποιήσει τα εργαλεία του Octa πάνω σε ό,τι έχεις ανοιχτό: να διαβάσει πίνακες, να τρέξει SQL, να αλλάξει την ενεργή καρτέλα. Αυτή είναι η κανονική λειτουργία."
mode_plain = "Απλά απάντησε"
