multi_search_cap = "Ograničenje veličine datoteke za opseg direktorija ploče Višestruko pretraživanje.\nDatoteke veće od ovoga se preskaču i navode u oznaci\npreskočenih datoteka. Označite \"Neograničeno\" za potpuno uklanjanje ograničenja.\n\nZadano: 50 MB."
multi_search_unlimited = "Pretražuje svaku datoteku u direktoriju bez obzira na veličinu.\nOgroman zapisnik ili dump može zaglaviti pretragu i pojesti memoriju."
chart_max_points = "Maksimalan broj redaka koje kartica Grafikon crta prije nego što se\nuključi ravnomjerno prorjeđivanje (Histogram, Linija, Raspršeni). Trakasti grafikoni\nuvijek agregiraju cijeli ulaz; Kutijasti računaju\n5-brojni sažetak nad cijelim ulazom. Postavite 0 da onemogućite\nprorjeđivanje - sigurno samo za umjereno velike tablice.\n\nZadano: 25,000. Numerički unos prihvaća razdjelnike-zareze."
chart_max_categories = "Maksimalan broj različitih X kategorija koje trakasti grafikon prihvaća prije nego\nšto odbije crtati. Iznad toga renderer prikazuje pogrešku\numjesto da napravi nečitljiv zid traka - prvo filtrirajte ili\nagregirajte tablicu.\n\nZadano: 200. Numerički unos prihvaća razdjelnike-zareze."
tables_in_picker = "Koliko redaka tablica dijalog za odabir višetabličnih izvora (SQLite,\nDuckDB, ...) treba uklopiti okomito pri zadanoj veličini. Dijalog\nse i dalje može mijenjati po veličini - povucite kut da ga napravite\nvećim kada baza podataka ima mnogo tablica.\n\nZadano: 10. Minimum 1."
excel_auto_open = "Koliko listova višelistne Excel radne knjige otvoriti\nautomatski (svaki u svojoj kartici). Radne knjige s više\nlistova od ovoga prikazuju birač da odaberete koje otvoriti\n(i dalje možete odabrati više od ovog broja, ili sve).\n\nZadano: 5. Minimum 1."
max_recent = "Broj nedavno otvaranih datoteka prikazanih u izborniku Datoteka"
start_maximised = "Kada je uključeno, prozor se pokreće maksimiziran, a veličina ispod\nse koristi kao veličina vraćanja iz maksimiziranja.\nKada je isključeno, prozor se pokreće odabranom veličinom."
initial_window_size = "Veličina prozora pri pokretanju (kada je „Pokreni maksimizirano“ isključeno),\nili veličina vraćanja iz maksimiziranja kada je uključeno."
ctrl_close = "Zatvori"
ctrl_restore = "Vrati"
ctrl_full_size = "Puna veličina"
ctrl_minimise = "Minimiziraj"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Štiti tvoje datoteke od spremanja iz sučelja i od zadane postavke MCP poslužitelja.\nKada je uključeno, dodavanje ili uklanjanje stupaca u SQLite, DuckDB ili GeoPackage\ndatoteci odbija se pri spremanju. Pomoćnikom se upravlja po profilu razgovora\n(prekidač Dopusti pisanje u profilu), a ne ovom postavkom."
confirm_db_write_back = "Prije nego što izmjene odu u bazu koja radi, Octa pokazuje što bi se promijenilo i pita.\nIsključi ovo da Spremi odmah primijeni razlike; u oba slučaja to je jedna transakcija,\na neuspio upis se poništava."
confirm_url_redirects = "Kada te web adresa pošalje na drugu, pitaj prije nego se datoteka otvori odande. Ta potvrda je jedino mjesto gdje se ta promjena vidi."
backup_before_modify = "Prije nego pomoćnik ili spremanje baze koje mijenja shemu prepiše\ndatoteku, najprije je kopiraj u .bak datoteku s vremenskom oznakom pokraj nje.\nUobičajena ručna spremanja ne kopiraju se."
chat_profiles = "Svaki profil je jedna spremljena postava: pružatelj, model, temperatura i neobavezan proračun razmišljanja, pod nazivom koji odaberete. Napravite ih koliko želite, uključujući više njih za istog pružatelja, i prebacujte se između njih iz ploče pomoćnika."
chat_profile_base_url = "Krajnja točka za ovaj profil. Ostavite prazno za adresu Ollama poslužitelja postavljenu ispod."
write_options = "Zadane vrijednosti kad Octa zapisuje datoteku. Spremi kao i skupna pretvorba polaze od njih i mogu ih promijeniti za jedno izvođenje."
status_message_secs = "Koliko dugo statusna poruka ostaje na zaslonu prije nego nestane.\nIsto trajanje vrijedi za svaku poruku, uspjeh i pogrešku.\n\nAko prijeđeš mišem preko nje, odbrojavanje se pauzira - pogreška\nkoju čitaš ili kopiraš ostaje na mjestu. Svaka poruka ima i 'x'\nza trenutno zatvaranje.\n\nNe može se isključiti; ispod 3 vrijedi 3. Zadano: 10."
chat_tools = "Koje alate pomoćnik smije koristiti. Grupa core ide uz svaku poruku; ostale grupe mu se samo imenuju, a jednu učita kad je posao traži. Isključen alat nestaje svugdje: ne šalje se, ne nudi se i odbija se ako ga pomoćnik ipak pozove."
chat_tools_enable_all = "Ponovno uključi sve alate. Uz svaku poruku ide samo grupa core, pa ostalo ne košta ništa dok pomoćnik za to ne zatraži."
chat_tools_budget = "Otprilike koliko tokena opisi alata dodaju poruci. Izračunato iz njihove veličine, pa čitaj kao smjernicu, a ne kao račun."
sql_page_rows = "Koliko se redaka rezultata dohvaća odjednom; pomicanjem stižu novi. Broj redaka i Izvoz uvijek pokrivaju cijeli rezultat. 0 učitava sve odjednom."
sql_auto_register = "Čini svaku drugu otvorenu karticu upitljivom u SQL ploči pod njezinim imenom, tako da spajanje dviju otvorenih datoteka ne treba attach."
sql_auto_register_max = "Veće kartice ne registriraju se automatski jer registracija kopira njihove retke. Umjesto toga dobivaju gumb Registriraj."
sql_auto_register_max_off = "Koristi se samo dok je uključeno Upitaj ostale otvorene kartice."
git_marks_uncommitted = "Boji datoteke i mape u bočnoj traci koje imaju git promjene bez commita: izmijenjene, dodane, obrisane, preimenovane ili nepraćene."
git_marks_branch = "Boji datoteke i mape izmijenjene na trenutnoj grani otkako se odvojila od osnovne grane."
git_marks_base_branch = "Grana s kojom se uspoređuje. Kad repozitorij nema granu s tim imenom, pokušava se main; ako nedostaje i ona, oznaka grane jednostavno izostaje, a opis mape pri prelasku mišem to kaže."
git_marks_base_branch_off = "Koristi se samo dok je uključeno Označi promjene na ovoj grani."
git_marks_refresh_secs = "Koliko često bočna traka ponovno pita git dok je vidljiva. 0 isključuje mjerač: oznake se tada osvježavaju samo pri otvaranju mape i kad Octa spremi datoteku."
git_marks_refresh_secs_off = "Koristi se samo dok je uključena barem jedna git oznaka."
retype_layout_sample = "Koliko vrijednosti čita Promijeni tip kad odlučuje u kojem je formatu datuma tekstualni stupac zapisan. Glasanje košta sedam obrada datuma po vrijednosti, sve odjednom u niti sučelja: na 5.000.000 vrijednosti to je 35.000.000 obrada i prozor prestaje reagirati nekoliko sekundi. Povećanje pomaže samo kad prve vrijednosti stupca ne predstavljaju ostale, na primjer kod datoteke sortirane tako da su svi ISO redci na početku. Prikazane brojeve to nikad ne mijenja. Zadano 10.000."
retype_layout_sample_off = "Isključi Neograničeno da bi ovdje upisao broj."
retype_layout_sample_unlimited = "Čita svaku vrijednost u stupcu umjesto uzorka. Najtočnije kod neravnomjerno sortiranog stupca, ali na nekoliko milijuna redaka prozor se zamrzne na nekoliko sekundi svaki put kad odabereš tip datuma."
cloud_download_concurrency = "Koliko objekata iz oblaka spajanje preuzima istovremeno. Zadano 8, minimalno 1. Preuzimanje iz spremišta objekata uglavnom znači čekanje na odziv, a ne prijenos bajtova, pa preuzimanje jednog po jednog ostavlja vezu da miruje između zahtjeva. Osam je otprilike ono što preglednik dopušta po hostu. Povećaj na brzoj vezi s velikim kašnjenjem; smanji na 1 ako davatelj ili proxy počne odbijati zahtjeve. Vrlo velike vrijednosti pokreću toliko niti odjednom i najbrži su put do pogreške o ograničenju broja zahtjeva."
cloud_sidebar_position = "Uz koji rub prozora se priključuje preglednik veza u oblaku. Zadano lijevo. Preglednici uz isti rub dijele jednu ploču."
db_sidebar_position = "Uz koji rub prozora se priključuje preglednik veza s bazama. Zadano lijevo. Preglednici uz isti rub dijele jednu ploču."
sql_format_title = "Kako gumb Oblikuj u SQL ploči raspoređuje upit. Pregled ispod pokazuje rezultat."
sql_format_keywords = "Hoće li ključne riječi poput SELECT i FROM biti velikim slovima, malim ili kako si ih upisao."
sql_format_indent = "Što je jedna razina uvlake: 2 razmaka, 4 razmaka ili tabulator."
sql_format_commas = "Gdje ide zarez između dvije stavke popisa. Na početku sljedećeg retka zarez koji nedostaje odmah upada u oči."
sql_format_joins = "Svaki JOIN počinje u novom retku na razini FROM, umjesto uvučen ispod njega."
sql_format_inline = "Popis kraći od toliko znakova ostaje u jednom retku, npr. SELECT a, b, c. Uz 0 svaka stavka dobiva svoj redak."
sql_format_blank_lines = "Koliko praznih redaka razdvaja dvije naredbe."
sql_format_one_line = "Samo sređuje razmake i veličinu slova ključnih riječi i stavlja svaku naredbu u jedan redak. Zgodno za lijepljenje u log ili program."
sql_format_off_one_line = "Isključeno dok je uključeno Cijeli upit u jednom retku: nema prijeloma redaka za raspoređivanje."
sql_format_clause_width = "Klauzula kraća od toliko znakova ostaje u retku svoje ključne riječi, kao GROUP BY c.name, a kratki podupit ostaje u svojim zagradama. Počinje od širine popisa."
sql_format_clause_needs_list = "Najprije postavi širinu popisa iznad 0. Samo ovo ostavilo bi stavke klauzule bez uvlake."
sql_format_bracket_width = "Zagrade kraće od toliko znakova ostaju u jednom retku, kao coalesce(a, 0) ili IN (1, 2, 3). U duljima je svaka stavka u svom retku."
sql_format_semicolon = "Dodaje ; iza zadnje naredbe ako ga nema."
sql_format_preview = "Primjer upita raspoređen prema postavkama iznad. Mijenja se dok ih mijenjaš."
restore_session = "Pri pokretanju Octa ponovno otvara datoteke koje su bile otvorene kad si ga zatvorio. Zadano isključeno. Datoteke kojih više nema se preskaču."
restore_session_cloud = "Ponovno otvara i objekte u oblaku. Oprez: svaki se pri svakom pokretanju ponovno preuzima, što traje i može koštati za prijenos podataka."
restore_session_connections = "Ponovno otvara i tablice iz veza s bazama podataka i API krajnjih točaka. Oprez: svaka pri svakom pokretanju šalje upit svom poslužitelju. Kod skladišta podataka to ga može probuditi i koštati, a istekla prijava traži da se ponovno prijaviš."
restore_session_needs_main = "Najprije uključi Ponovno otvori zadnju sesiju."

