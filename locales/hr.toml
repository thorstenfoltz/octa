verdict_benford_conforms = "Prve znamenke stoje blizu onoga što Benfordov zakon očekuje, kako to obično rade mjerene ili nakupljene veličine. Ne dokazuje ništa: stupac se može uklapati i svejedno biti kriv."
verdict_benford_acceptable = "Malo pokraj očekivanih udjela, unutar raspona u kojem se pravi podaci šeću. Nema se što raditi."
verdict_benford_marginal = "Dovoljno pokraj za drugi pogled, ali još nije nalaz. Pogledaj kako stupac nastaje prije nego što iz njega nešto iščitaš."
verdict_benford_nonconforming = "Prve znamenke ne izgledaju kao mjerene veličine. Razlog da gledaš dalje, ali sam po sebi nikad nalaz: zaokruženi, odrezani ili rukom utipkani brojevi završe ovdje posve nevino."
verdict_benford_not_numbers = "Nije provjereno: stupac ne sadrži brojeve, a zakon govori o prvoj znamenki broja."
verdict_benford_too_few = "Nije provjereno: ispod 300 upotrebljivih vrijednosti, gdje su udjeli znamenki šum a ne razdioba."
verdict_benford_narrow = "Nije provjereno: vrijednosti stanu u manje od deseterostrukog raspona. Postotak, dob ili ocjena nemaju razloga slijediti zakon, pa bi rezultat samo zavaravao."
verdict_benford_ids = "Nije provjereno: gusti cijeli brojevi, svi različiti, dakle dodijeljen niz (broj retka, broj računa, identifikator). Takvo se što dodjeljuje, ne mjeri."
verdict_calendar_complete = "Svaki korak niza je tu, od prvog vremenskog žiga do zadnjeg. Nema rupa za objašnjavanje."
verdict_calendar_weekdays = "Jedine rupe su preskočeni vikendi, a poslovni podaci to rade namjerno. Broji se kao potpuno, i ti vikendi ne stoje u kartici rupa."
verdict_calendar_dst = "Jedina rupa ima oblik pomicanja sata: jedan korak, u nedjelju, u sitne sate. Vremenski žigovi u Octi ne nose vremensku zonu, pa se ovdje čita oblik a ne zna. Provjeri ako je nizu važan sat."
verdict_calendar_gaps = "Vrijeme koje bi trebalo imati retke a nema ih. Kartica Rupe u kalendaru navodi svaku rupu s vremenskim žigovima s obje strane."
verdict_calendar_not_dates = "Nije provjereno: stupac ne sadrži datume ni vremenske žigove."
verdict_calendar_too_few = "Nije provjereno: manje od tri različita vremenska žiga, to još nije niz."
verdict_calendar_irregular = "Nije provjereno: nijedan korak ne pokriva 60% razmaka, dakle nema ritma u kojem bi se tražile rupe. Tako se čitaju dnevnici događaja."
verdict_shape_consistent = "Svaka vrijednost ima isti oblik, na primjer svaki poštanski broj je A-99999."
verdict_shape_mixed = "Gotovo svaka vrijednost ima jedan oblik, nekoliko nema. To su često tipfeleri ili drugi format; kartica Mješoviti oblici ih navodi."
verdict_shape_na = "Nije provjereno: stupac je prazan, nije tekst, ili ima previše oblika da bi se odlučilo (slobodan tekst, ili nekoliko formata namjerno)."

