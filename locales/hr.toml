offer_repair = "Kada se CSV/TSV čita ali izgleda neispravno (loše\nkodiranje, početni BOM, kontrolni znakovi, razdjelnik\nkoji se ne slaže s ekstenzijom, ili vrlo neravni retci),\nprikaži upit s ponudom za popravak i ponovno učitavanje.\nIsključeno zadano; popravak se izvršava samo\nako ga potvrdite."
readonly_notice = "Prikaži modalni dijalog potvrde svaki put kada se prebaci\nnačin samo za čitanje (preko F8 ili izbornika Prikaz). Isključi da\nprebacuješ stanje bez poruke."
notebook_output = "Pozicija izlaza koda u Jupyter Notebook prikazu\n(primjenjuje se samo na .ipynb datoteke u Notebook načinu)"
sql_open_default = "Pri otvaranju tablične datoteke, automatski prikaži\nSQL uređivač pokraj tabličnog prikaza."
sql_panel_position = "Gdje se SQL uređivač priključuje u odnosu na tablicu"
sql_row_limit = "LIMIT korišten u upitu-rezerviranju pri otvaranju kartice\n(npr. 100 -> SELECT * FROM data LIMIT 100).\nUnesite broj - primjenjuje se pri Primijeni."
autocomplete = "Ponudi prijedloge SQL ključnih riječi i naziva stupaca\nispod SQL uređivača."
editor_font = "Izgled fonta koji koristi SQL uređivač i njegova traka\ns brojevima redaka. JetBrains Mono dolazi uz Octa.\n\nNapomena: programske ligature se ne primjenjuju - egui\ntekst renderer još ne obrađuje OpenType GSUB zamjene."
sql_diff_highlight = "Nakon INSERT/UPDATE/DELETE upita nakratko istakni promijenjene celije i retke."
sql_diff_secs = "Koliko dugo isticanje SQL promjena ostaje prije nego sto nestane."
mcp_intro = "Zadane vrijednosti za MCP poslužitelj (`octa --mcp`). Poslužitelj ih čita jednom pri pokretanju; promjena dok poslužitelj radi zahtijeva ponovno pokretanje `octa --mcp`."
mcp_row_limit = "Maksimalan broj redaka koje vraćaju `read_table` / `run_sql` kada pozivatelj izostavi `limit`. Shema alata oglašava ovu zadanu vrijednost modelu da može tražiti više (ili neograničeno) po potrebi.\n\nZadano: 1,000. Postavljanje visoko - ili označavanje Neograničeno - može progurati vrlo velike odgovore kroz stdio i usporiti MCP klijenta."
cell_byte_cap = "Ograničenje veličine ćelije na žici. Ćelije čiji tekstualni oblik prelazi ovo zamjenjuju se oznakom `[truncated: ...]`, a odgovor označava `cell_truncated: true`. Postavite 0 da onemogućite ograničenje.\n\nZadano: 65,536 (64 KiB)."
chat_intro = "Ugrađeni AI asistent koji upravlja Octa alatima nad tvojim otvorenim karticama i datotekama. Odaberi pružatelja i postavite njegov API ključ (ili pokrenite Ollama lokalno), zatim otvorite ploču iz alatne trake (izbornik Analiza, Asistent)."
chat_max_iterations = "Maksimalan broj krugova poziva alata koje asistent može izvršiti unutar jedne poruke prije nego što mora stati. Zaštita od odbjeglih petlji alata."
chat_max_tokens = "Ograničenje duljine odgovora (u tokenima) traženog po odgovoru. Neograničeno dopušta modelu da koristi vlastiti maksimum (Anthropic uvijek treba ograničenje, pa tamo koristi visoku vrijednost)."
chat_provider = "S kojim LLM pozadinskim sustavom asistent razgovara. Svaki pružatelj treba vlastiti API ključ, osim Ollama koji radi lokalno."
chat_model = "Model korišten za ovog pružatelja. Odaberite predložak ili unesite naziv modela."
chat_ollama_url = "Korijenski URL tvog lokalnog Ollama poslužitelja. API putanje Octa dodaje sama."
chat_position = "Gdje se ploča razgovora priključuje u odnosu na tablicu."
chat_export_dir = "Mapa u koju asistent zapisuje izvezene datoteke (novi CSV, grafikoni) kada ne date punu putanju."
chat_audit_log = "Dodaje svaki poziv alata asistenta u zapisnik u direktoriju konfiguracije (chat_audit/). Zadano iskljuceno."
chat_render_markdown = "Uključeno: naslovi, popisi, tablice, blokovi koda i poveznice u odgovorima crtaju se formatirano. Isključeno: vidiš sirovi Markdown izvor. Tvoje poruke se nikad ne preoblikuju."
chat_audit_warn = "Prikazi upozorenje pri pokretanju kada zapisi premase ovu velicinu."
chat_api_key = "Tvoj API ključ za ovog pružatelja. Pohranjuje se u privjesak ključeva OS-a kada je dostupan, inače u običnom tekstu u settings.toml."
map_intro = "Zadane vrijednosti za prikaz Karta (koriste GeoJSON datoteke). Aktivna kartica može prebacivati između Pločica i Samo geometrije preko alatne trake Karte."
map_default_mode = "Pločice: dohvati kliznu kartu s konfiguriranog URL-a pločica.\nSamo geometrija: crtaj samo objekte na praznom platnu."
map_fallback = "Kada dohvaćanje pločica ne uspije (izvan mreže, blokirano), automatski prebaci na crtanje samo geometrije za tu karticu."
tile_url = "URL predložak za rasterske pločice. `{z}/{x}/{y}` se zamjenjuju razinom zumiranja i koordinatama pločice. Zadano pokazuje na OSM poslužitelj pločica - za produkciju / intenzivnu uporabu usmjerite na samostalno hostani ili komercijalni pružatelj."
sidebar_position = "Na kojoj je strani priključeno stablo direktorija kada\nse mapa otvori preko Datoteka > Otvori mapu."
shortcuts_intro = "Kliknite „Snimaj“ pa pritisnite kombinaciju tipki (s Ctrl / Shift / Alt).\nPritisnite Esc za otkazivanje snimanja. „Očisti“ ostavlja radnju nepovezanom."
initial_load_cap = "Maksimalan broj redaka učitanih u tablicu pri prvom otvaranju za\nstreaming formate (Parquet, CSV, TSV). Preostali retci\nse učitavaju u pozadini dok pomičete.\n\nZadano: 5,000,000. Povećanje poboljšava potpunost\nprvog iscrtavanja ali koristi više memorije. Smanjenje čini\npočetno otvaranje bržim ali prebacuje više posla na\npozadinski učitavač. Označite „Neograničeno“ da onemogućite\nograničenje u potpunosti i učitate svaki redak odmah.\n\nUnesite broj - primjenjuje se pri Primijeni."
db_page_rows = "Redaka po zahtjevu kad otvoriš tablicu preko žive veze na bazu podataka.\n\nZadano: 100,000. To je veličina stranice, a ne strop: sljedeća stranica se učitava u pozadini dok skrolaš, isto kao kod velike Parquet datoteke.\n\nZasebna je postavka jer gornje ograničenje mjeri čitanje lokalne datoteke, dok ovdje mrežom putuju megabajti JSON-a. Smanji ga ako ti se otvaranje tablice čini sporim.\n\nUnesite broj - primjenjuje se pri Primijeni."
raw_view_cap = "Najveća veličina datoteke (u MB) koju Octa u cijelosti učitava u uređivač\nsirovog prikaza. Ograničava i sirovi zamjenski prikaz pri pogrešci\nraščlanjivanja te sirovu stranu prikaza usporedbe. Veće datoteke preskaču\nsirovi tekst radi zaštite memorije.\n\nZadano: 500 MB. Označite \"Neograničeno\" za učitavanje svake\ndatoteke bez obzira na veličinu. Primjenjuje se pri potvrdi."
decompress_cap = "Najveća raspakirana veličina (u MB) za prozirno otvorene\n.gz / .zst datoteke. Sitna sažeta datoteka može se golemo napuhati\n(bomba raspakiranja); iznad ovog ograničenja otvaranje se odbija.\n\nZadano: 4.295 MB (4 GB). Primjenjuje se pri potvrdi."
decompress_unlimited = "Potpuno ukloni ograničenje veličine raspakiranja. Označite ovo\nsamo za arhive kojima vjerujete."
raw_view_unlimited = "Učitaj cijeli tekst bilo koje datoteke u sirovi prikaz, bez\nograničenja veličine. Koristite samo uz višak RAM-a - datoteka od\nviše GB u cijelosti se učitava u memoriju."
initial_load_unlimited = "Učitaj svaki redak u datoteci odmah. Preporučuje se samo\nkada imate viška RAM-a - parquet od 100 M redaka pojede\nnekoliko GB."
syntax_size_cap = "Datoteke veće od ovoga prelaze na obični monospace u\nsirovom uređivaču. Postavite 0 da onemogućite isticanje\nsintakse u potpunosti; postavite vrlo velik broj da odustanete\nod zaštite. JSON/YAML/XML/Markdown/TOML se nikada ne ističu\n- oni koriste svoje namjenske prikaze stablo/pregled.\n\nZadano: 1 MB. Unesite broj, odaberite jedinicu - primjenjuje se pri Primijeni."
open_as_text = "Dodatne ekstenzije datoteka koje se tretiraju kao obični tekst pri\notvaranju (zamjenjuje čitač koji bi ih obično preuzeo).\nOdvojeno zarezom ili razmakom, bez početne točke, malim slovima.\nPrimjer: log4j  myproj  rawdata\n\nPrimjenjuje se pri Primijeni; stupa na snagu za naredna otvaranja datoteka."
folder_union_cap = "Najveći broj datoteka koje spajanje mape u oblaku preuzima i spaja.\nSvaka se datoteka u cijelosti učitava u memoriju, pa mapa s desecima\ntisuća dijelova može iscrpiti RAM. Datoteke iznad ograničenja se\npreskaču i broje u traci stanja.\n\nZadano: 500. Primjenjuje se na Primijeni."
folder_union_unlimited = "Spoji sve datoteke u mapi, koliko god ih bilo. Označite samo ako\nimate dovoljno memorije."
multi_search_cap = "Ograničenje veličine datoteke za opseg direktorija ploče Višestruko pretraživanje.\nDatoteke veće od ovoga se preskaču i navode u oznaci\npreskočenih datoteka. Označite \"Neograničeno\" za potpuno uklanjanje ograničenja.\n\nZadano: 50 MB."
multi_search_unlimited = "Pretražuje svaku datoteku u direktoriju bez obzira na veličinu.\nOgroman zapisnik ili dump može zaglaviti pretragu i pojesti memoriju."
chart_max_points = "Maksimalan broj redaka koje kartica Grafikon crta prije nego što se\nuključi ravnomjerno prorjeđivanje (Histogram, Linija, Raspršeni). Trakasti grafikoni\nuvijek agregiraju cijeli ulaz; Kutijasti računaju\n5-brojni sažetak nad cijelim ulazom. Postavite 0 da onemogućite\nprorjeđivanje - sigurno samo za umjereno velike tablice.\n\nZadano: 100,000. Numerički unos prihvaća razdjelnike-zareze."
chart_max_categories = "Maksimalan broj različitih X kategorija koje trakasti grafikon prihvaća prije nego\nšto odbije crtati. Iznad toga renderer prikazuje pogrešku\numjesto da napravi nečitljiv zid traka - prvo filtrirajte ili\nagregirajte tablicu.\n\nZadano: 200. Numerički unos prihvaća razdjelnike-zareze."
tables_in_picker = "Koliko redaka tablica dijalog za odabir višetabličnih izvora (SQLite,\nDuckDB, ...) treba uklopiti okomito pri zadanoj veličini. Dijalog\nse i dalje može mijenjati po veličini - povucite kut da ga napravite\nvećim kada baza podataka ima mnogo tablica.\n\nZadano: 10. Minimum 1."
excel_auto_open = "Koliko listova višelistne Excel radne knjige otvoriti\nautomatski (svaki u svojoj kartici). Radne knjige s više\nlistova od ovoga prikazuju birač da odaberete koje otvoriti\n(i dalje možete odabrati više od ovog broja, ili sve).\n\nZadano: 5. Minimum 1."
max_recent = "Broj nedavno otvaranih datoteka prikazanih u izborniku Datoteka"
start_maximised = "Kada je uključeno, prozor se pokreće maksimiziran, a veličina ispod\nse koristi kao veličina vraćanja iz maksimiziranja.\nKada je isključeno, prozor se pokreće odabranom veličinom."
initial_window_size = "Veličina prozora pri pokretanju (kada je „Pokreni maksimizirano“ isključeno),\nili veličina vraćanja iz maksimiziranja kada je uključeno."
ctrl_close = "Zatvori"
ctrl_restore = "Vrati"
ctrl_full_size = "Puna veličina"
ctrl_minimise = "Minimiziraj"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Štiti tvoje datoteke od spremanja iz sučelja i od zadane postavke MCP poslužitelja.\nKada je uključeno, dodavanje ili uklanjanje stupaca u SQLite, DuckDB ili GeoPackage\ndatoteci odbija se pri spremanju. Pomoćnikom se upravlja po profilu razgovora\n(prekidač Dopusti pisanje u profilu), a ne ovom postavkom."
confirm_db_write_back = "Prije nego što izmjene odu u bazu koja radi, Octa pokazuje što bi se promijenilo i pita.\nIsključi ovo da Spremi odmah primijeni razlike; u oba slučaja to je jedna transakcija,\na neuspio upis se poništava."
confirm_url_redirects = "Kada te web adresa pošalje na drugu, pitaj prije nego se datoteka otvori odande. Ta potvrda je jedino mjesto gdje se ta promjena vidi."
backup_before_modify = "Prije nego pomoćnik ili spremanje baze koje mijenja shemu prepiše\ndatoteku, najprije je kopiraj u .bak datoteku s vremenskom oznakom pokraj nje.\nUobičajena ručna spremanja ne kopiraju se."
chat_profiles = "Svaki profil je jedna spremljena postava: pružatelj, model, temperatura i neobavezan proračun razmišljanja, pod nazivom koji odaberete. Napravite ih koliko želite, uključujući više njih za istog pružatelja, i prebacujte se između njih iz ploče pomoćnika."
chat_profile_base_url = "Krajnja točka za ovaj profil. Ostavite prazno za adresu Ollama poslužitelja postavljenu ispod."
write_options = "Zadane vrijednosti kad Octa zapisuje datoteku. Spremi kao i skupna pretvorba polaze od njih i mogu ih promijeniti za jedno izvođenje."
status_message_secs = "Koliko dugo statusna poruka ostaje na zaslonu prije nego nestane.\nIsto trajanje vrijedi za svaku poruku, uspjeh i pogrešku.\n\nAko prijeđeš mišem preko nje, odbrojavanje se pauzira - pogreška\nkoju čitaš ili kopiraš ostaje na mjestu. Svaka poruka ima i 'x'\nza trenutno zatvaranje.\n\nNe može se isključiti; ispod 3 vrijedi 3. Zadano: 10."
chat_tools = "Koje alate pomoćnik smije koristiti. Grupa core ide uz svaku poruku; ostale grupe mu se samo imenuju, a jednu učita kad je posao traži. Isključen alat nestaje svugdje: ne šalje se, ne nudi se i odbija se ako ga pomoćnik ipak pozove."
chat_tools_enable_all = "Ponovno uključi sve alate. Uz svaku poruku ide samo grupa core, pa ostalo ne košta ništa dok pomoćnik za to ne zatraži."
chat_tools_budget = "Otprilike koliko tokena opisi alata dodaju poruci. Izračunato iz njihove veličine, pa čitaj kao smjernicu, a ne kao račun."

