section_missingness_intro = "Kolom yang kosong di baris yang sama. Empat kolom yang masing-masing 8% kosong adalah masalah berbeda tergantung apakah setiap kali itu 8% baris yang sama (satu gabungan rusak, satu tempat untuk diperbaiki) atau empat 8% yang tak berhubungan. Setiap baris di sini adalah satu kelompok seperti itu, yang terbesar lebih dulu."
section_calendar_intro = "Lubang di kolom tanggal atau cap waktu: bagian tempat rangkaian melompat alih-alih melangkah. Akhir pekan yang hilang dan pergantian waktu musim panas tidak dihitung, jadi yang terdaftar benar-benar hari, jam, atau bulan yang hilang."
hint_miss_columns = "Kolom yang kosong bersamaan di baris-baris itu."
hint_miss_column_count = "Berapa banyak kolomnya."
hint_miss_rows = "Berapa baris yang persis punya kumpulan kolom ini dalam keadaan kosong."
hint_miss_share_percent = "Baris-baris itu sebagai persentase dari seluruh tabel."
hint_gap_column = "Kolom tanggal atau cap waktu tempat lubangnya berada."
hint_gap_after = "Nilai terakhir sebelum lubang."
hint_gap_before = "Nilai pertama sesudahnya."
hint_gap_missing_steps = "Berapa langkah rangkaian yang hilang di antaranya, dihitung dalam irama kolom itu sendiri (hari, jam, bulan)."
hint_gap_kind = "Lubang macam apa: celah biasa, atau rentang yang cukup panjang sehingga tampak seperti berhenti, bukan tersandung."
overall_explained = "Rata-rata nilai per kolom dalam laporan. Arahkan tetikus ke judul kolom score untuk melihat bagaimana satu nilai dihitung."
verdict_benford_conforms = "Digit pertamanya dekat dengan yang diharapkan hukum Benford, seperti biasanya angka hasil pengukuran atau penjumlahan. Bukan bukti apa-apa: sebuah kolom bisa cocok dan tetap salah."
verdict_benford_acceptable = "Sedikit meleset dari proporsi yang diharapkan, masih dalam rentang data nyata bergoyang. Tidak ada yang perlu dikerjakan."
verdict_benford_marginal = "Cukup meleset untuk dilihat kedua kali, tapi belum jadi temuan. Lihat dulu bagaimana kolom ini dihasilkan sebelum membaca apa pun darinya."
verdict_benford_nonconforming = "Digit pertamanya tidak seperti besaran yang diukur. Alasan untuk menelusuri lebih jauh, tidak pernah jadi temuan dengan sendirinya: angka yang dibulatkan, dipotong di batas atas, atau diketik tangan semua mendarat di sini tanpa salah apa pun."
verdict_benford_not_numbers = "Tidak diuji: kolomnya tidak berisi angka, sedangkan hukumnya soal digit pertama sebuah angka."
verdict_benford_too_few = "Tidak diuji: kurang dari 300 nilai yang terpakai, di mana proporsi digit adalah derau, bukan sebaran."
verdict_benford_narrow = "Tidak diuji: nilainya membentang kurang dari sepuluh kali lipat. Persentase, usia atau nilai rapor tidak punya alasan mengikuti hukum itu, jadi sebuah putusan hanya akan menyesatkan."
verdict_benford_ids = "Tidak diuji: bilangan bulat yang rapat dan semuanya berbeda, jadi ini deret yang diberikan (nomor baris, nomor faktur, id). Yang begitu dibagikan, bukan diukur."
verdict_calendar_complete = "Setiap langkah deret ada, dari stempel waktu pertama sampai terakhir. Tidak ada lubang untuk dijelaskan."
verdict_calendar_weekdays = "Satu-satunya lubang adalah akhir pekan yang dilewati, dan data bisnis memang sengaja begitu. Dihitung lengkap, dan akhir pekan itu tidak masuk tab lubang."
verdict_calendar_dst = "Satu-satunya lubang berbentuk pergantian jam: satu langkah, di hari Minggu, dini hari. Stempel waktu Octa tidak membawa zona waktu, jadi ini membaca bentuknya, bukan mengetahuinya. Periksa kalau jam penting untuk deret ini."
verdict_calendar_gaps = "Waktu yang seharusnya punya baris tapi tidak. Tab Lubang kalender mendaftar setiap lubang dengan stempel waktu di kedua sisinya."
verdict_calendar_not_dates = "Tidak diuji: kolomnya tidak berisi tanggal atau stempel waktu."
verdict_calendar_too_few = "Tidak diuji: kurang dari tiga stempel waktu berbeda, itu belum sebuah deret."
verdict_calendar_irregular = "Tidak diuji: tidak ada satu langkah pun yang mencakup 60% jarak antar titik, jadi tidak ada irama untuk mencari lubang. Log kejadian terbaca begitu."

