[distcmp]
title = "Bandingkan distribusi"
intro = "Menanyakan apakah dua kolom angka atau kategori tersebar dengan cara yang sama: bukan apakah rata-ratanya bertemu, melainkan apakah seluruh bentuknya bertemu. Harga tahun lalu melawan tahun ini, waktu tanggap satu wilayah melawan wilayah lain. Octa memilih ujinya dari datanya (Kolmogorov-Smirnov untuk angka, khi kuadrat untuk kategori) dan menjawab dalam satu kalimat, dengan statistiknya di bawah."
menu = "Bandingkan distribusi..."
