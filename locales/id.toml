initial_load_cap = "Maksimum baris yang dimuat ke tabel saat pertama dibuka untuk\nformat streaming (Parquet, CSV, TSV). Baris sisanya\nmengalir di latar saat Anda menggulir.\n\nBawaan: 5.000.000. Menaikkannya memperbaiki kelengkapan\ncat-pertama tetapi memakai lebih banyak memori. Menurunkannya membuat\npembukaan awal lebih cepat tetapi mendorong lebih banyak kerja ke\npemuat latar. Centang \"Tak terbatas\" untuk menonaktifkan\nbatas sepenuhnya dan memuat setiap baris di awal.\n\nKetik angka - diterapkan saat Terapkan."
db_page_rows = "Baris per permintaan saat kamu membuka tabel dari koneksi database langsung.\n\nDefault: 100,000. Ini ukuran halaman, bukan batas atas: halaman berikutnya dimuat di latar belakang saat kamu menggulir, sama seperti file Parquet besar.\n\nSetelan terpisah karena batas di atas mengukur pembacaan file lokal, sedangkan di sini ada megabyte JSON yang lewat jaringan. Turunkan kalau membuka tabel terasa lambat.\n\nKetik angka - diterapkan saat Terapkan."
raw_view_cap = "Ukuran berkas maksimum (dalam MB) yang dibaca Octa sepenuhnya\nke penyunting tampilan Mentah. Juga membatasi cadangan teks\nmentah saat gagal diurai dan sisi mentah pada tampilan\nBandingkan. Berkas lebih besar melewati teks mentah demi\nmenjaga memori.\n\nBawaan: 500 MB. Centang Tanpa batas untuk memuat berkas apa pun\ntanpa memandang ukuran. Berlaku setelah Terapkan."
decompress_cap = "Ukuran maksimum setelah dekompresi (dalam MB) untuk berkas\n.gz / .zst yang dibuka secara transparan. Berkas terkompresi\nyang mungil bisa mengembang sangat besar (bom dekompresi);\ndi atas batas ini pembukaan ditolak.\n\nBawaan: 4.295 MB (4 GB). Berlaku setelah Terapkan."
decompress_unlimited = "Hilangkan batas ukuran dekompresi sepenuhnya. Centang ini hanya\nuntuk arsip yang Anda percayai."
raw_view_unlimited = "Baca seluruh teks berkas apa pun ke tampilan Mentah, tanpa\nbatas ukuran. Pakai hanya bila RAM berlimpah, berkas beberapa\nGB dibaca seluruhnya ke memori."
initial_load_unlimited = "Muat setiap baris dalam berkas di awal. Disarankan hanya\nsaat Anda punya RAM lebih - parquet 100 juta baris memakan\nbeberapa GB."
syntax_size_cap = "Berkas lebih besar dari ini beralih ke monospace polos di\neditor mentah. Setel ke 0 untuk menonaktifkan penyorotan sintaks\nsepenuhnya; setel angka sangat besar untuk melewati\npenjaga. JSON/YAML/XML/Markdown/TOML tidak pernah disorot\n- mereka memakai tampilan pohon/pratinjau khusus.\n\nBawaan: 1 MB. Ketik angka, pilih satuan - diterapkan saat Terapkan."
open_as_text = "Ekstensi berkas tambahan yang diperlakukan sebagai teks biasa saat dibuka\n(menimpa pembaca mana pun yang biasanya mengklaimnya).\nDipisah koma atau spasi, tanpa titik awal, huruf kecil.\nContoh: log4j  myproj  rawdata\n\nDiterapkan saat Terapkan; berlaku untuk pembukaan berkas berikutnya."
folder_union_cap = "Jumlah maksimum berkas yang diunduh dan digabungkan oleh\npenggabungan folder di cloud. Setiap berkas dibaca penuh ke memori,\nsehingga folder dengan puluhan ribu bagian dapat menghabiskan RAM.\nBerkas di atas batas dilewati dan dihitung di bilah status.\n\nBawaan: 500. Diterapkan saat Terapkan."
folder_union_unlimited = "Gabungkan semua berkas dalam folder, berapa pun jumlahnya.\nCentang hanya jika RAM Anda berlimpah."
multi_search_cap = "Batas ukuran per-berkas untuk lingkup direktori panel\nPencarian-ganda. Berkas lebih besar dari ini dilewati dan didaftar di\nchip berkas-dilewati. Centang \"Tak terbatas\" untuk menghapus batas sepenuhnya.\n\nBawaan: 50 MB."
multi_search_unlimited = "Pindai setiap berkas di direktori berapa pun ukurannya. Log atau\ndump yang sangat besar dapat memacetkan pemindaian dan menghabiskan memori."
chart_max_points = "Maksimum baris yang akan diplot tab Grafik sebelum downsampling\nberjarak-rata aktif (Histogram, Garis, Sebar). Grafik Batang\nselalu mengagregasi seluruh masukan; plot Kotak menghitung\nringkasan 5-angka atas seluruh masukan. Setel ke 0 untuk menonaktifkan\nsampling - hanya aman untuk tabel berukuran sedang.\n\nBawaan: 100.000. Masukan numerik menerima pemisah koma."
chart_max_categories = "Maksimum kategori X berbeda yang diterima grafik Batang sebelum\nmenolak menggambar. Di atas ini perender memunculkan galat\nalih-alih menghasilkan dinding batang tak terbaca - saring atau\nagregasikan tabel dahulu.\n\nBawaan: 200. Masukan numerik menerima pemisah koma."
tables_in_picker = "Berapa banyak baris tabel yang harus muat secara vertikal pada dialog\npemilih multi-tabel (SQLite, DuckDB, ...) di ukuran bawaannya.\nDialog tetap bisa diubah ukurannya - seret sudut untuk\nmemperbesarnya saat basis data punya banyak tabel.\n\nBawaan: 10. Minimum 1."
excel_auto_open = "Berapa banyak lembar buku kerja Excel multi-lembar dibuka\notomatis (masing-masing di tabnya). Buku kerja dengan lebih\nbanyak lembar dari ini menampilkan pemilih agar Anda memilih mana yang dibuka\n(Anda tetap bisa memilih lebih dari jumlah ini, atau semua).\n\nBawaan: 5. Minimum 1."
max_recent = "Jumlah berkas yang baru dibuka ditampilkan di menu Berkas"
start_maximised = "Saat aktif, jendela dimulai termaksimalkan dan ukuran di bawah\ndipakai sebagai ukuran pulih-dari-maksimal.\nSaat mati, jendela dimulai pada ukuran yang dipilih."
initial_window_size = "Ukuran jendela saat mulai (ketika \"Mulai termaksimalkan\" mati),\natau ukuran pulih-dari-maksimal saat aktif."
ctrl_close = "Tutup"
ctrl_restore = "Pulihkan"
ctrl_full_size = "Ukuran penuh"
ctrl_minimise = "Minimalkan"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Melindungi berkas Anda dari penyimpanan lewat antarmuka dan dari\nbawaan server MCP. Saat aktif, menambah atau menghapus kolom pada\nberkas SQLite, DuckDB, atau GeoPackage ditolak saat menyimpan. Asisten\ndiatur per profil obrolan (sakelar Izinkan penulisan pada profil),\nbukan oleh pengaturan ini."
confirm_db_write_back = "Sebelum perubahan masuk ke basis data yang berjalan, Octa menampilkan apa yang akan berubah dan bertanya.\nMatikan ini agar Simpan langsung menerapkannya; keduanya tetap satu transaksi,\ndan penulisan yang gagal dibatalkan seluruhnya."
confirm_url_redirects = "Saat alamat web mengalihkanmu ke alamat lain, tanya dulu sebelum berkas dibuka dari sana. Konfirmasi itu satu-satunya tempat perubahan ini terlihat."
backup_before_modify = "Sebelum asisten atau penyimpanan basis data yang mengubah skema\nmenimpa sebuah berkas, salin dulu berkas itu menjadi berkas .bak\nbercap waktu di sebelahnya. Penyimpanan manual biasa tidak dicadangkan."
chat_profiles = "Setiap profil adalah satu setelan tersimpan: penyedia, model, temperatur, dan anggaran berpikir opsional, dengan nama pilihan Anda. Buat sebanyak yang Anda mau, termasuk beberapa untuk penyedia yang sama, lalu berpindah di antaranya dari panel asisten."
chat_profile_base_url = "Endpoint untuk profil ini. Kosongkan untuk memakai alamat server Ollama yang diatur di bawah."
write_options = "Nilai bawaan saat Octa menulis berkas. Simpan sebagai dan konversi massal bermula dari sini dan dapat menimpanya untuk satu proses."
status_message_secs = "Berapa lama pesan status bertahan di layar sebelum hilang.\nDurasi yang sama berlaku untuk setiap pesan, baik berhasil\nmaupun gagal.\n\nMengarahkan tetikus ke pesan menjeda hitung mundur, jadi galat\nyang sedang kamu baca atau salin tetap di tempat. Setiap pesan\njuga punya 'x' untuk menutupnya langsung.\n\nTidak bisa dimatikan; di bawah 3 dianggap 3. Bawaan: 10."
chat_tools = "Alat mana yang boleh dipakai asisten. Grup core ikut di setiap pesan; grup lain hanya disebut namanya, dan asisten memuat satu ketika pekerjaannya butuh. Alat yang dimatikan hilang di mana-mana: tidak dikirim, tidak ditawarkan, dan ditolak kalau asisten tetap memanggilnya."
chat_tools_enable_all = "Nyalakan lagi semua alat. Hanya grup core yang ikut setiap pesan, jadi sisanya tidak memakan apa pun sampai asisten memintanya."
chat_tools_budget = "Kira-kira berapa token yang ditambahkan deskripsi alat ke sebuah pesan. Dihitung dari ukurannya, jadi baca sebagai ancar-ancar, bukan tagihan."

