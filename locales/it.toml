hint_calendar_verdict = "Se una colonna di tempo scorre senza buchi: complete, weekdays only, complete (clock change) o gaps. Weekend e cambi d'ora non contano come mancanti. Una colonna che non è una serie dice perché non è stata testata. Passa sopra un verdetto per vedere cosa significa; i buchi stanno in una scheda a parte."
hint_score = "Il voto di questa colonna su 100, ricavato da tre delle colonne a sinistra: 40% per quanto è piena, 40% per quanti valori corrispondono al tipo dichiarato e 20% per quanto sono vari i valori. I valori anomali numerici tolgono fino a 10 punti. Non dice nulla su quanto i valori siano giusti, solo su quanto sono ben formati."
