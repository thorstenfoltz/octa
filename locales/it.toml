overall_explained = "La media dei voti per colonna del rapporto. Passa sopra l'intestazione della colonna score per vedere come nasce un singolo voto."
verdict_benford_conforms = "Le prime cifre stanno vicine a quello che si aspetta la legge di Benford, come fanno di solito le grandezze misurate o accumulate. Non prova niente: una colonna può essere conforme e sbagliata lo stesso."
verdict_benford_acceptable = "Un po' fuori dalle quote attese, dentro il margine in cui i dati veri si muovono. Niente da fare."
verdict_benford_marginal = "Abbastanza fuori da meritare una seconda occhiata, non abbastanza da essere un risultato. Guarda come nasce la colonna prima di leggerci dentro qualcosa."
verdict_benford_nonconforming = "Le prime cifre non sembrano quantità misurate. Un motivo per guardare oltre, mai un risultato di per sé: cifre arrotondate, tagliate o battute a mano finiscono tutte qui in tutta innocenza."
verdict_benford_not_numbers = "Non testata: la colonna non contiene numeri, e la legge parla della prima cifra di un numero."
verdict_benford_too_few = "Non testata: meno di 300 valori utilizzabili, dove le quote delle cifre sono rumore e non una distribuzione."
verdict_benford_narrow = "Non testata: i valori coprono meno di un fattore dieci. Una percentuale, un'età o un voto non hanno motivo di seguire la legge, quindi un verdetto sarebbe solo fuorviante."
verdict_benford_ids = "Non testata: interi fitti e tutti diversi, quindi una sequenza assegnata (un numero di riga, un numero di fattura, un id). Roba che si assegna, non che si misura."
verdict_calendar_complete = "Ogni passo della serie c'è, dal primo timestamp all'ultimo. Nessun buco da spiegare."
verdict_calendar_weekdays = "Gli unici buchi sono weekend saltati, che è quello che i dati aziendali fanno apposta. Conta come completo, e quei weekend non compaiono nella scheda dei buchi."
verdict_calendar_dst = "L'unico buco ha la forma di un cambio d'ora: un passo, di domenica, nelle prime ore. I timestamp di Octa non portano fuso orario, quindi qui si legge la forma senza saperlo. Verifica se per la serie conta l'ora."
verdict_calendar_gaps = "Tempo che dovrebbe avere righe e non ne ha. La scheda Buchi di calendario elenca ogni buco con i timestamp ai due lati."
verdict_calendar_not_dates = "Non testata: la colonna non contiene date o timestamp."
verdict_calendar_too_few = "Non testata: meno di tre timestamp distinti, non è ancora una serie."
verdict_calendar_irregular = "Non testata: nessun passo copre il 60% degli intervalli, quindi non c'è un ritmo in cui cercare buchi. I log di eventi si leggono così."

