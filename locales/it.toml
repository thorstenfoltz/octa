mcp_intro = "Valori predefiniti per il server MCP (`octa --mcp`). Il server li legge una volta all'avvio; cambiarli con un server in esecuzione richiede il riavvio di `octa --mcp`."
mcp_row_limit = "Numero massimo di righe restituite da `read_table` / `run_sql` quando il chiamante omette `limit`. Lo schema dello strumento comunica questo valore predefinito al modello, così può chiederne di più (o illimitato) quando serve.\n\nPredefinito: 1,000. Impostarlo alto - o spuntare Illimitato - può spingere risposte molto grandi attraverso stdio e rallentare il client MCP."
cell_byte_cap = "Limite di dimensione per cella in trasmissione. Le celle la cui forma testuale supera questo valore vengono sostituite da un marcatore `[truncated: ...]` e la risposta segnala `cell_truncated: true`. Imposta 0 per disabilitare il limite.\n\nPredefinito: 65,536 (64 KiB)."
map_intro = "Valori predefiniti per la vista Mappa (usata dai file GeoJSON). La scheda attiva può passare tra Tessere e solo Geometria dalla barra della Mappa."
chat_intro = "Assistente IA integrato che usa gli strumenti di Octa sulle schede e sui file aperti. Scegli un provider e imposta la sua chiave API (oppure esegui Ollama in locale), quindi apri il pannello dalla barra degli strumenti (menu Analizza, Assistente)."
chat_max_iterations = "Numero massimo di cicli di chiamate agli strumenti che l'assistente puo eseguire in un singolo messaggio prima di doversi fermare. Una protezione contro i cicli incontrollati."
chat_max_tokens = "Limite alla lunghezza della risposta (in token) richiesta per risposta. Illimitato lascia che il modello usi il proprio massimo (Anthropic richiede sempre un limite, quindi usa un valore elevato)."
chat_provider = "Quale backend LLM usa l'assistente. Ogni provider richiede la propria chiave API, tranne Ollama che viene eseguito in locale."
chat_model = "Il modello usato per questo provider. Scegli un preset o digita un nome di modello qualsiasi."
chat_ollama_url = "URL radice del tuo server Ollama locale. Octa aggiunge i percorsi dell'API."
chat_position = "Dove si aggancia il pannello chat rispetto alla tabella."
chat_export_dir = "Cartella in cui l'assistente scrive i file esportati (nuovi CSV, grafici) quando non indichi un percorso completo."
chat_audit_log = "Aggiunge ogni chiamata di strumento dell'assistente a un registro nella cartella di configurazione (chat_audit/). Disattivato per impostazione predefinita."
chat_audit_warn = "Mostra un avviso all'avvio quando i registri superano questa dimensione."
chat_api_key = "La tua chiave API per questo provider. Memorizzata nel portachiavi di sistema se disponibile, altrimenti in chiaro in settings.toml."
map_default_mode = "Tessere: recupera una mappa slippy dall'URL delle tessere configurato.\nSolo geometria: disegna solo le feature su una tela vuota."
map_fallback = "Quando il recupero delle tessere fallisce (offline, bloccato), passare automaticamente al rendering solo geometria per quella scheda."
