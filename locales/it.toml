write_protection = "Protegge i tuoi file dai salvataggi dell'interfaccia e dal comportamento predefinito del server MCP.\nQuando è attiva, aggiungere o rimuovere colonne in un file SQLite, DuckDB o GeoPackage\nviene rifiutato al salvataggio. L'assistente è regolato da ogni profilo di chat\n(l'interruttore Consenti scritture del profilo), non da questa impostazione."
confirm_db_write_back = "Prima che le modifiche arrivino a un database attivo, Octa mostra cosa cambierebbe e chiede conferma.\nDisattivalo per far applicare subito le modifiche a Salva; in entrambi i casi è una sola transazione\ne un errore annulla tutto."
confirm_url_redirects = "Quando un indirizzo web ti porta a un altro, chiedere prima di aprire il file da lì. Quella conferma è l'unico punto in cui il cambio si vede."
backup_before_modify = "Prima che l'assistente o un salvataggio che cambia lo schema del database\nsovrascriva un file, questo viene prima copiato in un file .bak con data e ora accanto.\nI normali salvataggi manuali non vengono copiati."
chat_profiles = "Ogni profilo è una configurazione salvata: un fornitore, un modello, una temperatura e un budget di ragionamento facoltativo, con il nome che scegli. Creane quanti vuoi, anche più dello stesso fornitore, e passa dall'uno all'altro dal pannello dell'assistente."
chat_profile_base_url = "Endpoint di questo profilo. Lascia vuoto per usare l'indirizzo del server Ollama impostato sotto."
write_options = "Valori predefiniti quando Octa scrive un file. Salva con nome e la conversione in blocco partono da questi e possono modificarli per una singola esecuzione."
status_message_secs = "Per quanto tempo un messaggio di stato resta visibile prima\ndi sparire. La stessa durata vale per ogni messaggio, sia di\nsuccesso sia di errore.\n\nPassandoci sopra col mouse il conto alla rovescia si mette in\npausa: un errore che stai leggendo o copiando resta lì. Ogni\nmessaggio ha anche una 'x' per chiuderlo subito.\n\nNon si può disattivare; sotto 3 vale 3. Predefinito: 10."
chat_tools = "Quali strumenti può usare l'assistente. Il gruppo core parte con ogni messaggio; gli altri gruppi gli vengono solo nominati, e ne carica uno quando il lavoro lo richiede. Uno strumento spento sparisce ovunque: non viene inviato, non viene offerto e viene rifiutato se lo chiama lo stesso."
chat_tools_enable_all = "Riaccendi tutti gli strumenti. Solo il gruppo core parte con ogni messaggio, quindi il resto non costa nulla finché l'assistente non lo chiede."
chat_tools_budget = "Più o meno quanti token le descrizioni degli strumenti aggiungono a un messaggio. Calcolato dalla loro dimensione: leggilo come indicazione, non come fattura."

