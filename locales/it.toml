section_missingness_intro = "Colonne che restano vuote nelle stesse righe. Quattro colonne vuote all'8% ciascuna sono un problema diverso a seconda che sia ogni volta lo stesso 8% di righe (una join rotta, un solo punto da riparare) oppure quattro 8% scollegati. Ogni riga qui è uno di questi gruppi, il più grande per primo."
section_calendar_intro = "Buchi in una colonna di data o di orario: i tratti in cui la serie salta invece di procedere a passi. I fine settimana mancanti e il cambio dell'ora legale non contano, quindi quello che vedi elencato è un giorno, un'ora o un mese davvero assente."
