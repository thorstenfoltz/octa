hint_benford_verdict = "Czy pierwsze cyfry kolumny idą za prawem Benforda: conforms, acceptable, marginal albo nonconforming. Większość kolumn w ogóle nie jest badana, a komórka mówi dlaczego. Najedź na wynik, żeby zobaczyć, co znaczy."
hint_calendar_verdict = "Czy kolumna czasu biegnie bez dziur: complete, weekdays only, complete (clock change) albo gaps. Weekendy i zmiany czasu nie liczą się jako brakujące. Kolumna, która nie jest szeregiem, mówi, czemu nie została zbadana. Najedź na wynik, żeby zobaczyć, co znaczy; same dziury są w osobnej karcie."
hint_score = "Ocena tej kolumny od 0 do 100, wyliczona z trzech kolumn po lewej: 40% za to, jak bardzo jest wypełniona, 40% za to, ile wartości pasuje do zadeklarowanego typu, i 20% za różnorodność wartości. Liczbowe wartości odstające zabierają do 10 punktów. Nie mówi nic o tym, czy wartości są poprawne, tylko o tym, jak są uformowane."
section_missingness = "Brakujące razem"
section_calendar = "Luki w kalendarzu"
sections_added = "Otwarto {n} dodatkowych kart dla ustaleń, które nie dotyczą pojedynczych kolumn."
section_missingness_intro = "Kolumny, które pustoszeją w tych samych wierszach. Cztery kolumny puste w 8% każda to zupełnie inny problem w zależności od tego, czy za każdym razem chodzi o te same 8% wierszy (jedno zepsute złączenie, jedno miejsce do naprawy), czy o cztery niezależne 8%. Każdy wiersz tutaj to jedna taka grupa, największa na początku."
section_calendar_intro = "Dziury w kolumnie z datą lub znacznikiem czasu: odcinki, w których seria przeskakuje zamiast iść krok po kroku. Brakujące weekendy i zmiana czasu się nie liczą, więc to, co jest wypisane, to naprawdę brakujący dzień, godzina albo miesiąc."
hint_miss_columns = "Kolumny, które w tych wierszach są puste razem."
hint_miss_column_count = "Ile to kolumn."
hint_miss_rows = "Ile wierszy ma pusty dokładnie ten zestaw kolumn."
hint_miss_share_percent = "Te wiersze jako procent całej tabeli."
hint_gap_column = "Kolumna z datą lub znacznikiem czasu, w której jest dziura."
hint_gap_after = "Ostatnia wartość przed dziurą."
hint_gap_before = "Pierwsza wartość po niej."
hint_gap_missing_steps = "Ile kroków serii brakuje pomiędzy, liczonych we własnym rytmie kolumny (dni, godziny, miesiące)."
hint_gap_kind = "Jaka to dziura: zwykła przerwa albo odcinek na tyle długi, że wygląda na przestój, a nie na potknięcie."
overall_explained = "Średnia ocen poszczególnych kolumn w raporcie. Najedź na nagłówek kolumny score, żeby zobaczyć, jak powstaje pojedyncza ocena."
verdict_benford_conforms = "Pierwsze cyfry leżą blisko tego, czego oczekuje prawo Benforda, tak jak zwykle robią to wielkości mierzone albo sumowane. Niczego nie dowodzi: kolumna może się zgadzać i i tak być błędna."
verdict_benford_acceptable = "Lekko obok oczekiwanych udziałów, w granicach, w których prawdziwe dane się kręcą. Nic do roboty."
verdict_benford_marginal = "Na tyle obok, że warto spojrzeć drugi raz, ale to jeszcze nie ustalenie. Sprawdź, jak powstaje kolumna, zanim coś z niej wyczytasz."
verdict_benford_nonconforming = "Pierwsze cyfry nie wyglądają jak wielkości mierzone. Powód, żeby popatrzeć dalej, nigdy sam w sobie ustalenie: liczby zaokrąglone, ucięte albo wklepane ręcznie lądują tu wszystkie zupełnie niewinnie."
verdict_benford_not_numbers = "Nie badano: kolumna nie zawiera liczb, a prawo mówi o pierwszej cyfrze liczby."
verdict_benford_too_few = "Nie badano: poniżej 300 użytecznych wartości, gdzie udziały cyfr są szumem, a nie rozkładem."
verdict_benford_narrow = "Nie badano: wartości mieszczą się w mniej niż dziesięciokrotności. Procent, wiek czy ocena nie mają powodu iść za prawem, więc wynik tylko by mylił."
verdict_benford_ids = "Nie badano: gęste liczby całkowite, wszystkie różne, czyli nadany ciąg (numer wiersza, numer faktury, identyfikator). Takie rzeczy się rozdaje, a nie mierzy."
verdict_calendar_complete = "Każdy krok szeregu jest na miejscu, od pierwszego znacznika czasu do ostatniego. Żadnych dziur do wyjaśnienia."
verdict_calendar_weekdays = "Jedyne dziury to pominięte weekendy, a dane biznesowe robią to celowo. Liczy się jako kompletne, i tych weekendów nie ma w karcie dziur."
verdict_calendar_dst = "Jedyna dziura ma kształt zmiany czasu: jeden krok, w niedzielę, nad ranem. Znaczniki czasu Octy nie niosą strefy, więc to czyta kształt, a nie wie. Sprawdź, jeśli w tym szeregu liczy się godzina."
verdict_calendar_gaps = "Czas, który powinien mieć wiersze, a nie ma. Karta Dziury w kalendarzu wypisuje każdą dziurę ze znacznikami czasu po obu stronach."
verdict_calendar_not_dates = "Nie badano: kolumna nie zawiera dat ani znaczników czasu."
verdict_calendar_too_few = "Nie badano: mniej niż trzy różne znaczniki czasu, to jeszcze nie szereg."
verdict_calendar_irregular = "Nie badano: żaden pojedynczy krok nie pokrywa 60% odstępów, więc nie ma rytmu, w którym można szukać dziur. Tak czytają się dzienniki zdarzeń."

