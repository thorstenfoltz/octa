hint_gap_kind = "Kokia tai skylė: paprastas tarpas ar pakankamai ilga atkarpa, kad atrodytų kaip sustojimas, o ne suklupimas."
hint_shape_column = "Stulpelis, kuriame yra nukrypstanti forma."
hint_shape_shape = "Nukrypstanti forma: skaitmenys yra 9, didžiosios raidės A, kitos raidės a."
hint_shape_count = "Kiek reikšmių turi šią formą."
hint_shape_example = "Viena reikšmė su šia forma."
overall_explained = "Ataskaitos stulpelių įverčių vidurkis. Užvesk pelę ant stulpelio score antraštės, ten parašyta, kaip susidaro vienas įvertis."
verdict_benford_conforms = "Pirmieji skaitmenys guli arti to, ko Benfordo dėsnis tikisi, kaip paprastai daro matuoti ar sukaupti dydžiai. Nieko neįrodo: stulpelis gali sutapti ir vis tiek būti klaidingas."
verdict_benford_acceptable = "Truputį pro laukiamas dalis, tose ribose, kuriose tikri duomenys vaikšto. Nėra ką daryti."
verdict_benford_marginal = "Pakankamai pro šalį, kad vertėtų pažiūrėti antrą kartą, bet tai dar ne radinys. Pažiūrėk, kaip stulpelis atsiranda, prieš ką nors iš jo išskaitydamas."
verdict_benford_nonconforming = "Pirmieji skaitmenys neatrodo kaip matuoti dydžiai. Priežastis žiūrėti toliau, bet pats savaime niekada ne radinys: suapvalinti, nukirsti ar ranka suvesti skaičiai visi patenka čia visiškai nekaltai."
verdict_benford_not_numbers = "Netikrinta: stulpelyje nėra skaičių, o dėsnis kalba apie pirmąjį skaičiaus skaitmenį."
verdict_benford_too_few = "Netikrinta: mažiau nei 300 tinkamų reikšmių, kur skaitmenų dalys yra triukšmas, o ne skirstinys."
verdict_benford_narrow = "Netikrinta: reikšmės telpa į mažiau nei dešimteriopą rėžį. Procentui, amžiui ar įvertinimui nėra priežasties sekti dėsniu, tad rezultatas tik klaidintų."
verdict_benford_ids = "Netikrinta: tankūs sveikieji skaičiai, visi skirtingi, taigi priskirta seka (eilutės numeris, sąskaitos numeris, id). Tokie dalykai išdalijami, o ne matuojami."
verdict_calendar_complete = "Kiekvienas eilės žingsnis yra vietoje, nuo pirmos laiko žymos iki paskutinės. Jokių skylių aiškinti."
verdict_calendar_weekdays = "Vienintelės skylės yra praleisti savaitgaliai, o verslo duomenys taip daro tyčia. Skaitoma kaip pilna, ir tie savaitgaliai skylių skirtuke nerodomi."
verdict_calendar_dst = "Vienintelė skylė yra laikrodžio persukimo formos: vienas žingsnis, sekmadienį, ankstyvą rytą. Octos laiko žymos neneša laiko juostos, tad čia skaitoma forma, o ne žinoma. Patikrink, jei eilei svarbi valanda."
verdict_calendar_gaps = "Laikas, kuris turėtų turėti eilučių ir neturi. Skirtukas Kalendoriaus skylės išvardija kiekvieną skylę su laiko žymomis iš abiejų pusių."
verdict_calendar_not_dates = "Netikrinta: stulpelyje nėra datų ar laiko žymų."
verdict_calendar_too_few = "Netikrinta: mažiau nei trys skirtingos laiko žymos, tai dar ne eilė."
verdict_calendar_irregular = "Netikrinta: nė vienas žingsnis nedengia 60% tarpų, tad nėra ritmo, kuriame ieškoti skylių. Įvykių žurnalai skaitosi taip."
verdict_shape_consistent = "Kiekviena reikšmė turi tokią pačią formą, pavyzdžiui kiekvienas pašto kodas yra A-99999."
verdict_shape_mixed = "Beveik kiekviena reikšmė turi vieną formą, kelios neturi. Tos kelios dažnai yra rašymo klaidos arba antras formatas; skirtukas Mišrios formos jas išvardija."
verdict_shape_na = "Netikrinta: stulpelis tuščias, nėra tekstas, arba turi per daug formų, kad būtų galima nuspręsti (laisvas tekstas, arba keli formatai tyčia)."

