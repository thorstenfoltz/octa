hint_score = "Šio stulpelio įvertis iš 100, apskaičiuotas iš trijų stulpelių kairėje: 40% už tai, kiek jis užpildytas, 40% už tai, kiek reikšmių atitinka nurodytą tipą, ir 20% už reikšmių įvairovę. Skaitinės išskirtys atima iki 10 taškų. Jis nieko nesako apie tai, ar reikšmės teisingos, tik apie tai, kaip tvarkingai jos suformuotos."
