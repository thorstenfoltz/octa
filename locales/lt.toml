mcp_row_limit = "Maksimalus eilučių skaičius, grąžinamas `read_table` / `run_sql`, kai iškvietėjas nenurodo `limit`. Įrankio schema skelbia šį numatytąjį modeliui, kad jis prireikus galėtų prašyti daugiau (arba neriboto).\n\nNumatyta: 1,000. Nustačius didelę reikšmę - arba pažymėjus Neribota - per stdio gali būti perduodami labai dideli atsakymai ir sulėtinti MCP klientą."
cell_byte_cap = "Vieno langelio perdavimo dydžio limitas. Langeliai, kurių tekstinė forma jį viršija, pakeičiami `[truncated: ...]` žymekliu ir atsakymas pažymi `cell_truncated: true`. Nustatykite 0, kad išjungtumėte limitą.\n\nNumatyta: 65,536 (64 KiB)."
chat_intro = "Programos viduje veikiantis DI asistentas, valdantis Octa įrankius tavo atvertose kortelėse ir failuose. Pasirinkite tiekėją ir nustatykite jo API raktą (arba paleiskite Ollama vietoje), tada atverkite skydelį iš įrankių juostos (Analizės meniu, Asistentas)."
chat_max_iterations = "Maksimalus įrankių iškvietimų raundų skaičius, kurį asistentas gali atlikti per vieną žinutę prieš sustodamas. Apsauga nuo nevaldomų įrankių ciklų."
chat_max_tokens = "Atsakymo ilgio limitas (žetonais), prašomas kiekvienam atsakymui. Neribota leidžia modeliui naudoti savo maksimumą (Anthropic visada reikalauja limito, todėl ten naudojama didelė reikšmė)."
chat_provider = "Su kuriuo LLM posistemiu kalbasi asistentas. Kiekvienam tiekėjui reikia savo API rakto, išskyrus Ollama, kuri veikia vietoje."
chat_model = "Modelis, naudojamas šiam tiekėjui. Pasirinkite išankstinį nustatymą arba įveskite bet kurį modelio pavadinimą."
chat_ollama_url = "Tavo vietinio Ollama serverio šakninis URL. API kelius Octa prideda pati."
chat_position = "Kur pokalbių skydelis prijungiamas lentelės atžvilgiu."
chat_export_dir = "Aplankas, į kurį asistentas įrašo eksportuotus failus (naujus CSV, diagramas), kai nenurodote pilno kelio."
chat_audit_log = "Prideda kiekvieną asistento įrankio kvietimą į žurnalą konfigūracijos kataloge (chat_audit/). Pagal numatymus išjungta."
chat_render_markdown = "Įjungta: atsakymų antraštės, sąrašai, lentelės, kodo blokai ir nuorodos piešiamos suformatuotos. Išjungta: matai neapdorotą Markdown šaltinį. Tavo paties žinutės niekada neperformatuojamos."
chat_audit_warn = "Rodyti įspėjimą paleidžiant, kai žurnalai viršija šį dydį."
chat_api_key = "Tavo API raktas šiam tiekėjui. Saugomas tavo OS raktinėje, kai įmanoma, kitaip - grynu tekstu settings.toml."
map_intro = "Žemėlapio rodinio numatytieji nustatymai (naudojami GeoJSON failų). Aktyvi kortelė gali persijungti tarp Plytelių ir Tik geometrijos per Žemėlapio įrankių juostą."
map_default_mode = "Plytelės: atsiųsti slankų žemėlapį iš sukonfigūruoto plytelės URL.\nTik geometrija: nupiešti tik objektus tuščioje drobėje."
map_fallback = "Kai plytelės atsiuntimas nepavyksta (neprisijungus, užblokuota), automatiškai persijungti į tik geometrijos atvaizdavimą tai kortelei."
tile_url = "URL šablonas rastrinėms plytelėms. `{z}/{x}/{y}` pakeičiami mastelio lygiu ir plytelės koordinatėmis. Numatyta nukreipia į OSM plytelių serverį - gamybiniam / dideliam naudojimui nukreipkite į savarankiškai talpinamą ar komercinį tiekėją."
sidebar_position = "Kurioje pusėje prijungiamas katalogų medis,\nkai aplankas atveriamas per Failas > Atverti katalogą."
shortcuts_intro = "Spustelėkite „Įrašyti“, tada paspauskite klavišų kombinaciją (su Ctrl / Shift / Alt).\nPaspauskite Esc įrašymui atšaukti. „Išvalyti“ palieka veiksmą nepriskirtą."
initial_load_cap = "Maksimalus eilučių skaičius, įkeliamas į lentelę pirmą kartą atveriant\nsrautinius formatus (Parquet, CSV, TSV). Likusios eilutės\nsrautu įkeliamos fone tau slenkant.\n\nNumatyta: 2,000,000. Padidinus pagerinamas pirmojo piešimo\npilnumas, bet naudojama daugiau atminties. Sumažinus pradinis\natvėrimas tampa greitesnis, bet daugiau darbo perduodama\nfono įkėlikliui. Pažymėkite \"Neribota\", kad visiškai išjungtumėte\nlimitą ir įkeltumėte kiekvieną eilutę iš karto.\n\nĮveskite skaičių - taikoma paspaudus Taikyti."
db_page_rows = "Eilučių vienai užklausai, kai atveri lentelę per tiesioginį duomenų bazės ryšį.\n\nNumatyta: 100,000. Tai puslapio dydis, o ne riba: kitas puslapis įkeliamas fone tau slenkant, lygiai kaip su dideliu Parquet failu.\n\nAtskiras nustatymas, nes viršuje esanti riba matuoja vietinio failo skaitymą, o čia tinklu keliauja megabaitai JSON. Sumažink jį, jei lentelės atidarymas atrodo lėtas.\n\nĮveskite skaičių - taikoma paspaudus Taikyti."
raw_view_cap = "Didžiausias failo dydis (MB), kurį Octa visiškai įkelia į neapdoroto\nrodinio rengyklę. Taip pat riboja atsarginį neapdorotą rodinį po nuskaitymo\nklaidos ir Palyginimo rodinio neapdorotą pusę. Didesniems failams neapdorotas\ntekstas praleidžiamas, kad būtų taupoma atmintis.\n\nNumatyta: 50 MB. Pažymėkite \"Neribota\", kad būtų įkeltas bet kokio\ndydžio failas. Taikoma paspaudus Taikyti."
decompress_cap = "Didžiausias išskleistas dydis (MB) skaidriai atveriamiems\n.gz / .zst failams. Mažas suglaudintas failas gali išsiplėsti milžiniškai\n(išskleidimo bomba); viršijus ribą atverti atsisakoma.\n\nNumatyta: 4 295 MB (4 GB). Taikoma paspaudus Taikyti."
decompress_unlimited = "Visiškai panaikinti išskleidimo dydžio ribą. Žymėkite tik\ntiems archyvams, kuriais pasitikite."
raw_view_unlimited = "Įkelti visą bet kurio failo tekstą į neapdorotą rodinį be\ndydžio ribos. Naudokite tik turėdami atminties atsargų - kelių GB\nfailas nuskaitomas visas į atmintį."
initial_load_unlimited = "Įkelti kiekvieną failo eilutę iš karto. Rekomenduojama tik\nkai turite atsarginės RAM - 100 mln. eilučių parquet suvalgo\nkelis GB."
syntax_size_cap = "Už šį didesni failai pereina prie paprasto lygiapločio\nneapdoroto teksto redaktoriuje. Nustatykite 0, kad visiškai\nišjungtumėte sintaksės paryškinimą; nustatykite labai didelį skaičių\napsaugai atsisakyti. JSON/YAML/XML/Markdown/TOML niekada nepažymimi\n- jie naudoja savo medžio/peržiūros rodinius.\n\nNumatyta: 1 MB. Įveskite skaičių, pasirinkite vienetą - taikoma paspaudus Taikyti."
open_as_text = "Papildomi failų plėtiniai, traktuojami kaip paprastas tekstas atveriant\n(pakeičia bet kurią skaityklę, kuri juos paprastai paimtų).\nAtskirti kableliais arba tarpais, be pradinio taško, mažosiomis raidėmis.\nPavyzdys: log4j  myproj  rawdata\n\nTaikoma paspaudus Taikyti; įsigalioja vėlesniems failų atvėrimams."
folder_union_cap = "Didžiausias failų skaičius, kurį debesies aplanko sujungimas\natsisiunčia ir sujungia. Kiekvienas failas visas įkeliamas į atmintį,\ntodėl aplankas su dešimtimis tūkstančių dalių gali išnaudoti RAM.\nVirš limito esantys failai praleidžiami ir suskaičiuojami būsenos\njuostoje.\n\nNumatyta: 500. Pritaikoma paspaudus Taikyti."
folder_union_unlimited = "Sujungti visus aplanko failus, kad ir kiek jų būtų. Žymėkite tik\nturėdami atminties su atsarga."
multi_search_cap = "Vieno failo dydžio limitas Daugybinės paieškos skydelio katalogo\napimčiai. Už šį didesni failai praleidžiami ir nurodomi\npraleistų failų ženklelyje. Pažymėkite \"Neribota\", kad limitas būtų visai panaikintas.\n\nNumatyta: 50 MB."
multi_search_unlimited = "Peržiūri kiekvieną katalogo failą, kad ir koks jo dydis. Milžiniškas\nžurnalas ar išklotinė gali užstrigdyti paiešką ir suėsti atmintį."
chart_max_points = "Maksimalus eilučių skaičius, kurį Diagramos kortelė nubraižys prieš įsijungiant\ntolygiam retinimui (Histograma, Linija, Sklaida). Stulpelinės diagramos\nvisada agreguoja visą įvestį; Stačiakampių diagramos apskaičiuoja\n5 skaičių santrauką visai įvesčiai. Nustatykite 0, kad išjungtumėte\nretinimą - saugu tik vidutinio dydžio lentelėms.\n\nNumatyta: 25,000. Skaitinė įvestis priima kablelius."
chart_max_categories = "Maksimalus skirtingų X kategorijų skaičius, kurį Stulpelinė diagrama priims prieš\natsisakydama braižyti. Viršijus šį skaičių piešyklė parodo klaidą,\no ne nesuprantamą stulpelių sieną - pirma filtruokite arba\nagreguokite lentelę.\n\nNumatyta: 200. Skaitinė įvestis priima kablelius."
tables_in_picker = "Kiek lentelės eilučių daugialentelis parinkiklio dialogas (SQLite,\nDuckDB, ...) turėtų vertikaliai talpinti numatytuoju dydžiu. Dialogo\ndydį naudotojas vis tiek gali keisti - tempkite kampą, kad\npadidintumėte, kai duomenų bazė turi daug lentelių.\n\nNumatyta: 10. Minimumas 1."
excel_auto_open = "Kiek kelialakščio Excel darbaknygės lakštų atverti\nautomatiškai (kiekvieną savo kortelėje). Darbaknygės su daugiau\nlakštų nei šis rodo parinkiklį, kad pasirinktumėte, kuriuos atverti\n(vis tiek galite pasirinkti daugiau nei šį skaičių arba visus).\n\nNumatyta: 5. Minimumas 1."
max_recent = "Paskutinių atvertų failų skaičius, rodomas Failo meniu"
start_maximised = "Kai įjungta, langas paleidžiamas išdidintas, o žemiau esantis dydis\nnaudojamas kaip atstatymo iš išdidinimo dydis.\nKai išjungta, langas paleidžiamas pasirinktu dydžiu."
initial_window_size = "Lango dydis, naudojamas paleidžiant (kai \"Pradėti išdidinta\" išjungta),\narba atstatymo iš išdidinimo dydis, kai įjungta."
ctrl_close = "Užverti"
ctrl_restore = "Atstatyti"
ctrl_full_size = "Visas dydis"
ctrl_minimise = "Sumažinti"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Apsaugo tavo failus nuo grafinės sąsajos įrašymų ir numatytosios MCP serverio elgsenos.\nKai įjungta, stulpelių pridėjimas ar pašalinimas SQLite, DuckDB ar GeoPackage\nfaile įrašant atmetamas. Asistentą valdo atskiras pokalbių profilis\n(profilio jungiklis Leisti rašymą), o ne šis nustatymas."
confirm_db_write_back = "Prieš pakeitimams patenkant į veikiančią duomenų bazę, Octa parodo, kas pasikeistų, ir paklausia.\nIšjunk tai, kad Įrašyti pritaikytų skirtumus iš karto; abiem atvejais tai viena transakcija,\no nepavykęs įrašymas atšaukiamas."
db_pushdown = "Kai duomenų bazės skirtukas turi tik dalį savo lentelės, Santrauka, Reikšmių dažnis, kokybės ataskaita, Koreliacija, Sujungimo raktų ieškiklis, Sujungimo diagnostika, Rasti žinynų lenteles ir Ryšių žemėlapio Išmatuoti vykdomos kaip SQL serveryje per visas eilutes, nieko neatsisiunčiant.\nIšjunk, kad jos būtų vykdomos įkeltose eilutėse."
confirm_url_redirects = "Kai interneto adresas nukreipia į kitą, paklausti prieš atveriant failą iš ten. Tas patvirtinimas yra vienintelė vieta, kur šis pokytis matomas."
backup_before_modify = "Prieš asistentui arba schemą keičiančiam duomenų bazės įrašymui perrašant\nfailą, pirma nukopijuoti jį į šalia esantį .bak failą su laiko žyma.\nĮprasti rankiniai įrašymai nekopijuojami."
chat_profiles = "Kiekvienas profilis yra viena įrašyta sąranka: tiekėjas, modelis, temperatūra ir neprivalomas mąstymo biudžetas tavo pasirinktu pavadinimu. Kurk jų kiek norite, įskaitant kelis to paties tiekėjo, ir perjunkite juos asistento skydelyje."
chat_profile_base_url = "Šio profilio galinis taškas. Palikite tuščią, kad būtų naudojamas žemiau nurodytas Ollama serverio adresas."
write_options = "Numatytosios reikšmės, kai Octa įrašo failą. Įrašyti kaip ir paketinis konvertavimas remiasi jomis ir gali jas pakeisti vienam paleidimui."
status_message_secs = "Kiek laiko būsenos pranešimas lieka ekrane, kol dingsta. Ta pati\ntrukmė galioja kiekvienam pranešimui - ir sėkmės, ir klaidos.\n\nUžvedus pelę, atgalinė atskaita sustoja: klaida, kurią skaitai ar\nkopijuoji, lieka vietoje. Kiekvienas pranešimas taip pat turi 'x'\nužverti iš karto.\n\nIšjungti negalima; mažiau nei 3 laikoma 3. Numatyta: 10."
chat_tools = "Kuriuos įrankius asistentas gali naudoti. Core grupė keliauja su kiekviena žinute; kitos grupės jam tik įvardijamos, ir jis užkrauna vieną, kai darbui to reikia. Išjungtas įrankis dingsta visur: jis nesiunčiamas, nesiūlomas ir atmetamas, jei asistentas jį vis tiek iškviečia."
chat_tools_enable_all = "Vėl įjungti visus įrankius. Su kiekviena žinute keliauja tik core grupė, tad likusieji nieko nekainuoja, kol asistentas jų nepaprašo."
chat_tools_budget = "Maždaug kiek tokenų įrankių aprašai prideda prie žinutės. Apskaičiuota pagal jų dydį, tad skaityk kaip gairę, o ne kaip sąskaitą."
sql_page_rows = "Kiek rezultato eilučių paimama iš karto; slenkant ateina daugiau. Eilučių skaičius ir Eksportuoti visada apima visą rezultatą. 0 įkelia viską iš karto."
sql_auto_register = "Padaro kiekvieną kitą atidarytą kortelę užklausiamą SQL skydelyje jos pačios vardu, kad dviejų atidarytų failų sujungimui nereikėtų attach."
sql_auto_register_max = "Didesnės kortelės automatiškai neregistruojamos, nes registravimas nukopijuoja jų eilutes. Vietoj to jos gauna mygtuką Registruoti."
sql_auto_register_max_off = "Naudojama tik tada, kai įjungta Užklausti kitas atidarytas korteles."
git_marks_uncommitted = "Nuspalvina šoninėje juostoje failus ir aplankus, kuriuose yra neįrašytų git pakeitimų: pakeisti, pridėti, ištrinti, pervadinti arba nesekami."
git_marks_branch = "Nuspalvina failus ir aplankus, pakeistus dabartinėje šakoje nuo tada, kai ji atsišakojo nuo bazinės šakos."
git_marks_base_branch = "Šaka, su kuria lyginama. Kai saugykloje nėra tokio pavadinimo šakos, bandoma main; jei trūksta ir jos, šakos žymos tiesiog nėra, o aplanko patarimas tai pasako."
git_marks_base_branch_off = "Naudojama tik tada, kai įjungta Žymėti pakeitimus šioje šakoje."
git_marks_refresh_secs = "Kaip dažnai šoninė juosta iš naujo klausia git, kol ji matoma. 0 išjungia laikmatį: tada žymos atsinaujina tik atvėrus aplanką ir kai Octa įrašo failą."
git_marks_refresh_secs_off = "Naudojama tik tada, kai įjungta bent viena git žyma."
retype_layout_sample = "Kiek reikšmių perskaito Keisti tipą, kai sprendžia, kokiu datos formatu parašytas teksto stulpelis. Balsavimas kainuoja septynias datos analizes vienai reikšmei, visos iškart sąsajos gijoje: prie 5 000 000 reikšmių tai 35 000 000 analizių, ir langas kelioms sekundėms nustoja reaguoti. Didinti verta tik tada, kai pirmosios stulpelio reikšmės neatstovauja likusioms, pavyzdžiui faile, surikiuotame taip, kad visos ISO eilutės būtų priekyje. Rodomų skaičių tai niekada nekeičia. Numatyta 10 000."
retype_layout_sample_off = "Išjunk Neribotai, kad čia galėtum įrašyti skaičių."
retype_layout_sample_unlimited = "Perskaito kiekvieną stulpelio reikšmę vietoj imties. Tiksliausia netolygiai surikiuotam stulpeliui, bet kelių milijonų eilučių stulpelyje langas kaskart kelioms sekundėms užšąla, kai pasirenki datos tipą."
cloud_download_concurrency = "Kiek debesijos objektų sujungimas atsisiunčia vienu metu. Numatyta 8, mažiausiai 1. Skaitymas iš objektų saugyklos daugiausia yra laukimas atsako, o ne baitų perdavimas, todėl siunčiant po vieną ryšys tarp užklausų prastovi. Aštuoni - maždaug tiek, kiek naršyklė leidžia vienam serveriui. Padidink greitame, didelės delsos ryšyje; sumažink iki 1, jei tiekėjas ar tarpinis serveris ima atmetinėti užklausas. Labai didelės reikšmės paleidžia tiek pat gijų iškart ir yra greičiausias kelias į užklausų limito klaidą."
cloud_sidebar_position = "Prie kurio lango krašto prijungiama debesų ryšių naršyklė. Numatyta kairėje. Naršyklės prie to paties krašto dalijasi vienu skydeliu."
db_sidebar_position = "Prie kurio lango krašto prijungiama duomenų bazių ryšių naršyklė. Numatyta kairėje. Naršyklės prie to paties krašto dalijasi vienu skydeliu."
sql_format_title = "Kaip SQL skydelio mygtukas Formatuoti išdėsto užklausą. Žemiau esanti peržiūra rodo rezultatą."
sql_format_keywords = "Ar raktažodžiai, tokie kaip SELECT ir FROM, bus didžiosiomis, mažosiomis raidėmis ar tokie, kokius įvedei."
sql_format_indent = "Kiek yra vienas įtraukos lygis: 2 tarpai, 4 tarpai ar tabuliacija."
sql_format_commas = "Kur dedamas kablelis tarp dviejų sąrašo elementų. Kitos eilutės pradžioje trūkstamas kablelis iškart matomas."
sql_format_joins = "Kiekvienas JOIN prasideda naujoje eilutėje FROM lygmenyje, o ne įtrauktas po juo."
sql_format_inline = "Trumpesnis nei tiek simbolių sąrašas lieka vienoje eilutėje, pvz., SELECT a, b, c. Esant 0, kiekvienas elementas gauna savo eilutę."
sql_format_blank_lines = "Kiek tuščių eilučių skiria du sakinius."
sql_format_one_line = "Tik sutvarko tarpus ir raktažodžių raidžių dydį ir kiekvieną sakinį sudeda į vieną eilutę. Patogu įklijuoti į žurnalą ar programą."
sql_format_off_one_line = "Išjungta, kol įjungta Visa užklausa vienoje eilutėje: nėra eilučių lūžių, kuriuos reikėtų išdėstyti."
sql_format_clause_width = "Už tiek simbolių trumpesnė sąlyga lieka savo raktažodžio eilutėje, pvz., GROUP BY c.name, o trumpa antrinė užklausa lieka savo skliaustuose. Pradedama nuo sąrašo pločio."
sql_format_clause_needs_list = "Pirma nustatyk sąrašo plotį virš 0. Vienas šis nustatymas paliktų sąlygos elementus be įtraukos."
sql_format_bracket_width = "Už tiek simbolių trumpesni skliaustai lieka vienoje eilutėje, pvz., coalesce(a, 0) ar IN (1, 2, 3). Ilgesniuose kiekvienas elementas eina į savo eilutę."
sql_format_semicolon = "Prideda ; po paskutinio sakinio, jei jo nėra."
sql_format_preview = "Pavyzdinė užklausa, išdėstyta pagal aukščiau esančius nustatymus. Ji keičiasi, kai juos keiti."
restore_session = "Paleidžiama Octa vėl atveria failus, kurie buvo atverti, kai jį uždarei. Pagal numatymą išjungta. Dingę failai praleidžiami."
restore_session_cloud = "Taip pat vėl atveria debesies objektus. Atsargiai: kiekvienas atsisiunčiamas iš naujo per kiekvieną paleidimą, tai užtrunka ir gali kainuoti už duomenų perdavimą."
restore_session_connections = "Taip pat vėl atveria lenteles iš duomenų bazių ryšių ir API galinių taškų. Atsargiai: kiekviena per kiekvieną paleidimą siunčia užklausą savo serveriui. Duomenų saugyklą tai gali pažadinti ir kainuoti, o pasibaigęs prisijungimas paprašys tavęs prisijungti iš naujo."
restore_session_needs_main = "Pirma įjunk Iš naujo atverti paskutinę sesiją."

