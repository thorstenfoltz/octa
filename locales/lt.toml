section_missingness_intro = "Stulpeliai, kurie ištuštėja tose pačiose eilutėse. Keturi stulpeliai, kurių kiekviename tuščia 8%, yra skirtinga bėda priklausomai nuo to, ar kiekvieną kartą kalbama apie tas pačias 8% eilučių (vienas sugedęs sujungimas, viena vieta taisyti), ar apie keturis nesusijusius 8%. Kiekviena eilutė čia yra viena tokia grupė, didžiausia pirma."
section_calendar_intro = "Skylės datos ar laiko žymos stulpelyje: atkarpos, kuriose seka peršoka, užuot žengusi žingsnį. Trūkstami savaitgaliai ir perėjimas prie vasaros laiko neskaičiuojami, tad išvardyta yra tikrai trūkstama diena, valanda ar mėnuo."
