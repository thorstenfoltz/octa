write_protection = "Захищає твої файли від збережень із графічного інтерфейсу та типової\nповедінки сервера MCP. Коли увімкнено, додавання чи вилучення стовпців\nу файлі SQLite, DuckDB або GeoPackage відхиляється під час збереження.\nПомічник керується окремо для кожного профілю чату (перемикач\nДозволити запис у профілі), а не цим налаштуванням."
confirm_db_write_back = "Перш ніж зміни підуть у робочу базу, Octa показує, що зміниться, і питає.\nВимкни це, щоб Зберегти застосовувало зміни одразу; в обох випадках це одна транзакція,\nа невдалий запис відкочується."
