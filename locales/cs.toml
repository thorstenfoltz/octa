default_search_mode = "Výchozí režim hledání/filtru pro nové karty"
tab_size = "Mezery vložené při stisku Tab v textovém editoru"
caret_click = "Kterým kliknutím přidáš další kurzor v textových editorech. Vyber Ctrl+klik, pokud Alt+klik posouvá okno. Klávesy pro kurzory najdeš v sekci Klávesové zkratky."
color_aligned = "Obarvit sloupce v zobrazení nezpracovaného textu CSV/TSV\n(platí jen když je zapnuto 'Zarovnat sloupce')"
warn_unalign = "Potvrdit, než se formátování v zobrazení nezpracovaného textu vypne -\nsoubor se znovu načte z disku a úpravy v paměti se zahodí."
detect_dates = "Při otevření souboru změnit textové sloupce jen s daty\nna sloupce dat.\n\nVelké soubory: otevírání se zpomalí, asi o tři sekundy\nna sloupec dat při pěti milionech řádků. Sloupce > Rozpoznat data\nto místo toho udělá na požádání."
warn_date_change = "Zobrazit banner, když odvození data přepíše sloupec\ndo zobrazovací podoby ISO (např. uloženo 02.05.2026,\nzobrazeno 2026-05-02). Vypnutím upozornění umlčíte."
warn_date_change_off = "Platí jen, když je zapnuté Rozpoznávat data při načtení"
trim_whitespace = "Oříznout počáteční/koncové mezery z textových buněk\npři otevření souboru. Vnitřní mezery zůstanou."
warn_trim = "Zobrazit banner se seznamem sloupců, jimž byly při načtení\nořezány mezery. Nezávislé na nastavení ořezávání."
clean_headers = "Normalizovat záhlaví sloupců na identifikátory snake_case\npři načtení (oříznuté, malá písmena, mezery a interpunkce\nse stanou podtržítky, duplikáty dostanou číselnou příponu)."
offer_repair = "Když se CSV/TSV načte, ale vypadá poškozeně (špatné\nkódování, řídicí znaky, oddělovač,\nkterý nesouhlasí s příponou, nebo velmi\nnepravidelné řádky), zobrazí výzvu nabízející\nopravu a opětovné načtení. Výchozí vypnuto; oprava\nproběhne, jen když ji potvrdíš."
readonly_notice = "Zobrazit potvrzovací dialog při každém přepnutí režimu\njen pro čtení (přes F8 nebo nabídku Zobrazení). Vypněte pro\ntiché přepnutí stavu."
notebook_output = "Pozice výstupu kódu v zobrazení Jupyter Notebook\n(platí jen pro soubory .ipynb v režimu Notebook)"
sql_open_default = "Při otevření tabulkového souboru automaticky zobrazit\neditor SQL vedle zobrazení tabulky."
sql_keep_open = "Když se karta zavře nebo se do ní otevře soubor, otevřený editor SQL zůstane otevřený i s tvými dotazy.\nVypnuto: editor patří ke své kartě a zavře se s ní."
sql_panel_position = "Kam se editor SQL ukotví vzhledem k tabulce"
sql_row_limit = "LIMIT použitý v zástupném dotazu při otevření karty\n(např. 100 -> SELECT * FROM data LIMIT 100).\nZadejte číslo - použije se po Použít."
autocomplete = "Nabízet návrhy klíčových slov SQL a názvů sloupců\npod editorem SQL."
editor_font = "Písmo používané editorem SQL a jeho okrajem s čísly\nřádků. JetBrains Mono je součástí Octy."
sql_diff_highlight = "Po dotazu INSERT/UPDATE/DELETE krátce zvýrazní změněné buňky a řádky."
sql_diff_secs = "Jak dlouho zvýraznění změn SQL zůstane, než zmizí."
mcp_intro = "Výchozí hodnoty serveru MCP (`octa --mcp`). Server je čte jednou při spuštění; změna za běhu vyžaduje restart `octa --mcp`."
mcp_row_limit = "Maximální počet řádků vrácených `read_table` / `run_sql`, když volající vynechá `limit`. Schéma nástroje tuto výchozí hodnotu oznamuje modelu, aby si mohl podle potřeby vyžádat více (nebo neomezeně).\n\nVýchozí: 1 000. Nastavení vysoké hodnoty - nebo zaškrtnutí Neomezeně - může poslat velmi velké odpovědi přes stdio a zpomalit klienta MCP."
cell_byte_cap = "Limit velikosti na buňku při přenosu. Buňky, jejichž textová podoba toto překročí, jsou nahrazeny značkou `[truncated: ...]` a odpověď nastaví `cell_truncated: true`. 0 vypne limit.\n\nVýchozí: 65 536 (64 KiB)."
chat_intro = "Vestavěný AI asistent, který ovládá nástroje Octy nad vašimi otevřenými kartami a soubory. Vyberte poskytovatele a nastavte jeho klíč API (nebo spusťte Ollama lokálně), pak otevřete panel z panelu nástrojů (nabídka Analýza, Asistent)."
chat_max_iterations = "Maximální počet kol volání nástrojů, která asistent může v rámci jedné zprávy provést, než se musí zastavit. Pojistka proti nekontrolovaným smyčkám nástrojů."
chat_max_tokens = "Limit délky odpovědi (v tokenech) na jednu odpověď. Neomezeně nechá model použít vlastní maximum (Anthropic vždy potřebuje limit, takže použije vysokou hodnotu)."
chat_provider = "S jakým backendem LLM asistent komunikuje. Každý poskytovatel potřebuje vlastní klíč API, kromě Ollama, která běží lokálně."
chat_model = "Model použitý pro tohoto poskytovatele. Vyberte přednastavení nebo zadejte libovolný název modelu."
chat_ollama_url = "Kořenová URL tvého místního serveru Ollama. Cesty API připojí Octa sama."
chat_position = "Kam se panel chatu ukotví vzhledem k tabulce."
chat_export_dir = "Složka, do které asistent zapisuje exportované soubory (nová CSV, grafy), když nezadáte úplnou cestu."
chat_audit_log = "Připojí každé volání nástroje asistenta do protokolu v konfiguračním adresáři (chat_audit/). Výchozí vypnuto."
chat_export_trace = "Exporty pak obsahují i každý krok z ladicího pole, se systémovým promptem, voláními nástrojů a jejich výsledky, takže v nich můžou být tvoje data. Kroky existují jen pro chaty z tohohle spuštění Octy, protože se nikdy neukládají."
chat_writing_apply_directly = "Vypnuto, nová verze od asistenta se otevře vedle tvého současného textu a použije se, až když ji přijmeš. Zapnuto, jde hned do editoru a tlačítko Vrátit změnu vrátí starý text. Na disk se v žádném případě nic neukládá."
chat_cli_program = "Octa spustí tento program na tvém počítači a pošle mu tvou otázku. Nech prázdné, pokud se má použít program z PATH. Nejdřív ho nainstaluj a přihlas se v něm. Octa tvoje přihlášení nikdy nevidí."
chat_render_markdown = "Zapnuto: nadpisy, seznamy, tabulky, bloky kódu a odkazy v odpovědích se vykreslí naformátované. Vypnuto: vidíš surový Markdown zdroj. Tvoje vlastní zprávy se nikdy nepřeformátovávají."
chat_audit_warn = "Zobrazit varování při spuštění, když protokoly překročí tuto velikost."
chat_api_key = "Tvůj klíč API pro tohoto poskytovatele. Uložen v úložišti klíčů OS, je-li dostupné, jinak jako prostý text v settings.toml."
map_intro = "Výchozí hodnoty zobrazení Mapa (pro soubory GeoJSON). Aktivní karta může přepínat mezi Dlaždicemi a Pouze geometrií přes panel Mapa."
map_default_mode = "Dlaždice: načíst posuvnou mapu z nastavené URL dlaždic.\nPouze geometrie: vykreslit jen prvky na prázdné plátno."
map_fallback = "Když načtení dlaždic selže (offline, blokováno), automaticky přepne na vykreslení pouze geometrie pro tuto kartu."
tile_url = "Vzor URL pro rastrové dlaždice. `{z}/{x}/{y}` se nahradí úrovní přiblížení a souřadnicemi dlaždice. Výchozí ukazuje na dlaždicový server OSM - pro produkci / intenzivní použití zamiřte na vlastní nebo komerční poskytovatele."
sidebar_position = "Na které straně je ukotven strom adresářů, když se\nsložka otevře přes Soubor > Otevřít složku."
shortcuts_intro = "Klikněte na 'Zaznamenat' a stiskněte kombinaci kláves (s Ctrl / Shift / Alt).\nEsc zruší záznam. 'Vymazat' ponechá akci nepřiřazenou."
initial_load_cap = "Maximální počet řádků načtených do tabulky při prvním otevření pro\nstreamovací formáty (Parquet, CSV, TSV). Zbývající řádky\nse načítají na pozadí při posouvání.\n\nVýchozí: 2 000 000. Zvýšení zlepší úplnost prvního\nvykreslení, ale spotřebuje více paměti. Snížení zrychlí\nprvní otevření, ale přesune více práce na načítání na\npozadí. Zaškrtněte \"Neomezeně\" pro úplné vypnutí\nlimitu a načtení všech řádků předem.\n\nZadejte číslo - použije se po Použít."
db_page_rows = "Řádky na jeden požadavek, když otevíráš tabulku přes živé připojení k databázi.\n\nVýchozí: 100,000. Je to velikost stránky, ne strop: další stránka se načte na pozadí, jak posouváš, stejně jako u velkého souboru Parquet.\n\nJe to samostatné nastavení, protože limit výše měří čtení lokálního souboru, kdežto tady po síti tečou megabajty JSON. Sniž ho, když ti otevírání tabulky připadá pomalé.\n\nZadejte číslo - použije se po Použít."
raw_view_cap = "Maximální velikost souboru (v MB), který Octa načte celý do\neditoru surového zobrazení. Řídí také surové náhradní zobrazení při chybě\nzpracování a surovou stranu porovnání. Větší soubory surový text vynechají,\naby se šetřila paměť.\n\nVýchozí: 50 MB. Zaškrtněte \"Bez omezení\" pro načtení souboru\nlibovolné velikosti. Použije se při potvrzení."
decompress_cap = "Maximální velikost po rozbalení (v MB) pro průhledně otevírané\nsoubory .gz / .zst. Malý komprimovaný soubor se může obrovsky nafouknout\n(dekompresní bomba); nad tímto limitem se otevření odmítne.\n\nVýchozí: 4 295 MB (4 GB). Použije se při potvrzení."
decompress_unlimited = "Zcela odstranit limit velikosti po rozbalení. Zaškrtněte jen\npro archivy, kterým důvěřujete."
raw_view_unlimited = "Načíst celý text libovolného souboru do surového zobrazení bez\nomezení velikosti. Používejte jen s dostatkem paměti - soubor\no velikosti několika GB se načte celý do paměti."
initial_load_unlimited = "Načíst všechny řádky souboru předem. Doporučeno jen\nkdyž máte RAM nazbyt - parquet se 100 M řádky spotřebuje\nněkolik GB."
syntax_size_cap = "Soubory větší než toto se v nezpracovaném editoru vrátí k\nprostému monospace. 0 zcela vypne zvýrazňování syntaxe;\nvelmi velké číslo se vzdá ochrany. JSON/YAML/XML/Markdown/TOML\nse nikdy nezvýrazňují - používají vlastní stromová/náhledová zobrazení.\n\nVýchozí: 1 MB. Zadejte číslo, vyberte jednotku - po Použít."
open_as_text = "Další přípony souborů, které se při otevření zpracují jako prostý text\n(přepíší čtečku, která by je jinak nárokovala).\nOddělené čárkou nebo mezerou, bez úvodní tečky, malými písmeny.\nPříklad: log4j  myproj  rawdata\n\nProjeví se po Použít pro další otevírání souborů."
folder_union_cap = "Maximální počet souborů, které sloučení složky v cloudu stáhne a\nspojí. Každý soubor se celý načte do paměti, takže složka s desítkami\ntisíc částí může vyčerpat RAM. Soubory nad limit se přeskočí a\nspočítají ve stavovém řádku.\n\nVýchozí: 500. Uplatní se po stisku Použít."
folder_union_unlimited = "Sloučit všechny soubory ve složce, ať je jich kolik chce.\nZaškrtněte jen, pokud máte paměti nazbyt."
multi_search_cap = "Limit velikosti na soubor pro adresářový rozsah panelu\nVícenásobné hledání. Větší soubory se přeskočí a vypíší ve\nštítku přeskočených souborů. Zaškrtněte \"Neomezeně\" pro úplné zrušení limitu.\n\nVýchozí: 50 MB."
multi_search_unlimited = "Prohledá každý soubor v adresáři bez ohledu na velikost. Obrovský\nlog nebo dump může skenování zablokovat a sežrat paměť."
chart_max_points = "Maximální počet řádků, které karta Graf vykreslí, než se zapne\nrovnoměrné podvzorkování (Histogram, Čára, Bodový). Sloupcové grafy\nvždy agregují celý vstup; krabicové grafy počítají\npětičíselný souhrn z celého vstupu. 0 vypne\nvzorkování - bezpečné jen pro středně velké tabulky.\n\nVýchozí: 25 000. Číselné pole přijímá oddělovače čárkou."
chart_max_categories = "Maximální počet odlišných kategorií X, které sloupcový graf přijme, než\nodmítne vykreslení. Nad touto hranicí vykreslovač zobrazí chybu\nmísto nečitelné zdi sloupců - nejprve tabulku vyfiltrujte nebo\nagregujte.\n\nVýchozí: 200. Číselné pole přijímá oddělovače čárkou."
tables_in_picker = "Kolik řádků tabulky se má vejít svisle v dialogu výběru\nz více tabulek (SQLite, DuckDB, ...) při výchozí velikosti.\nDialog lze stále změnit - tažením rohu jej zvětšíte,\nkdyž má databáze mnoho tabulek.\n\nVýchozí: 10. Minimum 1."
excel_auto_open = "Kolik listů vícelistového sešitu Excelu se otevře\nautomaticky (každý ve své kartě). Sešity s více\nlisty zobrazí výběr, abyste zvolili, které otevřít\n(stále můžete vybrat více, nebo vše).\n\nVýchozí: 5. Minimum 1."
max_recent = "Počet nedávno otevřených souborů zobrazených v nabídce Soubor"
start_maximised = "Když je zapnuto, okno se spustí maximalizované a velikost níže\nse použije jako velikost po obnovení z maximalizace.\nKdyž je vypnuto, okno se spustí ve zvolené velikosti."
open_in_running_instance = "Zapnuto: dvojklik na soubor nebo spuštění octa se souborem přidá kartu do Octa, která už je otevřená. Spuštění Octa bez souboru stejně otevře druhou. Vypnuto: každé spuštění je samostatná Octa. Projeví se při příštím spuštění Octa."
notify_on_finish = "Ve výchozím stavu zapnuto: když skončí úloha, která chvíli běžela, a Octa není okno v popředí, tvůj systém ukáže oznámení, co skončilo a jak dlouho to trvalo."
notify_after_secs = "Kratší úlohy skončí, zatímco se ještě díváš, takže oznámení nedostanou."
notify_after_secs_off = "Nejdřív zapni oznámení."
notify_test = "Hned ukáže oznámení, ať je vidět, jak vypadá, a jestli tvůj systém Octa dovolí je posílat."
notify_when_focused = "Ve výchozím stavu vypnuto. Zapnuto: oznámení dostaneš i tehdy, když je Octa okno v popředí, pokud úloha trvala dost dlouho."
initial_window_size = "Velikost okna při spuštění (když je \"Spustit maximalizované\" vypnuto),\nnebo velikost po obnovení z maximalizace, když je zapnuto."
ctrl_close = "Zavřít"
ctrl_restore = "Obnovit"
ctrl_full_size = "Plná velikost"
ctrl_minimise = "Minimalizovat"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Je-li zapnuto, uložení souboru SQLite, DuckDB nebo GeoPackage se odmítne, pokud byly přidány nebo odebrány sloupce. Platí to pro ukládání v aplikaci i pro server MCP, který si nastavení přečte jednou při spuštění. Asistent se místo toho řídí přepínačem Povolit zápis svého profilu."
chat_profile_may_override = "Tohle je výchozí hodnota. Profil modelu si může nastavit vlastní."
confirm_db_write_back = "Než změny půjdou do běžící databáze, Octa ukáže, co by se změnilo, a zeptá se.\nVypni to, ať Uložit rozdíl použije rovnou; v obou případech jde o jednu transakci\na neúspěšný zápis se vrátí zpět."
db_pushdown = "Když karta databáze obsahuje jen část své tabulky, Souhrn, Četnost hodnot, zpráva o kvalitě, Korelace, Hledání spojovacích klíčů, Diagnostika spojení, Najít číselníky a Změřit v Mapě vztahů běží jako SQL na serveru přes všechny řádky, bez stahování.\nVypni to, aby běžely nad načtenými řádky."
auto_refresh_min = "Automatické obnovení odmítne kratší interval u karty s databází nebo API."
auto_refresh_min_billed = "Totéž pro BigQuery, Athena a Snowflake, kde každé čtení stojí peníze."
confirm_url_redirects = "Když tě webová adresa pošle na jinou, zeptat se dřív, než se odtud soubor otevře. Ta otázka je jediné místo, kde je změna vidět."
backup_before_modify = "Než asistent nebo uložení měnící schéma databáze přepíše\nsoubor, zkopírovat jej nejprve vedle do souboru .bak s časovým razítkem.\nBěžná ruční uložení se nezálohují."
chat_profiles = "Každý profil je jedno uložené nastavení: poskytovatel, model, teplota a volitelný rozpočet na přemýšlení pod názvem, který zvolíte. Vytvořte si jich, kolik chcete, klidně i několik pro téhož poskytovatele, a přepínejte mezi nimi z panelu asistenta."
chat_profile_base_url = "Koncový bod pro tento profil. Ponechte prázdné pro použití adresy serveru Ollama nastavené níže."
write_options = "Výchozí hodnoty při zápisu souboru. Uložit jako a dávkový převod z nich vycházejí a mohou je pro jeden běh změnit."
status_message_secs = "Jak dlouho zůstane stavová zpráva na obrazovce, než zmizí.\nStejná doba platí pro každou zprávu, úspěch i chybu.\n\nNajetím myší se odpočet pozastaví - chyba, kterou zrovna čteš\nnebo kopíruješ, tedy zůstane. Každá zpráva má také 'x' pro\nokamžité zavření.\n\nNelze vypnout; méně než 3 se bere jako 3. Výchozí: 10."
chat_tools = "Které nástroje smí asistent používat. Skupina core jde s každou zprávou; ostatní skupiny se mu jen vyjmenují a jednu si načte, když ji úkol potřebuje. Vypnutý nástroj zmizí všude: neposílá se, nenabízí se a je odmítnut, když si ho asistent přesto zavolá."
chat_tools_enable_all = "Zapnout všechny nástroje zpět. S každou zprávou jde jen skupina core, takže zbytek nic nestojí, dokud si o něj asistent neřekne."
chat_tools_budget = "Zhruba kolik tokenů popisy nástrojů přidají ke zprávě. Spočítáno z jejich velikosti, ber to tedy jako vodítko, ne jako fakturu."
sql_page_rows = "Kolik řádků výsledku se načte najednou; při posouvání přibývají další. Počet řádků i Export vždycky pokrývají celý výsledek. 0 načte všechno naráz."
sql_auto_register = "Udělá z každé další otevřené karty dotazovatelnou tabulku v SQL panelu pod jejím vlastním jménem, takže spojení dvou otevřených souborů nepotřebuje attach."
sql_auto_register_max = "Větší karty se neregistrují automaticky, protože registrace kopíruje jejich řádky. Místo toho dostanou tlačítko Registrovat."
sql_auto_register_max_off = "Používá se jen, dokud je zapnuté Dotazovat ostatní otevřené karty."
git_marks_uncommitted = "Obarví soubory a složky v postranním panelu, které mají nezapsané změny v gitu: změněné, přidané, smazané, přejmenované nebo nesledované."
git_marks_branch = "Obarví soubory a složky změněné na aktuální větvi od chvíle, kdy se odštěpila od základní větve."
git_marks_base_branch = "Větev, se kterou se porovnává. Když repozitář větev tohoto jména nemá, zkusí se main; když chybí i ta, značka větve prostě chybí a nápověda složky to říká."
git_marks_base_branch_off = "Používá se jen, dokud je zapnuté Označovat změny na této větvi."
git_marks_refresh_secs = "Jak často se postranní panel znovu ptá gitu, dokud je vidět. 0 časovač vypne: značky se pak obnoví jen při otevření složky a když Octa uloží soubor."
git_marks_refresh_secs_off = "Používá se jen, dokud je zapnutá aspoň jedna značka gitu."
retype_layout_sample = "Kolik hodnot přečte Změnit typ, když rozhoduje, v jakém formátu data je textový sloupec zapsán. Hlasování stojí sedm rozborů data na hodnotu, najednou ve vlákně rozhraní: při 5 000 000 hodnotách je to 35 000 000 rozborů a okno na několik sekund přestane reagovat. Zvýšení pomůže jen tehdy, když první hodnoty sloupce nereprezentují zbytek, třeba u souboru seřazeného tak, že všechny ISO řádky jsou na začátku. Zobrazené počty to nikdy nezmění. Výchozí 10 000."
retype_layout_sample_off = "Vypni Neomezeně, abys sem mohl zadat číslo."
retype_layout_sample_unlimited = "Přečte každou hodnotu ve sloupci místo vzorku. Nejpřesnější u nerovnoměrně seřazeného sloupce, ale u několika milionů řádků okno pokaždé na pár sekund zamrzne, když zvolíš typ data."
folder_compare_max_files = "Porovnání složek přestane vypisovat složku po tolika souborech a oznámí, že výsledek je neúplný. Vyšší čísla trvají déle a u velkých složek v cloudu spotřebují víc paměti."
folder_compare_max_files_off = "Je zaškrtnuto Neomezeně: vypíšou se všechny soubory."
folder_compare_max_files_unlimited = "Vypsat všechny soubory ve všech složkách, ať je jich kolik chce."
cloud_download_concurrency = "Kolik cloudových objektů stahuje sjednocení naráz. Výchozí 8, minimum 1. Stahování z objektového úložiště je hlavně čekání na odezvu, ne přenos bajtů, takže stahování jednoho po druhém nechává linku mezitím ležet ladem. Osm je zhruba to, co prohlížeč povoluje na jeden host. Zvyš to na rychlé lince s vysokou latencí; sniž na 1, pokud poskytovatel nebo proxy začne požadavky odmítat. Velmi vysoké hodnoty spustí tolik vláken naráz a jsou nejrychlejší cesta k chybě o překročení limitu."
cloud_sidebar_position = "U kterého okraje okna se ukotví prohlížeč cloudových připojení. Výchozí je vlevo. Prohlížeče u stejného okraje sdílejí jeden panel."
db_sidebar_position = "U kterého okraje okna se ukotví prohlížeč databázových připojení. Výchozí je vlevo. Prohlížeče u stejného okraje sdílejí jeden panel."
sql_format_title = "Jak tlačítko Formátovat v panelu SQL rozvrhne dotaz. Náhled níže ukazuje výsledek."
sql_format_keywords = "Zda klíčová slova jako SELECT a FROM budou velkými písmeny, malými, nebo jak jsi je napsal."
sql_format_indent = "Co je jedna úroveň odsazení: 2 mezery, 4 mezery nebo tabulátor."
sql_format_commas = "Kam patří čárka mezi dvěma položkami seznamu. Na začátku dalšího řádku chybějící čárku hned uvidíš."
sql_format_joins = "Každý JOIN začne na novém řádku na úrovni FROM, místo aby byl odsazený pod ním."
sql_format_inline = "Seznam kratší než tolik znaků zůstane na jednom řádku, třeba SELECT a, b, c. Při 0 má každá položka vlastní řádek."
sql_format_blank_lines = "Kolik prázdných řádků odděluje dva příkazy."
sql_format_one_line = "Jen uklidí mezery a velikost klíčových slov a dá každý příkaz na jeden řádek. Hodí se pro vložení do logu nebo programu."
sql_format_off_one_line = "Vypnuto, dokud je zapnuté Celý dotaz na jeden řádek: nejsou žádné zalomení k rozvržení."
sql_format_clause_width = "Klauzule kratší než tolik znaků zůstane na řádku svého klíčového slova, třeba GROUP BY c.name, a krátký poddotaz zůstane ve svých závorkách. Začíná na šířce seznamu."
sql_format_clause_needs_list = "Nejdřív nastav šířku seznamu nad 0. Samotné by to nechalo položky klauzule bez odsazení."
sql_format_bracket_width = "Závorky kratší než tolik znaků zůstanou na jednom řádku, třeba coalesce(a, 0) nebo IN (1, 2, 3). U delších je každá položka na vlastním řádku."
sql_format_semicolon = "Přidá ; za poslední příkaz, když ho nemá."
sql_format_preview = "Ukázkový dotaz rozvržený podle nastavení výše. Mění se, jak je měníš."
restore_session = "Při startu Octa znovu otevře soubory, které byly otevřené, když jsi ji zavřel. Výchozí je vypnuto. Soubory, které už neexistují, se přeskočí. Editory SQL se taky vrátí, jen s textem a souborem, takže se k ničemu nepřipojují."
restore_session_cloud = "Znovu otevře i cloudové objekty. Pozor: každý se při každém startu stahuje znovu, což trvá a může stát peníze za přenos dat."
restore_session_connections = "Znovu otevře i tabulky z databázových připojení a API endpointů. Pozor: každá při každém startu pošle dotaz na svůj server. U datového skladu ho to může probudit a stát peníze a prošlé přihlášení tě požádá o nové přihlášení."
restore_session_needs_main = "Nejdřív zapni Znovu otevřít poslední relaci."
save_as_rows = "Když hledání nebo filtr skrývá řádky, Uložit jako může zapsat všechny řádky, nebo jen ty viditelné. Ptej se pokaždé, nebo zaškrtnutí zruš a vždy se použije odpověď vybraná tady."
save_as_open = "Po Uložit jako pokračuješ v novém souboru: tato karta se na něj přepne, nebo ho otevře nová karta, když se uložily jen viditelné řádky. Ptej se pokaždé, nebo zaškrtnutí zruš a vždy se použije odpověď vybraná tady."
keep_versions = "Pokaždé, když uložíš přes soubor, se nahrazená verze uchová. Soubor > Starší verze je otevře, porovná nebo obnoví. Ve výchozím stavu vypnuto, protože to zabírá místo na disku."
versions_needs_main = "Nejdřív zapni Uchovávat starší verze."
versions_per_file = "Kolik starších verzí každého souboru uchovat. Nejstarší jde pryč první. Zaškrtni Neomezeně, chceš-li uchovat všechny."
versions_total = "Kolik místa na disku smějí zabrat všechny starší verze dohromady. Nejstarší jdou pryč první, ale nejnovější verze každého souboru zůstane vždy. Zaškrtni Neomezeně pro žádný limit."
versions_limit_off = "Zruš zaškrtnutí Neomezeně, chceš-li nastavit limit."
versions_place = "Kam jdou uchované verze. Vlastní složka Octy je drží stranou. Složka, kterou si vybereš, drží verze všech souborů. Podsložka vedle souboru je složka .octa-versions vedle každého souboru. Přímo vedle souboru dá kopie jako sales.20261020-140211-123.csv vedle sales.csv. Vedle souboru se limit místa počítá pro každou složku zvlášť. Změna nic nepřesune: verze uchované jinde zůstanou v seznamu Starší verze."
versions_dir_choose = "Vyber složku, ve které se uchovávají starší verze všech souborů."
zoom_step = "O kolik jeden krok zvětšení změní velikost, u Ctrl+Plus a Ctrl+Minus, v nabídce Zobrazení a u tlačítek + a - ve stavovém řádku. Výchozí je 5 %."
confirm_snippet_delete = "Zeptá se před smazáním SQL úryvku. Vypnuto maže hned."

