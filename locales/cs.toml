section_missingness_intro = "Sloupce, které se vyprazdňují ve stejných řádcích. Čtyři sloupce s 8 % prázdných hodnot jsou různý problém podle toho, jestli jde pokaždé o stejných 8 % řádků (jedno rozbité spojení, jedno místo k opravě), nebo o čtyři nesouvisející 8 %. Každý řádek tady je jedna taková skupina, největší jako první."
section_calendar_intro = "Díry ve sloupci s datem nebo časovým razítkem: úseky, kde řada přeskakuje místo aby šla krok za krokem. Chybějící víkendy a přechod na letní čas se nepočítají, takže vypsaný je opravdu chybějící den, hodina nebo měsíc."
