verdict_shape_na = "Netestováno: sloupec je prázdný, není text, nebo má příliš mnoho tvarů na rozhodnutí (volný text, nebo víc formátů schválně)."
hint_number_verdict = "Jestli číslování, třeba čísla faktur nebo objednávek, běží bez děr. Textová ID jako INV-2024-0007 se kontrolují pro každou řadu zvlášť. Najeď na verdikt a uvidíš, co znamená. Chybějící čísla jsou vypsaná ve vlastní záložce."
