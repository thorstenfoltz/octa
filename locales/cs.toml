verdict_calendar_dst = "Jediná díra má tvar změny času: jeden krok, v neděli, nad ránem. Časová razítka Octy nenesou zónu, takže tohle čte tvar a neví. Ověř si to, jestli u té řady záleží na hodině."
verdict_calendar_gaps = "Čas, který by měl mít řádky a nemá. Karta Díry v kalendáři vypíše každou díru s razítky po obou stranách."
verdict_calendar_not_dates = "Netestováno: sloupec neobsahuje data ani časová razítka."
verdict_calendar_too_few = "Netestováno: méně než tři různá časová razítka, to ještě není řada."
verdict_calendar_irregular = "Netestováno: žádný jednotlivý krok nepokrývá 60% rozestupů, takže není rytmus, ve kterém by se daly hledat díry. Takhle se čtou logy událostí."
verdict_shape_consistent = "Každá hodnota má stejný tvar, například každé PSČ je A-99999."
