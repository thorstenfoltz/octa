verdict_benford_marginal = "Dost vedle na druhý pohled, ale ještě to není nález. Podívej se, jak sloupec vzniká, než z něj něco vyčteš."
verdict_benford_nonconforming = "První číslice nevypadají jako měřené veličiny. Důvod dívat se dál, nikdy sám o sobě nález: zaokrouhlená, useknutá nebo ručně naťukaná čísla tu končí všechna zcela nevinně."
