mcp_intro = "MCP 서버(`octa --mcp`)의 기본값. 서버는 시작 시 한 번 읽습니다. 서버 실행 중 변경하려면 `octa --mcp` 재시작이 필요합니다."
mcp_row_limit = "호출자가 `limit`을 생략할 때 `read_table` / `run_sql`이 반환하는 최대 행 수. 도구 스키마는 이 기본값을 모델에 알려 필요 시 더 많은(또는 무제한) 행을 요청할 수 있게 합니다.\n\n기본값: 1,000. 이를 높게 설정하거나 무제한을 선택하면 매우 큰 응답이 stdio를 통해 전달되어 MCP 클라이언트가 느려질 수 있습니다."
cell_byte_cap = "셀당 전송 크기 상한. 텍스트 형식이 이를 초과하는 셀은 `[truncated: ...]` 마커로 대체되고 응답은 `cell_truncated: true`로 표시됩니다. 0으로 설정하면 상한을 비활성화합니다.\n\n기본값: 65,536 (64 KiB)."
chat_intro = "열려 있는 탭과 파일에 대해 Octa의 도구를 구동하는 내장 AI 어시스턴트. 제공자를 선택하고 API 키를 설정(또는 Ollama를 로컬로 실행)한 다음 도구 모음(분석 메뉴, 어시스턴트)에서 패널을 엽니다."
chat_max_iterations = "어시스턴트가 단일 메시지 내에서 중지하기 전에 실행할 수 있는 최대 도구 호출 라운드 수. 도구 무한 루프에 대한 보호 장치입니다."
chat_max_tokens = "응답마다 요청하는 응답 길이(토큰) 상한. 무제한은 모델이 자체 최대값을 사용하도록 합니다(Anthropic은 항상 상한이 필요하므로 거기서는 높은 값을 사용합니다)."
chat_provider = "어시스턴트가 통신하는 LLM 백엔드. 로컬로 실행되는 Ollama를 제외하고 각 제공자는 자체 API 키가 필요합니다."
chat_model = "이 제공자에 사용하는 모델. 사전 설정을 선택하거나 임의의 모델 이름을 입력하세요."
chat_ollama_url = "로컬 Ollama 서버의 루트 URL. Octa가 API 경로를 추가합니다."
chat_position = "채팅 패널이 표를 기준으로 도킹되는 위치."
chat_export_dir = "전체 경로를 지정하지 않을 때 어시스턴트가 내보낸 파일(새 CSV, 차트)을 쓰는 폴더."
chat_audit_log = "어시스턴트의 각 도구 호출을 설정 디렉터리(chat_audit/)의 로그에 추가합니다. 기본값은 꺼짐."
chat_render_markdown = "켜면 답변의 제목, 목록, 표, 코드 블록, 링크가 서식이 적용된 채로 그려져. 끄면 마크다운 원본이 그대로 보여. 네가 쓴 메시지는 절대 다시 서식이 입혀지지 않아."
chat_audit_warn = "로그가 이 크기를 초과하면 시작 시 경고를 표시합니다."
chat_api_key = "이 제공자의 API 키. 가능하면 OS 키링에, 그렇지 않으면 settings.toml에 평문으로 저장됩니다."
map_intro = "지도 보기(GeoJSON 파일에서 사용)의 기본값. 활성 탭은 지도 도구 모음으로 타일과 지오메트리만 사이를 전환할 수 있습니다."
map_default_mode = "타일: 구성된 타일 URL에서 지도를 가져옵니다.\n지오메트리만: 빈 캔버스에 피처만 그립니다."
map_fallback = "타일 가져오기에 실패하면(오프라인, 차단됨) 해당 탭에 대해 자동으로 지오메트리만 렌더링으로 전환합니다."
tile_url = "래스터 타일의 URL 패턴. `{z}/{x}/{y}`는 확대 수준과 타일 좌표로 대체됩니다. 기본값은 OSM 타일 서버를 가리킵니다 - 프로덕션 / 고부하 사용 시 자체 호스팅 또는 상용 제공자를 가리키세요."
sidebar_position = "파일 > 디렉터리 열기 로 폴더를 열 때\n디렉터리 트리가 도킹되는 쪽."
shortcuts_intro = "'기록'을 클릭한 다음 키 조합(Ctrl / Shift / Alt 포함)을 누르세요.\nEsc를 눌러 기록을 취소합니다. '지우기'는 동작을 바인딩 없이 둡니다."
initial_load_cap = "스트리밍 형식(Parquet, CSV, TSV)에서 처음 열 때\n표에 불러오는 최대 행 수. 나머지 행은\n스크롤할 때 백그라운드에서 스트리밍됩니다.\n\n기본값: 2,000,000. 높이면 첫 화면의 완전성이\n좋아지지만 메모리를 더 사용합니다. 낮추면 첫\n열기가 빨라지지만 더 많은 작업이 백그라운드\n로더로 넘어갑니다. \"무제한\"을 선택하면 상한을\n완전히 비활성화하고 모든 행을 미리 불러옵니다.\n\n숫자를 입력 - 적용 시 반영됩니다."
db_page_rows = "라이브 데이터베이스 연결에서 테이블을 열 때 요청 한 번에 가져오는 행 수입니다.\n\n기본값: 100,000. 상한이 아니라 페이지 크기입니다. 큰 Parquet 파일과 마찬가지로 스크롤하면 다음 페이지가 백그라운드에서 불러와집니다.\n\n위의 상한과는 별개 설정입니다. 그쪽은 로컬 파일 읽기를 재는 값이지만, 여기서는 수 메가바이트의 JSON이 네트워크를 타고 옵니다. 테이블 여는 게 느리게 느껴지면 줄이세요.\n\n숫자를 입력 - 적용 시 반영됩니다."
raw_view_cap = "Octa가 원시 보기 편집기로 통째로 읽어 들이는 최대 파일\n크기 (MB)입니다. 구문 분석 오류 시 원시 텍스트로 돌아가는\n동작과 비교 보기의 원시 쪽에도 적용됩니다. 이보다 큰 파일은\n메모리를 지키기 위해 원시 텍스트를 건너뜁니다.\n\n기본값: 50 MB. 크기와 상관없이 모두 읽으려면 \"무제한\"을\n체크하세요. 적용할 때 반영됩니다."
decompress_cap = "투명하게 열리는 .gz / .zst 파일의 압축 해제 후 최대 크기\n(MB)입니다. 아주 작은 압축 파일이 엄청나게 부풀 수 있으며\n(압축 폭탄), 이 상한을 넘으면 열기를 거부합니다.\n\n기본값: 4,295 MB (4 GB). 적용할 때 반영됩니다."
decompress_unlimited = "압축 해제 크기 상한을 완전히 없앱니다. 신뢰할 수 있는\n아카이브에만 체크하세요."
raw_view_unlimited = "크기 제한 없이 어떤 파일이든 전체 텍스트를 원시 보기로\n읽어 들입니다. 메모리에 여유가 있을 때만 사용하세요.\n수 GB 파일이 통째로 메모리에 올라갑니다."
initial_load_unlimited = "파일의 모든 행을 미리 불러옵니다. RAM에 여유가\n있을 때만 권장됩니다 - 1억 행 parquet는 수 GB를\n사용합니다."
syntax_size_cap = "이보다 큰 파일은 원시 편집기에서 일반 고정폭으로\n대체됩니다. 0으로 설정하면 구문 강조를 완전히\n비활성화합니다. 보호를 해제하려면 매우 큰 숫자를\n설정하세요. JSON/YAML/XML/Markdown/TOML은 절대\n강조되지 않습니다 - 전용 트리/미리보기 보기를 사용합니다.\n\n기본값: 1 MB. 숫자를 입력하고 단위를 선택 - 적용 시 반영됩니다."
open_as_text = "열 때 일반 텍스트로 처리할 추가 파일 확장자\n(일반적으로 이를 처리하는 리더를 재정의).\n쉼표 또는 공백으로 구분, 앞쪽 점 없음, 소문자.\n예: log4j  myproj  rawdata\n\n적용 시 반영되며 이후 파일 열기에 적용됩니다."
folder_union_cap = "클라우드 폴더 결합이 내려받아 합치는 파일의 최대 개수입니다.\n각 파일은 전체가 메모리에 읽히므로 수만 개의 조각이 있는 폴더는\nRAM을 소진할 수 있습니다. 상한을 넘는 파일은 건너뛰고 상태\n표시줄에 개수가 표시됩니다.\n\n기본값: 500. 적용 시 반영됩니다."
folder_union_unlimited = "폴더의 모든 파일을 개수와 무관하게 결합합니다. 메모리에 여유가\n있을 때만 체크하세요."
multi_search_cap = "다중 검색 패널 디렉터리 범위의 파일당 크기 상한.\n이보다 큰 파일은 건너뛰고 건너뛴 파일 칩에\n나열됩니다. \"무제한\"을 체크하면 상한이 완전히 사라집니다.\n\n기본값: 50 MB."
multi_search_unlimited = "크기와 무관하게 디렉터리의 모든 파일을 검색합니다. 거대한 로그나\n덤프는 검색을 멈추게 하고 메모리를 소진할 수 있습니다."
chart_max_points = "차트 탭이 균등 다운샘플링을 적용하기 전에 그릴 최대\n행 수(히스토그램, 선, 산점도). 막대 차트는 항상\n전체 입력을 집계합니다. 상자 그림은 전체 입력에 대해\n5수 요약을 계산합니다. 0으로 설정하면 다운샘플링을\n비활성화합니다 - 중간 크기의 표에만 안전합니다.\n\n기본값: 25,000. 숫자 입력은 쉼표 구분을 허용합니다."
chart_max_categories = "막대 차트가 그리기를 거부하기 전에 허용하는 고유 X\n범주의 최대 수. 이를 초과하면 렌더러가 읽을 수 없는\n막대 벽을 만드는 대신 오류를 표시합니다 - 먼저\n표를 필터링하거나 집계하세요.\n\n기본값: 200. 숫자 입력은 쉼표 구분을 허용합니다."
tables_in_picker = "다중 테이블 선택기 대화 상자(SQLite, DuckDB, ...)가\n기본 크기에서 세로로 담아야 하는 테이블 행 수. 대화\n상자는 사용자가 크기를 조절할 수 있습니다 - 데이터베이스에\n테이블이 많을 때 모서리를 끌어 크게 만드세요.\n\n기본값: 10. 최소 1."
excel_auto_open = "여러 시트가 있는 Excel 통합 문서에서 자동으로 열\n시트 수(각각 자체 탭에). 이보다 시트가 많은\n통합 문서는 선택기를 표시하여 어떤 것을 열지\n선택할 수 있게 합니다(이 수보다 많거나 전부 선택 가능).\n\n기본값: 5. 최소 1."
