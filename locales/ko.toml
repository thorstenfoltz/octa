verdict_benford_narrow = "검정 안 함: 값의 폭이 10배도 안 돼. 백분율이나 나이나 평점이 법칙을 따를 이유는 없으니, 판정을 내놔봐야 오해만 낳아."
verdict_benford_ids = "검정 안 함: 촘촘한 정수가 전부 다르니 배정된 일련번호야 (행 번호, 송장 번호, 아이디). 그런 건 나눠주는 거지 재는 게 아니야."
verdict_calendar_complete = "첫 타임스탬프부터 마지막까지 계열의 모든 단계가 있어. 설명할 구멍이 없어."
verdict_calendar_weekdays = "구멍이라고는 건너뛴 주말뿐이고, 업무 데이터는 일부러 그래. 완전한 것으로 세고, 그 주말은 구멍 탭에 올리지 않아."
verdict_calendar_dst = "유일한 구멍이 시계 변경의 모양이야: 한 단계, 일요일, 새벽. Octa의 타임스탬프에는 시간대가 없어서 이건 모양을 읽은 것이지 확인한 게 아니야. 계열에서 시각이 중요하면 확인해 봐."
verdict_calendar_gaps = "행이 있어야 하는데 없는 시간. 달력 구멍 탭이 각 구멍을 양옆 타임스탬프와 함께 보여줘."
verdict_calendar_not_dates = "검정 안 함: 열에 날짜나 타임스탬프가 없어."
verdict_calendar_too_few = "검정 안 함: 서로 다른 타임스탬프가 3개 미만이라 아직 계열이 아니야."
verdict_calendar_irregular = "검정 안 함: 어떤 간격도 전체의 60%를 넘지 못해서 구멍을 찾을 리듬이 없어. 이벤트 로그가 이렇게 읽혀."
verdict_shape_consistent = "모든 값이 같은 모양이에요. 예를 들면 모든 우편번호가 A-99999예요."
