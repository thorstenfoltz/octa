write_protection = "GUI 저장과 MCP 서버 기본 동작으로부터 파일을 보호합니다.\n켜져 있으면 SQLite, DuckDB, GeoPackage 파일에서 열을 추가하거나\n제거하는 저장이 거부됩니다. 어시스턴트는 이 설정이 아니라 채팅\n프로필별 쓰기 허용 스위치로 제어됩니다."
confirm_db_write_back = "변경 사항이 운영 중인 데이터베이스로 가기 전에 무엇이 바뀌는지 보여주고 물어봐요.\n이 옵션을 끄면 저장이 바로 적용해요. 어느 쪽이든 하나의 트랜잭션이고,\n실패하면 전부 되돌려요."
confirm_url_redirects = "웹 주소가 다른 주소로 보낼 때, 거기서 파일을 열기 전에 물어봐요. 이 확인 창이 그 변화가 보이는 유일한 곳이에요."
backup_before_modify = "어시스턴트나 스키마를 바꾸는 데이터베이스 저장이 파일을\n덮어쓰기 전에, 시간이 찍힌 .bak 파일로 옆에 먼저 복사합니다.\n일반적인 수동 저장은 백업하지 않습니다."
chat_profiles = "프로필은 저장된 설정 한 벌입니다. 공급자, 모델, 온도, 선택적 사고 예산을 원하는 이름으로 묶습니다. 같은 공급자의 프로필을 여러 개 포함해 원하는 만큼 만들고, 어시스턴트 패널에서 전환할 수 있습니다."
chat_profile_base_url = "이 프로필의 엔드포인트입니다. 비워 두면 아래에 설정한 Ollama 서버 주소를 사용합니다."
write_options = "Octa가 파일을 기록할 때 사용하는 기본값입니다. 다른 이름으로 저장과 일괄 변환이 여기서 시작하며 한 번의 실행에 한해 바꿀 수 있습니다."
status_message_secs = "상태 메시지가 사라지기 전까지 화면에 남아 있는 시간. 성공이든\n실패든 모든 메시지에 같은 시간이 적용된다.\n\n마우스를 올리면 카운트다운이 멈추므로, 읽거나 복사하는 중인\n오류는 그대로 남는다. 모든 메시지에는 바로 닫는 'x'도 있다.\n\n끌 수 없으며 3보다 작은 값은 3으로 처리한다. 기본값: 10."
