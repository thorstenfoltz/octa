section_missingness_intro = "Stĺpce, ktoré sa vyprázdňujú v tých istých riadkoch. Štyri stĺpce s 8 % prázdnych hodnôt sú iný problém podľa toho, či ide zakaždým o tých istých 8 % riadkov (jedno rozbité spojenie, jedno miesto na opravu), alebo o štyri nesúvisiace 8 %. Každý riadok tu je jedna taká skupina, najväčšia ako prvá."
section_calendar_intro = "Diery v stĺpci s dátumom alebo časovou pečiatkou: úseky, kde rad preskakuje namiesto toho, aby šiel krok za krokom. Chýbajúce víkendy a prechod na letný čas sa nerátajú, takže vypísaný je naozaj chýbajúci deň, hodina alebo mesiac."
