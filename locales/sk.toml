initial_load_cap = "Maximálny počet riadkov načítaných do tabuľky pri prvom otvorení pre\nstreamovacie formáty (Parquet, CSV, TSV). Zvyšné riadky\nsa načítavajú na pozadí počas posúvania.\n\nPredvolene: 5,000,000. Zvýšenie zlepšuje úplnosť\nprvého vykreslenia, ale používa viac pamäte. Zníženie robí\npočiatočné otvorenie rýchlejším, ale presúva viac práce na\nnačítavač na pozadí. Zaškrtnite „Neobmedzené“ na vypnutie\nlimitu úplne a načítanie každého riadku naraz.\n\nZadajte číslo - použije sa pri Použiť."
db_page_rows = "Riadky na jednu požiadavku, keď otváraš tabuľku cez živé pripojenie k databáze.\n\nPredvolené: 100,000. Je to veľkosť stránky, nie strop: ďalšia stránka sa načíta na pozadí, ako posúvaš, rovnako ako pri veľkom súbore Parquet.\n\nSamostatné nastavenie, lebo limit vyššie meria čítanie lokálneho súboru, kým tu ide po sieti megabajty JSON. Zníž ho, ak sa ti otváranie tabuľky zdá pomalé.\n\nZadajte číslo - použije sa pri Použiť."
raw_view_cap = "Maximálna veľkosť súboru (v MB), ktorý Octa načíta celý do\neditora surového zobrazenia. Riadi aj surové náhradné zobrazenie pri chybe\nspracovania a surovú stranu porovnania. Väčšie súbory surový text vynechajú,\naby sa šetrila pamäť.\n\nPredvolené: 500 MB. Zaškrtnite \"Bez obmedzenia\" na načítanie súboru\nľubovoľnej veľkosti. Použije sa pri potvrdení."
decompress_cap = "Maximálna veľkosť po rozbalení (v MB) pre priehľadne otvárané\nsúbory .gz / .zst. Malý komprimovaný súbor sa môže obrovsky nafúknuť\n(dekompresná bomba); nad týmto limitom sa otvorenie odmietne.\n\nPredvolené: 4 295 MB (4 GB). Použije sa pri potvrdení."
decompress_unlimited = "Úplne odstrániť limit veľkosti po rozbalení. Zaškrtnite len\npre archívy, ktorým dôverujete."
raw_view_unlimited = "Načítať celý text ľubovoľného súboru do surového zobrazenia bez\nobmedzenia veľkosti. Používajte len s dostatkom pamäte - súbor\ns veľkosťou niekoľkých GB sa načíta celý do pamäte."
initial_load_unlimited = "Načítať každý riadok v súbore naraz. Odporúča sa iba,\nkeď máte voľnú RAM - parquet so 100 M riadkami zožerie\nniekoľko GB."
syntax_size_cap = "Súbory väčšie ako toto prejdú na obyčajný monospace v\nsurovom editore. Nastavte 0 na vypnutie zvýrazňovania\nsyntaxe úplne; nastavte veľmi veľké číslo na vzdanie sa\nochrany. JSON/YAML/XML/Markdown/TOML sa nikdy nezvýrazňujú\n- používajú svoje vyhradené zobrazenia strom/náhľad.\n\nPredvolene: 1 MB. Zadajte číslo, vyberte jednotku - použije sa pri Použiť."
open_as_text = "Ďalšie prípony súborov, ktoré sa pri otvorení majú považovať za obyčajný\ntext (prevažuje nad čítačkou, ktorá by ich bežne nárokovala).\nOddelené čiarkou alebo medzerou, bez úvodnej bodky, malými písmenami.\nPríklad: log4j  myproj  rawdata\n\nPoužije sa pri Použiť; nadobúda účinnosť pre nasledujúce otvorenia súborov."
folder_union_cap = "Maximálny počet súborov, ktoré zlučovanie priečinka v cloude stiahne\na spojí. Každý súbor sa celý načíta do pamäte, takže priečinok s\ndesiatkami tisíc častí môže vyčerpať RAM. Súbory nad limit sa preskočia\na spočítajú v stavovom riadku.\n\nPredvolene: 500. Uplatní sa po stlačení Použiť."
folder_union_unlimited = "Zlúčiť všetky súbory v priečinku, nech je ich koľkokoľvek.\nZaškrtnite len, ak máte pamäte nazvyš."
multi_search_cap = "Limit veľkosti súboru pre rozsah adresára panela Viacnásobné hľadanie.\nSúbory väčšie ako toto sa preskočia a uvedú v značke\npreskočených súborov. Zaškrtnite \"Neobmedzené\" na úplné zrušenie limitu.\n\nPredvolene: 50 MB."
multi_search_unlimited = "Prehľadá každý súbor v adresári bez ohľadu na veľkosť. Obrovský\nlog alebo dump môže skenovanie zablokovať a zožrať pamäť."
chart_max_points = "Maximálny počet riadkov, ktoré karta Graf vykreslí predtým, ako sa\nzapne rovnomerné preriedenie (Histogram, Čiara, Bodový). Stĺpcové grafy\nvždy agregujú celý vstup; Krabicové počítajú\n5-číselný súhrn nad celým vstupom. Nastavte 0 na vypnutie\npreriedenia - bezpečné iba pre stredne veľké tabuľky.\n\nPredvolene: 100,000. Číselný vstup prijíma oddeľovače-čiarky."
chart_max_categories = "Maximálny počet rôznych kategórií X, ktoré stĺpcový graf prijme predtým, ako\nodmietne kresliť. Nad tým vykresľovač zobrazí chybu\nnamiesto vytvorenia nečitateľnej steny stĺpcov - najskôr filtrujte alebo\nagregujte tabuľku.\n\nPredvolene: 200. Číselný vstup prijíma oddeľovače-čiarky."
tables_in_picker = "Koľko riadkov tabuliek má dialóg výberu viactabuľkových zdrojov (SQLite,\nDuckDB, ...) vertikálne prispôsobiť pri predvolenej veľkosti. Dialóg\nje stále možné meniť veľkosťou - potiahnite roh, aby ste ho urobili\nväčším, keď databáza má veľa tabuliek.\n\nPredvolene: 10. Minimum 1."
excel_auto_open = "Koľko hárkov viachárkového zošita Excel otvoriť\nautomaticky (každý vo svojej karte). Zošity s viac\nhárkami ako toto zobrazia výber, aby ste si vybrali, ktoré otvoriť\n(stále môžete vybrať viac ako toto číslo, alebo všetky).\n\nPredvolene: 5. Minimum 1."
max_recent = "Počet nedávno otvorených súborov zobrazených v menu Súbor"
start_maximised = "Keď je zapnuté, okno sa spustí maximalizované a veľkosť nižšie\nsa použije ako veľkosť obnovenia z maximalizácie.\nKeď je vypnuté, okno sa spustí s vybranou veľkosťou."
initial_window_size = "Veľkosť okna pri spustení (keď je „Spustiť maximalizované“ vypnuté),\nalebo veľkosť obnovenia z maximalizácie, keď je zapnuté."
ctrl_close = "Zavrieť"
ctrl_restore = "Obnoviť"
ctrl_full_size = "Plná veľkosť"
ctrl_minimise = "Minimalizovať"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Chráni tvoje súbory pred ukladaním z rozhrania a predvoleným nastavením servera MCP.\nAk je zapnuté, pridanie alebo odobranie stĺpcov v súbore SQLite, DuckDB alebo GeoPackage\nsa pri uložení odmietne. Asistent sa riadi jednotlivými profilmi konverzácie\n(prepínačom Povoliť zápis v profile), nie týmto nastavením."
confirm_db_write_back = "Skôr než zmeny pôjdu do bežiacej databázy, Octa ukáže, čo by sa zmenilo, a spýta sa.\nVypni to, nech Uložiť použije rozdiel hneď; v oboch prípadoch ide o jednu transakciu\na neúspešný zápis sa vráti späť."
confirm_url_redirects = "Keď ťa webová adresa pošle na inú, spýtať sa skôr, než sa odtiaľ súbor otvorí. Tá otázka je jediné miesto, kde je zmena vidieť."
backup_before_modify = "Skôr než asistent alebo uloženie meniace schému databázy prepíše\nsúbor, skopírovať ho najprv vedľa do súboru .bak s časovou pečiatkou.\nBežné ručné uloženia sa nezálohujú."
chat_profiles = "Každý profil je jedno uložené nastavenie: poskytovateľ, model, teplota a voliteľný rozpočet na premýšľanie pod názvom, ktorý zvolíte. Vytvorte si ich, koľko chcete, pokojne aj niekoľko pre toho istého poskytovateľa, a prepínajte medzi nimi z panela asistenta."
chat_profile_base_url = "Koncový bod pre tento profil. Nechajte prázdne pre použitie adresy servera Ollama nastavenej nižšie."
write_options = "Predvolené hodnoty pri zápise súboru. Uložiť ako a dávkový prevod z nich vychádzajú a môžu ich pre jeden beh zmeniť."
status_message_secs = "Ako dlho zostane stavová správa na obrazovke, kým zmizne.\nRovnaký čas platí pre každú správu, úspech aj chybu.\n\nPrejdením myšou sa odpočet pozastaví - chyba, ktorú práve čítaš\nalebo kopíruješ, teda zostane. Každá správa má aj 'x' na\nokamžité zatvorenie.\n\nNedá sa vypnúť; menej ako 3 sa berie ako 3. Predvolené: 10."
chat_tools = "Ktoré nástroje smie asistent používať. Skupina core ide s každou správou; ostatné skupiny sa mu len vymenujú a jednu si načíta, keď ju úloha potrebuje. Vypnutý nástroj zmizne všade: neposiela sa, neponúka sa a je odmietnutý, keď si ho asistent aj tak zavolá."
chat_tools_enable_all = "Zapnúť všetky nástroje späť. S každou správou ide len skupina core, takže zvyšok nič nestojí, kým si ho asistent nevypýta."
chat_tools_budget = "Zhruba koľko tokenov popisy nástrojov pridajú k správe. Vypočítané z ich veľkosti, ber to teda ako vodidlo, nie ako faktúru."
sql_page_rows = "Koľko riadkov výsledku sa načíta naraz; pri posúvaní pribúdajú ďalšie. Počet riadkov aj Export vždy pokrývajú celý výsledok. 0 načíta všetko naraz."
sql_auto_register = "Spraví z každej ďalšej otvorenej karty dopytovateľnú tabuľku v SQL paneli pod jej vlastným menom, takže spojenie dvoch otvorených súborov nepotrebuje attach."
sql_auto_register_max = "Väčšie karty sa neregistrujú automaticky, lebo registrácia kopíruje ich riadky. Namiesto toho dostanú tlačidlo Registrovať."
sql_auto_register_max_off = "Používa sa len, kým je zapnuté Dopytovať ostatné otvorené karty."
git_marks_uncommitted = "Zafarbí súbory a priečinky v bočnom paneli, ktoré majú nezapísané zmeny v gite: zmenené, pridané, zmazané, premenované alebo nesledované."
git_marks_branch = "Zafarbí súbory a priečinky zmenené na aktuálnej vetve od chvíle, keď sa odštiepila od základnej vetvy."
git_marks_base_branch = "Vetva, s ktorou sa porovnáva. Keď repozitár vetvu s týmto názvom nemá, skúsi sa main; keď chýba aj tá, značka vetvy jednoducho chýba a nápoveda priečinka to hovorí."
git_marks_base_branch_off = "Používa sa len, kým je zapnuté Označovať zmeny na tejto vetve."
git_marks_refresh_secs = "Ako často sa bočný panel znovu pýta gitu, kým je viditeľný. 0 časovač vypne: značky sa potom obnovia len pri otvorení priečinka a keď Octa uloží súbor."
git_marks_refresh_secs_off = "Používa sa len, kým je zapnutá aspoň jedna značka gitu."
retype_layout_sample = "Koľko hodnôt prečíta Zmeniť typ, keď rozhoduje, v akom formáte dátumu je textový stĺpec zapísaný. Hlasovanie stojí sedem rozborov dátumu na hodnotu, naraz vo vlákne rozhrania: pri 5 000 000 hodnotách je to 35 000 000 rozborov a okno na niekoľko sekúnd prestane reagovať. Zvýšenie pomôže len vtedy, keď prvé hodnoty stĺpca nereprezentujú zvyšok, napríklad pri súbore zoradenom tak, že všetky ISO riadky sú na začiatku. Zobrazené počty to nikdy nezmení. Predvolené 10 000."
retype_layout_sample_off = "Vypni Neobmedzene, aby si sem mohol zadať číslo."
retype_layout_sample_unlimited = "Prečíta každú hodnotu v stĺpci namiesto vzorky. Najpresnejšie pri nerovnomerne zoradenom stĺpci, ale pri niekoľkých miliónoch riadkov okno zakaždým na pár sekúnd zamrzne, keď zvolíš typ dátumu."
cloud_download_concurrency = "Koľko cloudových objektov sťahuje zjednotenie naraz. Predvolené 8, minimum 1. Sťahovanie z objektového úložiska je hlavne čakanie na odozvu, nie prenos bajtov, takže sťahovanie jedného po druhom necháva linku medzitým ležať ladom. Osem je zhruba to, čo prehliadač povoľuje na jeden host. Zvýš to na rýchlej linke s vysokou latenciou; zníž na 1, ak poskytovateľ alebo proxy začne požiadavky odmietať. Veľmi vysoké hodnoty spustia toľko vlákien naraz a sú najrýchlejšia cesta k chybe o prekročení limitu."

