hint_shape_shape = "Odchylný tvar: čísla sú 9, veľké písmená A, ostatné písmená a."
hint_shape_count = "Koľko hodnôt má tento tvar."
hint_shape_example = "Jedna hodnota s týmto tvarom."
overall_explained = "Priemer známok jednotlivých stĺpcov v zostave. Prejdi myšou po záhlaví stĺpca score, kde je opísané, ako vzniká jedna známka."
verdict_benford_conforms = "Prvé číslice sedia blízko tomu, čo Benfordov zákon čaká, ako to merané alebo nasčítané hodnoty zvyčajne robia. Nič to nedokazuje: stĺpec môže sedieť a aj tak byť zle."
verdict_benford_acceptable = "Kúsok vedľa čakaných podielov, v medziach, v ktorých sa skutočné dáta pohybujú. Netreba nič riešiť."
verdict_benford_marginal = "Dosť vedľa na druhý pohľad, ale ešte to nie je nález. Pozri sa, ako stĺpec vzniká, kým z neho niečo vyčítaš."
verdict_benford_nonconforming = "Prvé číslice nevyzerajú ako merané veličiny. Dôvod pozrieť sa ďalej, nikdy sám osebe nález: zaokrúhlené, useknuté alebo ručne naťukané čísla tu končia všetky celkom nevinne."
verdict_benford_not_numbers = "Netestované: stĺpec neobsahuje čísla a zákon je o prvej číslici čísla."
verdict_benford_too_few = "Netestované: pod 300 použiteľných hodnôt, kde sú podiely číslic šum a nie rozdelenie."
verdict_benford_narrow = "Netestované: hodnoty sa zmestia do menej ako desaťnásobku. Percento, vek alebo známka nemajú dôvod ísť podľa zákona, výsledok by teda len mýlil."
verdict_benford_ids = "Netestované: husté celé čísla, všetky rôzne, teda pridelený rad (číslo riadku, číslo faktúry, id). Také veci sa rozdávajú, nemerajú."
verdict_calendar_complete = "Každý krok radu je tam, od prvej časovej pečiatky po poslednú. Žiadne diery na vysvetľovanie."
verdict_calendar_weekdays = "Jediné diery sú preskočené víkendy, a to firemné dáta robia naschvál. Počíta sa ako úplné a tie víkendy nie sú na karte dier."
verdict_calendar_dst = "Jediná diera má tvar zmeny času: jeden krok, v nedeľu, nad ránom. Časové pečiatky Octy nenesú zónu, takže toto číta tvar a nevie. Over si to, ak pri tom rade záleží na hodine."
verdict_calendar_gaps = "Čas, ktorý by mal mať riadky a nemá. Karta Diery v kalendári vypíše každú dieru s pečiatkami po oboch stranách."
verdict_calendar_not_dates = "Netestované: stĺpec neobsahuje dátumy ani časové pečiatky."
verdict_calendar_too_few = "Netestované: menej ako tri rôzne časové pečiatky, to ešte nie je rad."
verdict_calendar_irregular = "Netestované: žiadny jednotlivý krok nepokrýva 60% rozostupov, takže niet rytmu, v ktorom by sa dali hľadať diery. Takto sa čítajú logy udalostí."
verdict_shape_consistent = "Každá hodnota má rovnaký tvar, napríklad každé PSČ je A-99999."
verdict_shape_mixed = "Takmer každá hodnota má jeden tvar, pár nie. Tie bývajú preklepy alebo druhý formát; karta Zmiešané tvary ich vypíše."
verdict_shape_na = "Netestované: stĺpec je prázdny, nie je text, alebo má príliš veľa tvarov na rozhodnutie (voľný text, alebo viac formátov naschvál)."

