chat_model = "O modelo usado para este provedor. Escolha um predefinido ou digite qualquer nome de modelo."
chat_ollama_url = "URL raiz do seu servidor Ollama local. O Octa acrescenta os caminhos da API."
chat_position = "Onde o painel de chat encaixa em relação à tabela."
chat_export_dir = "Pasta onde o assistente grava os arquivos exportados (CSV novos, gráficos) quando você não informa um caminho completo."
chat_audit_log = "Acrescenta cada chamada de ferramenta do assistente a um registro no diretório de configuração (chat_audit/). Desligado por padrão."
chat_export_trace = "As exportações passam a conter também cada passo da caixa de depuração, com o prompt do sistema, as chamadas de ferramentas e os resultados, então podem conter seus dados. Só há passos nos chats desta execução do Octa, porque eles nunca são salvos."
chat_writing_apply_directly = "Desligado, a versão nova do assistente abre ao lado do seu texto atual e só entra quando você aceita. Ligado, ela vai para o editor na hora e o botão Desfazer alteração traz o texto antigo de volta. Em nenhum dos casos algo é salvo no disco."
chat_cli_program = "O Octa inicia este programa no seu computador e envia a sua pergunta para ele. Deixe vazio para usar o que está no seu PATH. Instale e entre nele primeiro. O Octa nunca vê o seu login."
chat_render_markdown = "Ligado: títulos, listas, tabelas, blocos de código e links nas respostas do assistente aparecem formatados. Desligado: você vê o Markdown bruto. Suas mensagens nunca são reformatadas."
chat_audit_warn = "Mostrar um aviso ao iniciar quando os registros de auditoria passarem deste tamanho."
chat_api_key = "Sua chave de API para este provedor. Guardada no chaveiro do sistema quando disponível; caso contrário, em texto simples em settings.toml."
map_intro = "Padrões da visualização de mapa (usada pelos arquivos GeoJSON). A aba ativa pode alternar entre Blocos e Apenas geometria pela barra do mapa."
map_default_mode = "Blocos: carregar um mapa navegável a partir da URL de blocos configurada.\nApenas geometria: desenhar só as feições em uma tela em branco."
map_fallback = "Quando a obtenção de blocos falha (offline, bloqueada), passar automaticamente a mostrar só a geometria nessa aba."
tile_url = "Padrão de URL dos blocos raster. `{z}/{x}/{y}` são substituídos pelo nível de zoom e pelas coordenadas do bloco. O padrão aponta para o servidor de blocos do OSM - para produção ou uso intenso, aponte para um provedor próprio ou comercial."
sidebar_position = "Em qual borda o navegador de pastas se encaixa. À esquerda e à direita\nredimensiona pela largura; em cima e embaixo, pela altura. Os navegadores da nuvem e\ndos bancos de dados têm suas próprias posições em Painéis."
shortcuts_intro = "Clique em 'Gravar' e pressione uma combinação de teclas (com Ctrl / Shift / Alt).\nPressione Esc para cancelar a gravação. 'Limpar' deixa a ação sem atalho."
initial_load_cap = "Máximo de linhas carregadas na tabela na primeira abertura dos\nformatos em fluxo (Parquet, CSV, TSV). As linhas restantes\nchegam em segundo plano enquanto você rola.\n\nPadrão: 2.000.000. Aumentar deixa a primeira exibição\nmais completa, mas usa mais memória. Diminuir deixa a\nabertura inicial mais rápida, mas passa mais trabalho ao\ncarregador em segundo plano. Marque \"Ilimitado\" para desligar\no limite por completo e carregar todas as linhas de uma vez.\n\nDigite um número - aplicado ao clicar em Aplicar."
db_page_rows = "Linhas buscadas por requisição quando você abre uma tabela de uma conexão com um banco de dados ao vivo.\n\nPadrão: 100.000. É um tamanho de página, não um teto: a página seguinte carrega em segundo plano enquanto você rola, como num arquivo Parquet grande.\n\nÉ separado do limite acima porque aquele mede a leitura de um arquivo local, enquanto este vira megabytes de JSON pela rede. Diminua se abrir uma tabela parecer lento.\n\nDigite um número - aplicado ao clicar em Aplicar."
raw_view_cap = "Tamanho máximo de arquivo (em MB) que o Octa lê por inteiro para o editor\nda visualização bruta. Também limita o recurso ao texto bruto depois de um erro\nde interpretação e o lado bruto da visualização de comparação. Os arquivos maiores\ndispensam o texto bruto para proteger a memória.\n\nPadrão: 50 MB. Marque \"Ilimitado\" para carregar qualquer arquivo\nseja qual for o tamanho. Aplicado ao clicar em Aplicar."
decompress_cap = "Tamanho máximo descomprimido (em MB) dos arquivos .gz / .zst\nabertos de forma transparente. Um arquivo comprimido minúsculo pode crescer muito\n(uma bomba de descompressão); acima deste limite a abertura é recusada.\n\nPadrão: 4.295 MB (4 GB). Aplicado ao clicar em Aplicar."
decompress_unlimited = "Retirar por completo o limite de tamanho da descompressão. Marque isto\nsó para arquivos compactados em que você confia."
raw_view_unlimited = "Ler o texto completo de qualquer arquivo na visualização bruta, sem\nlimite de tamanho. Use só com RAM sobrando - um arquivo de vários GB\né lido inteiro para a memória."
initial_load_unlimited = "Carregar todas as linhas do arquivo de uma vez. Só recomendado\nquando você tem RAM sobrando - um parquet de 100 M de linhas consome\nvários GB."
syntax_size_cap = "Os arquivos maiores que isto passam para monoespaçado simples no\neditor bruto. Defina 0 para desligar por completo o realce de sintaxe;\ndefina um número muito grande para dispensar a\nproteção. JSON/YAML/XML/Markdown/TOML nunca são realçados\n- usam suas próprias visualizações de árvore/prévia.\n\nPadrão: 1 MB. Digite um número e escolha uma unidade - aplicado ao clicar em Aplicar."
open_as_text = "Extensões de arquivo extras a tratar como texto simples ao abrir\n(passam na frente do leitor que normalmente as reivindicaria).\nSeparadas por vírgulas ou espaços, sem ponto inicial, em minúsculas.\nExemplo: log4j  myproj  rawdata\n\nAplicado ao clicar em Aplicar; tem efeito nas próximas aberturas."
folder_union_cap = "Número máximo de arquivos que uma união de pasta na nuvem baixa e\njunta. Cada arquivo é lido inteiro para a memória, então uma pasta\ncom dezenas de milhares de partes pode esgotar a RAM. Os arquivos\nacima do limite são ignorados e contados na barra de status.\n\nPadrão: 500. Aplicado ao clicar em Aplicar."
folder_union_unlimited = "Unir todos os arquivos da pasta, quantos forem.\nUse só com RAM sobrando."
multi_search_cap = "Limite de tamanho por arquivo para o escopo de diretório do painel\nde pesquisa múltipla. Os arquivos maiores são ignorados e listados na\netiqueta de arquivos ignorados. Marque \"Ilimitado\" para tirar o limite por completo.\n\nPadrão: 50 MB."
multi_search_unlimited = "Varre todos os arquivos do diretório, seja qual for o tamanho. Um log enorme\nou um dump pode travar a varredura e consumir memória."
chart_max_points = "Máximo de linhas que a aba Gráfico plota antes de entrar uma\namostragem uniforme (Histograma, Linha, Dispersão). Os gráficos de barras\nsempre agregam todos os dados; os box plots calculam o\nresumo de 5 números sobre todos os dados. Defina 0 para desligar\na amostragem - só é seguro em tabelas de tamanho moderado.\n\nPadrão: 25.000. O campo numérico aceita separadores de vírgula."
chart_max_categories = "Máximo de categorias X distintas que um gráfico de barras aceita antes\nde se recusar a desenhar. Acima disso aparece um erro\nem vez de um muro ilegível de barras - filtre ou\nagregue a tabela primeiro.\n\nPadrão: 200. O campo numérico aceita separadores de vírgula."
tables_in_picker = "Quantas linhas de tabelas o seletor de várias tabelas (SQLite,\nDuckDB, ...) deve mostrar na vertical no tamanho padrão. A\ncaixa de diálogo continua redimensionável - arraste o canto para\naumentá-la quando um banco de dados tem muitas tabelas.\n\nPadrão: 10. Mínimo 1."
excel_auto_open = "Quantas planilhas de uma pasta de trabalho do Excel com várias planilhas abrir\nautomaticamente (cada uma na sua aba). As pastas de trabalho com mais\nplanilhas mostram um seletor para você escolher quais abrir\n(você pode escolher mais do que este número, ou todas).\n\nPadrão: 5. Mínimo 1."
max_recent = "Número de arquivos abertos recentemente mostrados no menu Arquivo"
start_maximised = "Ligado: a janela abre maximizada (ocupa a tela inteira)\ne o tamanho abaixo só vale quando você\ntira a janela do estado maximizado. Desligado: a janela abre no tamanho escolhido."
open_in_running_instance = "Ligado: clicar duas vezes em um arquivo, ou rodar octa com um arquivo, acrescenta uma aba ao Octa que já está aberto. Iniciar o Octa sem arquivo continua abrindo um segundo. Desligado: cada início é um Octa separado. Tem efeito na próxima vez que o Octa iniciar."
notify_on_finish = "Ligado por padrão: quando uma tarefa que demorou um pouco termina e o Octa não é a janela da frente, seu sistema mostra uma notificação dizendo o que terminou e quanto tempo levou."
notify_after_secs = "As tarefas mais curtas terminam enquanto você ainda está olhando, então não recebem notificação."
notify_after_secs_off = "Ligue primeiro as notificações."
notify_test = "Mostra agora uma notificação, para você ver como é e confirmar que seu sistema deixa o Octa enviá-las."
notify_when_focused = "Desligado por padrão. Ligado: você também recebe a notificação quando o Octa é a janela da frente, desde que a tarefa tenha demorado o suficiente."
initial_window_size = "Tamanho em pixels da janela quando NÃO está maximizada. Uma janela\nmaximizada sempre ocupa a tela inteira, então numa janela maximizada todos\nos tamanhos parecem iguais; isto só vale quando você tira do estado maximizado\n(ou com \"Iniciar maximizado\" desligado)."
ctrl_close = "Fechar"
ctrl_restore = "Restaurar"
ctrl_full_size = "Tamanho completo"
ctrl_minimise = "Minimizar"
write_protection = "Quando ligado, salvar um arquivo SQLite, DuckDB ou GeoPackage é recusado se colunas foram adicionadas ou removidas. Vale para os salvamentos no aplicativo e para o servidor MCP, que lê a configuração uma vez ao iniciar. O assistente segue a opção Permitir gravação do perfil dele."
chat_profile_may_override = "Este é o valor padrão. Um perfil de modelo pode definir o seu."
confirm_db_write_back = "Antes de as edições irem para um banco de dados ao vivo, mostrar o que mudaria e perguntar.\nDesligue isso para que Salvar aplique as diferenças na hora; nos dois casos é\numa única transação, e uma gravação com falha é revertida do mesmo jeito."
db_pushdown = "Quando uma aba de banco de dados tem só parte da sua tabela, o Resumo, a Frequência de valores, o relatório de qualidade, a Correlação, o Localizador de chaves de junção, o Diagnóstico de junção, Encontrar tabelas de consulta e Medir do mapa de relações rodam como SQL no servidor sobre todas as linhas, sem baixá-las.\nDesligue isso para rodá-los sobre as linhas carregadas."
auto_refresh_min = "A atualização automática recusa um intervalo menor em uma aba de banco de dados ou de API."
auto_refresh_min_billed = "O mesmo vale para BigQuery, Athena e Snowflake, onde cada leitura custa dinheiro."
confirm_url_redirects = "Quando um endereço web redireciona você para outro, perguntar antes de abrir o arquivo a partir de lá. A confirmação é o único lugar onde essa mudança aparece."
backup_before_modify = "Antes de o assistente ou um salvamento de banco de dados que muda o esquema sobrescrever\num arquivo, ele é primeiro copiado para um arquivo .bak com data e hora ao lado.\nOs salvamentos manuais comuns não têm backup."
chat_profiles = "Cada perfil é uma configuração salva: um provedor, um modelo, uma temperatura e um orçamento de raciocínio opcional, com o nome que você escolher. Crie quantos quiser, inclusive vários do mesmo provedor, e alterne entre eles no painel do assistente."
chat_profile_base_url = "Endpoint deste perfil. Deixe vazio para usar o endereço do servidor Ollama definido abaixo."
write_options = "Padrões usados quando o Octa grava um arquivo. Salvar como e a conversão em lote partem daqui e podem alterá-los em uma execução."
status_message_secs = "Quanto tempo uma mensagem de status fica na tela antes de sumir.\nA mesma duração vale para todas as mensagens, de sucesso ou de falha.\n\nPassar o mouse por cima da mensagem pausa a contagem, então um erro que\nvocê está lendo ou copiando fica no lugar. Cada mensagem também tem um\n'x' para fechá-la na hora.\n\nNão pode ser desligado; valores abaixo de 3 contam como 3.\nPadrão: 10."
chat_tools = "Quais ferramentas o assistente pode usar. O grupo básico vai com cada mensagem; dos outros grupos só o nome é passado ao assistente, que carrega um quando um trabalho precisa. Desligar uma ferramenta tira ela de todo lugar: não é enviada, não é oferecida e é recusada se o assistente pedir mesmo assim."
chat_tools_enable_all = "Ligar de novo todas as ferramentas. Só o grupo básico vai com cada mensagem, então o resto não custa nada até o assistente pedir."
chat_tools_budget = "Mais ou menos quantos tokens as descrições das ferramentas acrescentam a uma mensagem. Calculado pelo tamanho delas, então leia como orientação, não como uma fatura."
sql_page_rows = "Quantas linhas de resultado são buscadas por vez; chegam mais enquanto você rola. A contagem de linhas e Exportar sempre cobrem o resultado inteiro. 0 carrega tudo de uma vez."
sql_auto_register = "Torna cada uma das outras abas abertas consultável no painel SQL com o próprio nome, para que juntar dois arquivos abertos não precise de nenhuma etapa de anexar."
sql_auto_register_max = "As abas maiores que isto não são registradas automaticamente, porque registrar copia as linhas delas. Em vez disso recebem um botão Registrar."
sql_auto_register_max_off = "Só é usado enquanto Consultar outras abas abertas estiver ligado."
git_marks_uncommitted = "Colore os arquivos e as pastas da barra lateral que têm alterações git não confirmadas: modificados, adicionados, excluídos, renomeados ou não rastreados."
git_marks_branch = "Colore os arquivos e as pastas alterados no branch atual desde que ele se separou do branch base."
git_marks_base_branch = "Branch com o qual se compara. Quando um repositório não tem nenhum branch com este nome, tenta-se main; se também faltar, a marca de branch simplesmente não aparece e a dica da pasta avisa."
git_marks_base_branch_off = "Só é usado enquanto Marcar alterações neste branch estiver ligado."
git_marks_refresh_secs = "Com que frequência a barra lateral volta a perguntar ao git enquanto está visível. 0 desliga o temporizador: então as marcas só se atualizam ao abrir uma pasta e quando o Octa salva um arquivo."
git_marks_refresh_secs_off = "Só é usado enquanto pelo menos uma marca git estiver ligada."
retype_layout_sample = "Quantos valores o Alterar tipo lê para decidir qual formato de data uma coluna de texto usa. A votação custa sete interpretações de data por valor, de uma vez só na thread da interface: com 5.000.000 de valores são 35.000.000 de interpretações e a janela para de responder por segundos com um único clique. Aumentar só ajuda quando os primeiros valores de uma coluna não representam o resto, como num arquivo ordenado com todas as linhas em formato ISO na frente. Nunca muda uma contagem exibida. Padrão 10.000."
retype_layout_sample_off = "Desligue Ilimitado para digitar um número aqui."
retype_layout_sample_unlimited = "Lê todos os valores da coluna em vez de uma amostra. É a escolha mais exata em uma coluna ordenada de forma irregular, mas em uma coluna com vários milhões de linhas a janela para de responder por segundos sempre que você escolhe um tipo de data."
folder_compare_max_files = "Comparar pastas para de listar uma pasta depois deste número de arquivos e avisa que o resultado está incompleto. Números maiores demoram mais e usam mais memória em buckets grandes."
folder_compare_max_files_off = "Ilimitado está marcado: todos os arquivos são listados."
folder_compare_max_files_unlimited = "Lista todos os arquivos de todas as pastas, quantos forem."
cloud_download_concurrency = "Quantos objetos uma conexão com a nuvem processa ao mesmo tempo quando uma tarefa envolve muitos, como uma união, copiar, mover ou excluir uma pasta, ou comparar pastas. Uma conexão pode definir seu próprio número no formulário dela. Padrão 8, mínimo 1. Um armazenamento de objetos passa a maior parte do tempo esperando a resposta, então um objeto depois do outro deixa a conexão parada. Baixe para 1 se um provedor ou proxy começar a recusar pedidos. Valores muito altos iniciam essa quantidade de threads de uma vez e logo geram um erro de limite de requisições."
cloud_sidebar_position = "Em qual borda da janela o navegador de conexões na nuvem se encaixa. À esquerda por padrão. Os navegadores na mesma borda dividem um painel."
db_sidebar_position = "Em qual borda da janela o navegador de conexões de banco de dados se encaixa. À esquerda por padrão. Os navegadores na mesma borda dividem um painel."
sql_format_title = "Como o botão Formatar do painel SQL organiza uma consulta. A visualização abaixo mostra o resultado."
sql_format_keywords = "Se as palavras-chave como SELECT e FROM saem em maiúsculas, em minúsculas ou como você digitou."
sql_format_indent = "O que é um nível de recuo: 2 espaços, 4 espaços ou uma tabulação."
sql_format_commas = "Onde fica a vírgula entre dois itens de uma lista. No início da linha seguinte, uma vírgula faltando fica fácil de ver."
sql_format_joins = "Começar cada JOIN em uma linha nova no nível do FROM, em vez de recuado embaixo dele."
sql_format_inline = "Uma lista mais curta que este número de caracteres fica em uma linha, como SELECT a, b, c. 0 coloca cada item na sua própria linha."
sql_format_blank_lines = "Quantas linhas vazias separam duas instruções."
sql_format_one_line = "Só arruma os espaços e as maiúsculas das palavras-chave e coloca cada instrução em uma linha. Prático para colar em um log ou em um programa."
sql_format_off_one_line = "Desligado enquanto Consulta inteira em uma linha estiver ligado: não há quebras de linha para organizar."
sql_format_clause_width = "Uma cláusula mais curta que este número de caracteres fica na linha da sua palavra-chave, como GROUP BY c.name, e uma subconsulta curta fica dentro dos parênteses. Começa na largura de lista."
sql_format_clause_needs_list = "Coloque primeiro a largura de lista acima de 0. Sozinha, esta opção deixaria os itens de uma cláusula sem recuo."
sql_format_bracket_width = "Os parênteses mais curtos que este número de caracteres ficam em uma linha, como coalesce(a, 0) ou IN (1, 2, 3). Os mais longos colocam cada item na sua própria linha."
sql_format_semicolon = "Acrescenta ; depois da última instrução quando não tem."
sql_format_preview = "Uma consulta de exemplo organizada com as configurações acima. Muda conforme você as altera."
restore_session = "Quando o Octa inicia, abre de novo os arquivos que estavam abertos quando você o fechou. Desligado por padrão. Os arquivos que já não existem são ignorados. Os editores SQL também voltam, só com o texto e o arquivo, então nada se conecta."
restore_session_cloud = "Reabrir também os objetos na nuvem. Cuidado: cada um é baixado de novo a cada início, o que leva tempo e pode custar dinheiro em transferência de dados."
restore_session_connections = "Reabrir também as tabelas das conexões de banco de dados e dos endpoints de API. Cuidado: cada uma envia uma consulta ao seu servidor a cada início. Em um data warehouse isso pode acordá-lo e custar dinheiro, e um login expirado pede que você entre de novo."
restore_session_needs_main = "Ligue primeiro Reabrir a última sessão."
save_as_rows = "Quando uma pesquisa ou um filtro esconde linhas, Salvar como pode gravar todas as linhas ou só as que você vê. Pergunta sempre, ou desmarque para usar sempre a resposta escolhida aqui."
save_as_open = "Depois de Salvar como, continuar no arquivo novo: esta aba passa para ele, ou ele abre em uma aba nova quando só as linhas que você vê foram salvas. Pergunta sempre, ou desmarque para usar sempre a resposta escolhida aqui."
keep_versions = "Sempre que você salva por cima de um arquivo, manter a versão que ele substitui. Arquivo > Versões anteriores abre, compara ou restaura essas versões. Desligado por padrão, porque ocupa espaço em disco."
versions_needs_main = "Ligue primeiro Manter versões anteriores."
versions_per_file = "Quantas versões anteriores manter de cada arquivo. A mais antiga sai primeiro. Marque Ilimitado para manter todas."
versions_total = "Quanto espaço em disco todas as versões anteriores podem usar juntas. As mais antigas saem primeiro, mas a versão mais recente de cada arquivo é sempre mantida. Marque Ilimitado para não ter limite."
versions_limit_off = "Desmarque Ilimitado para definir um limite."
versions_place = "Para onde vão as versões mantidas. A pasta do próprio Octa as deixa fora do caminho. Uma pasta que você escolhe guarda as versões de todos os arquivos. Uma subpasta ao lado do arquivo é uma pasta .octa-versions junto de cada arquivo. Bem ao lado do arquivo coloca cópias como sales.20261020-140211-123.csv junto de sales.csv. Ao lado do arquivo, o limite de espaço conta cada pasta separadamente. Mudar isto não move nada: as versões mantidas em outro lugar continuam listadas em Versões anteriores."
versions_dir_choose = "Escolha a pasta que guarda as versões anteriores de todos os arquivos."
zoom_step = "Quanto um passo de zoom muda o tamanho, com Ctrl+Mais e Ctrl+Menos, no menu Exibir e com os botões + e - na barra de status. 5 por cento por padrão."
confirm_snippet_delete = "Pergunta antes de apagar um trecho SQL. Desligado apaga na hora."

