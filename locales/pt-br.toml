warn_unalign = "Confirmar antes de desligar uma opção de formatação da visualização bruta -\nrecarrega o arquivo do disco e descarta as edições no buffer."
detect_dates = "Transformar as colunas de texto que só contêm datas em colunas de datas\nao abrir um arquivo.\n\nArquivos grandes: abrir fica mais lento, cerca de três segundos\npor coluna de datas com cinco milhões de linhas. Colunas > Detectar datas\nfaz isso sob demanda."
warn_date_change = "Mostrar um banner quando a detecção de datas reescreve uma coluna\nna forma de exibição ISO (ex.: salva como 02.05.2026,\nmostrada como 2026-05-02). Desligue para silenciar o aviso."
