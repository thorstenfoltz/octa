verdict_calendar_not_dates = "Não testado: a coluna não tem datas nem timestamps."
verdict_calendar_too_few = "Não testado: menos de três timestamps distintos, o que ainda não é uma série."
verdict_calendar_irregular = "Não testado: nenhum passo cobre 60% dos intervalos, então não há ritmo em que procurar buracos. Os logs de eventos aparecem assim."
verdict_shape_consistent = "Todos os valores têm a mesma forma, por exemplo todos os códigos postais são A-99999."
verdict_shape_mixed = "Quase todos os valores têm uma forma e alguns não. Esses poucos costumam ser erros de digitação ou um segundo formato; a aba Formas misturadas os lista."
