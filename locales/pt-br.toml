mcp_intro = "Padrões do servidor MCP (`octa --mcp`). O servidor os lê uma vez ao iniciar; alterá-los com um servidor em execução exige reiniciar `octa --mcp`."
mcp_row_limit = "Máximo de linhas retornadas por `read_table` / `run_sql` quando quem chama omite `limit`. O esquema da ferramenta anuncia este padrão ao modelo para que ele possa pedir mais (ou ilimitado) quando precisar.\n\nPadrão: 1.000. Um valor alto - ou marcar Ilimitado - pode empurrar respostas muito grandes pelo stdio e deixar o cliente MCP lento."
cell_byte_cap = "Limite de tamanho por célula na transmissão. As células cuja forma textual excede isto são substituídas por um marcador `[truncated: ...]` e a resposta indica `cell_truncated: true`. Defina 0 para desativar o limite.\n\nPadrão: 65.536 (64 KiB)."
chat_intro = "Assistente de IA integrado que usa as ferramentas do Octa sobre suas abas e arquivos abertos. Escolha um provedor e defina a chave de API (ou execute o Ollama localmente) e depois abra o painel pela barra de ferramentas (menu Analisar, Assistente)."
chat_max_iterations = "Número máximo de rodadas de chamadas de ferramentas que o assistente pode fazer em uma única mensagem antes de ter que parar. Uma proteção contra loops de ferramentas descontrolados."
chat_max_tokens = "Limite do tamanho da resposta (em tokens) pedido por resposta. Ilimitado deixa o modelo usar o próprio máximo (a Anthropic sempre precisa de um limite, então ali é usado um valor alto)."
