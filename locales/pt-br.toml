clean_headers = "Normalizar os cabeçalhos das colunas para identificadores snake_case em minúsculas\nao carregar um arquivo (remoção de espaços, minúsculas, espaços e pontuação\nviram sublinhados, os duplicados recebem um sufixo numérico)."
offer_repair = "Quando um CSV/TSV é lido mas parece malformado (codificação\nerrada, caracteres de controle, um\ndelimitador que não bate com a extensão ou\nlinhas muito irregulares), mostrar um aviso oferecendo\nrepará-lo e recarregá-lo. Desligado por padrão; o reparo\nsó roda se você confirmar."
readonly_notice = "Mostrar uma janela de confirmação sempre que o modo somente leitura\né ligado ou desligado (com F8 ou o menu Exibir). Desligue para\nmudar o estado em silêncio."
notebook_output = "Posição da saída do código na visualização de notebook Jupyter\n(só se aplica a arquivos .ipynb no modo de visualização de notebook)"
sql_open_default = "Ao abrir um arquivo tabular, mostrar automaticamente o\neditor SQL ao lado da visualização de tabela."
sql_keep_open = "Quando uma aba fecha ou um arquivo abre nela, o editor SQL aberto continua aberto e guarda suas consultas.\nDesligado: o editor pertence à aba e fecha junto com ela."
