mcp_row_limit = "呼び出し側が `limit` を省略したときに `read_table` / `run_sql` が返す最大行数。ツールスキーマはこの既定値をモデルに通知し、必要に応じてさらに多く(または無制限)を要求できるようにします。\n\n既定: 1,000。これを高く設定する - または無制限をチェックする - と、非常に大きな応答が stdio を通り、MCP クライアントを遅くする可能性があります。"
