chat_intro = "開いているタブやファイルに対して Octa のツールを操作する組み込み AI アシスタント。プロバイダーを選んでその API キーを設定する(またはローカルで Ollama を実行する)と、ツールバー(分析メニュー、アシスタント)からパネルを開けます。"
