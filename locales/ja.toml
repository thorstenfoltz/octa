initial_load_cap = "ストリーミング形式(Parquet、CSV、TSV)で初回に\nテーブルへ読み込む最大行数。残りの行は\nスクロールに応じてバックグラウンドで読み込まれます。\n\n既定: 2,000,000。上げると初回描画の完全性は\n向上しますが、メモリを多く使います。下げると\n初回の表示は速くなりますが、より多くの作業が\nバックグラウンドローダーに回ります。「無制限」を\nチェックすると上限を完全に無効にし、すべての行を\n前もって読み込みます。\n\n数値を入力 - 適用時に反映されます。"
db_page_rows = "ライブデータベース接続からテーブルを開くときに、1リクエストで取得する行数です。\n\n既定値: 100,000。これは上限ではなくページサイズで、大きなParquetファイルと同じように、スクロールすると次のページがバックグラウンドで読み込まれます。\n\n上の上限とは別の設定です。あちらはローカルファイルの読み込みを測るものですが、こちらはネットワーク越しに数メガバイトのJSONが流れます。テーブルを開くのが遅く感じたら小さくしてください。\n\n数値を入力 - 適用時に反映されます。"
raw_view_cap = "Octa が生ビューのエディターに丸ごと読み込むファイルサイズの\n上限 (MB) です。解析エラー時の生テキストへの切り替えや、\n比較ビューの生側もこの設定に従います。これより大きい\nファイルはメモリを守るため生テキストを読み込みません。\n\n既定: 50 MB。サイズに関係なく読み込むには \"無制限\" に\nチェックしてください。適用時に反映されます。"
decompress_cap = "透過的に開かれる .gz / .zst ファイルの展開後サイズの上限\n(MB) です。ごく小さな圧縮ファイルが巨大に膨らむことがあり\n(解凍爆弾)、この上限を超えると開くのを拒否します。\n\n既定: 4,295 MB (4 GB)。適用時に反映されます。"
decompress_unlimited = "展開サイズの上限を完全に外します。信頼できるアーカイブに\nのみチェックしてください。"
raw_view_unlimited = "サイズ制限なしで、どんなファイルでも全文を生ビューに\n読み込みます。メモリに余裕がある場合のみ使ってください。\n数 GB のファイルがそのままメモリに載ります。"
initial_load_unlimited = "ファイルのすべての行を前もって読み込みます。RAM に\n余裕があるときのみ推奨 - 1 億行の parquet は\n数 GB を消費します。"
syntax_size_cap = "これより大きいファイルは生エディターでプレーンな\n等幅にフォールバックします。0 に設定すると構文\nハイライトを完全に無効にします。非常に大きな数値を\n設定するとガードを無効にできます。JSON/YAML/XML/\nMarkdown/TOML は決してハイライトされません - 専用の\nツリー/プレビュー表示を使います。\n\n既定: 1 MB。数値を入力し、単位を選択 - 適用時に反映されます。"
open_as_text = "開くときにプレーンテキストとして扱う追加のファイル\n拡張子(通常それらを処理するリーダーを上書きします)。\nカンマまたは空白区切り、先頭のドットなし、小文字。\n例: log4j  myproj  rawdata\n\n適用時に反映され、以降のファイルを開くときに有効になります。"
folder_union_cap = "クラウドのフォルダー結合がダウンロードして結合するファイルの\n最大数です。各ファイルは全体がメモリに読み込まれるため、数万の\nパートを含むフォルダーはメモリを使い切る可能性があります。上限を\n超えたファイルはスキップされ、ステータスバーに件数が表示されます。\n\n既定: 500。適用時に反映されます。"
folder_union_unlimited = "フォルダー内のすべてのファイルを、数に関係なく結合します。\nメモリに余裕がある場合のみチェックしてください。"
multi_search_cap = "マルチ検索パネルのディレクトリ範囲のファイルごとの\nサイズ上限。これより大きいファイルはスキップされ、\nスキップ済みファイルのチップに列挙されます。\"無制限\" に\nチェックすると上限を完全に外します。\n\n既定: 50 MB。"
multi_search_unlimited = "サイズに関係なくディレクトリ内のすべてのファイルを走査します。\n巨大なログやダンプはスキャンを止め、メモリを食い潰すことがあります。"
chart_max_points = "チャートタブが均等な間引きを行う前に描画する最大\n行数(ヒストグラム、折れ線、散布図)。棒グラフは常に\n入力全体を集計します。箱ひげ図は入力全体で 5 数\n要約を計算します。0 に設定すると間引きを無効にします\n- 中程度のサイズのテーブルでのみ安全です。\n\n既定: 25,000。数値入力はカンマ区切りを受け付けます。"
chart_max_categories = "棒グラフが描画を拒否する前に受け入れる個別の X\nカテゴリの最大数。これを超えると、判読不能な棒の壁を\n生成する代わりにエラーを表示します - まずテーブルを\n絞り込むか集計してください。\n\n既定: 200。数値入力はカンマ区切りを受け付けます。"
tables_in_picker = "複数テーブルピッカーダイアログ(SQLite、DuckDB、...)が\n既定サイズで縦に収めるべきテーブル行の数。ダイアログは\nユーザーがサイズ変更できます - データベースに多くの\nテーブルがあるときは角をドラッグして大きくしてください。\n\n既定: 10。最小 1。"
excel_auto_open = "複数シートの Excel ブックのうち自動で開くシート数\n(それぞれ独自のタブに)。これより多くのシートを持つ\nブックはピッカーを表示し、どれを開くか選べます\n(この数より多く、またはすべてを選ぶこともできます)。\n\n既定: 5。最小 1。"
max_recent = "ファイルメニューに表示する最近開いたファイルの数"
start_maximised = "オンのとき、ウィンドウは最大化して起動し、下の\nサイズが最大化からの復元サイズとして使われます。\nオフのとき、ウィンドウは選択したサイズで起動します。"
initial_window_size = "起動時に使うウィンドウサイズ(「最大化して起動」がオフのとき)、\nまたはオンのときは最大化からの復元サイズ。"
ctrl_close = "閉じる"
ctrl_restore = "元に戻す"
ctrl_full_size = "フルサイズ"
ctrl_minimise = "最小化"

write_protection = "GUI からの保存と MCP サーバーの既定動作からファイルを守ります。\nオンのとき、SQLite、DuckDB、GeoPackage ファイルでの列の追加や削除は\n保存時に拒否されます。アシスタントはこの設定ではなく、チャット\nプロファイルごとの「書き込みを許可」で制御されます。"
confirm_db_write_back = "変更が稼働中のデータベースに反映される前に、何が変わるかを表示して確認します。\nオフにすると保存が差分をすぐ適用します。どちらでも 1 つのトランザクションで、\n失敗すればすべて元に戻ります。"
db_pushdown = "データベースのタブがテーブルの一部しか持っていないとき、サマリー、値の頻度、品質レポート、相関、結合キーの検出、結合の診断、ルックアップ表を探す、関係マップの計測は、ダウンロードせずにサーバー上でSQLとして全行に対して実行されます。\nオフにすると、読み込み済みの行で実行します。"
confirm_url_redirects = "ウェブアドレスが別のアドレスへ転送したとき、そこからファイルを開く前に確認します。この確認が、その入れ替わりに気づける唯一の場所です。"
backup_before_modify = "アシスタントやスキーマを変更するデータベース保存がファイルを\n上書きする前に、タイムスタンプ付きの .bak ファイルとして隣にコピーします。\n通常の手動保存はバックアップされません。"
chat_profiles = "プロファイルは保存済みの設定一式です。プロバイダー、モデル、温度、任意の思考予算を、好きな名前でまとめます。同じプロバイダーの複数プロファイルを含め、いくつでも作成でき、アシスタントパネルから切り替えられます。"
chat_profile_base_url = "このプロファイルのエンドポイントです。空欄にすると、下で設定した Ollama サーバーのアドレスを使います。"
write_options = "Octa がファイルを書き込むときの既定値です。名前を付けて保存と一括変換はここから始まり、1 回の実行だけ変更できます。"
status_message_secs = "ステータスメッセージが消えるまで画面に残る時間。成功も失敗も、\nすべてのメッセージで同じ長さになる。\n\nマウスを重ねるとカウントダウンが止まるので、読んでいる途中や\nコピー中のエラーはそのまま残る。どのメッセージにもすぐ閉じる\nための 'x' がある。\n\nオフにはできない。3 未満は 3 として扱う。既定値: 10。"
chat_tools = "アシスタントが使ってよいツールです。core グループは毎回のメッセージに付いていき、ほかのグループは名前だけ伝えてあって、仕事に必要になったときにアシスタントが読み込みます。オフにしたツールはどこからも消えます。送られず、提示されず、それでも呼ばれたら拒否されます。"
chat_tools_enable_all = "すべてのツールをまた有効にします。毎回のメッセージに付いていくのは core グループだけなので、残りはアシスタントが求めるまで何もかかりません。"
chat_tools_budget = "ツールの説明がメッセージにおおよそ何トークン足すかです。大きさから計算した値なので、請求書ではなく目安として読んでください。"
sql_page_rows = "一度に取ってくる結果行数。スクロールすると続きが届く。行数の表示とエクスポートは常に結果全体を対象にする。0 なら一度に全部読み込む。"
sql_auto_register = "開いている他のタブを、それぞれの名前で SQL パネルから問い合わせられるようにする。開いた 2 つのファイルの結合に attach がいらなくなる。"
sql_auto_register_max = "これより大きいタブは自動登録しない。登録は行をコピーするため。代わりに登録ボタンが出る。"
sql_auto_register_max_off = "開いている他のタブに問い合わせるがオンのときだけ使われる。"
git_marks_uncommitted = "サイドバーで、未コミットの git 変更があるファイルとフォルダーに色を付けます。変更、追加、削除、名前変更、未追跡が対象です。"
git_marks_branch = "基準ブランチから分岐して以降、現在のブランチで変更されたファイルとフォルダーに色を付けます。"
git_marks_base_branch = "比較対象のブランチ。リポジトリにこの名前のブランチがなければ main を試します。それもなければブランチのマークは単に付かず、フォルダーのホバーにその旨が出ます。"
git_marks_base_branch_off = "このブランチの変更をマークがオンのときだけ使われる。"
git_marks_refresh_secs = "サイドバーが表示されている間、git に問い合わせ直す間隔。0 でタイマーは止まり、マークはフォルダーを開いたときと Octa がファイルを保存したときだけ更新されます。"
git_marks_refresh_secs_off = "git のマークが少なくとも一つオンのときだけ使われる。"
retype_layout_sample = "テキスト列がどの日付形式で書かれているかを型を変更が判断するときに読み取る値の数です。この判定は値ごとに7回の日付解析を行い、すべてインターフェーススレッド上で一度に実行します。500万件なら3500万回の解析となり、ウィンドウが数秒間応答しなくなります。増やして効果があるのは、列の先頭の値が残りを代表していない場合だけです。たとえばISO形式の行がすべて先頭にくるように並べ替えられたファイルなどです。表示される件数が変わることはありません。既定値は10,000です。"
retype_layout_sample_off = "ここに数値を入力するには「無制限」をオフにしてください。"
retype_layout_sample_unlimited = "サンプルではなく列のすべての値を読み取ります。並び順が偏った列では最も正確ですが、数百万行の列では日付型を選ぶたびにウィンドウが数秒間フリーズします。"
cloud_download_concurrency = "ユニオンが同時にダウンロードするクラウドオブジェクトの数です。既定値は8、最小値は1です。オブジェクトストレージからの取得は、バイトの転送よりも往復の待ち時間が大半を占めるため、1件ずつ順番にダウンロードすると、その間は回線が空いたままになります。8はブラウザーがホストごとに許可する数とほぼ同じです。高速で遅延の大きい回線では増やし、プロバイダーやプロキシがリクエストを拒否し始めたら1まで下げてください。非常に大きな値はその数だけスレッドを一度に起動するため、レート制限エラーへの近道になります。"
cloud_sidebar_position = "クラウド接続ブラウザーをウィンドウのどの端にドッキングするか。既定は左。同じ端のブラウザーは1つのパネルにまとまる。"
db_sidebar_position = "データベース接続ブラウザーをウィンドウのどの端にドッキングするか。既定は左。同じ端のブラウザーは1つのパネルにまとまる。"
sql_format_title = "SQL パネルの 整形 ボタンがクエリをどう並べるか。下のプレビューで結果が見られる。"
sql_format_keywords = "SELECT や FROM などのキーワードを大文字にするか、小文字にするか、入力どおりにするか。"
sql_format_indent = "インデント 1 段の幅: スペース 2 つ、スペース 4 つ、またはタブ。"
sql_format_commas = "リスト項目の間のカンマをどこに置くか。次の行の先頭に置くと、カンマの抜けがすぐ分かる。"
sql_format_joins = "JOIN を FROM の下に字下げせず、FROM と同じ高さの新しい行から始める。"
sql_format_inline = "この文字数より短いリストは SELECT a, b, c のように 1 行に収める。0 なら項目ごとに 1 行。"
sql_format_blank_lines = "文と文の間に入れる空行の数。"
sql_format_one_line = "空白とキーワードの大文字小文字だけを整えて、各文を 1 行にまとめるよ。ログやプログラムに貼るときに便利。"
sql_format_off_one_line = "クエリ全体を 1 行に がオンの間はオフ。並べる改行がないからね。"
sql_format_clause_width = "この文字数より短い句はキーワードと同じ行に残るよ。例えば GROUP BY c.name。短いサブクエリも括弧の中に収まる。最初はリストの幅と同じ。"
sql_format_clause_needs_list = "先にリストの幅を 0 より大きくしてね。これだけだと句の項目がインデントなしになっちゃう。"
sql_format_bracket_width = "この文字数より短い括弧は 1 行のまま。例えば coalesce(a, 0) や IN (1, 2, 3)。長いものは項目ごとに改行するよ。"
sql_format_semicolon = "最後の文に ; がなければ付けるよ。"
sql_format_preview = "上の設定で整形したサンプルクエリ。設定を変えるとすぐ変わる。"
restore_session = "起動時に、閉じたときに開いていたファイルを開き直す。初期設定はオフ。なくなったファイルは飛ばす。"
restore_session_cloud = "クラウドのオブジェクトも開き直す。注意: 起動のたびにひとつずつダウンロードし直すので時間がかかり、データ転送の料金がかかることもある。"
restore_session_connections = "データベース接続と API エンドポイントのテーブルも開き直す。注意: 起動のたびにそれぞれがサーバーにクエリを送る。データウェアハウスだと起動して料金がかかることがあるし、ログインの期限が切れていれば再ログインを求められる。"
