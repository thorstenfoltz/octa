warn_date_change = "Banner anzeigen, wenn die Datumserkennung eine Spalte in die\nISO-Anzeigeform umschreibt (z. B. gespeichert als 02.05.2026,\nangezeigt als 2026-05-02). Deaktivieren, um die Warnung zu unterdrücken."
trim_whitespace = "Führende/abschließende Leerzeichen aus Textzellen entfernen,\nwenn eine Datei geöffnet wird. Innere Leerzeichen bleiben erhalten."
