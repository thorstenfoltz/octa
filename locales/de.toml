sql_open_default = "Beim Öffnen einer tabellarischen Datei automatisch den\nSQL-Editor neben der Tabellenansicht anzeigen."
sql_keep_open = "Wenn ein Tab geschlossen wird oder eine Datei darin geöffnet wird, bleibt der offene SQL-Editor offen und behält deine Abfragen.\nAus: Der Editor gehört zu seinem Tab und schließt mit ihm."
sql_panel_position = "Wo der SQL-Editor relativ zur Tabelle andockt"
sql_row_limit = "LIMIT, das in der Platzhalterabfrage verwendet wird, wenn ein Tab\ngeöffnet wird (z. B. 100 -> SELECT * FROM data LIMIT 100).\nZahl eingeben - wird beim Anwenden übernommen."
autocomplete = "SQL-Schlüsselwort- und Spaltennamenvorschläge\nunter dem SQL-Editor anbieten."
editor_font = "Schriftart des SQL-Editors und seiner Zeilennummernleiste.\nJetBrains Mono ist in Octa enthalten.\n\nHinweis: Programmierligaturen werden nicht angewendet -\neguis Textrenderer verarbeitet OpenType-GSUB-\nErsetzungen noch nicht."
sql_diff_highlight = "Nach einer INSERT/UPDATE/DELETE-Abfrage die geänderten Zellen und Zeilen kurz hervorheben."
sql_diff_secs = "Wie lange die SQL-Änderungshervorhebung bleibt, bevor sie verblasst."
mcp_intro = "Standardwerte für den MCP-Server (`octa --mcp`). Der Server liest diese einmal beim Start; eine Änderung bei laufendem Server erfordert einen `octa --mcp`-Neustart."
mcp_row_limit = "Maximale Zeilenzahl, die `read_table` / `run_sql` zurückgeben, wenn der Aufrufer `limit` weglässt. Das Tool-Schema gibt diesen Standard an das Modell weiter, damit es bei Bedarf mehr (oder unbegrenzt) anfordern kann.\n\nStandard: 1.000. Ein hoher Wert - oder das Aktivieren von Unbegrenzt - kann sehr große Antworten durch stdio schieben und den MCP-Client verlangsamen."
cell_byte_cap = "Größenobergrenze pro Zelle für die Übertragung. Zellen, deren Textform dies überschreitet, werden durch eine `[truncated: ...]`-Markierung ersetzt, und die Antwort meldet `cell_truncated: true`. Auf 0 setzen, um die Grenze zu deaktivieren.\n\nStandard: 65.536 (64 KiB)."
map_intro = "Standardwerte für die Kartenansicht (von GeoJSON-Dateien verwendet). Der aktive Tab kann über die Karten-Symbolleiste zwischen Kacheln und nur Geometrie wechseln."
chat_intro = "In-App-KI-Assistent, der Octas Tools auf Deine offenen Tabs und Dateien anwendet. Wähle einen Anbieter und hinterlege den API-Key (oder nutze Ollama lokal), dann öffne das Panel über die Symbolleiste (Menü Analyse, Assistent)."
chat_max_iterations = "Maximale Anzahl an Tool-Aufruf-Runden, die der Assistent innerhalb einer Nachricht ausführen darf, bevor er stoppen muss. Ein Schutz gegen endlose Tool-Schleifen."
chat_max_tokens = "Begrenzung der Antwortlänge (in Tokens) pro Antwort. Unbegrenzt lässt das Modell sein eigenes Maximum nutzen (Anthropic benötigt immer eine Begrenzung und verwendet dort einen hohen Wert)."
chat_provider = "Welches LLM-Backend der Assistent nutzt. Jeder Anbieter braucht seinen eigenen API-Key, außer Ollama, das lokal läuft."
chat_model = "Das für diesen Anbieter verwendete Modell. Wähle eine Vorgabe oder gib einen beliebigen Modellnamen ein."
chat_ollama_url = "Die Root-URL Deines lokalen Ollama-Servers. Die API-Pfade hängt Octa selbst an."
chat_position = "Wo das Chat-Panel relativ zur Tabelle andockt."
chat_export_dir = "Hier landen die Dateien, die der Assistent erzeugt (neue CSVs, Diagramme), solange Du keinen vollständigen Pfad angibst."
chat_audit_log = "Jeden Tool-Aufruf des Assistenten in ein Protokoll unter dem Konfigurationsordner (chat_audit/) schreiben. Standardmäßig aus."
chat_render_markdown = "An: Überschriften, Listen, Tabellen, Codeblöcke und Links in den Antworten werden formatiert dargestellt. Aus: du siehst den rohen Markdown-Quelltext. Deine eigenen Nachrichten werden nie umformatiert."
chat_audit_warn = "Beim Start warnen, wenn die Protokolle diese Größe überschreiten."
chat_api_key = "Dein API-Key für diesen Anbieter. Wird im OS-Schlüsselbund gespeichert, sofern verfügbar, sonst im Klartext in settings.toml."
map_default_mode = "Kacheln: eine Slippy-Map von der konfigurierten Kachel-URL abrufen.\nNur Geometrie: nur die Features auf leerer Fläche zeichnen."
map_fallback = "Wenn der Kachelabruf fehlschlägt (offline, blockiert), für diesen Tab automatisch zur reinen Geometriedarstellung wechseln."
tile_url = "URL-Muster für Rasterkacheln. `{z}/{x}/{y}` werden durch Zoomstufe und Kachelkoordinaten ersetzt. Der Standard zeigt auf den OSM-Kachelserver - für Produktion / intensive Nutzung auf einen selbst gehosteten oder kommerziellen Anbieter zeigen."
sidebar_position = "Auf welcher Seite der Verzeichnisbaum andockt, wenn ein\nOrdner über Datei > Verzeichnis öffnen geöffnet wird."
shortcuts_intro = "Auf 'Aufnehmen' klicken und die gewünschte Tastenkombination drücken (mit Strg / Umschalt / Alt).\nEsc bricht ab, 'Löschen' lässt die Aktion ohne Tastenkürzel."
initial_load_cap = "Maximale Zeilenzahl, die beim ersten Öffnen für Streaming-Formate\n(Parquet, CSV, TSV) in die Tabelle geladen wird. Die übrigen Zeilen\nwerden beim Scrollen im Hintergrund nachgeladen.\n\nStandard: 2.000.000. Ein höherer Wert verbessert die Vollständigkeit\nbeim ersten Zeichnen, braucht aber mehr Speicher. Ein niedrigerer Wert\nmacht das erste Öffnen schneller, verlagert aber mehr Arbeit auf den\nHintergrundlader. \"Unbegrenzt\" deaktiviert die Grenze ganz und lädt\nalle Zeilen sofort.\n\nZahl eingeben - wird beim Anwenden übernommen."
db_page_rows = "Zeilen pro Anfrage, wenn du eine Tabelle über eine Live-Datenbankverbindung öffnest.\n\nStandard: 100,000. Das ist eine Seitengröße, keine Obergrenze: die nächste Seite wird beim Scrollen im Hintergrund nachgeladen, genau wie bei einer großen Parquet-Datei.\n\nEigene Einstellung, weil das Limit darüber einen lokalen Dateizugriff bemisst, während hier Megabytes an JSON übers Netz gehen. Verkleinere den Wert, wenn sich das Öffnen einer Tabelle zäh anfühlt.\n\nZahl eingeben - wird beim Anwenden übernommen."
raw_view_cap = "Maximale Dateigröße (in MB), die Octa vollständig in den Editor\nder Rohansicht liest. Gilt auch für den Roh-Rückfall bei Parse-Fehlern\nund die Rohseite der Vergleichsansicht. Größere Dateien lassen den\nRohtext aus, um Speicher zu schonen.\n\nStandard: 50 MB. Setze \"Unbegrenzt\", um jede Datei\nunabhängig von der Größe zu laden. Wird beim Anwenden übernommen."
decompress_cap = "Maximale entpackte Größe (in MB) für transparent geöffnete\n.gz-/.zst-Dateien. Eine winzige komprimierte Datei kann sich enorm\naufblähen (eine Dekomprimierungsbombe); oberhalb dieser Grenze wird\ndas Öffnen verweigert.\n\nStandard: 4.295 MB (4 GB). Wird beim Anwenden übernommen."
decompress_unlimited = "Die Grenze für die entpackte Größe ganz aufheben. Nur für\nArchive aktivieren, denen du vertraust."
raw_view_unlimited = "Den vollständigen Text jeder Datei ohne Größenbegrenzung in die\nRohansicht lesen. Nur mit reichlich RAM verwenden, eine Datei mit\nmehreren GB wird komplett in den Speicher gelesen."
initial_load_unlimited = "Alle Zeilen der Datei sofort laden. Nur empfohlen, wenn\ngenug RAM vorhanden ist. Eine Parquet-Datei mit 100 Mio.\nZeilen erreicht schnell mehrere GB."
syntax_size_cap = "Dateien, die größer sind, fallen im Roheditor auf einfache\nMonospace-Darstellung zurück. Auf 0 setzen, um die\nSyntaxhervorhebung ganz zu deaktivieren; einen sehr großen\nWert setzen, um die Schutzgrenze abzuschalten. JSON/YAML/XML/\nMarkdown/TOML werden nie hervorgehoben - sie nutzen ihre\neigenen Baum-/Vorschauansichten.\n\nStandard: 1 MB. Zahl eingeben, Einheit wählen - beim Anwenden übernommen."
open_as_text = "Zusätzliche Dateierweiterungen, die beim Öffnen als reiner Text\nbehandelt werden (überschreibt den sonst zuständigen Reader).\nKomma- oder leerzeichengetrennt, ohne führenden Punkt, klein.\nBeispiel: log4j  myproj  rawdata\n\nBeim Anwenden übernommen; wirkt für nachfolgende Dateiöffnungen."
folder_union_cap = "Maximale Anzahl Dateien, die eine Ordner-Vereinigung aus der\nCloud herunterlädt und zusammenführt. Jede Datei wird vollständig\nin den Speicher gelesen; ein Ordner mit Zehntausenden Teilen kann\nden Arbeitsspeicher sprengen. Dateien über der Grenze werden\nübersprungen und in der Statusleiste gezählt.\n\nStandard: 500. Wird beim Anwenden übernommen."
folder_union_unlimited = "Alle Dateien im Ordner vereinen, egal wie viele es sind. Nur\nbei reichlich Arbeitsspeicher aktivieren."
multi_search_cap = "Größenobergrenze pro Datei für den Verzeichnisbereich des\nMehrfachsuche-Panels. Größere Dateien werden übersprungen und\nim Chip der übersprungenen Dateien aufgeführt. \"Unbegrenzt\" ankreuzen,\num die Grenze ganz aufzuheben.\n\nStandard: 50 MB."
multi_search_unlimited = "Jede Datei im Verzeichnis unabhängig von der Größe durchsuchen.\nEin riesiges Log oder Dump kann den Scan blockieren und Speicher fressen."
chart_max_points = "Maximale Zeilenzahl, die der Diagramm-Tab zeichnet, bevor\ngleichmäßiges Heruntertasten einsetzt (Histogramm, Linie, Streu).\nBalkendiagramme aggregieren immer die gesamte Eingabe; Boxplots\nberechnen die 5-Zahlen-Zusammenfassung über die gesamte Eingabe.\nAuf 0 setzen, um das Sampling zu deaktivieren - nur für mäßig\ngroße Tabellen sicher.\n\nStandard: 25.000. Numerische Eingabe akzeptiert Komma-Trennzeichen."
chart_max_categories = "So viele verschiedene X-Kategorien nimmt ein Balkendiagramm noch an.\nDarüber zeichnet Octa nicht mehr, sondern meldet einen Fehler, statt\neine unlesbare Wand aus Balken hinzustellen - filter oder aggregier\ndie Tabelle vorher.\n\nStandard: 200. Bei der Zahl darfst Du Tausenderpunkte setzen."
tables_in_picker = "Wie viele Tabellenzeilen der Mehrtabellen-Auswahldialog (SQLite,\nDuckDB, ...) bei seiner Standardgröße vertikal fassen soll. Der\nDialog bleibt vom Benutzer veränderbar - zieh die Ecke, um\nihn zu vergrößern, wenn eine Datenbank viele Tabellen hat.\n\nStandard: 10. Minimum 1."
excel_auto_open = "Wie viele Blätter einer mehrblättrigen Excel-Arbeitsmappe\nautomatisch geöffnet werden (jedes in eigenem Tab). Arbeitsmappen\nmit mehr Blättern zeigen eine Auswahl, damit Du wählst, welche\ngeöffnet werden (Du kannst mehr als diese Zahl oder alle wählen).\n\nStandard: 5. Minimum 1."
max_recent = "Anzahl der zuletzt geöffneten Dateien, die im Datei-Menü angezeigt werden"
start_maximised = "Wenn aktiv, startet das Fenster maximiert und die Größe unten\nwird als Wiederherstellungsgröße verwendet.\nWenn aus, startet das Fenster in der gewählten Größe."
initial_window_size = "Fenstergröße beim Start (wenn \"Maximiert starten\" aus ist),\noder die Wiederherstellungsgröße, wenn es an ist."
ctrl_close = "Schließen"
ctrl_restore = "Wiederherstellen"
ctrl_full_size = "Volle Größe"
ctrl_minimise = "Minimieren"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Schützt deine Dateien vor GUI-Speicherungen und vor dem Standard des MCP-Servers.\nWenn aktiv, wird das Hinzufügen oder Entfernen von Spalten in einer SQLite-, DuckDB-\noder GeoPackage-Datei beim Speichern verweigert. Der Assistent wird je Chat-Profil\ngesteuert (über den Schalter Schreiben erlauben des Profils), nicht über diese Einstellung."
confirm_db_write_back = "Bevor Änderungen an eine laufende Datenbank gehen, zeigt Octa, was sich ändern würde, und fragt nach.\nSchalte das aus, damit Speichern die Änderungen sofort anwendet; in beiden Fällen ist es eine einzige\nTransaktion, und ein Fehlschlag wird zurückgerollt."
db_pushdown = "Hält ein Datenbank-Tab nur einen Teil seiner Tabelle, laufen Zusammenfassung, Werthäufigkeit, Qualitätsbericht, Korrelation, Verbindungsschlüssel finden, Join-Diagnose, Lookup-Tabellen finden und Messen in der Beziehungskarte als SQL auf dem Server über alle Zeilen, ohne sie herunterzuladen.\nSchalte das aus, um sie stattdessen auf den geladenen Zeilen laufen zu lassen."
confirm_url_redirects = "Wenn eine Webadresse auf eine andere weiterleitet, vorher nachfragen, bevor die Datei von dort geöffnet wird. Die Rückfrage ist die einzige Stelle, an der diese Änderung sichtbar wird."
backup_before_modify = "Bevor der Assistent oder ein schemaänderndes Datenbankspeichern eine\nDatei überschreibt, wird sie zuerst als .bak-Datei mit Zeitstempel daneben kopiert.\nRoutinemäßige manuelle Speicherungen werden nicht gesichert."
chat_profiles = "Jedes Profil ist eine gespeicherte Konfiguration: ein Anbieter, ein Modell, eine Temperatur und ein optionales Denkbudget, unter einem selbst gewählten Namen. Lege beliebig viele an, auch mehrere für denselben Anbieter, und wechsle im Assistenten-Panel zwischen ihnen."
chat_profile_base_url = "Endpunkt für dieses Profil. Leer lassen, um die unten eingestellte Ollama-Serveradresse zu verwenden."
write_options = "Vorgaben, wenn Octa eine Datei schreibt. Speichern unter und Stapelkonvertierung übernehmen sie und können sie für einen Lauf ändern."
status_message_secs = "Wie lange eine Statusmeldung sichtbar bleibt, bevor sie\nverschwindet. Dieselbe Dauer gilt für jede Meldung, ob\nErfolg oder Fehler.\n\nZeigst Du mit der Maus darauf, pausiert der Countdown -\nein Fehler, den Du gerade liest oder kopierst, bleibt also\nstehen. Jede Meldung hat außerdem ein 'x' zum Schließen.\n\nLässt sich nicht abschalten; Werte unter 3 gelten als 3.\nStandard: 10."
chat_tools = "Welche Werkzeuge der Assistent benutzen darf. Die Kerngruppe geht bei jeder Nachricht mit; die anderen Gruppen werden ihm nur genannt, und er lädt eine davon, wenn die Aufgabe sie braucht. Ein ausgeschaltetes Werkzeug ist überall weg: es wird nicht mitgeschickt, nicht angeboten und abgelehnt, falls er es trotzdem aufruft."
chat_tools_enable_all = "Alle Werkzeuge wieder einschalten. Nur die Kerngruppe geht bei jeder Nachricht mit, der Rest kostet nichts, bis der Assistent danach fragt."
chat_tools_budget = "Ungefähr wie viele Tokens die Werkzeugbeschreibungen einer Nachricht hinzufügen. Aus ihrer Größe gerechnet, also als Anhaltspunkt lesen, nicht als Rechnung."
sql_page_rows = "Wie viele Ergebniszeilen auf einmal geholt werden; beim Scrollen kommen weitere dazu. Zeilenzahl und Export umfassen immer das ganze Ergebnis. 0 lädt alles sofort."
sql_auto_register = "Macht jeden anderen offenen Tab im SQL-Panel unter seinem eigenen Namen abfragbar, damit ein Join zweier offener Dateien ohne Attach auskommt."
sql_auto_register_max = "Größere Tabs werden nicht automatisch registriert, weil das Registrieren ihre Zeilen kopiert. Sie bekommen stattdessen einen Knopf Registrieren."
sql_auto_register_max_off = "Wird nur genutzt, solange Andere offene Tabs abfragen an ist."
git_marks_uncommitted = "Färbt Dateien und Ordner in der Seitenleiste ein, die nicht committete git-Änderungen haben: geändert, hinzugefügt, gelöscht, umbenannt oder nicht versioniert."
git_marks_branch = "Färbt Dateien und Ordner ein, die auf dem aktuellen Branch geändert wurden, seit er vom Basis-Branch abgezweigt ist."
git_marks_base_branch = "Branch, mit dem verglichen wird. Hat ein Repository keinen Branch mit diesem Namen, wird main probiert; fehlt auch der, bleibt die Branch-Markierung einfach weg und der Hover des Ordners sagt das."
git_marks_base_branch_off = "Wird nur genutzt, solange Änderungen auf diesem Branch markieren an ist."
git_marks_refresh_secs = "Wie oft die Seitenleiste git erneut fragt, solange sie sichtbar ist. 0 schaltet den Timer ab: dann aktualisieren sich die Markierungen nur beim Öffnen eines Ordners und wenn Octa eine Datei speichert."
git_marks_refresh_secs_off = "Wird nur genutzt, solange mindestens eine git-Markierung an ist."
retype_layout_sample = "Wie viele Werte Typ ändern liest, um zu entscheiden, in welchem Datumsformat eine Textspalte geschrieben ist. Die Abstimmung kostet sieben Datums-Parsevorgänge pro Wert, alle auf einmal im Oberflächen-Thread: bei 5.000.000 Werten sind das 35.000.000 Vorgänge, und das Fenster reagiert sekundenlang nicht mehr. Ein höherer Wert hilft nur, wenn die ersten Werte einer Spalte nicht repräsentativ für den Rest sind, etwa bei einer Datei, in der alle ISO-Zeilen zuerst stehen. An den gemeldeten Zahlen ändert er nie etwas. Standard 10.000."
retype_layout_sample_off = "Schalte Unbegrenzt aus, um hier eine Zahl einzutragen."
retype_layout_sample_unlimited = "Liest jeden Wert der Spalte statt einer Stichprobe. Das ist bei ungleichmässig sortierten Spalten am genauesten, aber bei mehreren Millionen Zeilen reagiert das Fenster jedes Mal sekundenlang nicht, wenn du einen Datumstyp wählst."
cloud_download_concurrency = "Wie viele Cloud-Objekte eine Union gleichzeitig herunterlädt. Standard 8, Minimum 1. Beim Abrufen aus einem Objektspeicher wartest du meist auf die Antwortzeit statt auf die Bytes, deshalb liegt die Verbindung beim Herunterladen nacheinander dazwischen brach. Acht entspricht ungefähr dem, was ein Browser pro Host zulässt. Erhöhe den Wert bei einer schnellen Verbindung mit hoher Latenz; senke ihn auf 1, wenn ein Anbieter oder Proxy anfängt, Anfragen abzulehnen. Sehr hohe Werte starten entsprechend viele Threads auf einmal und sind der schnellste Weg zu einem Rate-Limit-Fehler."
cloud_sidebar_position = "An welchem Fensterrand der Browser für Cloud-Verbindungen andockt. Standard ist links. Browser am selben Rand teilen sich ein Panel."
db_sidebar_position = "An welchem Fensterrand der Browser für Datenbankverbindungen andockt. Standard ist links. Browser am selben Rand teilen sich ein Panel."
sql_format_title = "Wie der Button Formatieren im SQL-Bereich eine Abfrage anordnet. Die Vorschau unten zeigt das Ergebnis."
sql_format_keywords = "Ob Schlüsselwörter wie SELECT und FROM groß, klein oder so wie getippt erscheinen."
sql_format_indent = "Was eine Einrückungsstufe ist: 2 Leerzeichen, 4 Leerzeichen oder ein Tab."
sql_format_commas = "Wo das Komma zwischen zwei Listeneinträgen steht. Am Anfang der nächsten Zeile fällt ein fehlendes Komma sofort auf."
sql_format_joins = "Jeder JOIN beginnt in einer neuen Zeile auf gleicher Höhe wie FROM, statt darunter eingerückt."
sql_format_inline = "Eine Liste, die kürzer als so viele Zeichen ist, bleibt in einer Zeile, etwa SELECT a, b, c. Bei 0 steht jeder Eintrag in einer eigenen Zeile."
sql_format_blank_lines = "Wie viele Leerzeilen zwei Anweisungen trennen."
sql_format_one_line = "Räumt nur Abstände und die Schreibweise der Schlüsselwörter auf und setzt jede Anweisung in eine Zeile. Praktisch zum Einfügen in ein Log oder ein Programm."
sql_format_off_one_line = "Aus, solange Ganze Abfrage in einer Zeile an ist: Es gibt keine Zeilenumbrüche anzuordnen."
sql_format_clause_width = "Eine Klausel, die kürzer als so viele Zeichen ist, bleibt in der Zeile ihres Schlüsselworts, etwa GROUP BY c.name, und eine kurze Unterabfrage bleibt in ihren Klammern. Startet bei der Listenbreite."
sql_format_clause_needs_list = "Stell zuerst die Listenbreite über 0. Allein würde das die Einträge einer Klausel ohne Einrückung lassen."
sql_format_bracket_width = "Klammern, die kürzer als so viele Zeichen sind, bleiben in einer Zeile, etwa coalesce(a, 0) oder IN (1, 2, 3). Bei längeren steht jeder Eintrag in einer eigenen Zeile."
sql_format_semicolon = "Setzt ; hinter die letzte Anweisung, wenn sie keins hat."
sql_format_preview = "Eine Beispielabfrage mit den Einstellungen oben. Sie ändert sich, während du sie änderst."
restore_session = "Beim Start öffnet Octa die Dateien wieder, die beim Schließen offen waren. Standardmäßig aus. Dateien, die es nicht mehr gibt, werden übersprungen."
restore_session_cloud = "Öffnet auch Cloud-Objekte wieder. Vorsicht: Jedes wird bei jedem Start neu heruntergeladen, das dauert und kann Geld für die Datenübertragung kosten."
restore_session_connections = "Öffnet auch Tabellen aus Datenbankverbindungen und API-Endpunkten wieder. Vorsicht: Jede schickt bei jedem Start eine Abfrage an ihren Server. Bei einem Warehouse kann das ihn aufwecken und Geld kosten, und eine abgelaufene Anmeldung fragt dich erneut nach dem Login."
restore_session_needs_main = "Schalte zuerst Letzte Sitzung wieder öffnen ein."

