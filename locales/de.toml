offer_repair = "Wenn eine CSV/TSV gelesen wird, aber fehlerhaft aussieht\n(falsche Kodierung, führende BOM, Steuerzeichen, ein\nTrennzeichen, das nicht zur Erweiterung passt, oder\nsehr ungleichmäßige Zeilen), eine Eingabeaufforderung\nzum Reparieren und Neuladen anzeigen. Standardmäßig aus;\ndie Reparatur läuft nur, wenn Du sie bestätigst."
readonly_notice = "Bei jedem Umschalten des Nur-Lese-Modus (über F8 oder\ndas Ansicht-Menü) ein Bestätigungsfenster anzeigen.\nAusschalten, um den Status still umzuschalten."
