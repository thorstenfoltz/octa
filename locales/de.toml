hint_type_consistency = "Anteil der Werte, die zum deklarierten Typ passen."
hint_benford_verdict = "Ob die führenden Ziffern der Spalte dem Benfordschen Gesetz folgen: conforms, acceptable, marginal oder nonconforming. Die meisten Spalten werden gar nicht geprüft, und die Zelle sagt warum. Fahr über ein Ergebnis, um zu sehen, was es bedeutet."
hint_calendar_verdict = "Ob eine Zeitspalte ohne Lücken läuft: complete, weekdays only, complete (clock change) oder gaps. Wochenenden und Zeitumstellungen zählen nicht als fehlend. Eine Spalte, die keine Reihe ist, sagt, warum sie nicht geprüft wurde. Fahr über ein Ergebnis, um zu sehen, was es bedeutet; die Lücken selbst stehen in einem eigenen Tab."
hint_shape_verdict = "Ob die Werte einer Textspalte eine gemeinsame Form haben: consistent, mixed (eine Form und ein paar Ausreißer) oder na. Fahr über ein Ergebnis, um zu sehen, was es bedeutet; die Ausreißer stehen in einem eigenen Tab."
hint_score = "Die Note dieser Spalte von 0 bis 100, gebildet aus drei der Spalten links davon: 40% dafür, wie vollständig sie gefüllt ist, 40% dafür, wie gut die Werte zum angegebenen Typ passen, und 20% für die Vielfalt der Werte. Numerische Ausreißer ziehen bis zu 10 Punkte ab. Sie sagt nichts darüber, ob die Werte richtig sind, nur wie sauber sie geformt sind."
section_missingness = "Gemeinsam fehlend"
section_calendar = "Lücken im Kalender"
sections_added = "{n} zusätzliche(r) Tab(s) für Befunde geöffnet, die nicht spaltenweise sind."
section_missingness_intro = "Spalten, die in denselben Zeilen leer bleiben. Vier Spalten mit je 8% Lücken sind ein anderes Problem, je nachdem ob es jedes Mal dieselben 8% der Zeilen sind (ein kaputter Join, eine Stelle zum Reparieren) oder vier voneinander unabhängige 8%. Jede Zeile hier ist eine solche Gruppe, die größte zuerst."
section_calendar_intro = "Löcher in einer Datums- oder Zeitstempelspalte: die Stellen, an denen die Reihe springt statt zu schreiten. Fehlende Wochenenden und die Zeitumstellung zählen nicht mit, aufgelistet wird also nur ein wirklich fehlender Tag, eine fehlende Stunde oder ein fehlender Monat."
section_shapes = "Gemischte Formen"
section_shapes_intro = "Textspalten, bei denen fast jeder Wert dieselbe Form hat. Jede Zeile ist eine Form, die davon abweicht, mit Häufigkeit und einem Beispiel."
hint_miss_columns = "Die Spalten, die in diesen Zeilen gemeinsam leer sind."
hint_miss_column_count = "Wie viele Spalten das sind."
hint_miss_rows = "Wie viele Zeilen genau diese Spalten leer haben."
hint_miss_share_percent = "Diese Zeilen als Prozentsatz der ganzen Tabelle."
hint_gap_column = "Die Datums- oder Zeitstempelspalte, in der die Lücke steckt."
hint_gap_after = "Der letzte Wert vor der Lücke."
hint_gap_before = "Der erste Wert danach."
hint_gap_missing_steps = "Wie viele Schritte der Reihe dazwischen fehlen, gezählt im eigenen Takt der Spalte (Tage, Stunden, Monate)."
hint_gap_kind = "Was für eine Lücke das ist: ein einfaches Loch oder eine Strecke, die eher nach Stillstand als nach Ausrutscher aussieht."
hint_shape_column = "Die Spalte, in der die abweichende Form steht."
hint_shape_shape = "Die abweichende Form: Ziffern sind 9, Großbuchstaben A, andere Buchstaben a."
hint_shape_count = "Wie viele Werte diese Form haben."
hint_shape_example = "Ein Wert mit dieser Form."
overall_explained = "Der Mittelwert der Spaltennoten im Bericht. Fahr über die Kopfzeile der Spalte score, dort steht, wie eine einzelne Note zustande kommt."
verdict_benford_conforms = "Die führenden Ziffern liegen nah an dem, was Benford erwartet, so wie gemessene oder aufsummierte Zahlen es üblicherweise tun. Das beweist nichts: eine Spalte kann passen und trotzdem falsch sein."
verdict_benford_acceptable = "Leicht neben den erwarteten Anteilen, im Rahmen dessen, was echte Daten schwanken. Nichts zu tun."
verdict_benford_marginal = "Weit genug daneben für einen zweiten Blick, aber noch kein Befund. Schau nach, wie die Spalte entsteht, bevor du etwas hineinliest."
verdict_benford_nonconforming = "Die führenden Ziffern sehen nicht nach gemessenen Größen aus. Ein Grund, weiter zu schauen, nie für sich schon ein Befund: gerundete, gedeckelte oder von Hand eingetippte Zahlen landen alle harmlos hier."
verdict_benford_not_numbers = "Nicht geprüft: die Spalte enthält keine Zahlen, und das Gesetz handelt von der ersten Ziffer einer Zahl."
verdict_benford_too_few = "Nicht geprüft: unter 300 brauchbare Werte, wo die Ziffernanteile Rauschen sind und keine Verteilung."
verdict_benford_narrow = "Nicht geprüft: die Werte umspannen weniger als den Faktor zehn. Ein Prozentsatz, ein Alter oder eine Bewertung hat keinen Grund, dem Gesetz zu folgen, ein Urteil würde also nur in die Irre führen."
verdict_benford_ids = "Nicht geprüft: dichte ganze Zahlen, alle verschieden, also eine vergebene Folge (eine Zeilennummer, eine Rechnungsnummer, eine ID). So etwas wird vergeben, nicht gemessen."
verdict_calendar_complete = "Jeder Schritt der Reihe ist da, vom ersten Zeitstempel bis zum letzten. Keine Lücken zu erklären."
verdict_calendar_weekdays = "Die einzigen Lücken sind übersprungene Wochenenden, und genau das machen Geschäftsdaten absichtlich. Zählt als vollständig, und diese Wochenenden stehen nicht im Lücken-Tab."
verdict_calendar_dst = "Die einzige Lücke hat die Form einer Zeitumstellung: ein Schritt, an einem Sonntag, in den frühen Morgenstunden. Octas Zeitstempel tragen keine Zeitzone, das hier liest also die Form und weiß es nicht. Prüf nach, wenn es bei der Reihe auf die Stunde ankommt."
verdict_calendar_gaps = "Zeit, die Zeilen haben sollte und keine hat. Der Tab Kalenderlücken listet jede Lücke mit den Zeitstempeln davor und danach."
verdict_calendar_not_dates = "Nicht geprüft: die Spalte enthält keine Datums- oder Zeitwerte."
verdict_calendar_too_few = "Nicht geprüft: unter drei verschiedene Zeitstempel, das ist noch keine Reihe."
verdict_calendar_irregular = "Nicht geprüft: kein einzelner Schritt deckt 60% der Abstände ab, es gibt also keinen Rhythmus, in dem man Lücken finden könnte. Ereignisprotokolle lesen sich so."
verdict_shape_consistent = "Jeder Wert hat dieselbe Form, zum Beispiel ist jede Postleitzahl A-99999."
verdict_shape_mixed = "Fast jeder Wert hat eine Form, ein paar nicht. Diese wenigen sind oft Tippfehler oder ein zweites Format; der Tab Gemischte Formen listet sie auf."
verdict_shape_na = "Nicht geprüft: Die Spalte ist leer, kein Text, oder hat zu viele Formen, um es zu sagen (Freitext, oder mehrere Formate mit Absicht)."

