chat_ollama_url = "Die Root-URL Deines lokalen Ollama-Servers. Die API-Pfade hängt Octa selbst an."
chat_position = "Wo das Chat-Panel relativ zur Tabelle andockt."
chat_export_dir = "Hier landen die Dateien, die der Assistent erzeugt (neue CSVs, Diagramme), solange Du keinen vollständigen Pfad angibst."
chat_audit_log = "Jeden Tool-Aufruf des Assistenten in ein Protokoll unter dem Konfigurationsordner (chat_audit/) schreiben. Standardmäßig aus."
