[distcmp]
title = "Verteilungen vergleichen"
intro = "Fragt, ob zwei Spalten mit Zahlen oder Kategorien gleich verteilt sind: nicht ob ihre Mittelwerte passen, sondern ob die ganze Form passt. Die Preise vom letzten Jahr gegen die von diesem, die Antwortzeiten einer Region gegen die einer anderen. Octa wählt den Test aus den Daten (Kolmogorow-Smirnow für Zahlen, Chi-Quadrat für Kategorien) und antwortet in einem Satz, mit der Kennzahl darunter."
menu = "Verteilungen vergleichen..."
menu_hint = "Prüft, ob zwei Spalten gleich verteilt sind, Form und alles, nicht nur im Durchschnitt. Öffnet einen Tab mit der Antwort als Satz."
