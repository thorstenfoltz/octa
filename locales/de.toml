need_columns = "Wähle zuerst beide Spalten."
tab_label = "Verteilungen"
column_hint = "Eine der beiden Spalten, die verglichen werden. Erst den Tab wählen, dann die Spalte darin. Die Reihenfolge ist egal, dem Test ist es gleich, welche wo steht."
tab_hint = "Die Antwort des Verteilungstests: das Urteil in Worten, darunter die Kennzahl, der p-Wert und die Größen, aus denen gerechnet wurde."

