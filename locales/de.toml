shortcuts_intro = "Auf 'Aufnehmen' klicken und die gewünschte Tastenkombination drücken (mit Strg / Umschalt / Alt).\nEsc bricht ab, 'Löschen' lässt die Aktion ohne Tastenkürzel."
initial_load_cap = "Maximale Zeilenzahl, die beim ersten Öffnen für Streaming-Formate\n(Parquet, CSV, TSV) in die Tabelle geladen wird. Die übrigen Zeilen\nwerden beim Scrollen im Hintergrund nachgeladen.\n\nStandard: 5.000.000. Ein höherer Wert verbessert die Vollständigkeit\nbeim ersten Zeichnen, braucht aber mehr Speicher. Ein niedrigerer Wert\nmacht das erste Öffnen schneller, verlagert aber mehr Arbeit auf den\nHintergrundlader. \"Unbegrenzt\" deaktiviert die Grenze ganz und lädt\nalle Zeilen sofort.\n\nZahl eingeben - wird beim Anwenden übernommen."
db_page_rows = "Zeilen pro Anfrage, wenn du eine Tabelle über eine Live-Datenbankverbindung öffnest.\n\nStandard: 100,000. Das ist eine Seitengröße, keine Obergrenze: die nächste Seite wird beim Scrollen im Hintergrund nachgeladen, genau wie bei einer großen Parquet-Datei.\n\nEigene Einstellung, weil das Limit darüber einen lokalen Dateizugriff bemisst, während hier Megabytes an JSON übers Netz gehen. Verkleinere den Wert, wenn sich das Öffnen einer Tabelle zäh anfühlt.\n\nZahl eingeben - wird beim Anwenden übernommen."
raw_view_cap = "Maximale Dateigröße (in MB), die Octa vollständig in den Editor\nder Rohansicht liest. Gilt auch für den Roh-Rückfall bei Parse-Fehlern\nund die Rohseite der Vergleichsansicht. Größere Dateien lassen den\nRohtext aus, um Speicher zu schonen.\n\nStandard: 500 MB. Setze \"Unbegrenzt\", um jede Datei\nunabhängig von der Größe zu laden. Wird beim Anwenden übernommen."
decompress_cap = "Maximale entpackte Größe (in MB) für transparent geöffnete\n.gz-/.zst-Dateien. Eine winzige komprimierte Datei kann sich enorm\naufblähen (eine Dekomprimierungsbombe); oberhalb dieser Grenze wird\ndas Öffnen verweigert.\n\nStandard: 4.295 MB (4 GB). Wird beim Anwenden übernommen."
decompress_unlimited = "Die Grenze für die entpackte Größe ganz aufheben. Nur für\nArchive aktivieren, denen du vertraust."
raw_view_unlimited = "Den vollständigen Text jeder Datei ohne Größenbegrenzung in die\nRohansicht lesen. Nur mit reichlich RAM verwenden, eine Datei mit\nmehreren GB wird komplett in den Speicher gelesen."
initial_load_unlimited = "Alle Zeilen der Datei sofort laden. Nur empfohlen, wenn\ngenug RAM vorhanden ist. Eine Parquet-Datei mit 100 Mio.\nZeilen erreicht schnell mehrere GB."
syntax_size_cap = "Dateien, die größer sind, fallen im Roheditor auf einfache\nMonospace-Darstellung zurück. Auf 0 setzen, um die\nSyntaxhervorhebung ganz zu deaktivieren; einen sehr großen\nWert setzen, um die Schutzgrenze abzuschalten. JSON/YAML/XML/\nMarkdown/TOML werden nie hervorgehoben - sie nutzen ihre\neigenen Baum-/Vorschauansichten.\n\nStandard: 1 MB. Zahl eingeben, Einheit wählen - beim Anwenden übernommen."
open_as_text = "Zusätzliche Dateierweiterungen, die beim Öffnen als reiner Text\nbehandelt werden (überschreibt den sonst zuständigen Reader).\nKomma- oder leerzeichengetrennt, ohne führenden Punkt, klein.\nBeispiel: log4j  myproj  rawdata\n\nBeim Anwenden übernommen; wirkt für nachfolgende Dateiöffnungen."
folder_union_cap = "Maximale Anzahl Dateien, die eine Ordner-Vereinigung aus der\nCloud herunterlädt und zusammenführt. Jede Datei wird vollständig\nin den Speicher gelesen; ein Ordner mit Zehntausenden Teilen kann\nden Arbeitsspeicher sprengen. Dateien über der Grenze werden\nübersprungen und in der Statusleiste gezählt.\n\nStandard: 500. Wird beim Anwenden übernommen."
folder_union_unlimited = "Alle Dateien im Ordner vereinen, egal wie viele es sind. Nur\nbei reichlich Arbeitsspeicher aktivieren."
multi_search_cap = "Größenobergrenze pro Datei für den Verzeichnisbereich des\nMehrfachsuche-Panels. Größere Dateien werden übersprungen und\nim Chip der übersprungenen Dateien aufgeführt. \"Unbegrenzt\" ankreuzen,\num die Grenze ganz aufzuheben.\n\nStandard: 50 MB."
multi_search_unlimited = "Jede Datei im Verzeichnis unabhängig von der Größe durchsuchen.\nEin riesiges Log oder Dump kann den Scan blockieren und Speicher fressen."
chart_max_points = "Maximale Zeilenzahl, die der Diagramm-Tab zeichnet, bevor\ngleichmäßiges Heruntertasten einsetzt (Histogramm, Linie, Streu).\nBalkendiagramme aggregieren immer die gesamte Eingabe; Boxplots\nberechnen die 5-Zahlen-Zusammenfassung über die gesamte Eingabe.\nAuf 0 setzen, um das Sampling zu deaktivieren - nur für mäßig\ngroße Tabellen sicher.\n\nStandard: 100.000. Numerische Eingabe akzeptiert Komma-Trennzeichen."
chart_max_categories = "So viele verschiedene X-Kategorien nimmt ein Balkendiagramm noch an.\nDarüber zeichnet Octa nicht mehr, sondern meldet einen Fehler, statt\neine unlesbare Wand aus Balken hinzustellen - filter oder aggregier\ndie Tabelle vorher.\n\nStandard: 200. Bei der Zahl darfst Du Tausenderpunkte setzen."
tables_in_picker = "Wie viele Tabellenzeilen der Mehrtabellen-Auswahldialog (SQLite,\nDuckDB, ...) bei seiner Standardgröße vertikal fassen soll. Der\nDialog bleibt vom Benutzer veränderbar - zieh die Ecke, um\nihn zu vergrößern, wenn eine Datenbank viele Tabellen hat.\n\nStandard: 10. Minimum 1."
excel_auto_open = "Wie viele Blätter einer mehrblättrigen Excel-Arbeitsmappe\nautomatisch geöffnet werden (jedes in eigenem Tab). Arbeitsmappen\nmit mehr Blättern zeigen eine Auswahl, damit Du wählst, welche\ngeöffnet werden (Du kannst mehr als diese Zahl oder alle wählen).\n\nStandard: 5. Minimum 1."
max_recent = "Anzahl der zuletzt geöffneten Dateien, die im Datei-Menü angezeigt werden"
start_maximised = "Wenn aktiv, startet das Fenster maximiert und die Größe unten\nwird als Wiederherstellungsgröße verwendet.\nWenn aus, startet das Fenster in der gewählten Größe."
initial_window_size = "Fenstergröße beim Start (wenn \"Maximiert starten\" aus ist),\noder die Wiederherstellungsgröße, wenn es an ist."
ctrl_close = "Schließen"
ctrl_restore = "Wiederherstellen"
ctrl_full_size = "Volle Größe"
ctrl_minimise = "Minimieren"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Schützt deine Dateien vor GUI-Speicherungen und vor dem Standard des MCP-Servers.\nWenn aktiv, wird das Hinzufügen oder Entfernen von Spalten in einer SQLite-, DuckDB-\noder GeoPackage-Datei beim Speichern verweigert. Der Assistent wird je Chat-Profil\ngesteuert (über den Schalter Schreiben erlauben des Profils), nicht über diese Einstellung."
confirm_db_write_back = "Bevor Änderungen an eine laufende Datenbank gehen, zeigt Octa, was sich ändern würde, und fragt nach.\nSchalte das aus, damit Speichern die Änderungen sofort anwendet; in beiden Fällen ist es eine einzige\nTransaktion, und ein Fehlschlag wird zurückgerollt."
confirm_url_redirects = "Wenn eine Webadresse auf eine andere weiterleitet, vorher nachfragen, bevor die Datei von dort geöffnet wird. Die Rückfrage ist die einzige Stelle, an der diese Änderung sichtbar wird."
backup_before_modify = "Bevor der Assistent oder ein schemaänderndes Datenbankspeichern eine\nDatei überschreibt, wird sie zuerst als .bak-Datei mit Zeitstempel daneben kopiert.\nRoutinemäßige manuelle Speicherungen werden nicht gesichert."
chat_profiles = "Jedes Profil ist eine gespeicherte Konfiguration: ein Anbieter, ein Modell, eine Temperatur und ein optionales Denkbudget, unter einem selbst gewählten Namen. Lege beliebig viele an, auch mehrere für denselben Anbieter, und wechsle im Assistenten-Panel zwischen ihnen."
chat_profile_base_url = "Endpunkt für dieses Profil. Leer lassen, um die unten eingestellte Ollama-Serveradresse zu verwenden."
write_options = "Vorgaben, wenn Octa eine Datei schreibt. Speichern unter und Stapelkonvertierung übernehmen sie und können sie für einen Lauf ändern."
status_message_secs = "Wie lange eine Statusmeldung sichtbar bleibt, bevor sie\nverschwindet. Dieselbe Dauer gilt für jede Meldung, ob\nErfolg oder Fehler.\n\nZeigst Du mit der Maus darauf, pausiert der Countdown -\nein Fehler, den Du gerade liest oder kopierst, bleibt also\nstehen. Jede Meldung hat außerdem ein 'x' zum Schließen.\n\nLässt sich nicht abschalten; Werte unter 3 gelten als 3.\nStandard: 10."
chat_tools = "Welche Werkzeuge der Assistent benutzen darf. Die Kerngruppe geht bei jeder Nachricht mit; die anderen Gruppen werden ihm nur genannt, und er lädt eine davon, wenn die Aufgabe sie braucht. Ein ausgeschaltetes Werkzeug ist überall weg: es wird nicht mitgeschickt, nicht angeboten und abgelehnt, falls er es trotzdem aufruft."
chat_tools_enable_all = "Alle Werkzeuge wieder einschalten. Nur die Kerngruppe geht bei jeder Nachricht mit, der Rest kostet nichts, bis der Assistent danach fragt."
chat_tools_budget = "Ungefähr wie viele Tokens die Werkzeugbeschreibungen einer Nachricht hinzufügen. Aus ihrer Größe gerechnet, also als Anhaltspunkt lesen, nicht als Rechnung."

