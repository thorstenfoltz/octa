hint_type_consistency = "Part des valeurs correspondant au type déclaré."
hint_benford_verdict = "Si les premiers chiffres de la colonne suivent la loi de Benford : conforms, acceptable, marginal ou nonconforming. La plupart des colonnes ne sont pas testées du tout, et la cellule dit pourquoi. Survole un verdict pour voir ce qu'il veut dire."
hint_calendar_verdict = "Si une colonne de temps avance sans trous : complète, weekdays only, complète (clock change) ou gaps. Les week-ends et les changements d'heure ne comptent pas comme manquants. Une colonne qui n'est pas une série dit pourquoi elle n'a pas été testée. Survole un verdict pour voir ce qu'il veut dire ; les trous eux-mêmes sont listés dans leur propre onglet."
hint_shape_verdict = "Si les valeurs d'une colonne de texte partagent une forme : consistent, mixed (une forme et quelques écarts) ou na. Survole un verdict pour voir ce qu'il veut dire ; les écarts sont listés dans leur propre onglet."
hint_score = "La note de cette colonne sur 100, calculée à partir de trois des colonnes de gauche : 40 % pour son taux de remplissage, 40 % pour la part de valeurs conformes au type déclaré et 20 % pour la variété des valeurs. Les valeurs aberrantes numériques retirent jusqu'à 10 points. Elle ne dit rien de l'exactitude des valeurs, seulement de leur bonne tenue."
section_missingness = "Absents ensemble"
section_calendar = "Trous dans le calendrier"
sections_added = "{n} onglet(s) supplémentaire(s) ouvert(s) pour des constats qui ne sont pas par colonne."
section_missingness_intro = "Les colonnes qui se vident sur les mêmes lignes. Quatre colonnes vides à 8 % chacune posent un problème différent selon qu'il s'agit chaque fois des mêmes 8 % de lignes (une jointure cassée, un seul endroit à réparer) ou de quatre 8 % sans rapport. Chaque ligne ici est un de ces groupes, le plus gros d'abord."
section_calendar_intro = "Les trous dans une colonne de date ou d'horodatage : les endroits où la série saute au lieu d'avancer d'un pas. Les week-ends manquants et le passage à l'heure d'été ne comptent pas, donc ce qui est listé est un jour, une heure ou un mois vraiment absent."
section_shapes = "Formes mélangées"
section_shapes_intro = "Colonnes de texte où presque chaque valeur a une forme. Chaque ligne est une forme qui s'en écarte, avec sa fréquence et un exemple."
hint_miss_columns = "Les colonnes vides ensemble sur ces lignes."
hint_miss_column_count = "Combien de colonnes cela représente."
hint_miss_rows = "Combien de lignes ont exactement cet ensemble de colonnes vides."
hint_miss_share_percent = "Ces lignes en pourcentage du tableau entier."
hint_gap_column = "La colonne de date ou d'horodatage où se trouve le trou."
hint_gap_after = "La dernière valeur avant le trou."
hint_gap_before = "La première valeur après."
hint_gap_missing_steps = "Combien de pas de la série manquent entre les deux, comptés dans le rythme propre de la colonne (jours, heures, mois)."
hint_gap_kind = "De quel trou il s'agit : un simple manque, ou une plage assez longue pour ressembler à un arrêt plutôt qu'à un raté."
hint_shape_column = "La colonne où se trouve la forme qui s'écarte."
hint_shape_shape = "La forme qui s'écarte : les chiffres sont 9, les majuscules A, les autres lettres a."
hint_shape_count = "Combien de valeurs ont cette forme."
hint_shape_example = "Une valeur avec cette forme."
overall_explained = "La moyenne des notes par colonne du rapport. Survole l'en-tête de la colonne score pour voir comment une note est calculée."
verdict_benford_conforms = "Les premiers chiffres collent à ce que la loi de Benford attend, comme le font d'habitude des grandeurs mesurées ou cumulées. Ça ne prouve rien : une colonne peut être conforme et fausse."
verdict_benford_acceptable = "Légèrement à côté des parts attendues, dans la marge où de vraies données se promènent. Rien à faire."
verdict_benford_marginal = "Assez loin pour mériter un deuxième regard, pas assez pour être un constat. Regarde comment la colonne est produite avant d'y lire quoi que ce soit."
verdict_benford_nonconforming = "Les premiers chiffres ne ressemblent pas à des quantités mesurées. Une raison de creuser, jamais un constat en soi : des chiffres arrondis, plafonnés ou saisis à la main atterrissent tous ici en toute innocence."
verdict_benford_not_numbers = "Pas testé : la colonne ne contient pas de nombres, et la loi parle du premier chiffre d'un nombre."
verdict_benford_too_few = "Pas testé : moins de 300 valeurs utilisables, là où les parts de chiffres sont du bruit et pas une distribution."
verdict_benford_narrow = "Pas testé : les valeurs s'étalent sur moins d'un facteur dix. Un pourcentage, un âge ou une note n'a aucune raison de suivre la loi, un verdict ne ferait qu'induire en erreur."
verdict_benford_ids = "Pas testé : des entiers serrés et tous différents, donc une suite attribuée (un numéro de ligne, un numéro de facture, un identifiant). Ça se distribue, ça ne se mesure pas."
verdict_calendar_complete = "Chaque pas de la série est là, du premier horodatage au dernier. Aucun trou à expliquer."
verdict_calendar_weekdays = "Les seuls trous sont des week-ends sautés, ce que les données d'entreprise font exprès. Compté comme complet, et ces week-ends ne sont pas listés dans l'onglet des trous."
verdict_calendar_dst = "Le seul trou a la forme d'un changement d'heure : un pas, un dimanche, au petit matin. Les horodatages d'Octa ne portent pas de fuseau, ceci lit donc la forme sans savoir. Vérifie si l'heure compte pour cette série."
verdict_calendar_gaps = "Du temps qui devrait avoir des lignes et n'en a pas. L'onglet Trous de calendrier liste chaque trou avec les horodatages de part et d'autre."
verdict_calendar_not_dates = "Pas testé : la colonne ne contient pas de dates ni d'horodatages."
verdict_calendar_too_few = "Pas testé : moins de trois horodatages distincts, ce n'est pas encore une série."
verdict_calendar_irregular = "Pas testé : aucun pas ne couvre 60% des intervalles, il n'y a donc pas de rythme dans lequel chercher des trous. Les journaux d'événements se lisent comme ça."
verdict_shape_consistent = "Chaque valeur a la même forme, par exemple chaque code postal est A-99999."
verdict_shape_mixed = "Presque chaque valeur a une forme, sauf quelques-unes. Ce sont souvent des fautes de frappe ou un second format ; l'onglet Formes mélangées les liste."
verdict_shape_na = "Non testé : la colonne est vide, n'est pas du texte, ou a trop de formes pour trancher (texte libre, ou plusieurs formats voulus)."

