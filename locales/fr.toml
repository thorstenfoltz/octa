recipe_dir = "Où les recettes sont enregistrées automatiquement. Chaque onglet a son propre fichier, nommé d'après le fichier de données."
recipe_autosave = "Réécrire la recette de l'onglet dans le dossier des recettes après chaque étape enregistrée. Désactivé : les recettes ne sont enregistrées qu'avec Enregistrer la recette..."
recipe_dir_reset = "Oublier le dossier choisi et enregistrer dans celui par défaut, dans le dossier de réglages d'Octa."
clickable_links = "Afficher les adresses web comme des liens et les ouvrir avec Ctrl+clic."
mark_filter_cell_mode = "Lors du filtrage sur les éléments marqués, comment traiter une cellule marquée : conserver sa ligne, sa colonne, ou les deux."
chat_result_row_limit = "Combien de lignes un résultat d'outil (par ex. une requête SQL) ajoute au chat de l'assistant. La requête s'exécute toujours sur toutes les lignes ; ceci limite seulement ce qui est montré au modèle, afin qu'un gros résultat n'envahisse pas la conversation. Le cas échéant, l'assistant propose d'écrire le résultat complet dans un fichier ou un nouvel onglet. Coche Illimité pour retirer la limite."
summary_intro = "Choisis les statistiques affichées par l'onglet Analyser -> Résumé. Colonne et Type sont toujours inclus."
directory_tree_filter = "Dans la barre latérale, n'afficher que les sous-dossiers et fichiers qu'Octa peut ouvrir. Désactive pour tout afficher."
search_result_mode = "Filtrer masque les lignes non correspondantes; Surligner conserve toutes les lignes et surligne les correspondances"
search_history_limit = "Nombre de recherches récentes à mémoriser (0 désactive l'historique)."
language = "Langue des menus et boîtes de dialogue de l'application. Prend effet immédiatement. Les traductions sont générées automatiquement et peuvent être affinées."
font_size = "Taille de police de base pour tout le texte de l'application"
default_theme = "Thème appliqué au démarrage de l'application"
body_font = "Famille de police pour le texte, les boutons et les titres.\nMonospace donne la même largeur à chaque caractère."
custom_font = "Chemin facultatif vers un fichier de police TrueType (.ttf),\nOpenType (.otf) ou TrueType Collection (.ttc). Lorsqu'il est\ndéfini et lisible, il remplace le choix de police pour le texte\nproportionnel. WOFF/WOFF2 ne sont pas pris en charge."
custom_font_placeholder = "(aucune - .ttf, .otf ou .ttc)"
icon_color = "Variante de couleur pour l'icône de l'application"
window_controls = "Désactiver les décorations de fenêtre du système et laisser Octa\ndessiner les boutons fermer / réduire / agrandir au bord droit\nde la barre d'outils principale. Utile sur les gestionnaires de\nfenêtres en mosaïque sans contrôles. Prend effet après\nredémarrage."
show_row_numbers = "Afficher les numéros de ligne dans la colonne la plus à gauche"
show_sequential_rows = "Lorsqu'un filtre est actif, ajoute une deuxième colonne\nnumérotant les lignes visibles à partir de 1"
alternating_rows = "Alterner les couleurs de fond des lignes pour la lisibilité"
negative_red = "Mettre en évidence les valeurs numériques négatives en rouge"
thousand_sep = "Afficher les séparateurs de milliers dans les cellules numériques\n(p. ex. 1,234,567.89). Affichage seul - les données enregistrées /\nexportées ne sont jamais modifiées."
number_style = "Regroupement et marques décimales pour les cellules numériques.\nAnglais : 1,234.56   Européen : 1.234,56\nLa marque décimale suit ce choix même avec\nles séparateurs de milliers désactivés."
highlight_edits = "Afficher une couleur de fond sur les cellules modifiées"
cell_line_breaks = "Permettre au texte long de passer sur plusieurs lignes\ndans une cellule au lieu d'être tronqué"
binary_display = "Comment afficher les colonnes de données binaires\nBinaire : bits bruts (01000001)\nHex : hexadécimal (41)\nTexte : décoder en UTF-8 si possible"
default_mark_color = "Couleur appliquée par le raccourci Marquer (Ctrl+M par défaut).\nLa barre d'outils / le menu contextuel laissent choisir n'importe quelle couleur."
column_navigator_position = "Où le panneau de navigation des colonnes s'ancre par rapport au tableau."
edit_audit_position = "Où le panneau de l'historique des modifications s'ancre par rapport au tableau."
default_search_mode = "Mode de recherche/filtre par défaut pour les nouveaux onglets"
tab_size = "Espaces insérés en appuyant sur Tab dans l'éditeur de texte"
color_aligned = "Colorer les colonnes dans la vue texte brut CSV/TSV\n(s'appliqué uniquement quand 'Aligner les colonnes' est activé)"
warn_unalign = "Confirmer avant de désactiver une mise en forme de la vue texte brut -\ncela recharge le fichier depuis le disque et abandonne les modifications du tampon."
warn_date_change = "Afficher une bannière quand l'inférence de date réécrit une colonne\nen forme d'affichage ISO (p. ex. enregistrée 02.05.2026, affichée\n2026-05-02). Désactiver pour masquer l'avertissement."
trim_whitespace = "Supprimer les espaces de début/fin des cellules de texte\nà l'ouverture d'un fichier. Les espaces intérieurs sont conservés."
warn_trim = "Afficher une bannière listant les colonnes dont les espaces ont\nété supprimés au chargement. Indépendant du réglage de suppression."
clean_headers = "Normaliser les en-têtes de colonnes en identifiants snake_case\nau chargement (rognés, minuscules, espaces et ponctuation\ndeviennent des underscores, les doublons reçoivent un suffixe numérique)."
offer_repair = "Quand un CSV/TSV se lit mais paraît malformé (mauvais encodage,\nBOM en tête, caractères de contrôle, un délimiteur incohérent avec\nl'extension ou des lignes très irrégulières), afficher une invite\nproposant de le réparer et de le recharger. Désactivé par défaut ;\nla réparation ne s'exécute que si tu la confirmes."
readonly_notice = "Afficher une fenêtre de confirmation à chaque bascule du mode\nlecture seule (via F8 ou le menu Affichage). Désactiver pour\nbasculer l'état silencieusement."
notebook_output = "Position de la sortie de code dans la vue Jupyter Notebook\n(s'appliqué uniquement aux fichiers .ipynb en mode Notebook)"
sql_open_default = "À l'ouverture d'un fichier tabulaire, afficher automatiquement\nl'éditeur SQL à côté de la vue tableau."
sql_keep_open = "Quand un onglet se ferme ou qu'un fichier s'y ouvre, l'éditeur SQL ouvert reste ouvert et garde tes requêtes.\nDésactivé : l'éditeur appartient à son onglet et se ferme avec lui."
sql_panel_position = "Où l'éditeur SQL s'ancre par rapport au tableau"
sql_row_limit = "LIMIT utilisé dans la requête modèle à l'ouverture d'un onglet\n(p. ex. 100 -> SELECT * FROM data LIMIT 100).\nSaisissez un nombre - appliqué via Appliquer."
autocomplete = "Proposer des suggestions de mots-clés SQL et de noms de colonne\nsous l'éditeur SQL."
editor_font = "Police utilisée par l'éditeur SQL et sa gouttière de numéros de\nligne. JetBrains Mono est fournie avec Octa.\n\nNote : les ligatures de programmation ne sont pas appliquées -\nle moteur de rendu de texte d'egui ne traite pas encore les\nsubstitutions GSUB d'OpenType."
sql_diff_highlight = "Après une requête INSERT/UPDATE/DELETE, surligner brièvement les cellules et lignes modifiées."
sql_diff_secs = "Durée pendant laquelle le surlignage des changements SQL reste avant de disparaître."
mcp_intro = "Valeurs par défaut du serveur MCP (`octa --mcp`). Le serveur les lit une fois au démarrage ; les changer pendant qu'un serveur tourne nécessite un redémarrage `octa --mcp`."
mcp_row_limit = "Nombre maximal de lignes renvoyées par `read_table` / `run_sql` quand l'appelant omet `limit`. Le schéma de l'outil annonce ce défaut au modèle pour qu'il puisse en demander plus (ou illimité) au besoin.\n\nPar défaut : 1,000. Le régler haut - ou cocher Illimité - peut pousser de très grosses réponses par stdio et ralentir le client MCP."
cell_byte_cap = "Limite de taille par cellule sur le fil. Les cellules dont la forme textuelle dépasse ceci sont remplacées par un marqueur `[truncated: ...]` et la réponse signale `cell_truncated: true`. Mettre 0 pour désactiver la limite.\n\nPar défaut : 65,536 (64 KiB)."
map_intro = "Valeurs par défaut de la vue Carte (utilisée par les fichiers GeoJSON). L'onglet actif peut basculer entre Tuiles et Géométrie seule via la barre d'outils Carte."
chat_intro = "Assistant IA intégré qui utilise les outils d'Octa sur tes onglets et fichiers ouverts. Choisis un fournisseur et renseigne sa clé API, ou lance Ollama en local, puis ouvre le panneau depuis la barre d'outils (menu Analyser, Assistant)."
chat_max_iterations = "Nombre maximal de tours d'appels d'outils que l'assistant peut effectuer au sein d'un même message avant de devoir s'arrêter. Une protection contre les boucles incontrôlées."
chat_max_tokens = "Limite de la longueur de réponse (en jetons) demandée par réponse. Illimité laisse le modèle utiliser son propre maximum (Anthropic exige toujours une limite, il utilise donc une valeur élevée)."
chat_provider = "Quel moteur LLM l'assistant utilise. Chaque fournisseur a besoin de sa propre clé API, sauf Ollama qui fonctionne en local."
chat_model = "Le modèle utilisé pour ce fournisseur. Choisis un préréglage ou saisis n'importe quel nom de modèle."
chat_ollama_url = "URL racine de ton serveur Ollama local. Octa ajoute les chemins de l'API tout seul."
chat_position = "Ou le panneau de chat s'ancre par rapport au tableau."
chat_export_dir = "Le dossier où l'assistant écrit les fichiers qu'il produit (nouveaux CSV, graphiques), tant que tu ne donnes pas de chemin complet."
chat_audit_log = "Ajouter chaque appel d'outil de l'assistant a un journal dans le dossier de configuration (chat_audit/). Désactivé par défaut."
chat_render_markdown = "Activé : les titres, listes, tableaux, blocs de code et liens des réponses sont mis en forme. Désactivé : tu vois la source Markdown brute. Tes propres messages ne sont jamais reformatés."
chat_audit_warn = "Afficher un avertissement au démarrage quand les journaux dépassent cette taille."
chat_api_key = "Ta clé API pour ce fournisseur. Stockée dans le trousseau du système si possible, sinon en clair dans settings.toml."
map_default_mode = "Tuiles : récupérer une carte glissante depuis l'URL de tuiles configurée.\nGéométrie seule : ne peindre que les entités sur un canevas vierge."
map_fallback = "Quand la récupération des tuiles échoue (hors ligne, bloquée), basculer automatiquement vers le rendu géométrie seule pour cet onglet."
tile_url = "Modèle d'URL pour les tuiles raster. `{z}/{x}/{y}` sont remplacés par le niveau de zoom et les coordonnées de la tuile. Par défaut pointe sur le serveur de tuiles OSM - pour la production / un usage intensif, pointe vers un fournisseur auto-hébergé ou commercial."
sidebar_position = "De quel côté l'arborescence de répertoires s'ancre quand un\ndossier est ouvert via Fichier > Ouvrir un répertoire."
shortcuts_intro = "Clique sur 'Enregistrer' puis appuie sur une combinaison (avec Ctrl / Maj / Alt).\nAppuyez sur Échap pour annuler. 'Effacer' laisse l'action non liée."
initial_load_cap = "Nombre maximal de lignes chargées dans le tableau à la première\nouverture pour les formats en flux (Parquet, CSV, TSV). Les lignes\nrestantes se chargent en arrière-plan au défilement.\n\nPar défaut : 2,000,000. L'augmenter améliore la complétude du\npremier rendu mais consomme plus de mémoire. Le réduire accélère\nl'ouverture initiale mais reporte plus de travail sur le chargeur\nd'arrière-plan. Coche \"Illimité\" pour désactiver la limite et\ncharger toutes les lignes d'emblée.\n\nSaisissez un nombre - appliqué via Appliquer."
db_page_rows = "Lignes par requête quand tu ouvres une table depuis une connexion de base de données en direct.\n\nPar défaut : 100,000. C'est une taille de page, pas un plafond : la page suivante se charge en arrière-plan au défilement, comme pour un gros fichier Parquet.\n\nRéglage distinct parce que la limite du dessus mesure la lecture d'un fichier local, alors qu'ici ce sont des mégaoctets de JSON qui passent par le réseau. Réduis-le si l'ouverture d'une table te semble lente.\n\nSaisissez un nombre - appliqué via Appliquer."
raw_view_cap = "Taille maximale de fichier (en Mo) qu'Octa lit entièrement dans\nl'éditeur de la vue brute. Conditionne aussi le repli en texte brut\naprès une erreur d'analyse et le côté brut de la vue Comparaison.\nLes fichiers plus grands sautent le texte brut pour ménager la mémoire.\n\nPar défaut : 50 Mo. Coche \"Illimité\" pour charger n'importe quel\nfichier quelle que soit sa taille. Appliqué à la validation."
decompress_cap = "Taille décompressée maximale (en Mo) pour les fichiers\n.gz / .zst ouverts de façon transparente. Un petit fichier\ncompressé peut gonfler énormément (bombe de décompression) ;\nau-delà de cette limite, l'ouverture est refusée.\n\nPar défaut : 4 295 Mo (4 Go). Appliqué à la validation."
decompress_unlimited = "Supprimer complètement la limite de taille de décompression.\nÀ ne cocher que pour des archives de confiance."
raw_view_unlimited = "Lire le texte intégral de n'importe quel fichier dans la vue\nbrute, sans limite de taille. À n'utiliser qu'avec de la RAM\nà revendre : un fichier de plusieurs Go est entièrement chargé en mémoire."
initial_load_unlimited = "Charger toutes les lignes du fichier d'emblée. À réserver aux\nmachines qui ont de la RAM à revendre - un parquet de 100 M de\nlignes avale plusieurs Go."
syntax_size_cap = "Les fichiers plus grands que ceci basculent en monospace simple\ndans l'éditeur brut. Mettre 0 pour désactiver entièrement la\ncoloration syntaxique ; mettre un très grand nombre pour ignorer\nla garde. JSON/YAML/XML/Markdown/TOML ne sont jamais colorés -\nils utilisent leurs vues arbre/aperçu dédiées.\n\nPar défaut : 1 Mo. Saisis un nombre, choisis une unité - appliqué via Appliquer."
open_as_text = "Extensions de fichier supplémentaires à traiter comme texte brut\nà l'ouverture (remplace le lecteur qui les revendiquerait\nnormalement). Séparées par virgules ou espaces, sans point initial,\nen minuscules.\nExemple : log4j  myproj  rawdata\n\nAppliqué via Appliquer ; prend effet pour les ouvertures suivantes."
folder_union_cap = "Nombre maximal de fichiers qu'une fusion de dossier dans le cloud\ntélécharge et regroupe. Chaque fichier est lu entièrement en\nmémoire ; un dossier de dizaines de milliers de parties peut donc\népuiser la RAM. Les fichiers au-delà de la limite sont ignorés et\ncomptés dans la barre d'état.\n\nPar défaut : 500. Appliqué à la validation."
folder_union_unlimited = "Fusionner tous les fichiers du dossier, quel qu'en soit le nombre.\nÀ n'utiliser qu'avec de la RAM en réserve."
multi_search_cap = "Limite de taille par fichier pour la portée répertoire du panneau\nde Recherche multiple. Les fichiers plus grands sont ignorés et\nlistés dans la puce des fichiers ignorés. Cocher \"Illimité\" pour supprimer\ncomplètement la limite.\n\nPar défaut : 50 Mo."
multi_search_unlimited = "Analyser tous les fichiers du répertoire quelle que soit leur taille.\nUn journal ou un dump énorme peut bloquer l'analyse et saturer la mémoire."
chart_max_points = "Nombre maximal de lignes que l'onglet Graphique tracera avant que\nle sous-échantillonnage régulier ne s'active (Histogramme, Ligne,\nNuage). Les graphiques à barres agrègent toujours toute l'entrée ;\nles boîtes calculent le résumé à 5 nombres sur toute l'entrée.\nMettre 0 pour désactiver l'échantillonnage - sûr seulement pour\ndes tableaux de taille modérée.\n\nPar défaut : 25,000. La saisie numérique accepte les séparateurs de virgule."
chart_max_categories = "Nombre maximal de catégories X distinctes qu'un graphique à barres\nacceptera avant de refuser de dessiner. Au-delà, le moteur affiche\nune erreur plutôt qu'un mur illisible de barres - filtre ou\nagrège le tableau d'abord.\n\nPar défaut : 200. La saisie numérique accepte les séparateurs de virgule."
tables_in_picker = "Combien de lignes de table la boîte de sélection multi-tables\n(SQLite, DuckDB, ...) doit afficher verticalement à sa taille par\ndéfaut. La boîte reste redimensionnable - tire le coin pour\nl'agrandir quand une base a beaucoup de tables.\n\nPar défaut : 10. Minimum 1."
excel_auto_open = "Combien de feuilles d'un classeur Excel multi-feuilles ouvrir\nautomatiquement, chacune dans son onglet. Au-delà, un sélecteur\ns'affiche pour choisir lesquelles ouvrir, et rien n'empêche d'en\nprendre plus que ce nombre, ou toutes.\n\nPar défaut : 5. Minimum 1."
max_recent = "Nombre de fichiers récemment ouverts affichés dans le menu Fichier"
start_maximised = "Quand activé, la fenêtre démarre agrandie et la taille ci-dessous\nsert de taille de restauration.\nQuand désactivé, la fenêtre démarre à la taille choisie."
initial_window_size = "Taille de la fenêtre au démarrage (quand \"Démarrer agrandi\" est\ndésactivé), ou taille de restauration quand il est activé."
ctrl_close = "Fermer"
ctrl_restore = "Restaurer"
ctrl_full_size = "Pleine taille"
ctrl_minimise = "Réduire"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Protège tes fichiers contre les enregistrements de l'interface et sert\nde valeur par défaut au serveur MCP. Quand elle est active, ajouter ou\nsupprimer des colonnes dans un fichier SQLite, DuckDB ou GeoPackage est\nrefusé à l'enregistrement. L'assistant, lui, dépend de chaque profil de\ndiscussion (son option Autoriser l'écriture), pas de ce paramètre."
confirm_db_write_back = "Avant que tes modifications partent vers une base en service, Octa montre ce qui changerait et demande.\nDésactive-le pour que Enregistrer applique directement; dans les deux cas c'est une seule transaction,\net un échec est annulé en entier."
db_pushdown = "Quand un onglet de base de données ne contient qu'une partie de sa table, le Résumé, la Fréquence des valeurs, le rapport de qualité, la Corrélation, la Recherche de clés de jointure, le Diagnostic de jointure, Trouver les tables de référence et Mesurer dans la Carte des relations s'exécutent en SQL sur le serveur sur toutes les lignes, sans rien télécharger.\nDésactive cette option pour les lancer plutôt sur les lignes chargées."
confirm_url_redirects = "Quand une adresse web t'envoie vers une autre, demander avant d'ouvrir le fichier depuis celle-ci. Cette confirmation est le seul endroit où le changement se voit."
backup_before_modify = "Avant que l'assistant ou un enregistrement modifiant le schéma d'une base\nde données n'écrase un fichier, en copier d'abord une version horodatée\nen .bak à côté. Les enregistrements manuels courants ne sont pas sauvegardés."
chat_profiles = "Un profil est une configuration enregistrée : un fournisseur, un modèle, une température et un budget de réflexion facultatif, sous le nom que tu veux. Tu peux en créer autant que nécessaire, y compris plusieurs pour le même fournisseur, et passer de l'un à l'autre depuis le panneau de l'assistant."
chat_profile_base_url = "Point de terminaison de ce profil. Laisse vide pour utiliser l'adresse du serveur Ollama définie ci-dessous."
write_options = "Valeurs par défaut à l'écriture d'un fichier. Enregistrer sous et la conversion par lots en partent et peuvent les modifier pour une exécution."
status_message_secs = "Combien de temps un message d'état reste affiché avant de\ndisparaître. La même durée s'applique à tous les messages,\nsuccès comme erreur.\n\nSurvoler le message met le compte à rebours en pause : une\nerreur que tu lis ou copies reste donc affichée. Chaque\nmessage a aussi une croix pour le fermer tout de suite.\n\nImpossible à désactiver ; en dessous de 3, on utilise 3.\nPar défaut : 10."
chat_tools = "Les outils que l'assistant a le droit d'utiliser. Le groupe core part avec chaque message ; les autres groupes lui sont seulement nommés, et il en charge un quand la tâche l'exige. Un outil désactivé disparaît partout : il n'est pas envoyé, pas proposé, et refusé s'il l'appelle quand même."
chat_tools_enable_all = "Réactiver tous les outils. Seul le groupe core part avec chaque message, le reste ne coûte rien tant que l'assistant ne le demande pas."
chat_tools_budget = "À peu près combien de tokens les descriptions d'outils ajoutent à un message. Calculé d'après leur taille : à lire comme un ordre de grandeur, pas comme une facture."
sql_page_rows = "Combien de lignes de résultat sont récupérées à la fois ; d'autres arrivent au défilement. Le nombre de lignes et Exporter couvrent toujours tout le résultat. 0 charge tout d'un coup."
sql_auto_register = "Rend chaque autre onglet ouvert interrogeable dans le panneau SQL sous son propre nom, pour qu'une jointure entre deux fichiers ouverts n'ait besoin d'aucun attach."
sql_auto_register_max = "Les onglets plus gros ne sont pas enregistrés automatiquement, car l'enregistrement copie leurs lignes. Ils reçoivent un bouton Enregistrer à la place."
sql_auto_register_max_off = "Utilisé seulement tant que Interroger les autres onglets ouverts est actif."
git_marks_uncommitted = "Colore les fichiers et dossiers de la barre latérale qui ont des modifications git non validées : modifiés, ajoutés, supprimés, renommés ou non suivis."
git_marks_branch = "Colore les fichiers et dossiers modifiés sur la branche actuelle depuis qu'elle a divergé de la branche de base."
git_marks_base_branch = "Branche de comparaison. Quand un dépôt n'a pas de branche de ce nom, main est essayée ; si elle manque aussi, la marque de branche est simplement absente et le survol du dossier le dit."
git_marks_base_branch_off = "Utilisé seulement tant que Marquer les modifications de cette branche est actif."
git_marks_refresh_secs = "À quelle fréquence la barre latérale réinterroge git tant qu'elle est visible. 0 désactive le minuteur : les marques ne se rafraîchissent alors qu'à l'ouverture d'un dossier et quand Octa enregistre un fichier."
git_marks_refresh_secs_off = "Utilisé seulement tant qu'au moins une marque git est active."
retype_layout_sample = "Combien de valeurs Changer le type lit pour décider dans quel format de date une colonne de texte est écrite. Le vote coûte sept analyses de date par valeur, d'un seul coup sur le fil de l'interface : à 5 000 000 de valeurs cela fait 35 000 000 d'analyses et la fenêtre ne répond plus pendant plusieurs secondes. L'augmenter n'aide que si les premières valeurs d'une colonne ne représentent pas le reste, par exemple un fichier trié avec toutes les lignes ISO en tête. Cela ne change jamais un total affiché. Par défaut 10 000."
retype_layout_sample_off = "Désactive Illimité pour saisir un nombre ici."
retype_layout_sample_unlimited = "Lit chaque valeur de la colonne au lieu d'un échantillon. C'est le plus précis sur une colonne mal triée, mais sur plusieurs millions de lignes la fenêtre se fige quelques secondes chaque fois que tu choisis un type date."
cloud_download_concurrency = "Combien d'objets cloud une union télécharge en même temps. Par défaut 8, minimum 1. Récupérer depuis un stockage objet consiste surtout à attendre l'aller-retour plutôt qu'à transférer des octets, donc télécharger l'un après l'autre laisse le lien inactif entre les deux. Huit correspond à peu près à ce qu'un navigateur autorise par hôte. Augmente-le sur un lien rapide à forte latence ; descends à 1 si un fournisseur ou un proxy commence à refuser les requêtes. Des valeurs très élevées lancent autant de fils d'exécution d'un coup et sont le moyen le plus rapide d'obtenir une erreur de limitation."
cloud_sidebar_position = "Le bord de la fenêtre où s'ancre le navigateur des connexions cloud. À gauche par défaut. Les navigateurs sur le même bord partagent un panneau."
db_sidebar_position = "Le bord de la fenêtre où s'ancre le navigateur des connexions de base de données. À gauche par défaut. Les navigateurs sur le même bord partagent un panneau."
sql_format_title = "Comment le bouton Formater du panneau SQL dispose une requête. L'aperçu ci-dessous montre le résultat."
sql_format_keywords = "Si les mots-clés comme SELECT et FROM sortent en majuscules, en minuscules ou tels que tu les as tapés."
sql_format_indent = "Ce que vaut un niveau d'indentation : 2 espaces, 4 espaces ou une tabulation."
sql_format_commas = "Où va la virgule entre deux éléments d'une liste. En début de ligne suivante, une virgule manquante saute aux yeux."
