[jev]
intro = "Jev 是 TypeSafe AI 的決策模型。它對每一列回答一種固定形式的問題，也就是從你的類別裡選一個、回答是或否，或者在一個量表上給出等級。它不寫文字，所以不屬於助手。欄 > 用 Jev 分類... 用的就是它。"
warning = "用 Jev 分類會把你選的儲存格傳送給 TypeSafe AI。它的伺服器只在美國，也沒有說明資料多久之後刪除。只有在你獲准的情況下才傳送個人或機密資料。"
