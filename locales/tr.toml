overall_explained = "Rapordaki sütun notlarının ortalaması. Tek bir notun nasıl çıktığını görmek için score sütununun başlığının üzerine gel."
verdict_benford_conforms = "Baştaki rakamlar Benford yasasının beklediğine yakın duruyor, ölçülmüş ya da birikmiş büyüklüklerin genelde yaptığı gibi. Hiçbir şey kanıtlamaz: bir sütun uyabilir ve yine de yanlış olabilir."
verdict_benford_acceptable = "Beklenen paylardan biraz sapmış, gerçek verinin gezindiği aralık içinde. Yapacak bir şey yok."
verdict_benford_marginal = "İkinci bir bakışı hak edecek kadar sapmış ama henüz bir bulgu değil. Ondan bir şey okumadan önce sütunun nasıl üretildiğine bak."
verdict_benford_nonconforming = "Baştaki rakamlar ölçülmüş büyüklüklere benzemiyor. Daha ileri bakmak için bir sebep, tek başına asla bir bulgu değil: yuvarlanmış, tavanlanmış ya da elle girilmiş sayılar hepsi masumca buraya düşer."
verdict_benford_not_numbers = "Sınanmadı: sütunda sayı yok, yasa ise bir sayının ilk rakamıyla ilgili."
verdict_benford_too_few = "Sınanmadı: 300'den az kullanılabilir değer, ki orada rakam payları dağılım değil gürültüdür."
verdict_benford_narrow = "Sınanmadı: değerler on kattan dar bir aralığa sığıyor. Bir yüzdenin, bir yaşın ya da bir puanın yasaya uyması için hiçbir sebep yok, dolayısıyla bir sonuç yalnızca yanıltırdı."
verdict_benford_ids = "Sınanmadı: sık ve hepsi farklı tam sayılar, yani atanmış bir dizi (satır numarası, fatura numarası, kimlik). Böyle şeyler dağıtılır, ölçülmez."
verdict_calendar_complete = "Dizinin her adımı yerinde, ilk zaman damgasından sonuncusuna. Açıklanacak delik yok."
verdict_calendar_weekdays = "Tek delikler atlanan hafta sonları, ki iş verisi bunu bilerek yapar. Tam sayılır ve o hafta sonları delikler sekmesinde listelenmez."
verdict_calendar_dst = "Tek delik bir saat değişimi biçiminde: bir adım, bir pazar günü, sabahın erken saatlerinde. Octa'nın zaman damgaları saat dilimi taşımaz, yani burada biçim okunuyor, bilinmiyor. Dizide saat önemliyse kontrol et."
verdict_calendar_gaps = "Satırı olması gereken ama olmayan zaman. Takvim delikleri sekmesi her deliği iki yanındaki zaman damgalarıyla listeler."
verdict_calendar_not_dates = "Sınanmadı: sütunda tarih ya da zaman damgası yok."
