section_missingness_intro = "Aynı satırlarda birlikte boşalan sütunlar. Her biri %8 boş olan dört sütun, her seferinde aynı %8 satır söz konusuysa (bozuk bir birleştirme, onarılacak tek bir yer) başka bir sorundur, birbirinden bağımsız dört %8 ise başka. Buradaki her satır böyle bir gruptur, en büyüğü başta."
section_calendar_intro = "Bir tarih ya da zaman damgası sütunundaki delikler: dizinin adım atmak yerine sıçradığı bölümler. Eksik hafta sonları ve yaz saatine geçiş sayılmaz, dolayısıyla listelenen gerçekten eksik olan gün, saat ya da aydır."
