mcp_intro = "MCP sunucusu (`octa --mcp`) için varsayılanlar. Sunucu bunları başlangıçta bir kez okur; çalışan bir sunucuda değiştirmek `octa --mcp` yeniden başlatması gerektirir."
mcp_row_limit = "Çağıran `limit` belirtmediğinde `read_table` / `run_sql` tarafından döndürülen en fazla satır sayısı. Araç şeması bu varsayılanı modele bildirir, böylece gerektiğinde daha fazlasını (veya sınırsız) isteyebilir.\n\nVarsayılan: 1,000. Bunu yüksek ayarlamak - veya Sınırsız'ı işaretlemek - stdio üzerinden çok büyük yanıtlar gönderebilir ve MCP istemcisini yavaşlatabilir."
cell_byte_cap = "Aktarımda hücre başına boyut sınırı. Metin biçimi bunu aşan hücreler bir `[truncated: ...]` işaretçisiyle değiştirilir ve yanıt `cell_truncated: true` işaretler. Sınırı devre dışı bırakmak için 0 ayarlayın.\n\nVarsayılan: 65,536 (64 KiB)."
map_intro = "Harita görünümü (GeoJSON dosyaları tarafından kullanılır) için varsayılanlar. Etkin sekme, Harita araç çubuğundan Döşemeler ile yalnızca Geometri arasında geçiş yapabilir."
chat_intro = "Octa'nın araçlarını açık sekmelerin ve dosyaların üzerinde çalıştıran, uygulamaya gömülü yapay zeka asistanı. Bir sağlayıcı seç ve API anahtarını gir, ya da Ollama'yı yerelde çalıştır, sonra araç çubuğundan paneli aç (Analiz menüsü, Asistan)."
chat_max_iterations = "Asistanin durmadan once tek bir mesaj içinde çalıştırabileceği en fazla araç cagrisi turu sayısı. Kontrolsuz donguler için bir koruma."
chat_max_tokens = "Yanit basina istenen yanit uzunlugu (token cinsinden) siniri. Sinirsiz, modelin kendi azamisini kullanmasina izin verir (Anthropic her zaman bir sinir gerektirir, bu nedenle orada yuksek bir değer kullanir)."
chat_provider = "Asistanin hangi LLM arka ucunu kullandigini. Yerel olarak çalışan Ollama disinda her sağlayıcı kendi API anahtarina ihtiyac duyar."
chat_model = "Bu sağlayıcı için kullanilan model. Bir hazir ayar secin veya herhangi bir model adi yazın."
chat_ollama_url = "Yerel Ollama sunucunun kök URL'si. API yollarını Octa kendisi ekler."
chat_position = "Sohbet panelinin tabloya göre nereye yerleştiği."
chat_export_dir = "Tam bir yol vermediginizde asistanin disa aktarilan dosyaları (yeni CSV'ler, grafikler) yazdigi klasor."
chat_audit_log = "Asistanin her araç cagrisini yapilandirma klasorundeki (chat_audit/) bir gunluge ekler. Varsayılan olarak kapalı."
chat_audit_warn = "Gunlukler bu boyutu asinca başlangıçta uyari göster."
chat_api_key = "Bu sağlayıcı için API anahtarın. Varsa işletim sisteminin anahtarlığında, yoksa settings.toml içinde düz metin olarak durur."
map_default_mode = "Döşemeler: yapılandırılmış döşeme URL'sinden kaygan bir harita getir.\nYalnızca geometri: yalnızca öğeleri boş bir tuval üzerine çiz."
map_fallback = "Döşeme getirme başarısız olduğunda (çevrimdışı, engellenmiş), o sekme için otomatik olarak yalnızca geometri oluşturmaya geç."
tile_url = "Raster döşemeler için URL deseni. `{z}/{x}/{y}` yakınlaştırma düzeyi ve döşeme koordinatlarıyla değiştirilir. Varsayılan, OSM döşeme sunucusunu işaret eder - üretim / yoğun kullanım için kendi barındırdığın ya da ticari bir sağlayıcıyı işaret edin."
sidebar_position = "Bir klasör Dosya > Dizin Aç ile açıldığında dizin ağacının\nhangi tarafa yerleştiği."
shortcuts_intro = "'Kaydet'e tıklayın, ardından bir tuş bileşimine (Ctrl / Shift / Alt ile) basın.\nKaydı iptal etmek için Esc'e basın. 'Temizle' eylemi bağlanmamış bırakır."
initial_load_cap = "Akış biçimleri (Parquet, CSV, TSV) için ilk açılışta tabloya\nyüklenen en fazla satır sayısı. Kalan satırlar siz kaydırdıkça\narka planda akar.\n\nVarsayılan: 5,000,000. Artırmak ilk çizimin eksiksizliğini iyileştirir\nama daha fazla bellek kullanır. Azaltmak ilk açılışı hızlandırır ama\ndaha fazla işi arka plan yükleyicisine kaydırır. Sınırı tamamen\ndevre dışı bırakıp tüm satırları önceden yüklemek için \"Sınırsız\"ı\nişaretleyin.\n\nBir sayı yazın - Uygula ile uygulanır."
db_page_rows = "Canlı veritabanı bağlantısından bir tablo açtığında istek başına çekilen satır sayısı.\n\nVarsayılan: 100,000. Bu bir üst sınır değil, sayfa boyutu: büyük bir Parquet dosyasında olduğu gibi, kaydırdıkça sonraki sayfa arka planda yüklenir.\n\nAyrı bir ayar, çünkü yukarıdaki sınır yerel dosya okumasını ölçer, buradaysa ağ üzerinden megabaytlarca JSON geçer. Tablo açmak sana yavaş geliyorsa düşür.\n\nBir sayı yazın - Uygula ile uygulanır."
raw_view_cap = "Octa'nın Ham görünüm düzenleyicisine tümüyle okuduğu en büyük\ndosya boyutu (MB). Ayrıca çözümleme hatasındaki ham metne\ndönüşü ve Karşılaştırma görünümünün ham tarafını da sınırlar.\nDaha büyük dosyalarda belleği korumak için ham metin atlanır.\n\nVarsayılan: 500 MB. Boyuttan bağımsız olarak her dosyayı yüklemek\niçin Sınırsız seçeneğini işaretleyin. Uygula ile etkinleşir."
decompress_cap = "Saydam olarak açılan .gz / .zst dosyaları için açıldıktan sonraki\nen büyük boyut (MB). Çok küçük bir sıkıştırılmış dosya devasa\nşişebilir (sıkıştırma bombası); bu sınırın üstünde açma reddedilir.\n\nVarsayılan: 4.295 MB (4 GB). Uygula ile etkinleşir."
decompress_unlimited = "Açma boyutu sınırını tamamen kaldır. Bunu yalnızca güvendiğin\narşivler için işaretleyin."
raw_view_unlimited = "Herhangi bir dosyanın tam metnini boyut sınırı olmadan Ham\ngörünüme oku. Yalnızca bol belleğin varsa kullanın, birkaç\nGB'lık bir dosya tümüyle belleğe okunur."
initial_load_unlimited = "Dosyadaki tüm satırları önceden yükle. Yalnızca yedek RAM'iniz\nvarsa önerilir - 100 milyon satırlık bir parquet birkaç GB yer."
syntax_size_cap = "Bundan büyük dosyalar ham düzenleyicide düz monospace'e geri\ndöner. Sözdizimi vurgulamayı tamamen devre dışı bırakmak için 0\nayarlayın; korumayı atlamak için çok büyük bir sayı ayarlayın.\nJSON/YAML/XML/Markdown/TOML asla vurgulanmaz - kendi ağaç/önizleme\ngörünümlerini kullanırlar.\n\nVarsayılan: 1 MB. Bir sayı yazın, bir birim seçin - Uygula ile uygulanır."
open_as_text = "Açılışta düz metin olarak ele alınacak ek dosya uzantıları\n(normalde bunları talep edecek okuyucuyu geçersiz kılar). Virgül\nveya boşlukla ayrılmış, baştaki nokta olmadan, küçük harfle.\nÖrnek: log4j  myproj  rawdata\n\nUygula ile uygulanır; sonraki dosya açılışları için geçerli olur."
folder_union_cap = "Buluttaki bir klasör birleştirmesinin indirip birleştirdiği en\nfazla dosya sayısı. Her dosya tamamen belleğe okunur; on binlerce\nparçalı bir klasör RAM'i tüketebilir. Sınırı aşan dosyalar atlanır\nve durum çubuğunda sayılır.\n\nVarsayılan: 500. Uygula ile etkinleşir."
folder_union_unlimited = "Klasördeki tüm dosyaları, sayısı ne olursa olsun birleştir.\nYalnızca bol RAM varken işaretleyin."
multi_search_cap = "Çoklu arama panelinin dizin kapsamı için dosya başına boyut sınırı.\nBundan büyük dosyalar atlanır ve atlanan dosyalar çipinde listelenir.\nSınırı tamamen kaldırmak için \"Sınırsız\" seçeneğini işaretleyin.\n\nVarsayılan: 50 MB."
multi_search_unlimited = "Boyutu ne olursa olsun dizindeki her dosyayı tara. Devasa bir\ngünlük veya döküm taramayı kilitleyip belleği tüketebilir."
chart_max_points = "Grafik sekmesinin eşit aralıklı alt örnekleme devreye girmeden önce\nçizeceği en fazla satır sayısı (Histogram, Çizgi, Dağılım). Çubuk\ngrafikler her zaman tüm girişi toplar; kutu grafikleri 5 sayılık\nözeti tüm giriş üzerinde hesaplar. Örneklemeyi devre dışı bırakmak\niçin 0 ayarlayın - yalnızca orta boyutlu tablolar için güvenlidir.\n\nVarsayılan: 100,000. Sayısal giriş virgül ayırıcıları kabul eder."
chart_max_categories = "Bir çubuk grafiğin çizmeyi reddetmeden önce kabul edeceği en fazla\nfarklı X kategorisi sayısı. Bunun üzerinde oluşturucu, okunamaz bir\nçubuk duvarı yerine bir hata gösterir - önce tabloyu filtreleyin ya\nda toplayın.\n\nVarsayılan: 200. Sayısal giriş virgül ayırıcıları kabul eder."
tables_in_picker = "Çok tablolu seçici iletişim kutusunun (SQLite, DuckDB, ...)\nvarsayılan boyutunda dikey olarak kaç tablo satırı sığdıracağı.\nİletişim kutusu yine de kullanıcı tarafından yeniden boyutlandırılabilir\n- bir veritabanında çok sayıda tablo olduğunda köşeden çekerek\nbüyütün.\n\nVarsayılan: 10. En az 1."
excel_auto_open = "Çok sayfalı bir Excel çalışma kitabının kaç sayfasının otomatik\nolarak açılacağı (her biri kendi sekmesinde). Bundan daha fazla\nsayfası olan çalışma kitapları, hangilerinin açılacağını seçmeniz\niçin bir seçici gösterir (yine de bu sayıdan fazlasını ya da tümünü\nseçebilirsin).\n\nVarsayılan: 5. En az 1."
max_recent = "Dosya menüsünde gösterilen son açılan dosya sayısı"
start_maximised = "Açık olduğunda pencere büyütülmüş başlar ve aşağıdaki boyut geri\nyükleme boyutu olarak kullanılır.\nKapalı olduğunda pencere seçilen boyutta başlar."
initial_window_size = "Başlangıçta pencere boyutu (\"Büyütülmüş başlat\" kapalıyken) veya\naçıkken geri yükleme boyutu."
ctrl_close = "Kapat"
ctrl_restore = "Geri yükle"
ctrl_full_size = "Tam boyut"
ctrl_minimise = "Küçült"

# Chat assistant panel. NOTE: values are English placeholders pending
# translation; the i18n parity test only requires the keys to exist.
write_protection = "Dosyalarınızı arayüzden kaydetmelere ve MCP sunucusunun varsayılanına\nkarşı korur. Açıkken bir SQLite, DuckDB veya GeoPackage dosyasında sütun\nekleme veya kaldırma kaydederken reddedilir. Asistan bu ayarla değil,\nsohbet profili başına (profilin Yazmaya izin ver anahtarı) yönetilir."
confirm_db_write_back = "Değişiklikler çalışan bir veritabanına gitmeden önce Octa neyin değişeceğini gösterir ve sorar.\nBunu kapatırsan Kaydet farkı hemen uygular; her iki durumda da tek bir işlemdir\nve başarısız bir yazma geri alınır."
confirm_url_redirects = "Bir web adresi seni başka birine gönderdiğinde, dosyayı oradan açmadan önce sor. Bu onay, değişikliğin görüldüğü tek yerdir."
backup_before_modify = "Asistan veya şema değiştiren bir veritabanı kaydı bir dosyanın\nüzerine yazmadan önce, dosyayı yanına zaman damgalı bir .bak\ndosyası olarak kopyala. Sıradan el ile kaydetmeler yedeklenmez."
chat_profiles = "Her profil kaydedilmiş bir kurulumdur: bir sağlayıcı, bir model, bir sıcaklık ve isteğe bağlı bir düşünme bütçesi, senin verdiğin bir adla. Aynı sağlayıcı için birkaç tane dahil olmak üzere istediğin kadar oluşturun ve asistan panelinden aralarında geçiş yapın."
chat_profile_base_url = "Bu profilin uç noktası. Aşağıda ayarlanan Ollama sunucu adresini kullanmak için boş bırakın."
write_options = "Octa bir dosya yazarken kullanılan varsayılanlar. Farklı kaydet ve toplu dönüştürme bunlardan başlar ve tek çalıştırma için değiştirebilir."
status_message_secs = "Bir durum mesajının kaybolmadan önce ekranda ne kadar kaldığı.\nAynı süre her mesaj için geçerli, başarı da hata da.\n\nFareyle üzerine gelince geri sayım durur - okuduğun ya da\nkopyaladığın bir hata yerinde kalır. Her mesajda ayrıca hemen\nkapatmak için bir 'x' var.\n\nKapatılamaz; 3'ün altı 3 sayılır. Varsayılan: 10."
chat_tools = "Asistanın hangi araçları kullanabileceği. Core grubu her mesajla gider; diğer gruplar ona yalnızca isimleriyle sayılır, iş gerektirdiğinde birini yükler. Kapatılan bir araç her yerden kalkar: gönderilmez, sunulmaz ve asistan yine de çağırırsa reddedilir."
chat_tools_enable_all = "Bütün araçları tekrar aç. Her mesajla sadece core grubu gider, geri kalanı asistan istemedikçe hiçbir şey tutmaz."
chat_tools_budget = "Araç açıklamalarının bir mesaja kabaca kaç token eklediği. Boyutlarından hesaplanır, o yüzden fatura değil, fikir verici bir sayı olarak oku."

