chat_max_tokens = "Giới hạn độ dài phản hồi (theo token) cho mỗi câu trả lời. Không giới hạn cho phép mô hình dùng mức tối đa của nó (Anthropic luôn cần giới hạn nên dùng giá trị cao)."
