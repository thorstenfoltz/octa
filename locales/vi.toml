chat_intro = "Trợ lý AI tích hợp điều khiển các công cụ của Octa trên các thẻ và tệp đang mở. Chọn nhà cung cấp và đặt khóa API của nó (hoặc chạy Ollama cục bộ), rồi mở bảng từ thanh công cụ (menu Phân tích, Trợ lý)."
