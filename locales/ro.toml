confirm_db_write_back = "Înainte ca modificările să ajungă într-o bază de date activă, Octa arată ce s-ar schimba și întreabă.\nDezactivează opțiunea ca Salvează să aplice imediat diferențele; oricum este o singură tranzacție,\niar o scriere eșuată este anulată."
