hint_gap_before = "Prima valoare de după."
hint_gap_missing_steps = "Câți pași ai seriei lipsesc între cele două, numărați în ritmul propriu al coloanei (zile, ore, luni)."
hint_gap_kind = "Ce fel de gol e: o pauză obișnuită sau o porțiune destul de lungă cât să pară o oprire, nu o scăpare."
hint_shape_column = "Coloana în care se află forma care se abate."
hint_shape_shape = "Forma care se abate: cifrele sunt 9, majusculele A, celelalte litere a."
hint_shape_count = "Câte valori au această formă."
hint_shape_example = "O valoare cu această formă."
overall_explained = "Media notelor pe coloană din raport. Treci cu mouse-ul peste antetul coloanei score ca să vezi cum se calculează o notă."
verdict_benford_conforms = "Primele cifre stau aproape de ce așteaptă legea lui Benford, așa cum fac de obicei mărimile măsurate sau adunate. Nu dovedește nimic: o coloană poate să se potrivească și tot să fie greșită."
verdict_benford_acceptable = "Puțin pe lângă proporțiile așteptate, în marja în care se plimbă datele reale. Nimic de făcut."
verdict_benford_marginal = "Destul de pe lângă cât să merite a doua privire, dar încă nu e o constatare. Uită-te cum se produce coloana înainte să citești ceva în ea."
verdict_benford_nonconforming = "Primele cifre nu arată a mărimi măsurate. Un motiv să te uiți mai departe, niciodată o constatare în sine: cifrele rotunjite, plafonate sau bătute de mână ajung toate aici absolut nevinovat."
verdict_benford_not_numbers = "Netestat: coloana nu conține numere, iar legea e despre prima cifră a unui număr."
verdict_benford_too_few = "Netestat: sub 300 de valori utilizabile, unde proporțiile cifrelor sunt zgomot, nu o distribuție."
verdict_benford_narrow = "Netestat: valorile se întind pe mai puțin de un factor zece. Un procent, o vârstă sau o notă nu au niciun motiv să urmeze legea, așa că un verdict doar ar induce în eroare."
verdict_benford_ids = "Netestat: numere întregi dese și toate diferite, deci o serie atribuită (un număr de rând, un număr de factură, un id). Astea se dau, nu se măsoară."
verdict_calendar_complete = "Fiecare pas al seriei e acolo, de la prima marcă de timp la ultima. Nicio gaură de explicat."
verdict_calendar_weekdays = "Singurele găuri sunt weekenduri sărite, ceea ce datele de business fac intenționat. Se numără ca fiind complet, iar acele weekenduri nu apar în fila cu găuri."
verdict_calendar_dst = "Singura gaură are forma unei schimbări de oră: un pas, într-o duminică, în zori. Mărcile de timp ale Octa nu poartă fus orar, deci asta citește forma, nu știe. Verifică dacă pentru serie contează ora."
verdict_calendar_gaps = "Timp care ar trebui să aibă rânduri și nu are. Fila Găuri de calendar listează fiecare gaură cu mărcile de timp de o parte și de alta."
verdict_calendar_not_dates = "Netestat: coloana nu conține date calendaristice sau mărci de timp."
verdict_calendar_too_few = "Netestat: sub trei mărci de timp distincte, încă nu e o serie."
verdict_calendar_irregular = "Netestat: niciun pas nu acoperă 60% dintre intervale, deci nu există un ritm în care să cauți găuri. Jurnalele de evenimente se citesc așa."
verdict_shape_consistent = "Fiecare valoare are aceeași formă, de exemplu fiecare cod poștal e A-99999."
verdict_shape_mixed = "Aproape fiecare valoare are o formă, câteva nu. Acelea sunt adesea greșeli de tastare sau un al doilea format; fila Forme amestecate le listează."
verdict_shape_na = "Netestat: coloana e goală, nu e text, sau are prea multe forme ca să se poată decide (text liber, sau mai multe formate intenționat)."

