write_options = "Valorile implicite când Octa scrie un fișier. Salvare ca și conversia în lot pornesc de la ele și le pot modifica pentru o rulare."
status_message_secs = "Cât timp rămâne un mesaj de stare pe ecran înainte să dispară.\nAceeași durată se aplică fiecărui mesaj, reușită sau eroare.\n\nDacă treci cu mouse-ul peste el, numărătoarea se oprește - o\neroare pe care o citești sau o copiezi rămâne pe loc. Fiecare\nmesaj are și un 'x' ca să-l închizi imediat.\n\nNu poate fi dezactivat; sub 3 se folosește 3. Implicit: 10."
chat_tools = "Ce unelte are voie să folosească asistentul. Grupul core pleacă cu fiecare mesaj; celelalte grupuri îi sunt doar numite, iar el încarcă unul când treaba o cere. O unealtă oprită dispare de peste tot: nu se trimite, nu se oferă și e refuzată dacă asistentul o cheamă totuși."
chat_tools_enable_all = "Pornește din nou toate uneltele. Cu fiecare mesaj pleacă doar grupul core, așa că restul nu costă nimic până când asistentul nu îl cere."
chat_tools_budget = "Cam câte tokenuri adaugă descrierile uneltelor la un mesaj. Calculat din mărimea lor, deci citește-l ca reper, nu ca factură."
sql_page_rows = "Câte rânduri de rezultat se aduc odată; când defilezi mai vin. Numărul de rânduri și Exportă acoperă mereu tot rezultatul. 0 încarcă tot dintr-o dată."
sql_auto_register = "Face fiecare altă filă deschisă interogabilă în panoul SQL sub numele ei, ca o îmbinare a două fișiere deschise să nu aibă nevoie de attach."
sql_auto_register_max = "Filele mai mari nu sunt înregistrate automat, fiindcă înregistrarea le copiază rândurile. În schimb primesc un buton Înregistrează."
sql_auto_register_max_off = "Se folosește doar cât timp Interoghează celelalte file deschise este pornit."
git_marks_uncommitted = "Colorează fișierele și folderele din bara laterală care au modificări git neconfirmate: modificate, adăugate, șterse, redenumite sau neurmărite."
git_marks_branch = "Colorează fișierele și folderele modificate pe ramura curentă de când s-a desprins din ramura de bază."
git_marks_base_branch = "Ramura cu care se compară. Când un depozit nu are nicio ramură cu acest nume, se încearcă main; dacă lipsește și aceea, marcajul de ramură pur și simplu nu apare, iar indiciul folderului spune asta."
git_marks_base_branch_off = "Se folosește doar cât timp Marchează modificările de pe această ramură este pornit."
git_marks_refresh_secs = "Cât de des bara laterală întreabă din nou git cât timp este vizibilă. 0 oprește temporizatorul: atunci marcajele se reîmprospătează doar la deschiderea unui folder și când Octa salvează un fișier."
git_marks_refresh_secs_off = "Se folosește doar cât timp cel puțin un marcaj git este pornit."
retype_layout_sample = "Câte valori citește Schimbă tipul când decide în ce format de dată este scrisă o coloană de text. Votul costă șapte analize de dată per valoare, toate deodată pe firul interfeței: la 5.000.000 de valori sunt 35.000.000 de analize, iar fereastra nu mai răspunde câteva secunde. Creșterea ajută doar când primele valori ale unei coloane nu le reprezintă pe celelalte, de exemplu un fișier sortat astfel încât toate rândurile ISO să fie la început. Nu schimbă niciodată un total afișat. Implicit 10.000."
retype_layout_sample_off = "Dezactivează Nelimitat ca să scrii un număr aici."
retype_layout_sample_unlimited = "Citește fiecare valoare din coloană în loc de un eșantion. Cel mai exact pe o coloană sortată neuniform, dar la câteva milioane de rânduri fereastra se blochează câteva secunde de fiecare dată când alegi un tip dată."
cloud_download_concurrency = "Câte obiecte din cloud descarcă o uniune în același timp. Implicit 8, minim 1. Citirea dintr-un depozit de obiecte înseamnă mai ales așteptarea dus-întors, nu mutarea octeților, așa că descărcarea una după alta lasă legătura inactivă între cereri. Opt este cam ce permite un navigator per gazdă. Crește-l pe o legătură rapidă cu latență mare; coboară-l la 1 dacă un furnizor sau un proxy începe să refuze cereri. Valorile foarte mari pornesc tot atâtea fire de execuție deodată și sunt cea mai rapidă cale către o eroare de limitare a cererilor."
cloud_sidebar_position = "La ce margine a ferestrei se ancorează browserul de conexiuni cloud. Implicit în stânga. Browserele de pe aceeași margine împart un panou."
db_sidebar_position = "La ce margine a ferestrei se ancorează browserul de conexiuni la baze de date. Implicit în stânga. Browserele de pe aceeași margine împart un panou."
sql_format_title = "Cum aranjează butonul Formatează din panoul SQL o interogare. Previzualizarea de mai jos arată rezultatul."
sql_format_keywords = "Dacă cuvintele cheie precum SELECT și FROM apar cu majuscule, cu minuscule sau cum le-ai scris."
sql_format_indent = "Cât înseamnă un nivel de indentare: 2 spații, 4 spații sau un tab."
sql_format_commas = "Unde stă virgula dintre două elemente ale unei liste. La începutul rândului următor, o virgulă lipsă sare imediat în ochi."
sql_format_joins = "Fiecare JOIN începe pe un rând nou la nivelul lui FROM, în loc să fie indentat sub el."
sql_format_inline = "O listă mai scurtă de atâtea caractere rămâne pe un rând, de exemplu SELECT a, b, c. Cu 0, fiecare element are rândul lui."
sql_format_blank_lines = "Câte rânduri goale despart două instrucțiuni."
sql_format_one_line = "Doar aranjează spațiile și majusculele cuvintelor cheie și pune fiecare instrucțiune pe un rând. Util ca s-o lipești într-un log sau într-un program."
sql_format_off_one_line = "Oprit cât timp Toată interogarea pe un rând e pornit: nu sunt rupturi de rând de aranjat."
sql_format_clause_width = "O clauză mai scurtă de atâtea caractere rămâne pe rândul cuvântului ei cheie, ca GROUP BY c.name, iar o subinterogare scurtă rămâne în parantezele ei. Pornește de la lățimea listelor."
sql_format_clause_needs_list = "Setează mai întâi lățimea listelor peste 0. Singură, setarea asta ar lăsa elementele clauzei fără indentare."
sql_format_bracket_width = "Parantezele mai scurte de atâtea caractere rămân pe un rând, ca coalesce(a, 0) sau IN (1, 2, 3). La cele mai lungi fiecare element are rândul lui."
sql_format_semicolon = "Adaugă ; după ultima instrucțiune dacă nu are."
sql_format_preview = "O interogare de exemplu aranjată cu setările de mai sus. Se schimbă pe măsură ce le schimbi."
restore_session = "La pornire, Octa redeschide fișierele care erau deschise când l-ai închis. Dezactivat implicit. Fișierele care nu mai există sunt sărite."
restore_session_cloud = "Redeschide și obiectele din cloud. Atenție: fiecare se descarcă din nou la fiecare pornire, ceea ce durează și poate costa bani pentru transferul de date."
restore_session_connections = "Redeschide și tabelele din conexiunile la baze de date și din endpointurile API. Atenție: fiecare trimite o interogare serverului ei la fiecare pornire. Pe un data warehouse asta îl poate trezi și poate costa bani, iar o autentificare expirată îți cere să te conectezi din nou."
