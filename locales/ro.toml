hint_calendar_verdict = "Dacă o coloană de timp curge fără găuri: complete, weekdays only, complete (clock change) sau gaps. Weekendurile și schimbările de oră nu se numără ca lipsă. O coloană care nu e o serie spune de ce nu a fost testată. Treci cu mouse-ul peste un verdict ca să vezi ce înseamnă; găurile în sine sunt într-o filă separată."
hint_shape_verdict = "Dacă valorile unei coloane de text au o formă comună: consistent, mixed (o formă și câteva excepții) sau na. Treci cu mouse-ul peste un verdict ca să vezi ce înseamnă; excepțiile sunt într-o filă separată."
hint_score = "Nota acestei coloane din 100, calculată din trei dintre coloanele din stânga: 40% pentru cât de completată este, 40% pentru câte valori se potrivesc cu tipul declarat și 20% pentru cât de variate sunt valorile. Valorile numerice aberante scad până la 10 puncte. Nu spune nimic despre dacă valorile sunt corecte, ci doar despre cât de bine sunt formate."
section_missingness = "Lipsesc împreună"
section_calendar = "Goluri în calendar"
sections_added = "S-au deschis {n} file suplimentare pentru constatări care nu sunt pe coloană."
section_missingness_intro = "Coloane care rămân goale pe aceleași rânduri. Patru coloane cu câte 8% goluri fiecare sunt o problemă diferită după cum e vorba de fiecare dată de aceleași 8% dintre rânduri (o îmbinare stricată, un singur loc de reparat) sau de patru 8% fără legătură. Fiecare rând de aici e un astfel de grup, cel mai mare primul."
section_calendar_intro = "Goluri într-o coloană de dată sau marcaj de timp: porțiunile în care seria sare în loc să pășească. Weekendurile lipsă și trecerea la ora de vară nu se numără, așa că ce e listat e o zi, o oră sau o lună chiar lipsă."
section_shapes = "Forme amestecate"
section_shapes_intro = "Coloane de text în care aproape fiecare valoare are o formă. Fiecare rând e o formă care se abate de la ea, cu frecvența și un exemplu."
