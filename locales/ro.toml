confirm_url_redirects = "Când o adresă web te trimite la alta, întreabă înainte de a deschide fișierul de acolo. Confirmarea e singurul loc unde se vede schimbarea."
backup_before_modify = "Înainte ca asistentul sau o salvare care schimbă schema bazei de date\nsă suprascrie un fișier, acesta este copiat mai întâi într-un fișier .bak cu marcaj de timp alături.\nSalvările manuale obișnuite nu primesc copie de siguranță."
chat_profiles = "Fiecare profil este o configurație salvată: un furnizor, un model, o temperatură și un buget de raționament opțional, sub un nume ales de tine. Creează câte vrei, inclusiv mai multe pentru același furnizor, și comută între ele din panoul asistentului."
