sidebar_position = "Pe ce parte este ancorat arborele de directoare când un\nfolder este deschis prin Fișier > Deschide director."
shortcuts_intro = "Faceți clic pe 'Înregistrează', apoi apăsați o combinație de taste (cu Ctrl / Shift / Alt).\nApăsați Esc pentru a anula. 'Șterge' lasă acțiunea nelegată."
initial_load_cap = "Numărul maxim de rânduri încărcate în tabel la prima deschidere pentru\nformatele de streaming (Parquet, CSV, TSV). Restul rândurilor\nse încarcă în fundal pe măsură ce derulați.\n\nImplicit: 2.000.000. Mărirea îmbunătățește completitudinea\nprimei afișări dar folosește mai multă memorie. Micșorarea face\ndeschiderea inițială mai rapidă dar mută mai mult lucru pe\nîncărcătorul de fundal. Bifați \"Nelimitat\" pentru a dezactiva\ncomplet limita și a încărca toate rândurile de la început.\n\nTastați un număr - aplicat la Aplică."
db_page_rows = "Rânduri pe cerere când deschizi un tabel dintr-o conexiune la o bază de date live.\n\nImplicit: 100,000. Este o dimensiune de pagină, nu un plafon: pagina următoare se încarcă în fundal pe măsură ce derulezi, exact ca la un fișier Parquet mare.\n\nEste o setare separată pentru că limita de mai sus măsoară citirea unui fișier local, pe când aici trec megabytes de JSON prin rețea. Scade-o dacă deschiderea unui tabel ți se pare lentă.\n\nTastați un număr - aplicat la Aplică."
raw_view_cap = "Dimensiunea maximă a fișierului (în MB) pe care Octa o citește\nintegral în editorul vizualizării brute. Guvernează și revenirea\nla text brut după o eroare de analiză, precum și partea brută a\nvizualizării de comparare. Fișierele mai mari sar peste textul\nbrut pentru a proteja memoria.\n\nImplicit: 50 MB. Bifează \"Fără limită\" pentru a încărca orice\nfișier, indiferent de dimensiune. Se aplică la Aplicare."
decompress_cap = "Dimensiunea maximă după decomprimare (în MB) pentru fișierele\n.gz / .zst deschise transparent. Un fișier comprimat mic poate\ncrește enorm (o bombă de decomprimare); peste această limită\ndeschiderea este refuzată.\n\nImplicit: 4.295 MB (4 GB). Se aplică la Aplicare."
decompress_unlimited = "Elimină complet limita de decomprimare. Bifează asta doar\npentru arhive în care ai încredere."
raw_view_unlimited = "Citește textul complet al oricărui fișier în vizualizarea brută,\nfără limită de dimensiune. Folosește doar dacă ai RAM din belșug:\nun fișier de mai mulți GB este citit integral în memorie."
initial_load_unlimited = "Încarcă fiecare rând din fișier de la început. Recomandat doar\ncând aveți RAM de rezervă - un parquet de 100 M rânduri consumă\ncâțiva GB."
syntax_size_cap = "Fișierele mai mari decât atât revin la monospațiat simplu în\neditorul brut. Setați 0 pentru a dezactiva complet evidențierea\nsintaxei; o valoare foarte mare renunță la protecție.\nJSON/YAML/XML/Markdown/TOML nu sunt niciodată evidențiate\n- folosesc vizualizările lor de arbore/previzualizare.\n\nImplicit: 1 MB. Tastați un număr, alegeți o unitate - la Aplică."
open_as_text = "Extensii suplimentare de tratat ca text simplu la deschidere\n(suprascriu orice cititor le-ar revendica normal).\nSeparate prin virgulă sau spațiu, fără punct inițial, litere mici.\nExemplu: log4j  myproj  rawdata\n\nAplicate la Aplică; au efect la deschiderile ulterioare."
folder_union_cap = "Numărul maxim de fișiere pe care o unire de folder din cloud le\ndescarcă și le combină. Fiecare fișier este citit complet în memorie,\nașa că un folder cu zeci de mii de părți poate epuiza memoria RAM.\nFișierele peste limită sunt omise și numărate în bara de stare.\n\nImplicit: 500. Se aplică la Aplicare."
folder_union_unlimited = "Unește toate fișierele din folder, oricâte ar fi. Bifați doar\ndacă aveți RAM din belșug."
multi_search_cap = "Limită de dimensiune per fișier pentru domeniul de director al\npanoului Căutare multiplă. Fișierele mai mari sunt omise și listate în\nchipul fișierelor omise. Bifați \"Nelimitat\" pentru a elimina complet limita.\n\nImplicit: 50 MB."
multi_search_unlimited = "Scanează fiecare fișier din director, indiferent de dimensiune. Un\njurnal sau dump uriaș poate bloca scanarea și consuma memoria."
chart_max_points = "Numărul maxim de rânduri pe care fila Grafic le va trasa înainte de\neșantionarea echidistantă (Histogramă, Linie, Dispersie). Graficele cu bare\nagregă mereu toată intrarea; diagramele Box calculează\nrezumatul în 5 numere pe toată intrarea. Setați 0 pentru a dezactiva\neșantionarea - sigur doar pentru tabele de dimensiuni moderate.\n\nImplicit: 25.000. Câmpul numeric acceptă separatori virgulă."
chart_max_categories = "Numărul maxim de categorii X distincte pe care un grafic cu bare îl acceptă\nînainte de a refuza desenarea. Peste asta randerul afișează o eroare\nîn loc de un zid ilizibil de bare - filtrați sau\nagregați mai întâi tabelul.\n\nImplicit: 200. Câmpul numeric acceptă separatori virgulă."
tables_in_picker = "Câte rânduri de tabel ar trebui să încapă vertical în dialogul\nde selecție multi-tabel (SQLite, DuckDB, ...) la dimensiunea implicită.\nDialogul rămâne redimensionabil - trageți colțul pentru a-l\nmări când o bază de date are multe tabele.\n\nImplicit: 10. Minim 1."
excel_auto_open = "Câte foi dintr-un registru Excel cu mai multe foi se deschid\nautomat (fiecare în fila sa). Registrele cu mai multe\nfoi decât atât afișează un selector ca să alegeți care se deschid\n(puteți alege oricum mai mult, sau toate).\n\nImplicit: 5. Minim 1."
max_recent = "Numărul de fișiere deschise recent afișate în meniul Fișier"
start_maximised = "Când e activ, fereastra pornește maximizată, iar dimensiunea de mai jos\neste folosită ca dimensiune de restaurare din maximizare.\nCând e dezactivat, fereastra pornește la dimensiunea aleasă."
initial_window_size = "Dimensiunea ferestrei la pornire (când \"Pornește maximizat\" e dezactivat),\nsau dimensiunea de restaurare din maximizare când e activat."
ctrl_close = "Închide"
ctrl_restore = "Restaurează"
ctrl_full_size = "Dimensiune completă"
ctrl_minimise = "Minimizează"

