intro = "Întreabă dacă două coloane de numere sau de categorii sunt distribuite la fel: nu dacă mediile lor se potrivesc, ci dacă se potrivește toată forma. Prețurile de anul trecut față de cele de anul acesta, timpii de răspuns dintr-o regiune față de alta. Octa alege testul din date (Kolmogorov-Smirnov pentru numere, hi pătrat pentru categorii) și răspunde într-o propoziție, cu statistica dedesubt."
menu = "Compară distribuțiile..."
menu_hint = "Verifică dacă două coloane sunt distribuite la fel, cu formă cu tot, nu doar în medie. Deschide o filă cu răspunsul într-o propoziție."
first = "Prima"
second = "A doua"
compare = "Compară"
compare_hint = "Rulează testul și deschide răspunsul într-o filă nouă"
need_columns = "Alege mai întâi ambele coloane."
tab_label = "Distribuții"
column_hint = "Una dintre cele două coloane de comparat. Alege întâi fila, apoi coloana din ea. Ordinea nu contează: testului îi e indiferent care e unde."
tab_hint = "Răspunsul testului de distribuție: verdictul în cuvinte, iar dedesubt statistica, valoarea p și mărimile pe care s-a calculat."

[refint]
