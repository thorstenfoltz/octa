verdict_numbers_repeat = "Sense provar. Menys del 95% dels valors són diferents, així que això no és una numeració. Les edats i les quantitats fan aquesta pinta."
verdict_numbers_not_sequence = "Sense provar. Menys del 60% dels passos entre valors veïns són 1, així que els valors no pugen d'un en un."
