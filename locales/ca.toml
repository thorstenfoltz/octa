hint_calendar_verdict = "Si una columna de temps avança sense forats: complete, weekdays only, complete (clock change) o gaps. Els caps de setmana i els canvis d'hora no compten com a absents. Una columna que no és una sèrie diu per què no s'ha provat. Passa el ratolí per sobre d'un veredicte per veure què vol dir; els forats mateixos es llisten en una pestanya pròpia."
hint_shape_verdict = "Si els valors d'una columna de text comparteixen una forma: consistent, mixed (una forma i uns quants que s'hi desvien) o na. Passa el ratolí per sobre d'un veredicte per veure què vol dir; els que es desvien es llisten en una pestanya pròpia."
hint_score = "La nota d'aquesta columna sobre 100, calculada a partir de tres de les columnes de l'esquerra: un 40% per quanta part està plena, un 40% per quanta part coincideix amb el tipus declarat i un 20% per com de variats són els valors. Els valors atípics numèrics resten fins a 10 punts. No diu res de si els valors són correctes, només de si estan ben formats."
section_missingness = "Buits alhora"
section_missingness_intro = "Columnes que queden buides a les mateixes files. Quatre columnes amb un 8% buit cadascuna són un problema diferent segons si és el mateix 8% de files cada vegada (una unió trencada, un conjunt de columnes per arreglar) o quatre 8% sense relació. Cada fila d'aquí és un d'aquests grups, primer el més gran."
section_calendar = "Forats al calendari"
section_calendar_intro = "Forats en una columna de data o de marca de temps: els trams en què la sèrie fa un salt en lloc d'avançar pas a pas. Els caps de setmana que falten i el salt de l'horari d'estiu no compten, de manera que el que es llista és un dia, una hora o un mes que falta de debò."
section_shapes = "Formes barrejades"
section_shapes_intro = "Columnes de text on gairebé tots els valors tenen la mateixa forma. Cada fila és una forma que se n'aparta, amb quantes vegades apareix i un exemple."
