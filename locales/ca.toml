chat_intro = "Assistent d'IA integrat que fa servir les eines de l'Octa sobre les teves pestanyes i fitxers oberts. Tria un proveïdor i posa'n la clau d'API (o executa Ollama localment), i després obre el plafó des de la barra d'eines (menú Analitza, Assistent)."
chat_max_iterations = "Nombre màxim de rondes de crides a eines que l'assistent pot fer dins d'un sol missatge abans d'haver d'aturar-se. Una protecció contra bucles d'eines descontrolats."
chat_max_tokens = "Límit de la llargada de la resposta (en tokens) que es demana per resposta. Il·limitat deixa que el model faci servir el seu propi màxim (Anthropic sempre necessita un límit, així que allà es fa servir un valor alt)."
chat_provider = "Amb quin motor de LLM parla l'assistent. Cada proveïdor necessita la seva clau d'API, excepte Ollama, que s'executa localment."
chat_model = "El model que es fa servir per a aquest proveïdor. Tria'n un de predefinit o escriu qualsevol nom de model."
chat_ollama_url = "URL arrel del teu servidor Ollama local. L'Octa hi afegeix els camins de l'API."
chat_position = "On s'acobla el plafó de xat respecte de la taula."
chat_export_dir = "Carpeta on l'assistent escriu els fitxers exportats (CSV nous, gràfics) quan no dones un camí complet."
chat_audit_log = "Afegeix cada crida a eines de l'assistent a un registre dins del directori de configuració (chat_audit/). Desactivat per defecte."
chat_export_trace = "Les exportacions inclouran també cada pas del quadre de depuració, amb la indicació del sistema, les crides a eines i els seus resultats, de manera que poden contenir les teves dades. Només hi ha passos dels xats d'aquesta execució de l'Octa, perquè no es desen mai."
chat_writing_apply_directly = "Desactivat, la versió nova de l'assistent s'obre al costat del teu text actual i només hi entra quan l'acceptes. Activat, va de seguida a l'editor i el botó Desfés el canvi recupera el text anterior. En cap cas es desa res al disc."
chat_cli_program = "Octa inicia aquest programa al teu ordinador i li envia la teva pregunta. Deixa-ho buit per fer servir el que hi ha al teu PATH. Instal·la'l i inicia-hi la sessió primer. Octa no veu mai el teu inici de sessió."
chat_render_markdown = "Activat: els títols, les llistes, les taules, els blocs de codi i els enllaços de les respostes de l'assistent es mostren amb format. Desactivat: veus el Markdown en brut. Els teus missatges no es tornen a formatar mai."
chat_audit_warn = "Mostra un avís en arrencar quan els registres d'auditoria superen aquesta mida."
chat_api_key = "La teva clau d'API per a aquest proveïdor. Es desa a l'anell de claus del sistema quan n'hi ha, si no, en text pla a settings.toml."
map_intro = "Valors per defecte de la vista de mapa (la fan servir els fitxers GeoJSON). La pestanya activa pot alternar entre Tessel·les i Només geometria des de la barra d'eines del mapa."
map_default_mode = "Tessel·les: carrega un mapa navegable des de l'URL de tessel·les configurat.\nNomés geometria: pinta només els elements sobre un llenç en blanc."
map_fallback = "Quan falla la càrrega de tessel·les (sense connexió, bloquejada), passa automàticament a mostrar només la geometria en aquella pestanya."
tile_url = "Patró d'URL de les tessel·les ràster. `{z}/{x}/{y}` se substitueixen pel nivell de zoom i les coordenades de la tessel·la. Per defecte apunta al servidor de tessel·les d'OSM - per a producció o ús intensiu, apunta a un proveïdor propi o comercial."
sidebar_position = "A quina vora s'acobla el navegador de carpetes. A esquerra i dreta\nes redimensiona per amplada; a dalt i a baix, per alçada. Els navegadors del núvol i\nde bases de dades tenen les seves posicions a Plafons."
shortcuts_intro = "Fes clic a 'Enregistra' i prem una combinació de tecles (amb Ctrl / Shift / Alt).\nPrem Esc per cancel·lar l'enregistrament. 'Esborra' deixa l'acció sense drecera."
initial_load_cap = "Màxim de files que es carreguen a la taula en obrir per primer cop\nels formats en flux (Parquet, CSV, TSV). La resta de files\narriben en segon pla mentre et desplaces.\n\nPer defecte: 2.000.000. Augmentar-lo fa que la primera vista\nsigui més completa, però fa servir més memòria. Reduir-lo fa\nque la primera obertura sigui més ràpida, però passa més feina\nal carregador en segon pla. Marca \"Il·limitat\" per desactivar\nel límit del tot i carregar totes les files d'entrada.\n\nEscriu un nombre - s'aplica en prémer Aplica."
db_page_rows = "Files que es demanen per petició quan obres una taula d'una connexió a una base de dades en directe.\n\nPer defecte: 100.000. És una mida de pàgina, no un sostre: la pàgina següent es carrega en segon pla mentre et desplaces, igual que amb un fitxer Parquet gran.\n\nVa a part del límit de dalt perquè aquell mesura la lectura d'un fitxer local, mentre que aquest es converteix en megabytes de JSON per la xarxa. Redueix-lo si obrir una taula et sembla lent.\n\nEscriu un nombre - s'aplica en prémer Aplica."
raw_view_cap = "Mida màxima de fitxer (en MB) que l'Octa llegeix sencer a l'editor\nde la vista en brut. També limita la vista en brut alternativa després d'un error\nd'interpretació i el costat en brut de la vista de comparació. Els fitxers més grans\nno carreguen el text en brut per protegir la memòria.\n\nPer defecte: 50 MB. Marca \"Il·limitat\" per carregar qualsevol fitxer\nsigui quina sigui la mida. S'aplica en prémer Aplica."
decompress_cap = "Mida màxima descomprimida (en MB) dels fitxers .gz / .zst\noberts de manera transparent. Un fitxer comprimit molt petit pot créixer moltíssim\n(una bomba de descompressió); per sobre d'aquest límit, l'obertura es rebutja.\n\nPer defecte: 4.295 MB (4 GB). S'aplica en prémer Aplica."
decompress_unlimited = "Treu del tot el límit de mida de descompressió. Marca-ho només\nper a arxius en què confiïs."
raw_view_unlimited = "Llegeix el text complet de qualsevol fitxer a la vista en brut, sense\nlímit de mida. Fes-ho servir només si et sobra RAM - un fitxer de diversos GB\nes llegeix sencer a la memòria."
initial_load_unlimited = "Carrega totes les files del fitxer d'entrada. Només es recomana\nsi et sobra RAM - un parquet de 100 M de files consumeix\ndiversos GB."
syntax_size_cap = "Els fitxers més grans que això es mostren en monoespaiat pla a\nl'editor en brut. Posa-hi 0 per desactivar del tot el ressaltat de sintaxi;\nposa-hi un nombre molt gran per prescindir de la\nprotecció. JSON/YAML/XML/Markdown/TOML no es ressalten mai\n- fan servir les seves vistes d'arbre o de previsualització.\n\nPer defecte: 1 MB. Escriu un nombre i tria una unitat - s'aplica en prémer Aplica."
open_as_text = "Extensions de fitxer addicionals que s'obren com a text pla\n(passen per davant del lector que normalment se les quedaria).\nSeparades per comes o espais, sense punt inicial, en minúscules.\nExemple: log4j  myproj  rawdata\n\nS'aplica en prémer Aplica; té efecte a partir de la propera obertura de fitxers."
folder_union_cap = "Nombre màxim de fitxers que baixa i combina una unió de\ncarpeta al núvol. Cada fitxer es llegeix sencer a la memòria, de manera que una carpeta\namb desenes de milers de parts podria esgotar la RAM. Els fitxers\nper sobre del límit s'ometen i es compten a la barra d'estat.\n\nPer defecte: 500. S'aplica en prémer Aplica."
folder_union_unlimited = "Uneix tots els fitxers de la carpeta, siguin quants siguin.\nFes-ho servir només si et sobra RAM."
multi_search_cap = "Límit de mida per fitxer de l'abast de directori del plafó\nde cerca múltiple. Els fitxers més grans s'ometen i es llisten a\nl'etiqueta de fitxers omesos. Marca \"Il·limitat\" per treure el límit del tot.\n\nPer defecte: 50 MB."
multi_search_unlimited = "Examina tots els fitxers del directori, sigui quina sigui la mida. Un registre enorme\no un bolcat pot encallar l'examen i menjar-se la memòria."
chart_max_points = "Màxim de files que la pestanya Gràfic dibuixa abans que s'apliqui un\nmostreig uniforme (Histograma, Línia, Dispersió). Els gràfics de barres\nsempre agreguen totes les dades; els diagrames de caixa calculen el\nresum de 5 nombres sobre totes les dades. Posa-hi 0 per desactivar\nel mostreig - només és segur amb taules de mida moderada.\n\nPer defecte: 25.000. El camp numèric accepta separadors de coma."
chart_max_categories = "Màxim de categories X diferents que accepta un gràfic de barres abans\nde negar-se a dibuixar. Per sobre d'això es mostra un error\nen lloc d'una paret de barres il·legible - filtra o\nagrega primer la taula.\n\nPer defecte: 200. El camp numèric accepta separadors de coma."
tables_in_picker = "Quantes files de taules ha de cabre verticalment el selector de diverses taules (SQLite,\nDuckDB, ...) amb la seva mida per defecte. El\ndiàleg continua sent redimensionable - arrossega la cantonada per fer-lo\nmés gran quan una base de dades té moltes taules.\n\nPer defecte: 10. Mínim 1."
excel_auto_open = "Quants fulls d'un llibre d'Excel amb diversos fulls s'obren\nautomàticament (cadascun a la seva pestanya). Els llibres amb més\nfulls mostren un selector perquè triïs quins obrir\n(encara en pots triar més que aquest nombre, o tots).\n\nPer defecte: 5. Mínim 1."
max_recent = "Nombre de fitxers oberts recentment que es mostren al menú Fitxer"
start_maximised = "Si està activat, la finestra s'obre maximitzada (ocupa tota la\npantalla), i la mida de sota només s'aplica quan la\ndesmaximitzes. Si està desactivat, la finestra s'obre amb la mida triada."
open_in_running_instance = "Activat: fer doble clic en un fitxer, o executar octa amb un fitxer, afegeix una pestanya a l'Octa que ja està obert. Iniciar l'Octa sense fitxer encara n'obre un segon. Desactivat: cada inici és un Octa independent. S'aplica la pròxima vegada que s'inicia l'Octa."
notify_on_finish = "Activat per defecte: quan una tasca que ha durat una estona acaba i l'Octa no és la finestra del davant, el sistema mostra una notificació que diu què ha acabat i quant ha trigat."
notify_after_secs = "Les tasques més curtes acaben mentre encara mires, de manera que no reben notificació."
notify_after_secs_off = "Primer activa les notificacions."
notify_test = "Mostra ara mateix una notificació, perquè vegis com és i comprovis que el sistema deixa que l'Octa les enviï."
notify_when_focused = "Desactivat per defecte. Activat: també reps la notificació quan l'Octa és la finestra del davant, sempre que la tasca hagi durat prou."
initial_window_size = "Mida en píxels de la finestra quan NO està maximitzada. Una finestra\nmaximitzada sempre ocupa tota la pantalla, així que amb la finestra maximitzada\ntotes les mides semblen iguals; això només s'aplica quan la desmaximitzes\n(o amb \"Inicia maximitzada\" desactivat)."
ctrl_close = "Tanca"
ctrl_restore = "Restaura"
ctrl_full_size = "Mida completa"
ctrl_minimise = "Minimitza"
write_protection = "Quan està activat, es rebutja desar un fitxer SQLite, DuckDB o GeoPackage si s'hi han afegit o tret columnes. Val per als desaments a l'aplicació i per al servidor MCP, que ho llegeix un cop en arrencar. L'assistent segueix en canvi l'opció Permet l'escriptura del seu perfil."
chat_profile_may_override = "Aquest és el valor per defecte. Un perfil de model pot fixar el seu."
confirm_db_write_back = "Abans que les edicions vagin a una base de dades en directe, mostra què canviaria i pregunta.\nDesactiva-ho perquè Desa apliqui les diferències directament; en tots dos casos és\nuna sola transacció, i una escriptura fallida es desfà igualment."
db_pushdown = "Quan una pestanya de base de dades només conté una part de la seva taula, Resum, Freqüència de valors, l'informe de qualitat, Correlació, el Cercador de claus de combinació, el Diagnòstic de combinació, Troba taules de consulta i Mesura del mapa de relacions s'executen com a SQL al servidor sobre totes les files, sense baixar-les.\nDesactiva-ho per executar-los sobre les files carregades."
auto_refresh_min = "La recàrrega automàtica rebutja un interval més curt en una pestanya de base de dades o d'API."
auto_refresh_min_billed = "El mateix per a BigQuery, Athena i Snowflake, on cada lectura costa diners."
confirm_url_redirects = "Quan una adreça web et porta a una altra, pregunta abans d'obrir el fitxer d'allà. La confirmació és l'únic lloc on es veu aquest canvi."
backup_before_modify = "Abans que l'assistent o un desament de base de dades que canvia l'esquema sobreescrigui\nun fitxer, primer el copia a un fitxer .bak amb data i hora al costat.\nEls desaments manuals habituals no tenen còpia de seguretat."
chat_profiles = "Cada perfil és una configuració desada: un proveïdor, un model, una temperatura i un pressupost de raonament opcional, amb el nom que triïs. Fes-ne tants com vulguis, fins i tot diversos per al mateix proveïdor, i canvia entre ells des del plafó de l'assistent."
chat_profile_base_url = "Endpoint d'aquest perfil. Deixa-ho buit per fer servir l'adreça del servidor Ollama definida a sota."
write_options = "Valors per defecte que es fan servir quan l'Octa escriu un fitxer. Desa com a i la conversió per lots parteixen d'aquí i els poden canviar per a una execució."
status_message_secs = "Quant de temps es queda a la pantalla un missatge d'estat abans d'esvair-se.\nEl mateix temps val per a tots els missatges, d'èxit o d'error.\n\nSi passes el ratolí per sobre del missatge, el compte enrere s'atura, de manera que un error que\nestàs llegint o copiant no es mou. Cada missatge també té una\n'x' per tancar-lo de seguida.\n\nNo es pot desactivar; els valors per sota de 3 es tracten com a 3.\nPer defecte: 10."
chat_tools = "Quines eines pot fer servir l'assistent. El grup bàsic va amb cada missatge; dels altres grups només se'n diu el nom a l'assistent, que en carrega un quan una feina el necessita. Desactivar una eina la treu de tot arreu: no s'envia, no s'ofereix i es rebutja si l'assistent la demana igualment."
chat_tools_enable_all = "Torna a activar totes les eines. Només el grup bàsic s'envia amb cada missatge, de manera que la resta no costa res fins que l'assistent la demana."
chat_tools_budget = "Aproximadament quants tokens afegeixen les descripcions de les eines a un missatge. Es calcula a partir de la seva mida, així que pren-ho com una orientació, no com una factura."
sql_page_rows = "Quantes files de resultat es demanen cada vegada; en van arribant més mentre et desplaces. El recompte de files i Exporta sempre cobreixen tot el resultat. 0 ho carrega tot de cop."
sql_auto_register = "Fa que totes les altres pestanyes obertes es puguin consultar al plafó SQL amb el seu propi nom, de manera que combinar dos fitxers oberts no necessita cap pas d'adjuntar."
sql_auto_register_max = "Les pestanyes més grans que això no es registren automàticament, perquè registrar-les en copia les files. En lloc d'això, reben un botó Registra."
sql_auto_register_max_off = "Només es fa servir mentre Consulta les altres pestanyes obertes està activat."
git_marks_uncommitted = "Acoloreix els fitxers i les carpetes de la barra lateral que tenen canvis de git sense confirmar: modificats, afegits, suprimits, reanomenats o sense seguiment."
git_marks_branch = "Acoloreix els fitxers i les carpetes que han canviat a la branca actual des que es va separar de la branca base."
git_marks_base_branch = "Branca amb què es compara. Quan un repositori no té cap branca amb aquest nom, es prova main; si tampoc hi és, la marca de branca simplement no apareix i el consell de la carpeta ho diu."
git_marks_base_branch_off = "Només es fa servir mentre Marca els canvis d'aquesta branca està activat."
git_marks_refresh_secs = "Cada quan la barra lateral torna a preguntar a git mentre és visible. 0 desactiva el temporitzador: llavors les marques només s'actualitzen quan s'obre una carpeta i quan l'Octa desa un fitxer."
git_marks_refresh_secs_off = "Només es fa servir mentre hi ha almenys una marca de git activada."
retype_layout_sample = "Quants valors llegeix Canvi de tipus per decidir quin format de data fa servir una columna de text. La votació costa set interpretacions de data per valor, totes de cop al fil de la interfície: amb 5.000.000 de valors són 35.000.000 d'interpretacions i la finestra deixa de respondre uns segons amb un sol clic. Augmentar-lo només ajuda quan els primers valors d'una columna no representen la resta, com en un fitxer ordenat de manera que totes les files en format ISO van primer. No canvia mai cap recompte mostrat. Per defecte 10.000."
retype_layout_sample_off = "Desactiva Il·limitat per escriure-hi un nombre."
retype_layout_sample_unlimited = "Llegeix tots els valors de la columna en lloc d'una mostra. És l'opció més exacta en una columna ordenada de manera desigual, però amb una columna de diversos milions de files la finestra deixa de respondre uns segons cada vegada que tries un tipus de data."
folder_compare_max_files = "Compara carpetes deixa de llistar una carpeta després d'aquest nombre de fitxers i diu que el resultat és incomplet. Els nombres més alts triguen més i fan servir més memòria en buckets grans."
folder_compare_max_files_off = "Il·limitat està marcat: es llisten tots els fitxers."
folder_compare_max_files_unlimited = "Llista tots els fitxers de totes les carpetes, siguin quants siguin."
cloud_download_concurrency = "Quants objectes treballa alhora una connexió al núvol quan una tasca en toca molts, com una unió, copiar, moure o esborrar una carpeta, o comparar carpetes. Una connexió pot fixar el seu propi nombre al seu formulari. Per defecte 8, mínim 1. Un emmagatzematge d'objectes passa gairebé tot el temps esperant la resposta, així que anar objecte per objecte deixa l'enllaç aturat. Baixa'l a 1 si un proveïdor o un proxy comença a rebutjar peticions. Valors molt alts engeguen tants fils alhora i aviat porten un error de límit de peticions."
cloud_sidebar_position = "A quina vora de la finestra s'acobla el navegador de connexions al núvol. A l'esquerra per defecte. Els navegadors de la mateixa vora comparteixen un plafó."
db_sidebar_position = "A quina vora de la finestra s'acobla el navegador de connexions de base de dades. A l'esquerra per defecte. Els navegadors de la mateixa vora comparteixen un plafó."
sql_format_title = "Com disposa una consulta el botó Formata del plafó SQL. La previsualització de sota mostra el resultat."
sql_format_keywords = "Si les paraules clau com SELECT i FROM surten en majúscules, en minúscules o tal com les has escrit."
sql_format_indent = "Què és un nivell de sagnat: 2 espais, 4 espais o una tabulació."
sql_format_commas = "On va la coma entre dos elements d'una llista. A l'inici de la línia següent fa que una coma que falta es vegi de seguida."
sql_format_joins = "Comença cada JOIN en una línia nova al mateix nivell que FROM, en lloc de sagnat a sota."
sql_format_inline = "Una llista més curta que aquest nombre de caràcters es queda en una línia, com SELECT a, b, c. 0 posa cada element en una línia pròpia."
sql_format_blank_lines = "Quantes línies buides separen dues instruccions."
sql_format_one_line = "Només endreça els espais i les majúscules de les paraules clau i posa cada instrucció en una línia. Útil per enganxar-la en un registre o en un programa."
sql_format_off_one_line = "Desactivat mentre Tota la consulta en una línia està activat: no hi ha salts de línia per disposar."
sql_format_clause_width = "Una clàusula més curta que aquest nombre de caràcters es queda a la línia de la seva paraula clau, com GROUP BY c.name, i una subconsulta curta es queda dins dels parèntesis. Comença amb l'amplada de llista."
sql_format_clause_needs_list = "Primer posa l'amplada de llista per sobre de 0. Sola, aquesta opció deixaria els elements d'una clàusula sense sagnat."
sql_format_bracket_width = "Els parèntesis més curts que aquest nombre de caràcters es queden en una línia, com coalesce(a, 0) o IN (1, 2, 3). Els més llargs posen cada element en una línia pròpia."
sql_format_semicolon = "Afegeix ; després de l'última instrucció quan no en té."
sql_format_preview = "Una consulta d'exemple disposada amb els paràmetres de dalt. Canvia a mesura que els canvies."
restore_session = "Quan l'Octa s'inicia, torna a obrir els fitxers que estaven oberts quan el vas tancar. Desactivat per defecte. Els fitxers que ja no hi són s'ometen. Els editors SQL també tornen, només amb el text i el fitxer, així que no es connecta res."
restore_session_cloud = "Torna a obrir també els objectes del núvol. Compte: cadascun es torna a baixar a cada inici, cosa que porta temps i pot costar diners en transferència de dades."
restore_session_connections = "Torna a obrir també les taules de connexions de base de dades i d'endpoints d'API. Compte: cadascuna envia una consulta al seu servidor a cada inici. En un magatzem de dades això el pot despertar i costar diners, i un inici de sessió caducat et demana que tornis a entrar."
restore_session_needs_main = "Primer activa Torna a obrir l'última sessió."
save_as_rows = "Quan una cerca o un filtre amaga files, Desa com a pot escriure totes les files o només les que veus. Pregunta-ho sempre, o desmarca-ho per fer servir sempre la resposta triada aquí."
save_as_open = "Després de Desa com a, continua al fitxer nou: aquesta pestanya hi passa, o s'obre en una pestanya nova quan només s'han desat les files que veus. Pregunta-ho sempre, o desmarca-ho per fer servir sempre la resposta triada aquí."
keep_versions = "Cada vegada que deses sobre un fitxer, conserva la versió que substitueix. Fitxer > Versions anteriors les obre, les compara o les restaura. Desactivat per defecte, perquè ocupa espai al disc."
versions_needs_main = "Primer activa Conserva les versions anteriors."
versions_per_file = "Quantes versions anteriors cal conservar de cada fitxer. La més antiga se'n va primer. Marca Il·limitat per conservar-les totes."
versions_total = "Quant espai de disc poden fer servir totes les versions anteriors juntes. Les més antigues se'n van primer, però la versió més nova de cada fitxer sempre es conserva. Marca Il·limitat perquè no hi hagi límit."
versions_limit_off = "Desmarca Il·limitat per posar un límit."
versions_place = "On van les versions conservades. La carpeta de l'Octa les manté apartades. Una carpeta que triïs conté les versions de tots els fitxers. Una subcarpeta al costat del fitxer és una carpeta .octa-versions al costat de cada fitxer. Just al costat del fitxer posa còpies com ara sales.20261020-140211-123.csv al costat de sales.csv. Al costat del fitxer, el límit d'espai compta cada carpeta per separat. Canviar això no mou res: les versions conservades en un altre lloc continuen llistades a Versions anteriors."
versions_dir_choose = "Tria la carpeta que conté les versions anteriors de tots els fitxers."
zoom_step = "Quant canvia la mida un pas de zoom, amb Ctrl+Més i Ctrl+Menys, al menú Visualitza i amb els botons + i - de la barra d'estat. 5 per cent per defecte."
confirm_snippet_delete = "Pregunta abans d'esborrar un fragment SQL. Desactivat l'esborra a l'instant."

