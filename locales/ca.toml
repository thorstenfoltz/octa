mcp_row_limit = "Màxim de files que retornen `read_table` / `run_sql` quan qui crida omet `limit`. L'esquema de l'eina anuncia aquest valor per defecte al model perquè en pugui demanar més (o sense límit) quan calgui.\n\nPer defecte: 1.000. Un valor alt - o marcar Il·limitat - pot enviar respostes molt grans per stdio i alentir el client MCP."
