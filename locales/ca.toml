sections_added = "S'han obert {n} pestanya(es) addicional(s) per a troballes que no són per columna."
verdict_benford_conforms = "Els primers dígits s'acosten al que espera la llei de Benford, com solen fer les xifres mesurades o acumulades. No demostra res: una columna pot complir-la i ser incorrecta igualment."
verdict_benford_acceptable = "Una mica desviat de les proporcions esperades, dins del marge en què es mouen les dades reals. No cal fer res."
verdict_benford_marginal = "Prou desviat perquè valgui la pena tornar-hi a mirar, sense arribar a ser una troballa. Comprova com es genera la columna abans de treure'n conclusions."
verdict_benford_nonconforming = "Els primers dígits no semblen quantitats mesurades. És un motiu per mirar-ho més, mai una troballa per si sola: xifres arrodonides, limitades o introduïdes a mà acaben aquí innocentment."
verdict_benford_not_numbers = "No s'ha provat: la columna no conté nombres, i la llei tracta del primer dígit d'un nombre."
verdict_benford_too_few = "No s'ha provat: menys de 300 valors utilitzables, on les proporcions de dígits són soroll i no una distribució."
verdict_benford_narrow = "No s'ha provat: els valors abasten menys d'un factor de deu. Un percentatge, una edat o una valoració no té cap motiu per seguir la llei, així que un veredicte només confondria."
verdict_benford_ids = "No s'ha provat: nombres enters densos i tots diferents, de manera que és una seqüència assignada (un número de fila, un número de factura, un identificador). Aquests es reparteixen, no es mesuren."
verdict_calendar_complete = "Hi ha tots els passos de la sèrie, des de la primera marca de temps fins a l'última. No hi ha cap forat per explicar."
verdict_calendar_weekdays = "Els únics forats són caps de setmana omesos, que és el que fan expressament les dades de negoci. Compta com a complet, i aquests caps de setmana no es llisten a la pestanya de forats."
verdict_calendar_dst = "L'únic forat té la forma d'un canvi d'hora: un pas, en diumenge, de matinada. Les marques de temps de l'Octa no porten fus horari, així que això llegeix la forma sense saber-ho del cert. Comprova-ho si la sèrie importa a l'hora."
verdict_calendar_gaps = "Temps que hauria de tenir files i no en té. La pestanya Forats al calendari llista cada forat amb les marques de temps de banda i banda."
verdict_calendar_not_dates = "No s'ha provat: la columna no conté dates ni marques de temps."
verdict_calendar_too_few = "No s'ha provat: menys de tres marques de temps diferents, que encara no és una sèrie."
verdict_calendar_irregular = "No s'ha provat: cap pas no cobreix el 60% dels intervals, així que no hi ha cap ritme on trobar forats. Els registres d'esdeveniments es llegeixen així."
verdict_shape_consistent = "Tots els valors tenen la mateixa forma, per exemple tots els codis postals són A-99999."
verdict_shape_mixed = "Gairebé tots els valors tenen una forma i uns quants no. Aquests pocs sovint són errors tipogràfics o un segon format; la pestanya Formes barrejades els llista."
verdict_shape_na = "No s'ha provat: la columna és buida, no és de text o té massa formes per decidir (text lliure, o diversos formats a propòsit)."
hint_number_verdict = "Si una numeració, com els números de factura o de comanda, segueix sense forats. Els ID de text com INV-2024-0007 es comproven sèrie per sèrie. Passa el ratolí per sobre d'un veredicte per veure què vol dir. Els números que falten surten en una pestanya pròpia."
section_numbers = "Números que falten"
section_numbers_intro = "Números que falten en una numeració, com els números de factura o de comanda. Cada fila és un forat, del primer a l'últim número que falta. Es llisten com a molt 200 forats per columna."
hint_num_column = "La columna on és la numeració."
hint_num_series = "El text al voltant de les xifres que compten, amb # en lloc del número. Buit en una columna només de números."
hint_num_first = "El primer número que falta en aquest forat."
hint_num_last = "L'últim número que falta en aquest forat."
hint_num_count = "Quants números falten en aquest forat."
verdict_numbers_complete = "Hi són tots els números, del primer a l'últim."
