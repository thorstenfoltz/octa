ssl_token_note = "Un inici de sessió amb testimoni sempre viatja xifrat, així que aquesta connexió fa servir {mode}."
ssl_ca_file = "Fitxer de CA:"
ssl_ca_file_hint = "Un fitxer PEM d'aquest ordinador amb l'autoritat que va signar el certificat del servidor. Només conté certificats públics, res secret. Demana'l a l'administrador del servidor, a Kubernetes (el secret de CA del clúster) o al teu proveïdor de núvol (AWS publica un paquet per a RDS). Desa'l on vulguis. Els usuaris de psql sovint el tenen a ~/.postgresql/root.crt. Només és de confiança per a aquesta connexió, al costat dels del sistema. El llegeixen els modes que comproven el certificat."
ssl_ca_browse_hint = "Tria el fitxer de CA d'aquest ordinador."
