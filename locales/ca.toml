hint_gap_before = "El primer valor després del forat."
hint_gap_missing_steps = "Quants passos de la sèrie falten entremig, comptats amb l'espaiat propi de la columna (dies, hores, mesos)."
hint_gap_kind = "Què és el forat: un forat simple, o un tram prou llarg per semblar una aturada més que no pas un descuit."
hint_shape_column = "La columna on és la forma que es desvia."
