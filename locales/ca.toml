[distcmp]
title = "Compara distribucions"
intro = "Pregunta si dues columnes de nombres o de categories es reparteixen de la mateixa manera: no si les mitjanes coincideixen, sinó si coincideix tota la forma. Els preus de l'any passat contra els d'aquest any, els temps de resposta d'una regió contra els d'una altra. L'Octa tria la prova segons les dades (Kolmogorov-Smirnov per a nombres, khi quadrat per a categories) i respon amb una frase, amb l'estadístic a sota."
menu = "Compara distribucions..."
menu_hint = "Comprova si dues columnes es reparteixen de la mateixa manera, amb forma i tot, no només de mitjana. Obre una pestanya amb la resposta en una frase."
