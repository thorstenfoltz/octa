[package]
name = "octa"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.95"
authors = ["Thorsten Foltz <thorsten.foltz@live.com>"]
description = "A modular multi-format data viewer and editor"
license = "MIT"
readme = "README.md"
repository = "https://github.com/thorstenfoltz/octa"
homepage = "https://thorstenfoltz.github.io/octa/"
documentation = "https://thorstenfoltz.github.io/octa/"
keywords = ["data-viewer", "parquet", "csv", "gui", "egui"]
categories = ["visualization", "gui"]

[lib]
name = "octa"
path = "src/lib.rs"

[[bin]]
name = "octa"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
# eframe's `default` feature selects the **wgpu** renderer, which drags in a
# general-purpose GPU stack octa never uses: naga (a shader compiler), wgpu-core
# / -hal / -types, ash (Vulkan bindings), spirv, gpu-allocator. Octa draws 2D
# tables and writes no shaders, so `glow` (OpenGL) is the smaller and more widely
# supported backend - glutin gives us GLX+EGL on X11, EGL on Wayland, WGL on
# Windows and CGL on macOS. egui renders identically through either; the backend
# only uploads the finished triangles. `web_screen_reader` is wasm-only, dropped.
#
# The `winit` line below is NOT redundant. eframe declares winit with
# `default-features = false`, and the ONLY thing that re-enables `winit/default`
# is eframe's own `default` feature, which we just turned off. Losing it would
# drop `wayland-dlopen` (the binary would hard-link libwayland-client.so and fail
# to start on X11-only machines) and `wayland-csd-adwaita` (Wayland window
# decorations, needed whenever `use_custom_title_bar` is off). Declaring winit
# directly restores both via Cargo's per-package feature unification; winit is
# already in the tree, so this adds no crates.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    # NOT optional despite the name. eframe 0.35 had no `links` feature: it
    # declared egui-winit with defaults, and egui-winit's own default set
    # includes `links`, so `webbrowser` came in for free even under
    # `default-features = false` here. eframe 0.36 split it out as
    # `links = ["egui-winit/links"]`, so omitting it silently drops webbrowser
    # and `ctx.open_url()` becomes a no-op - that is every clickable cell link
    # (ui/table_view/rows.rs) and every markdown link (view_modes/markdown.rs).
    # Nothing in the test suite catches it; the lockfile diff showed it as
    # `Removing webbrowser`.
    "links",
    "glow",
    "wayland",
    "x11",
] }
winit = { version = "0.30.13", features = ["default"] }
egui = { version = "0.36", features = ["serde"] }
egui_extras = { version = "0.36", features = ["default"] }
parquet = { version = "58", features = ["default"] }
arrow = { version = "58", features = ["default"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
# Timezone conversion for the Date/Time calculation dialog. Already in the
# tree at 0.10.4 via orc-rust, so this adds no crates; pinned to 0.10 so a
# second copy cannot appear.
chrono-tz = "0.10"
anyhow = "1"
arboard = "3"
csv = "1"
encoding_rs = "0.8"
chardetng = "1"
calamine = "0.36"
# `constant_memory` streams a very large sheet to a temp file instead of
# holding it in RAM; `write_workbook_with` switches to it past
# `CONSTANT_MEMORY_ROWS`. tempfile is already in the tree, so this adds no crate.
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
apache-avro = "0.21"
quick-xml = "0.41"
# HTML table reader (`src/formats/html_reader.rs`). Both are already in the
# lockfile via `htmd` (the chat panel's HTML-to-Markdown converter), so this
# promotes them to direct dependencies and adds no crates. A browser-grade
# parser matters here: real pages are tag soup, and a regex or an XML parser
# would refuse most of them.
html5ever = "0.38"
markup5ever_rcdom = "0.38"
toml = "1"
serde_yaml_ng = "0.10"
# Pinned to 0.45 to match what egui_extras and svg2pdf already pull. Our direct
# dep was the ONLY thing on 0.47, so the binary carried two complete SVG
# renderers (resvg + usvg + tiny-skia + tiny-skia-path + svgtypes + roxmltree +
# imagesize, twice). The API we use (usvg::Options/Tree, tiny_skia::Pixmap,
# resvg::render) is identical in both. Bump back to 0.47+ once egui_extras and
# svg2pdf move -- egui_extras 0.36.1 still requires resvg ^0.45.1 (rechecked
# 2026-08-24, so the 0.36 bump did NOT unblock this).
resvg = "0.45"
ureq = { version = "3", features = ["json"] }
flate2 = "1"
# Transparent .zst decompression (compression.rs); gzip rides on flate2.
zstd = "0.13"
# Consuming object_store's listing streams (already in the tree via
# object_store itself; this only makes the extension traits importable).
futures-util = { version = "0.3", default-features = false }
# Live database connections (src/db/, one file per engine). All three clients
# are async; src/db/runtime() blocks on them like the cloud module does.
# rustls everywhere (no OpenSSL), ring provider for a lighter native build.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.14"
mysql_async = { version = "0.37", default-features = false, features = [
    "default-rustls-ring",
    "chrono",
] }
tiberius = { version = "0.12", default-features = false, features = [
    "tds73",
    "rustls",
    "chrono",
] }
sqlx-exasol = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
] }
# Oracle. Pure Rust TNS implementation, so Octa stays a single binary: every
# other Oracle crate wraps OCI/ODPI-C and would make the Instant Client a
# prerequisite of installing Octa. The crate is young, so `src/db/oracle.rs`
# surfaces the driver's own error text rather than flattening it.
oracle-rs = "0.1.7"
# Snowflake key-pair auth: sign the login JWT (RS256) and compute the public-key
# SHA256 fingerprint. `rsa` re-exports the pkcs8/spki traits; both were already
# in the tree transitively. jsonwebtoken is deliberately NOT used - it cannot
# expose the public-key DER the fingerprint needs.
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["compat"] }

# SSH client for the per-connection tunnel (`src/db/ssh_tunnel.rs`). Pure Rust,
# so it needs no libssh2/OpenSSL and no `ssh` binary on PATH: a self-contained
# binary is the whole point of Octa's packaging, and the alternative considered
# (shelling out to `ssh -L`) cannot do password auth without a terminal, which a
# GUI has not got.
#
# `default-features = false` matters: russh's defaults pull `aws-lc-rs`, and
# Octa is ring-everywhere (see the rustls note above). `ring` + `rsa` cover the
# key types an ordinary bastion offers.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
regex = "1"
orc-rust = { version = "0.8.0", default-features = false }
hdf5-reader = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
duckdb = { version = "1", features = ["bundled"] }
rand = "0.10"
sas7bdat = { version = "0.8", default-features = false, features = ["simd"] }
ambers = "0.4"
# `ambers` (SPSS reader) still depends on arrow ^57 — keep arrow57 as an alias
# alongside the main arrow 58 until ambers ships an arrow 58–compatible release.
arrow57 = { package = "arrow", version = "57", default-features = false }
# Float16 values for width-correct Arrow array building (already an arrow
# dependency, so this adds no new code to the tree).
half = { version = "2", default-features = false }
# SHA-256 verification of downloaded release archives against the published
# SHA256SUMS file (already in the tree transitively).
sha2 = "0.10"
# AWS SigV4 request signing for the Athena connector (`src/db/sigv4.rs`).
# Already in the lockfile (rustls pulls it), so this only promotes it to a
# direct dependency; the alternative, shelling out to the `aws` CLI, would
# spawn a process for each of Athena's three calls per query.
hmac = "0.12"
dta = "0.6"
dbase = "0.8"
rds2rust = "0.2"
netcdf3 = "0.6"
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
# Syntax highlighting for the raw editor + notebook source cells. `default-fancy`
# selects the pure-Rust `fancy-regex` backend; we explicitly avoid the default
# `onig` feature which would pull in the Oniguruma C library.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Line-by-line text diff for the Compare view's text-diff mode.
similar = "3"
# Fast cryptographic hash for the Compare view's row-hash-diff mode.
# BLAKE3 is roughly an order of magnitude faster than SHA-256 and produces
# stable digests across runs (no per-process state) which is what we need.
blake3 = "1"
# Argument parsing for the CLI subcommands (`octa schema`, `octa head`, etc.).
# `derive` keeps the boilerplate down; the binary still launches the GUI when
# no subcommand is given.
clap = { version = "4", features = ["derive"] }
# Shell completion scripts (`octa --completions zsh`), generated from the same
# derive clap already parses with, so a new flag is covered the moment it is
# added. Default features only: the `unstable-dynamic` runtime completer would
# pull `clap_lex` machinery we have no use for.
# MIT/Apache-2.0.
clap_complete = "4"
# Model Context Protocol server (octa --mcp). Default features cover the
# tool/macros/server pieces we need; `transport-io` adds the stdio transport.
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
# Schema generator used by rmcp's `#[tool]` macro for the input-parameter
# JSON Schema. Must match the version rmcp re-exports: rmcp 3 requires
# schemars ^1.0, and a 0.x dep here lands the derive macros on the wrong
# trait so the `Parameters<T>` bound fails.
schemars = "1"
# Async runtime for the MCP server only — the GUI process stays sync. We
# spawn a current-thread runtime in `main` exclusively on the `--mcp` path.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "net", "time"] }
# Structured logs from rmcp emit through `tracing`; route to stderr so they
# don't collide with the JSON-RPC traffic on stdout.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# EPUB reader. `rbook` is Apache-2.0 (the GPL-licensed `epub` crate is
# explicitly blocked by `deny.toml`). Default features cover EPUB 2 + 3 read;
# we keep `write` off to trim the dep surface.
rbook = { version = "0.7", default-features = false, features = ["prelude"] }
# HTML→Markdown converter used to turn EPUB chapter XHTML into pulldown-cmark
# input. Apache-2.0; also rules out the GPL `html2md`.
htmd = "0.5"
# PNG/JPEG decoding for embedded EPUB images. `image` is already pulled in
# transitively via `egui_extras` and `resvg`, but we need a direct dep so
# `image::ImageReader` is reachable from our code. Disable defaults — most
# EPUB cover/figure formats are PNG/JPEG/GIF, so we don't need TIFF/BMP/etc.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# GeoJSON parsing for the Map view. MIT/Apache-2.0.
geojson = "1"
# Common geometry types used by both `geojson` (conversion) and `walkers`
# (rendering). MIT/Apache-2.0. We name it directly so the GeoJSON reader
# can construct `geo_types::Geometry<f64>` for the side-channel.
geo-types = "0.7"
# Slippy-map widget for egui — used by the GeoJSON Map view. MIT license.
# Walkers spawns its own dedicated thread with a private tokio runtime for
# tile downloads, so the eframe app thread stays sync.
walkers = "0.58"
# WKT serialisation for the GeoJSON reader's `__geometry: Utf8` column.
# MIT/Apache-2.0.
wkt = "0.14"
# Immediate-mode plotting widgets for the Chart tab (`ViewMode::Chart`).
# egui_plot runs one major ahead of the egui it targets: 0.37 is the release
# that links against egui 0.36. Bumping egui without bumping this in lockstep
# leaves egui_plot compiled against the previous egui and unusable here.
# MIT/Apache-2.0.
egui_plot = "0.37"
# Chart export → PDF. Disable default features (image / filters pull in
# duplicate crates we already have via resvg) but keep `text` so the
# usvg side exposes `fontdb_mut()` — without it the PDF text elements
# silently drop and the rendered chart is mostly blank.
# MIT/Apache-2.0.
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
# Multi-page PDF assembly for the table export. Already in the tree as
# svg2pdf's own dependency (svg2pdf 0.13 -> pdf-writer 0.12), so this adds no
# crate: it promotes it to a direct dep because `svg2pdf::to_chunk` hands back
# a `pdf_writer::Chunk` that we page up ourselves. Keep the version in lockstep
# with what svg2pdf pulls, or the two `Chunk` types stop being the same type.
# MIT/Apache-2.0.
pdf-writer = "0.12"
# NumPy .npy/.npz reader. Parses the .npy binary payload with runtime dtype
# dispatch; we read .npz archives with the existing `zip` crate rather than
# enabling npyz's `npz` feature (which would pull a second zip + bzip2 + crypto).
# MIT/Apache-2.0.
npyz = "0.9.1"
# MessagePack decoder for the read-only .msgpack reader (decoded into
# serde_json::Value, then flattened by the JSON reader). MIT.
rmp-serde = "1.3.1"
# BSON (MongoDB dump) reader. `serde` gates the extjson module and `serde_json-1`
# the `Bson -> serde_json::Value` conversion we feed into the JSON flattener.
# Apache-2.0.
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
# ESRI Shapefile reader. `geo-types` enables `Shape -> geo_types::Geometry`
# conversion so shapefiles plot on the Map view like GeoJSON. The sibling .dbf
# attributes are read via the `dbase` crate we already use. MIT.
shapefile = { version = "0.9.0", features = ["geo-types"] }
object_store = { version = "0.14", features = ["aws", "azure", "gcp"] }
# OS secret store for the chat panel's API keys, DB passwords and cloud
# credentials. keyring 4's default `v1` feature restores the v3 behaviour and
# picks the right backend per OS by itself, so this no longer needs three
# `[target.'cfg(...)']` blocks: zbus-secret-service-keyring-store on Linux
# (declared upstream with `crypto-rust`, so the freedesktop Secret Service
# still speaks PURE-RUST zbus and the release / musl / distroless builds stay
# free of libdbus and OpenSSL), apple-native on macOS, windows-native on
# Windows. `Entry` stays synchronous, so `src/ui/settings/secrets.rs` is
# unchanged. If no Secret Service is available at runtime the error is caught
# and we fall back to the plaintext settings.toml store.
keyring = "4"

[build-dependencies]
winresource = "0.1"

# Unix-only: setsid + process-group kill so stopping a locally-started Ollama
# also terminates its `llama-server` model-runner child (otherwise orphaned and
# leaking memory). Already in the tree transitively; MIT/Apache-2.0.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# tiberius 0.12.3 (July 2024) is the last release, and upstream `main` still
# pins tokio-rustls 0.24. That drags in rustls 0.21 and with it rustls-webpki
# 0.101, an EOL line unpatched against GHSA-82j2-j2ch-gfr8,
# GHSA-xgp8-3hg3-c2mh and GHSA-965h-392x-2mh5. tiberius was the ONLY crate in
# the tree still on that stack, so the binary linked two complete rustls
# stacks; this removes the old one.
#
# Our fork carries a single commit migrating the TLS stream to tokio-rustls
# 0.26 / rustls 0.23 / rustls-webpki 0.103, with `ring` as the named crypto
# provider (matching `db::rustls_client_config`) and TLS pinned to 1.2, since
# TDS tunnels the handshake inside TDS packets and this driver cannot process
# post-handshake TLS 1.3 records. Verified against SQL Server 2022 and 2019.
#
# Drop this section once tiberius publishes a release on tokio-rustls 0.26+.
# Pinned by commit deliberately: a branch ref would let the dependency move
# without a lockfile change.
[patch.crates-io]
tiberius = { git = "https://github.com/thorstenfoltz/tiberius", rev = "91ca80f3545ffa30201399d79284453b9fccb955" }
