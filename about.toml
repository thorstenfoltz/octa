# cargo-about configuration. Run via:
#
#     cargo about generate about.hbs > THIRD_PARTY_LICENSES.md
#
# Produces the attribution bundle that ships alongside Octa binaries to
# satisfy the Apache-2.0 / BSD / MIT / OFL / Ubuntu-font-1.0 notice
# requirements. Re-generate after any dependency change. Bundled material that
# is not a crate (the fonts) is hand-maintained in NOTICE instead.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

# Ignore the workspace crate itself — Octa's LICENSE file already covers it.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
