# The store-listing INDEX.md lives inside `docs/` but stays off the site nav.
# Listing it here silences the "exists but not in nav" build warning.
not_in_nav: |
  /assets/store/INDEX.md

# Surface broken links + missing anchors as errors during the strict
# build (used in CI). Locally `mkdocs serve` reports them as warnings.
strict: false

# A link to a heading that no longer exists is a warning, not silence: pages
# get reorganised, and a stale `page.md#anchor` otherwise lands at the top.
validation:
  links:
    anchors: warn
