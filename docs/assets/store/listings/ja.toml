# ja: written natively in a neutral register, no direct address; not a translation of the English.

short = "Parquet、CSV、XLSX、SQLite をはじめ約30種類のデータ形式を即座に表として表示。並べ替え、絞り込み、検索、編集、SQL クエリをローカルのパソコン上で実行します。"

long = """
Octa は Parquet、CSV、XLSX、SQLite、DuckDB、JSON の各ファイルと、約30種類のデータ形式をそのまま表として開きます。取り込み、初期設定、プロジェクトファイルは必要ありません。

表は並べ替え、絞り込み、検索が可能で、セル・列・行を編集でき、すべての変更は元に戻せます。開いているファイルは DuckDB の SQL テーブルとして扱え、複数のファイルを 1 つのクエリで結合できます。さらに、グラフ、列ごとの統計、重複行と外れ値の検出、ピボットテーブル、2 つのファイルの比較も備えています。数百万行の Parquet ファイルはバックグラウンドで読み込まれます。

Amazon S3、Azure Blob Storage、Google Cloud Storage 上のデータや、PostgreSQL、MySQL、SQL Server、Snowflake、BigQuery などのデータベースも直接開けます。書き込みは既定で無効です。任意で使える AI アシスタントは、自分の API キーまたは Ollama 経由のローカルモデルで、データに関する質問に自然な言葉で答えます。設定するまでは動作しません。

処理は、使用する機能が外部 API を必要とする場合を除き、ローカルのパソコン上で行われます。インターフェースは 32 言語に対応。Octa は MIT ライセンスの自由ソフトウェアです: https://github.com/thorstenfoltz/octa
"""

