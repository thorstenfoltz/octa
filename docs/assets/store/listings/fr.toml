# fr: written natively, not translated from English.

short = "Parquet, CSV, Excel, SQLite et une trentaine d'autres formats dans un tableau rapide. Trier, filtrer, rechercher, modifier et interroger en SQL, sur ta machine."

long = """
Octa ouvre les fichiers Parquet, CSV, Excel, SQLite, DuckDB et JSON, ainsi qu'une trentaine d'autres formats de données, sans import préalable ni configuration compliquée.

Tu peux trier, filtrer, rechercher et modifier tes données, lancer des requêtes SQL avec DuckDB, créer des graphiques ou comparer deux fichiers. Le chat intégré te permet aussi d'interroger tes données en langage naturel.

Le traitement de tes données se fait localement sur ta machine, sauf si la fonction utilisée a besoin d'une API externe.

L'interface est disponible en 32 langues. Octa est un logiciel libre sous licence MIT.
"""

