# fr: written natively in a neutral register, no direct address; not a translation of the English.

short = "Parquet, CSV, XLSX, SQLite et une trentaine d'autres formats de données, affichés aussitôt en tableau. Tri, filtre, recherche, édition et requêtes SQL, en local sur la machine."

long = """
Octa ouvre directement les fichiers Parquet, CSV, XLSX, SQLite, DuckDB et JSON, ainsi qu'une trentaine d'autres formats de données, et les affiche en tableau. Aucun import, aucune configuration, aucun fichier de projet.

Le tableau se trie, se filtre et se parcourt par recherche ; les cellules, colonnes et lignes sont modifiables, chaque modification pouvant être annulée. Chaque fichier ouvert est exposé à DuckDB comme table SQL, et plusieurs fichiers peuvent être joints dans une même requête. S'y ajoutent les graphiques, les statistiques par colonne, la détection des doublons et des valeurs aberrantes, les tableaux croisés dynamiques et la comparaison de deux fichiers. Les fichiers Parquet de plusieurs millions de lignes se chargent en arrière-plan.

Les données stockées sur Amazon S3, Azure Blob Storage et Google Cloud Storage, ou dans PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery et d'autres bases, s'ouvrent directement ; l'accès en écriture est désactivé par défaut. Un assistant IA facultatif répond en langage courant aux questions sur les données, avec une clé d'API personnelle ou un modèle local via Ollama, et reste inactif tant qu'il n'est pas configuré.

Le traitement s'effectue en local, sur la machine de l'utilisateur, sauf lorsque la fonction utilisée requiert une API externe. L'interface est disponible en 32 langues. Octa est un logiciel libre sous licence MIT : https://github.com/thorstenfoltz/octa
"""

