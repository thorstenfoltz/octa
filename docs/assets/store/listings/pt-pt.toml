short = "Parquet, CSV, XLSX, SQLite e cerca de trinta outros formatos de dados, apresentados de imediato como tabela. Ordenar, filtrar, pesquisar, editar e consultar com SQL, localmente no próprio computador."

long = """
O Octa abre ficheiros Parquet, CSV, XLSX, SQLite, DuckDB e JSON, além de cerca de trinta outros formatos de dados, e apresenta-os diretamente como tabela. Não há importação, configuração nem ficheiro de projeto.

A tabela pode ser ordenada, filtrada e pesquisada; células, colunas e linhas são editáveis, e cada alteração pode ser anulada. Cada ficheiro aberto fica disponível no DuckDB como tabela SQL, e vários ficheiros podem ser juntados numa única consulta. Há ainda gráficos, estatísticas por coluna, deteção de duplicados e de valores atípicos, tabelas dinâmicas e comparação de dois ficheiros. Os ficheiros Parquet com milhões de linhas são carregados em segundo plano.

Dados no Amazon S3, Azure Blob Storage e Google Cloud Storage, ou em PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery e outras bases de dados, abrem diretamente; o acesso de escrita vem desligado por predefinição. Um assistente de IA opcional responde em linguagem natural a perguntas sobre os dados, com uma chave de API própria ou um modelo local através do Ollama, e fica inativo até ser configurado.

O processamento é feito localmente, no próprio computador, exceto quando a função utilizada precisa de uma API externa. A interface está disponível em 35 idiomas. O Octa é software livre com licença MIT: https://github.com/thorstenfoltz/octa
"""

