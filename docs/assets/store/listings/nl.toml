# nl: written natively in a neutral register, no direct address; not a translation of the English.

short = "Parquet, CSV, XLSX, SQLite en zo'n dertig andere dataformaten, direct als tabel weergegeven. Sorteren, filteren, zoeken, bewerken en met SQL bevragen, lokaal op de eigen computer."

long = """
Octa opent Parquet-, CSV-, XLSX-, SQLite-, DuckDB- en JSON-bestanden en zo'n dertig andere dataformaten rechtstreeks als tabel. Importeren, instellen of een projectbestand aanmaken is niet nodig.

De tabel is te sorteren, te filteren en te doorzoeken; cellen, kolommen en rijen zijn bewerkbaar en elke wijziging kan ongedaan worden gemaakt. Elk geopend bestand staat in DuckDB als SQL-tabel klaar, en meerdere bestanden kunnen in één query worden gecombineerd. Daarnaast zijn er grafieken, kolomstatistieken, detectie van duplicaten en uitschieters, draaitabellen en het vergelijken van twee bestanden. Parquet-bestanden met miljoenen rijen worden op de achtergrond geladen.

Gegevens in Amazon S3, Azure Blob Storage en Google Cloud Storage, of in PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery en andere databases, zijn rechtstreeks te openen; schrijftoegang staat standaard uit. Een optionele AI-assistent beantwoordt vragen over de gegevens in gewone taal, met een eigen API-sleutel of een lokaal model via Ollama, en blijft inactief zolang hij niet is ingesteld.

De verwerking vindt lokaal plaats, op de eigen computer, behalve wanneer de gebruikte functie een externe API nodig heeft. De interface is beschikbaar in 32 talen. Octa is vrije software onder de MIT-licentie: https://github.com/thorstenfoltz/octa
"""

