# de: written natively in a neutral register, no direct address; not a translation of the English.

short = "Parquet, CSV, XLSX, SQLite und rund 30 weitere Datenformate sofort als Tabelle. Sortieren, filtern, suchen, bearbeiten und mit SQL abfragen, lokal auf dem eigenen Rechner."

long = """
Octa öffnet Parquet-, CSV-, XLSX-, SQLite-, DuckDB- und JSON-Dateien sowie rund 30 weitere Datenformate direkt als Tabelle. Ein Import, eine Einrichtung oder eine Projektdatei sind nicht nötig.

Die Tabelle lässt sich sortieren, filtern und durchsuchen; Zellen, Spalten und Zeilen sind bearbeitbar, jede Änderung ist rückgängig machbar. Jede geöffnete Datei steht in DuckDB als SQL-Tabelle bereit, mehrere Dateien lassen sich in einer Abfrage verbinden. Dazu kommen Diagramme, Spaltenstatistiken, Dubletten- und Ausreißererkennung, Pivot-Tabellen und der Vergleich zweier Dateien. Parquet-Dateien mit Millionen Zeilen werden im Hintergrund nachgeladen.

Daten in Amazon S3, Azure Blob Storage und Google Cloud Storage sowie in PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery und weiteren Datenbanken lassen sich direkt öffnen; Schreibzugriff ist standardmäßig deaktiviert. Ein optionaler KI-Assistent beantwortet Fragen zu den Daten in natürlicher Sprache, mit einem eigenen API-Key oder einem lokalen Modell über Ollama, und bleibt inaktiv, solange er nicht eingerichtet ist.

Die Verarbeitung findet lokal auf dem eigenen Rechner statt, sofern die genutzte Funktion keine externe Schnittstelle benötigt. Die Oberfläche ist in 32 Sprachen verfügbar. Octa ist freie Software unter der MIT-Lizenz: https://github.com/thorstenfoltz/octa
"""

