long = """
O Octa abre arquivos Parquet, CSV, XLSX, SQLite, DuckDB e JSON, além de cerca de trinta outros formatos de dados, e os exibe diretamente como tabela. Não há importação, configuração nem arquivo de projeto.

A tabela pode ser ordenada, filtrada e pesquisada; células, colunas e linhas são editáveis, e cada alteração pode ser desfeita. Cada arquivo aberto fica disponível no DuckDB como tabela SQL, e vários arquivos podem ser unidos em uma única consulta. Há ainda gráficos, estatísticas por coluna, detecção de duplicados e de valores atípicos, tabelas dinâmicas e comparação de dois arquivos. Arquivos Parquet com milhões de linhas são carregados em segundo plano.

Dados no Amazon S3, Azure Blob Storage e Google Cloud Storage, ou em PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery e outros bancos de dados, abrem diretamente; o acesso de escrita vem desativado por padrão. Um assistente de IA opcional responde em linguagem natural a perguntas sobre os dados, com uma chave de API própria ou um modelo local via Ollama, e permanece inativo até ser configurado.

O processamento ocorre localmente, no próprio computador, exceto quando a função utilizada exige uma API externa. A interface está disponível em 32 idiomas. O Octa é software livre sob licença MIT: https://github.com/thorstenfoltz/octa
