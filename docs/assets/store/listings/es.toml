long = """
Octa abre archivos Parquet, CSV, XLSX, SQLite, DuckDB y JSON, además de unos treinta formatos de datos más, y los muestra directamente como tabla. No requiere importación, configuración ni archivo de proyecto.

La tabla se puede ordenar, filtrar y buscar; las celdas, columnas y filas son editables, y cada cambio puede deshacerse. Cada archivo abierto queda disponible en DuckDB como tabla SQL, y varios archivos pueden unirse en una misma consulta. Se añaden gráficos, estadísticas por columna, detección de duplicados y de valores atípicos, tablas dinámicas y comparación de dos archivos. Los archivos Parquet con millones de filas se cargan en segundo plano.

Los datos alojados en Amazon S3, Azure Blob Storage y Google Cloud Storage, o en PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery y otras bases de datos, se abren directamente; el acceso de escritura está desactivado de forma predeterminada. Un asistente de IA opcional responde en lenguaje natural a preguntas sobre los datos, con una clave de API propia o un modelo local mediante Ollama, y permanece inactivo hasta que se configura.

El procesamiento se realiza en local, en el propio equipo, salvo cuando la función utilizada necesita una API externa. La interfaz está disponible en 32 idiomas. Octa es software libre bajo licencia MIT: https://github.com/thorstenfoltz/octa
"""

