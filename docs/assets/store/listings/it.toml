# it: written natively in a neutral register, no direct address; not a translation of the English.

short = "Parquet, CSV, XLSX, SQLite e circa trenta altri formati di dati, mostrati subito come tabella. Ordinamento, filtri, ricerca, modifica e query SQL, in locale sul proprio computer."

long = """
Octa apre file Parquet, CSV, XLSX, SQLite, DuckDB e JSON, oltre a circa trenta altri formati di dati, e li mostra direttamente come tabella. Non servono importazione, configurazione né file di progetto.

La tabella si ordina, si filtra e si cerca; celle, colonne e righe sono modificabili e ogni modifica può essere annullata. Ogni file aperto è disponibile in DuckDB come tabella SQL, e più file possono essere uniti in un'unica query. Si aggiungono grafici, statistiche per colonna, rilevamento di duplicati e valori anomali, tabelle pivot e confronto tra due file. I file Parquet con milioni di righe vengono caricati in background.

I dati su Amazon S3, Azure Blob Storage e Google Cloud Storage, oppure in PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery e altri database, si aprono direttamente; l'accesso in scrittura è disattivato per impostazione predefinita. Un assistente IA opzionale risponde in linguaggio naturale alle domande sui dati, con una chiave API propria o un modello locale tramite Ollama, e resta inattivo finché non viene configurato.

L'elaborazione avviene in locale, sul proprio computer, salvo quando la funzione utilizzata richiede un'API esterna. L'interfaccia è disponibile in 32 lingue. Octa è software libero con licenza MIT: https://github.com/thorstenfoltz/octa
"""

