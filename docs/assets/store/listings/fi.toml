long = """
Octa avaa Parquet-, CSV-, XLSX-, SQLite-, DuckDB- ja JSON-tiedostot sekä noin kolmekymmentä muuta tietomuotoa suoraan taulukkona. Tuontia, asennusasetuksia tai projektitiedostoa ei tarvita.

Taulukkoa voi lajitella, suodattaa ja hakea; solut, sarakkeet ja rivit ovat muokattavissa, ja jokaisen muutoksen voi perua. Jokainen avattu tiedosto on DuckDB:ssä käytettävissä SQL-tauluna, ja useita tiedostoja voi yhdistää samassa kyselyssä. Lisäksi ovat kaaviot, saraketilastot, kaksoiskappaleiden ja poikkeavien arvojen tunnistus, pivot-taulukot ja kahden tiedoston vertailu. Miljoonien rivien Parquet-tiedostot ladataan taustalla.

Amazon S3:ssa, Azure Blob Storagessa ja Google Cloud Storagessa tai PostgreSQL-, MySQL-, SQL Server-, Snowflake-, BigQuery- ja muissa tietokannoissa olevat tiedot avautuvat suoraan; kirjoitusoikeus on oletuksena pois päältä. Valinnainen tekoälyavustaja vastaa tietoja koskeviin kysymyksiin luonnollisella kielellä omalla API-avaimella tai paikallisella mallilla Ollaman kautta, ja pysyy käyttämättömänä, kunnes se on määritetty.

Käsittely tapahtuu paikallisesti omalla koneella, paitsi kun käytetty toiminto tarvitsee ulkoista rajapintaa. Käyttöliittymä on saatavilla 32 kielellä. Octa on vapaa ohjelmisto MIT-lisenssillä: https://github.com/thorstenfoltz/octa
