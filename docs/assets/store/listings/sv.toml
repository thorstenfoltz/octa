# sv: written natively in a neutral register, no direct address; not a translation of the English.

short = "Parquet, CSV, XLSX, SQLite och ett trettiotal andra dataformat visas direkt som tabell. Sortera, filtrera, sök, redigera och fråga med SQL, lokalt på den egna datorn."

long = """
Octa öppnar Parquet-, CSV-, XLSX-, SQLite-, DuckDB- och JSON-filer samt ett trettiotal andra dataformat direkt som tabell. Varken import, konfiguration eller projektfil behövs.

Tabellen kan sorteras, filtreras och genomsökas; celler, kolumner och rader kan redigeras, och varje ändring går att ångra. Varje öppen fil finns tillgänglig i DuckDB som SQL-tabell, och flera filer kan kombineras i en och samma fråga. Därtill finns diagram, kolumnstatistik, upptäckt av dubbletter och avvikande värden, pivottabeller och jämförelse av två filer. Parquet-filer med miljontals rader läses in i bakgrunden.

Data i Amazon S3, Azure Blob Storage och Google Cloud Storage, eller i PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery och andra databaser, kan öppnas direkt; skrivåtkomst är avstängd som standard. En valfri AI-assistent besvarar frågor om data på vanligt språk, med egen API-nyckel eller en lokal modell via Ollama, och förblir inaktiv tills den har konfigurerats.

Bearbetningen sker lokalt på den egna datorn, utom när den använda funktionen kräver ett externt API. Gränssnittet finns på 32 språk. Octa är fri programvara under MIT-licensen: https://github.com/thorstenfoltz/octa
"""

