long = """
Octa öppnar Parquet-, CSV-, Excel-, SQLite-, DuckDB- och JSON-filer plus ett trettiotal andra dataformat, utan import och utan krånglig installation.

Du kan sortera, filtrera, söka och redigera dina data, köra SQL-frågor med DuckDB, skapa diagram eller jämföra två filer. Med den inbyggda chatten frågar du dessutom om dina data på vanligt språk.

Dina data behandlas lokalt på din egen dator, så länge funktionen du använder inte behöver ett externt API.

Gränssnittet finns på 32 språk. Octa är fri programvara under MIT-licens.
"""

