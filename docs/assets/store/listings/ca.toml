long = """
L'Octa obre fitxers Parquet, CSV, XLSX, SQLite, DuckDB i JSON, a més d'una trentena d'altres formats de dades, i els mostra directament com a taula. No cal cap importació, configuració ni fitxer de projecte.

La taula es pot ordenar, filtrar i cercar; les cel·les, les columnes i les files es poden editar, i cada canvi es pot desfer. Cada fitxer obert queda disponible a DuckDB com a taula SQL, i diversos fitxers es poden combinar en una sola consulta. També hi ha gràfics, estadístiques per columna, detecció de duplicats i de valors atípics, taules dinàmiques i comparació de dos fitxers. Els fitxers Parquet amb milions de files es carreguen en segon pla.

Les dades d'Amazon S3, Azure Blob Storage i Google Cloud Storage, o de PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery i altres bases de dades, s'obren directament; l'accés d'escriptura ve desactivat per defecte. Un assistent d'IA opcional respon en llenguatge natural preguntes sobre les dades, amb una clau d'API pròpia o un model local mitjançant Ollama, i resta inactiu fins que es configura.

El processament es fa en local, a l'ordinador mateix, excepte quan la funció utilitzada necessita una API externa. La interfície està disponible en 35 llengües. L'Octa és programari lliure amb llicència MIT: https://github.com/thorstenfoltz/octa
"""

