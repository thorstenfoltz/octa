short = "Parquet, CSV, XLSX, SQLite és mintegy harminc további adatformátum azonnal táblázatként. Rendezés, szűrés, keresés, szerkesztés és SQL-lekérdezés, helyben, a saját gépen."

long = """
Az Octa a Parquet, CSV, XLSX, SQLite, DuckDB és JSON fájlokat, valamint mintegy harminc további adatformátumot közvetlenül táblázatként nyitja meg. Importálásra, beállításra vagy projektfájlra nincs szükség.

A táblázat rendezhető, szűrhető és kereshető; a cellák, oszlopok és sorok szerkeszthetők, és minden módosítás visszavonható. Minden megnyitott fájl SQL-táblaként érhető el a DuckDB-ben, több fájl pedig egyetlen lekérdezésben összekapcsolható. Ehhez jönnek a diagramok, az oszlopstatisztikák, a duplikátumok és kiugró értékek felismerése, a kimutatások és két fájl összehasonlítása. A többmillió soros Parquet fájlok a háttérben töltődnek be.

Az Amazon S3-ban, az Azure Blob Storage-ban és a Google Cloud Storage-ban, illetve a PostgreSQL, MySQL, SQL Server, Snowflake, BigQuery és más adatbázisokban tárolt adatok közvetlenül megnyithatók; az írási hozzáférés alapértelmezés szerint ki van kapcsolva. Egy opcionális MI-asszisztens hétköznapi nyelven válaszol az adatokra vonatkozó kérdésekre, saját API-kulccsal vagy Ollama-n keresztül futó helyi modellel, és beállításig inaktív marad.

A feldolgozás helyben, a saját gépen történik, kivéve ha a használt funkció külső API-t igényel. A felület 32 nyelven érhető el. Az Octa szabad szoftver MIT-licenc alatt: https://github.com/thorstenfoltz/octa
"""

