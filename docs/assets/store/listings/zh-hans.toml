short = "Parquet、CSV、XLSX、SQLite 等约三十种数据格式即刻以表格呈现。排序、筛选、搜索、编辑与 SQL 查询均在本机完成。"

long = """
Octa 可直接以表格形式打开 Parquet、CSV、XLSX、SQLite、DuckDB、JSON 文件以及约三十种其他数据格式，无需导入、配置或项目文件。

表格支持排序、筛选和搜索；单元格、列和行均可编辑，所有修改都可撤销。每个打开的文件都会作为 SQL 表提供给 DuckDB，多个文件可在同一条查询中联接。此外还提供图表、列统计、重复值与离群值检测、数据透视表以及两个文件的对比。数百万行的 Parquet 文件在后台加载。

存放在 Amazon S3、Azure Blob Storage、Google Cloud Storage 中的数据，以及 PostgreSQL、MySQL、SQL Server、Snowflake、BigQuery 等数据库，均可直接打开；写入权限默认关闭。可选的 AI 助手使用自有 API 密钥或通过 Ollama 运行的本地模型，以自然语言回答关于数据的问题，在完成配置前不会启用。

除所用功能需要外部 API 的情况外，全部处理均在本机完成。界面提供 32 种语言。Octa 是 MIT 许可证下的自由软件：https://github.com/thorstenfoltz/octa
"""

