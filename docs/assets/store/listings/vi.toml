Octa mở các tệp Parquet, CSV, XLSX, SQLite, DuckDB và JSON cùng khoảng ba mươi định dạng dữ liệu khác trực tiếp dưới dạng bảng. Không cần nhập dữ liệu, thiết lập hay tệp dự án.

