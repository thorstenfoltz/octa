# cargo-deny configuration. Run via:
#
#     cargo deny --all-features check licenses advisories
#
# Two gates. The license check protects Octa's MIT license; the advisory check
# fails the build on a RUSTSEC advisory. Before the advisory gate existed, the
# three unpatched rustls-webpki advisories that once forced a tiberius fork were
# found by hand, which is not a process.
#
# The license check is the gate for Octa's MIT license. Adding a crate whose
# license is not in `allow` will fail CI. Copyleft licenses (AGPL, GPL, LGPL,
# SSPL, EUPL) are not on the list — including them would force Octa to
# relicense.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
confidence-threshold = 0.93

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

# Specific crates whose effective license is fine but is reported as a
# composite that the SPDX matcher splits awkwardly. None today.
exceptions = []

[advisories]
# `version` is no longer read by cargo-deny; every vulnerability, unsound and
# notice advisory errors unconditionally. Ignore a specific one by adding it to
# `ignore` below WITH a reason naming the crate and the removal condition.
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack): `rsa` 0.9 leaks private-key information
  # through a non-constant-time implementation. There is no patched release -
  # the advisory itself says "no safe upgrade is available", 0.10 is still a
  # release candidate, and `sqlx-exasol-impl` pins 0.9 transitively, so bumping
  # octa's direct dep would add a duplicate rather than clear the advisory.
  #
  # Not exploitable in octa's usage. Marvin is a chosen-ciphertext timing oracle
  # against private-key operations an attacker can reach over a network. octa
  # uses `rsa` in exactly one place, `src/db/auth.rs`: parsing the user's own
  # Snowflake PEM, signing an auth JWT with it, and fingerprinting the public
  # key. All local, on a key the user supplies, with no attacker-submitted
  # ciphertext and no timing channel to observe.
  #
  # REMOVE THIS when `rsa` ships the constant-time implementation tracked at
  # https://github.com/RustCrypto/RSA/issues/626 and `sqlx-exasol` picks it up.
  # Recheck with: cargo deny --all-features check advisories
  { id = "RUSTSEC-2023-0071", reason = "no patched `rsa` release exists; octa only signs its own Snowflake JWT locally, which is not a network-observable timing oracle" },
  # RUSTSEC-2026-0391 / -0398 / -0403: zstd 0.13 and zstd-safe 7, fixed only in
  # zstd 0.14.3 / zstd-safe 8.2. `orc-rust` requires zstd ^0.13 in every release
  # (0.9 and its main branch too), and parquet/arrow-ipc 58 do as well until
  # duckdb moves to arrow 60 (held, see Cargo.toml), so bumping octa's own dep
  # would only add a second copy.
  #
  # Not reached in octa's usage. The flaws sit in `stream::raw::{Encoder,
  # Decoder}::with_context` (0391), the `seekable` feature (0398, not enabled)
  # and `stream::write::Decoder` (0403). octa, orc-rust, parquet and arrow-ipc
  # call only the bulk API, `stream::read::Decoder` and `stream::write::Encoder`.
  #
  # REMOVE THESE once no crate in the tree is on zstd 0.13 (`cargo tree -i
  # zstd@0.13.3` empty), then bump octa's direct `zstd` to 0.14.
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 held by orc-rust; with_context is never called" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 held by orc-rust; the seekable feature is not enabled" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 held by orc-rust; stream::write::Decoder is never used" },
]
# Default is "all", which fails on any unmaintained crate anywhere in the tree
# including ones we cannot influence. "workspace" limits it to crates octa
# depends on directly, which are the ones we can actually act on.
unmaintained = "workspace"

[bans]
# Deliberately allowed. The tree carries ~90 duplicated crates and almost none
# are ours to fix: arrow 57 via `ambers`, strum 0.27 via `apache-avro`/`duckdb`,
# base64 0.21 via `ssri`, zip 8 via `calamine`. Turning this on would be
# pure noise. Duplicates we CAN remove get removed by bumping the direct dep.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
